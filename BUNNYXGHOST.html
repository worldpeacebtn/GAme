<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ NEON COMIC VAULT v23 — Ghost Bunny & Sticker Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --glass-bg: rgba(10,15,30,0.45);
            --glass-border: rgba(0,240,255,0.2);
            --glass-shadow: 0 4px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
            --cyber-glow: 0 0 25px rgba(0,240,255,0.5);
            --rainbow: conic-gradient(#ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            --glass-radius: 12px;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            background: #03050b;
            overscroll-behavior-y: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            touch-action: none;
            color: #e2e8f0;
        }
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        * { scrollbar-width: none; }

        .animated-bg {
            background-color: #03050b;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(157,0,255,0.10) 0%, transparent 70%),
                radial-gradient(circle at 15% 25%, rgba(0,240,255,0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(255,0,127,0.06) 0%, transparent 50%),
                linear-gradient(to right, rgba(0,240,255,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,85,0,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            animation: gridShift 12s linear infinite;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(10px) saturate(120%);
            -webkit-backdrop-filter: blur(10px) saturate(120%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--glass-radius);
        }

        .glass-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            transition: all 0.07s ease;
            cursor: pointer;
            touch-action: manipulation;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 2px;
            padding: 6px 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #e2e8f0;
            white-space: nowrap;
            min-width: 44px;
            min-height: 44px;
        }
        .glass-btn:active, .glass-btn.active {
            transform: scale(0.94);
            background: linear-gradient(135deg, rgba(157,0,255,0.5), rgba(0,240,255,0.4));
            border-color: #00f0ff;
            box-shadow: var(--cyber-glow);
        }
        .glass-btn .btn-num { font-size: 9px; color: #00f0ff; font-weight: 800; }

        /* HUD side panels (kept for vertical layout) */
        .hud-side {
            background: transparent;
            border: none;
            backdrop-filter: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
            z-index: 50;
            padding: 4px;
        }
        .hud-side .glass-btn {
            background: rgba(10,15,30,0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            min-width: 48px;
            min-height: 48px;
            font-size: 14px;
        }

        /* Bottom HUD (two rows combined) */
        .bottom-hud {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
            pointer-events: none;
        }
        .bottom-hud .row {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            pointer-events: auto;
        }

        .spheric-wheel {
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #00f0ff 20%, #9d00ff 55%, #03050b 90%);
            box-shadow: inset 0 -10px 25px rgba(0,0,0,0.85), inset 0 6px 15px rgba(255,255,255,0.2), 0 0 20px rgba(0,240,255,0.4);
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            touch-action: none;
            cursor: grab;
            transition: border-radius 0.3s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .spheric-wheel:active { transform: scale(0.85); border-color: #ff007f; box-shadow: 0 0 40px rgba(255,0,127,0.8); }

        .timeline-track { display: flex; gap: 4px; overflow-x: auto; padding: 4px; scroll-snap-type: x proximity; }
        .timeline-frame { background: rgba(8,13,26,0.7); border: 2px solid rgba(0,240,255,0.3); border-radius: 6px; min-width: 48px; height: 48px; object-fit: cover; scroll-snap-align: start; cursor: pointer; transition: all 0.1s ease; position: relative; }
        .timeline-frame.active { border-color: #ff007f; box-shadow: 0 0 20px rgba(255,0,127,0.6); }
        .timeline-frame .frame-num { position: absolute; bottom: 0; right: 0; font-size: 8px; background: rgba(0,0,0,0.7); color: #00f0ff; padding: 1px 3px; border-radius: 2px; }

        .top-library { position: absolute; top: 4px; left: 4px; right: 4px; z-index: 45; display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; padding: 4px; }
        .lib-item { min-width: 40px; height: 40px; background: rgba(8,13,26,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s ease; backdrop-filter: blur(4px); }
        .lib-item img { max-width: 32px; max-height: 32px; object-fit: contain; }
        .lib-item .media-icon { font-size: 20px; }
        .lib-item:active { transform: scale(0.9); border-color: #00f0ff; }

        /* Sticker preview */
        .sticker-preview {
            position: absolute;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,240,255,0.5), 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            touch-action: none;
            animation: levitate 3s ease-in-out infinite;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(2px);
            padding: 4px;
        }
        .sticker-preview img { max-width: 100%; max-height: 100%; border-radius: 8px; }
        .sticker-preview.circular { border-radius: 50%; }
        .sticker-preview.speech-bubble { border-radius: 20px 20px 20px 5px; background: white; color: black; padding: 8px 12px; }

        /* Ghost bunny TV */
        .ghost-tv {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 75px;
            border: 3px solid #00f0ff;
            border-radius: 10px;
            background: rgba(0,0,0,0.7);
            box-shadow: 0 0 25px rgba(0,240,255,0.6), inset 0 0 15px rgba(157,0,255,0.4);
            animation: glitch 2s infinite;
            z-index: 100;
            pointer-events: none;
            overflow: hidden;
        }
        .ghost-bunny {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px;
            filter: drop-shadow(0 0 8px #ff007f);
            animation: float 2s ease-in-out infinite;
        }
        .ghost-ears {
            position: absolute;
            top: 5px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
        }
        .ghost-ear {
            width: 12px;
            height: 25px;
            background: linear-gradient(to top, #ff00ff, #00f0ff);
            border-radius: 10px 10px 0 0;
            animation: earGlow 1.5s alternate infinite;
        }
        .ghost-ear.left { transform: rotate(-15deg); }
        .ghost-ear.right { transform: rotate(15deg); }

        /* Layer stack behind canvas */
        #layer-stack {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: -1;
        }
        #layer-stack img {
            max-width: 80%;
            max-height: 80%;
            opacity: 0.3;
            position: absolute;
            transition: transform 0.5s ease, opacity 0.5s;
        }
        #layer-stack img:hover { opacity: 0.6; }

        @keyframes levitate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(2px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 2px); }
            100% { transform: translate(0); }
        }
        @keyframes earGlow {
            0% { filter: drop-shadow(0 0 2px #ff00ff); }
            100% { filter: drop-shadow(0 0 8px #00f0ff); }
        }
    </style>
</head>
<body class="text-slate-100 h-[100dvh] w-screen flex flex-col overflow-hidden animated-bg">

    <!-- Ghost Bunny TV -->
    <div class="ghost-tv">
        <div class="ghost-ears">
            <div class="ghost-ear left"></div>
            <div class="ghost-ear right"></div>
        </div>
        <span class="ghost-bunny">🐰</span>
    </div>

    <!-- Canvas area + layer stack -->
    <div id="canvas-container" class="absolute inset-x-0 top-0 bottom-36 z-0 touch-none flex items-center justify-center overflow-hidden">
        <div id="layer-stack"></div>
        <div id="zoom-viewport" class="relative w-full h-full flex items-center justify-center origin-center transition-transform duration-300 ease-out cursor-grab active:cursor-grabbing">
            <canvas id="studio-canvas" class="max-w-full max-h-full object-contain shadow-2xl rounded-lg border border-cyberblue/30"></canvas>
        </div>
        <div id="canvas-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-darkbg/60 backdrop-blur-xl z-30 pointer-events-auto p-4 text-center">
            <div class="glass p-6 flex flex-col items-center gap-3 rounded-3xl animate-float max-w-sm">
                <span class="text-4xl">⚡🌆</span>
                <span class="text-sm font-bold">Drop Media • Load Assets</span>
                <span class="text-[8px] text-cyberblue font-bold">✨ GLB • PNG • GIF • MP4 • HTML • PDF • TXT ✨</span>
                <button onclick="document.getElementById('file-input-placeholder').click()" class="glass-btn px-4 py-2 text-sm font-bold text-neongreen">📂 BROWSE</button>
                <input type="file" id="file-input-placeholder" multiple accept="*/*" class="hidden" onchange="handleFileSelect(event)">
            </div>
        </div>
    </div>

    <!-- TOP LIBRARY (mini previews) -->
    <div id="top-library" class="top-library glass"></div>

    <!-- BOTTOM HUD (two rows) -->
    <div class="bottom-hud">
        <!-- Row 1: Spheric Wheels & Mode Filters -->
        <div class="row glass">
            <div class="flex items-center gap-2">
                <span class="text-[9px] text-cyberblue font-bold uppercase">🎨STYLE</span>
                <div id="spheric-style-wheel" class="spheric-wheel" data-wheel="style" style="width:40px;height:40px;"><i class="fa-solid fa-palette text-neongreen text-xs"></i></div>
                <span class="text-[9px] text-cyberblue font-bold uppercase">🔥INT</span>
                <div id="spheric-intensity-wheel" class="spheric-wheel" data-wheel="intensity" style="width:40px;height:40px;"><i class="fa-solid fa-fire text-cyberpink text-xs"></i></div>
                <span class="text-[9px] text-cyberblue font-bold uppercase">📏SIZE</span>
                <div id="spheric-size-wheel" class="spheric-wheel" data-wheel="size" style="width:40px;height:40px;"><i class="fa-solid fa-expand text-neongreen text-xs"></i></div>
                <span class="text-[9px] text-cyberblue font-bold uppercase">🌈COL</span>
                <div id="spheric-color-wheel" class="spheric-wheel" data-wheel="color" style="width:40px;height:40px;background:var(--rainbow);"><i class="fa-solid fa-circle text-white text-xs"></i></div>
                <span class="text-[9px] text-cyberblue font-bold uppercase">🖌️BR</span>
                <div id="spheric-brush-wheel" class="spheric-wheel" data-wheel="brush" style="width:40px;height:40px;"><i class="fa-solid fa-paint-brush text-white text-xs"></i></div>
            </div>
        </div>
        <!-- Row 2: Filter / Style Quick Buttons -->
        <div class="row glass">
            <button onclick="applyStyle('anime')" class="glass-btn px-2 py-1">⚡ANIME</button>
            <button onclick="applyStyle('manga')" class="glass-btn px-2 py-1">🌸MANGA</button>
            <button onclick="applyStyle('comic')" class="glass-btn px-2 py-1">💥COMIC</button>
            <button onclick="applyStyle('neon')" class="glass-btn px-2 py-1">🌈NEON</button>
            <button onclick="applyStyle('ductus')" class="glass-btn px-2 py-1">🏮DUCTUS</button>
            <button onclick="applyStyle('pixel')" class="glass-btn px-2 py-1">👾PIXEL</button>
            <button onclick="applyStyle('jrpg')" class="glass-btn px-2 py-1">⚔️JRPG</button>
            <button onclick="applyStyle('flattened')" class="glass-btn px-2 py-1">🔳FLAT</button>
            <button onclick="applyStyle('pendot')" class="glass-btn px-2 py-1">⚫PENDOT</button>
            <button onclick="applyStyle('ghost')" class="glass-btn px-2 py-1">👻GHOST</button>
            <button onclick="applyStyle('outline')" class="glass-btn px-2 py-1">📐OUTLINE</button>
        </div>
        <!-- Row 3: Action / Tool Buttons -->
        <div class="row glass">
            <button onclick="undo()" class="glass-btn">⏪</button>
            <button onclick="redo()" class="glass-btn">⏩</button>
            <button onclick="openVault()" class="glass-btn">🔐</button>
            <button onclick="pinFrame()" class="glass-btn">📌</button>
            <button onclick="captureFrame()" class="glass-btn">📸</button>
            <button onclick="playAnimation()" class="glass-btn">▶️</button>
            <button onclick="stopAnimation()" class="glass-btn">⏹️</button>
            <button onclick="toggleStickerMode()" id="sticker-mode-btn" class="glass-btn">🖼️</button>
            <button onclick="addSpeechBubble()" class="glass-btn">💬</button>
            <button onclick="addCircularSticker()" class="glass-btn">⭕</button>
            <button onclick="openResolutionMenu()" class="glass-btn">📐</button>
            <button onclick="enterTheaterMode()" class="glass-btn">📖</button>
        </div>
    </div>

    <!-- Timeline strip (above bottom HUD) -->
    <div class="absolute bottom-36 left-0 right-0 z-50 pointer-events-none">
        <div id="timeline-strip" class="timeline-track no-scrollbar pointer-events-auto px-2"></div>
    </div>

    <!-- THEATER OVERLAY -->
    <div id="theater-overlay" class="fixed inset-0 z-[150] hidden" style="pointer-events:none;">
        <div style="pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
            <div class="bunny-progress" id="bunny-progress" style="width:80%; margin-bottom:10px;">
                <div class="red-thread" style="position:absolute; bottom:10px; left:0; right:0; height:2px; background:linear-gradient(to right,#ff007f,#00f0ff); opacity:0.5;"></div>
                <span class="rabbit-hole" style="position:absolute; left:-10px; bottom:-5px; font-size:18px;">🕳️</span>
                <span class="bunny" id="bunny" style="position:absolute; top:-8px; left:0; font-size:28px; animation:bunnyHop 0.6s ease-in-out infinite; transform:translateX(-50%);">🐰</span>
                <span class="carrot" style="position:absolute; right:-10px; top:-6px; font-size:24px;">🥕</span>
                <span class="stars" style="position:absolute; right:30px; top:-5px; font-size:18px;">✨</span>
            </div>
            <img id="theater-panel-img" class="theater-panel" src="" style="max-width:90vw; max-height:70vh; border:2px solid #00f0ff; border-radius:20px; pointer-events:auto;">
            <div style="display:flex; gap:20px; margin-top:10px; pointer-events:auto;">
                <button onclick="theaterPrev()" class="glass-btn px-6 py-3 text-xl">⏪</button>
                <button onclick="theaterNext()" class="glass-btn px-6 py-3 text-xl">⏩</button>
                <button onclick="exitTheaterMode()" class="glass-btn px-6 py-3 text-xl">✕</button>
            </div>
        </div>
    </div>

    <script>
        // ========== FULL STATE (with all enhancements) ==========
        let library = [];
        let vaultItems = [];
        let panels = [];
        let animationFrames = [];
        let layers = [];
        let filterLayers = [];
        let overlays = [];
        let adjustments = { brightness: 0, contrast: 0, saturation: 100 };
        let currentMode = 'jrpg';
        let activeWheelTarget = 'size';
        let selectedOverlayIndex = null;
        let activeOverlaySize = 75;
        let selectedColor = '#ffffff';
        let brushSize = 10;
        let brushMode = false;
        let eraserMode = false;
        let maskMode = false;
        let currentGridPreset = 'none';
        let currentResolution = 512;
        let historyStack = [];
        let historyPointer = -1;
        let currentZoom = 1, panX = 0, panY = 0;
        let isDraggingItem = false, dragStartX = 0, dragStartY = 0;
        let initialPinchDist = null, initialZoom = 1, isPanning = false, lastPanX = 0, lastPanY = 0;
        let isPlayingAnimation = false, animationInterval = null;
        let stickerMode = false;
        let theaterIndex = 0;

        const canvas = document.getElementById('studio-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const zoomViewport = document.getElementById('zoom-viewport');
        const container = document.getElementById('canvas-container');
        const layerStack = document.getElementById('layer-stack');

        // ========== TOAST ==========
        function showToast(msg, type='success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `px-4 py-2 rounded-xl text-sm font-bold shadow-2xl flex items-center gap-2 transition transform translate-y-2 opacity-0 pointer-events-auto ${type==='success'?'bg-cyberpurple/95 text-white border border-cyberblue/40 backdrop-blur-md':'bg-red-600/95 text-white backdrop-blur-md'}`;
            t.innerHTML = `<span>${type==='success'?'⚡':'⚠️'}</span> ${msg}`;
            c.appendChild(t);
            requestAnimationFrame(()=>t.classList.remove('translate-y-2','opacity-0'));
            setTimeout(()=>{t.classList.add('translate-y-2','opacity-0'); setTimeout(()=>t.remove(),300);},2000);
        }

        // ========== FILE HANDLING (all formats) ==========
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const type = file.type.startsWith('image') ? 'image' :
                        file.type.startsWith('video') ? 'video' :
                        file.type.startsWith('audio') ? 'audio' :
                        file.name.endsWith('.glb') ? 'glb' :
                        file.name.endsWith('.html') ? 'html' :
                        file.name.endsWith('.pdf') ? 'pdf' :
                        file.name.endsWith('.txt') ? 'txt' : 'file';
                    const item = { id:'f_'+Math.random().toString(36).substr(2,8), name:file.name, dataUrl:ev.target.result, type:type, thumb: type==='image' ? ev.target.result : null };
                    library.push(item);
                    updateTopLibrary();
                    if(library.length===1 && type==='image') loadImageToCanvas(item.dataUrl);
                    if(type==='audio') showToast('🔊 Audio added');
                    if(type==='video') showToast('🎬 Video added');
                    if(type==='glb') showToast('🧊 GLB added');
                    if(type==='html') showToast('🌐 HTML added');
                    if(type==='pdf') showToast('📄 PDF added');
                    if(type==='txt') showToast('📝 TXT added');
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }

        function updateTopLibrary() {
            const container = document.getElementById('top-library');
            container.innerHTML = library.map(item => {
                if(item.type==='image') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><img src="${item.dataUrl}" style="width:32px;height:32px;object-fit:cover;"></div>`;
                else if(item.type==='video') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>🎬</span></div>`;
                else if(item.type==='audio') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>🎵</span></div>`;
                else if(item.type==='glb') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>🧊</span></div>`;
                else if(item.type==='html') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>🌐</span></div>`;
                else if(item.type==='pdf') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>📄</span></div>`;
                else if(item.type==='txt') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>📝</span></div>`;
                else return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>📄</span></div>`;
            }).join('');
        }

        function handleLibraryItem(id) {
            const item = library.find(x => x.id === id);
            if (!item) return;
            if (stickerMode) {
                createStickerFromLibrary(id);
            } else {
                if (item.type === 'image') loadImageToCanvas(item.dataUrl);
                else if (item.type === 'audio') playAudio(item.dataUrl);
                else if (item.type === 'video') showToast('🎬 Video opened');
                else if (item.type === 'glb') showToast('🧊 GLB preview coming');
                else if (item.type === 'html') showToast('🌐 HTML opened');
                else if (item.type === 'pdf') showToast('📄 PDF opened');
                else if (item.type === 'txt') showToast('📝 TXT opened');
            }
        }

        function loadImageToCanvas(dataUrl) {
            document.getElementById('canvas-placeholder').classList.add('hidden');
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img,0,0);
                const base = { canvas: document.createElement('canvas'), originalImg: img, ctx: null };
                base.canvas.width = img.width; base.canvas.height = img.height;
                base.ctx = base.canvas.getContext('2d', { willReadFrequently: true });
                base.ctx.drawImage(img,0,0);
                layers = [base];
                overlays = []; filterLayers = [];
                adjustments = { brightness:0, contrast:0, saturation:100 };
                historyStack = []; historyPointer = -1;
                applyStyle('jrpg');
                saveState();
            };
            img.src = dataUrl;
        }

        function playAudio(dataUrl) {
            const audio = new Audio(dataUrl);
            audio.play().catch(err => showToast('Audio failed','error'));
        }

        // ========== STICKER MODE ==========
        function toggleStickerMode() {
            stickerMode = !stickerMode;
            document.getElementById('sticker-mode-btn').classList.toggle('active', stickerMode);
            showToast(stickerMode ? '🖼️ Sticker mode ON' : '🖼️ Sticker mode OFF');
        }

        function createStickerFromLibrary(id) {
            const item = library.find(x => x.id === id);
            if (!item) return;
            const sticker = document.createElement('div');
            sticker.className = 'sticker-preview';
            if (item.type === 'image') {
                sticker.innerHTML = `<img src="${item.dataUrl}">`;
            } else {
                sticker.innerHTML = `<span style="font-size:30px;">${item.type==='audio'?'🎵':item.type==='video'?'🎬':'📄'}</span>`;
            }
            sticker.style.left = '50%';
            sticker.style.top = '50%';
            sticker.style.width = '16%'; // approx 1/6
            document.getElementById('canvas-container').appendChild(sticker);
            makeDraggable(sticker);
            playPopSound();
        }

        function makeDraggable(el) {
            let startX, startY, origX, origY;
            el.addEventListener('touchstart', e => {
                const touch = e.touches[0];
                startX = touch.clientX; startY = touch.clientY;
                origX = el.offsetLeft; origY = el.offsetTop;
                el.style.animation = 'none';
                e.preventDefault();
            }, {passive:false});
            el.addEventListener('touchmove', e => {
                const touch = e.touches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                el.style.left = origX + dx + 'px';
                el.style.top = origY + dy + 'px';
                e.preventDefault();
            }, {passive:false});
            el.addEventListener('touchend', () => {
                el.style.animation = 'levitate 3s ease-in-out infinite';
            });
        }

        function playPopSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function addSpeechBubble() {
            const text = prompt('Bubble text', '✨ Hello!');
            if (text) {
                const bubble = document.createElement('div');
                bubble.className = 'sticker-preview speech-bubble';
                bubble.innerText = text;
                bubble.style.left = '60%'; bubble.style.top = '50%';
                document.getElementById('canvas-container').appendChild(bubble);
                makeDraggable(bubble);
                playPopSound();
            }
        }

        function addCircularSticker() {
            const url = prompt('Image URL', '');
            if (url) {
                const sticker = document.createElement('div');
                sticker.className = 'sticker-preview circular';
                sticker.innerHTML = `<img src="${url}">`;
                sticker.style.left = '40%'; sticker.style.top = '50%';
                document.getElementById('canvas-container').appendChild(sticker);
                makeDraggable(sticker);
                playPopSound();
            }
        }

        // ========== LAYER STACK (behind canvas) ==========
        function updateLayerStack() {
            if (!panels.length) { layerStack.innerHTML = ''; return; }
            const start = Math.max(0, panels.length - 3);
            layerStack.innerHTML = panels.slice(start).map((p,i) => 
                `<img src="${p.thumb}" style="transform: translateX(${(i - (panels.length-1-start)) * 20}px);" onclick="loadPanel(${start+i})">`
            ).join('');
        }

        // Call after pinFrame / captureFrame
        const origPinFrame = pinFrame;
        pinFrame = function() { origPinFrame(); updateLayerStack(); };
        const origCaptureFrame = captureFrame;
        captureFrame = function() { origCaptureFrame(); updateLayerStack(); };

        // ========== FILTERS (including new: ghost, outline) ==========
        function applyStyle(style) {
            if (!canvas.width) return;
            filterLayers = [];
            adjustments = { brightness:0, contrast:0, saturation:100 };
            switch(style) {
                case 'anime': adjustments={brightness:8,contrast:35,saturation:145}; filterLayers.push({type:'anime-ductus',strength:70,blendMode:'overlay'}); break;
                case 'manga': adjustments={brightness:5,contrast:55,saturation:90}; filterLayers.push({type:'ductus-pro',strength:85,blendMode:'multiply'}); break;
                case 'comic': adjustments={brightness:0,contrast:50,saturation:135}; filterLayers.push({type:'halftone-dots',strength:65,blendMode:'overlay'}); break;
                case 'neon': adjustments={brightness:15,contrast:70,saturation:180}; filterLayers.push({type:'neon-glow',strength:75,blendMode:'screen'}); break;
                case 'ductus': adjustments={brightness:10,contrast:60,saturation:80}; filterLayers.push({type:'ductus-pro',strength:90,blendMode:'soft-light'}); break;
                case 'pixel': adjustments={brightness:0,contrast:40,saturation:100}; filterLayers.push({type:'pixel-art',strength:100,blendMode:'normal'}); break;
                case 'jrpg': adjustments={brightness:12,contrast:30,saturation:140}; filterLayers.push({type:'cel-shade',strength:60,blendMode:'overlay'}); break;
                case 'lichtenstein': adjustments={brightness:5,contrast:65,saturation:200}; filterLayers.push({type:'lichtenstein',strength:90,blendMode:'overlay'}); break;
                case 'psp': adjustments={brightness:5,contrast:25,saturation:130}; filterLayers.push({type:'psp-render',strength:55,blendMode:'soft-light'}); break;
                case 'manga-dot': adjustments={brightness:3,contrast:50,saturation:80}; filterLayers.push({type:'manga-dot',strength:75,blendMode:'multiply'}); break;
                case 'flattened': adjustments={brightness:5,contrast:40,saturation:70}; filterLayers.push({type:'posterize',strength:4,blendMode:'normal'}); break;
                case 'pendot': adjustments={brightness:0,contrast:50,saturation:100}; filterLayers.push({type:'manga-dot',strength:80,blendMode:'multiply'}); break;
                case 'ghost': adjustments={brightness:0,contrast:60,saturation:120}; filterLayers.push({type:'ghost',strength:80,blendMode:'screen'}); break;
                case 'outline': adjustments={brightness:0,contrast:80,saturation:100}; filterLayers.push({type:'outline',strength:90,blendMode:'normal'}); break;
                default: break;
            }
            processImagePipeline();
        }

        // Add ghost & outline filter implementations in processImagePipeline
        function processImagePipeline() {
            if(!layers.length) return;
            const base = layers[0];
            const w = base.canvas.width, h = base.canvas.height;
            base.ctx.clearRect(0,0,w,h);
            base.ctx.drawImage(base.originalImg,0,0);
            // apply adjustments
            let imgData = base.ctx.getImageData(0,0,w,h);
            let d = imgData.data;
            const bright = adjustments.brightness;
            const contrast = adjustments.contrast;
            const sat = adjustments.saturation/100;
            const factor = (259*(contrast+255))/(255*(259-contrast));
            for(let i=0;i<d.length;i+=4){
                let r=d[i],g=d[i+1],b=d[i+2];
                r = factor*(r+bright-128)+128; g = factor*(g+bright-128)+128; b = factor*(b+bright-128)+128;
                let gray = 0.299*r+0.587*g+0.114*b;
                d[i] = Math.min(255,Math.max(0,gray+(r-gray)*sat));
                d[i+1] = Math.min(255,Math.max(0,gray+(g-gray)*sat));
                d[i+2] = Math.min(255,Math.max(0,gray+(b-gray)*sat));
            }
            base.ctx.putImageData(imgData,0,0);

            filterLayers.forEach(fl=>{
                const fC=document.createElement('canvas'); fC.width=w; fC.height=h;
                const fCtx=fC.getContext('2d'); fCtx.drawImage(base.canvas,0,0);
                if(fl.type==='ghost'){
                    // holographic TV effect with bunny
                    fCtx.globalAlpha = 0.8;
                    fCtx.filter = 'blur(2px) saturate(1.2)';
                    fCtx.drawImage(fC,0,0);
                    // add ghost bunny silhouette
                    fCtx.font = '100px sans-serif';
                    fCtx.fillStyle = 'rgba(255,255,255,0.5)';
                    fCtx.fillText('🐰', w/2, h/2);
                } else if(fl.type==='outline'){
                    // simple edge detection via luminance gradient
                    const edgeCtx = document.createElement('canvas').getContext('2d');
                    edgeCtx.canvas.width = w; edgeCtx.canvas.height = h;
                    edgeCtx.drawImage(base.canvas,0,0);
                    const src = edgeCtx.getImageData(0,0,w,h);
                    const dst = edgeCtx.createImageData(w,h);
                    for(let y=1; y<h-1; y++){
                        for(let x=1; x<w-1; x++){
                            const i = (y*w+x)*4;
                            const iu = ((y-1)*w+x)*4;
                            const id = ((y+1)*w+x)*4;
                            const il = (y*w+(x-1))*4;
                            const ir = (y*w+(x+1))*4;
                            const gx = Math.abs(src.data[i]-src.data[ir]) + Math.abs(src.data[i+1]-src.data[ir+1]) + Math.abs(src.data[i+2]-src.data[ir+2]);
                            const gy = Math.abs(src.data[i]-src.data[id]) + Math.abs(src.data[i+1]-src.data[id+1]) + Math.abs(src.data[i+2]-src.data[id+2]);
                            const mag = gx+gy;
                            const v = mag > 80 ? 255 : 0;
                            dst.data[i] = v; dst.data[i+1] = v; dst.data[i+2] = v; dst.data[i+3] = 255;
                        }
                    }
                    edgeCtx.putImageData(dst,0,0);
                    fCtx.clearRect(0,0,w,h);
                    fCtx.drawImage(edgeCtx.canvas,0,0);
                }
                // apply filter
                base.ctx.save();
                base.ctx.globalAlpha = fl.strength/100;
                base.ctx.globalCompositeOperation = fl.blendMode||'overlay';
                base.ctx.drawImage(fC,0,0);
                base.ctx.restore();
            });
            compositeLayers();
        }

        // ========== THEATER MODE ==========
        function enterTheaterMode() {
            if(!panels.length){ showToast('No panels','error'); return; }
            theaterIndex = 0;
            document.getElementById('theater-overlay').classList.remove('hidden');
            updateTheater();
        }
        function exitTheaterMode(){ document.getElementById('theater-overlay').classList.add('hidden'); }
        function theaterPrev(){ if(theaterIndex>0){ theaterIndex--; updateTheater(); } }
        function theaterNext(){ if(theaterIndex<panels.length-1){ theaterIndex++; updateTheater(); } }
        function updateTheater(){
            const img = document.getElementById('theater-panel-img');
            img.src = panels[theaterIndex].dataUrl;
            const progress = (theaterIndex/(panels.length-1))*100;
            document.getElementById('bunny').style.left = progress+'%';
        }

        // ========== INIT ==========
        updateTopLibrary();
        setMode('jrpg');
        applyStyle('jrpg');
    </script>
</body>
