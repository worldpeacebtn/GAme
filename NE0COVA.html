<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ NEON COMIC VAULT STUDIO v13 — JRPG & Cyberpunk</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#03050b',
                        darkcard: '#080d1a',
                        cyberblue: '#00f0ff',
                        cyberpurple: '#9d00ff',
                        cyberpink: '#ff007f',
                        cyberorange: '#ff5500',
                        neongreen: '#00ffcc',
                        glasswhite: 'rgba(255,255,255,0.08)'
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'glow-pulse': 'glowPulse 2.5s ease-in-out infinite',
                        'grid-shift': 'gridShift 8s linear infinite',
                        'bubble-rise': 'bubbleRise 6s ease-in-out infinite',
                        'shimmer': 'shimmer 3s ease-in-out infinite',
                        'butterfly': 'butterflyFlap 0.8s ease-in-out infinite',
                        'particle': 'particleMove 4s linear infinite'
                    },
                    keyframes: {
                        float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-8px)' } },
                        glowPulse: { '0%,100%': { boxShadow: '0 0 20px rgba(0,240,255,0.3)' }, '50%': { boxShadow: '0 0 40px rgba(0,240,255,0.7)' } },
                        gridShift: { '0%': { backgroundPosition: '0 0, 0 0' }, '100%': { backgroundPosition: '32px 32px, 32px 32px' } },
                        bubbleRise: { '0%,100%': { transform: 'translateY(0) scale(1)' }, '50%': { transform: 'translateY(-12px) scale(1.05)' } },
                        shimmer: { '0%,100%': { opacity: '0.6' }, '50%': { opacity: '1' } },
                        butterflyFlap: { '0%,100%': { transform: 'rotate(10deg)' }, '50%': { transform: 'rotate(-10deg)' } },
                        particleMove: { '0%': { transform: 'translateY(0) scale(1)', opacity: '0.8' }, '100%': { transform: 'translateY(-80px) scale(0)', opacity: '0' } }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --glass-bg: rgba(10, 15, 30, 0.55);
            --glass-border: rgba(0, 240, 255, 0.25);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            --cyber-glow: 0 0 25px rgba(0, 240, 255, 0.5);
            --rainbow: conic-gradient(#ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            --glass-radius: 18px;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            background: #03050b;
            overscroll-behavior-y: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            touch-action: none;
            color: #e2e8f0;
        }
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        * { scrollbar-width: none; }

        .animated-bg {
            background-color: #03050b;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(157,0,255,0.10) 0%, transparent 70%),
                radial-gradient(circle at 15% 25%, rgba(0,240,255,0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(255,0,127,0.06) 0%, transparent 50%),
                linear-gradient(to right, rgba(0,240,255,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,85,0,0.03) 1px, transparent 1px),
                linear-gradient(to right, rgba(157,0,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,255,204,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px, 8px 8px, 8px 8px;
            animation: gridShift 12s linear infinite;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--glass-radius);
        }

        .glass-btn {
            background: linear-gradient(135deg, rgba(15,23,42,0.7) 0%, rgba(5,8,18,0.85) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border-radius: 12px;
            transition: all 0.08s ease;
            cursor: pointer;
            touch-action: manipulation;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .glass-btn:active, .glass-btn.active {
            transform: scale(0.92);
            background: linear-gradient(135deg, rgba(157,0,255,0.5) 0%, rgba(0,240,255,0.4) 100%);
            border-color: #00f0ff;
            box-shadow: var(--cyber-glow);
        }

        .spheric-wheel {
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #00f0ff 20%, #9d00ff 55%, #03050b 90%);
            box-shadow: inset 0 -10px 25px rgba(0,0,0,0.85), inset 0 6px 15px rgba(255,255,255,0.2), 0 0 30px rgba(0,240,255,0.5), 0 8px 30px rgba(0,0,0,0.6);
            border: 2.5px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            touch-action: none;
            cursor: grab;
            transition: border-radius 0.3s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .spheric-wheel.square { border-radius: 14px; }
        .spheric-wheel:active { transform: scale(0.85); border-color: #ff007f; box-shadow: 0 0 50px rgba(255,0,127,0.8); cursor: grabbing; }

        .mode-pill {
            background: rgba(15,23,42,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
            transition: all 0.1s ease;
            white-space: nowrap;
        }
        .mode-pill.active { background: rgba(157,0,255,0.5); border-color: #00f0ff; box-shadow: var(--cyber-glow); }

        /* Butterfly */
        .butterfly {
            position: absolute;
            font-size: 22px;
            animation: butterflyFlap 0.5s ease-in-out infinite, float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 6px rgba(0,255,204,0.7));
            pointer-events: none;
            z-index: 30;
        }

        /* Node canvas */
        .node-connector-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }

        /* Panel strip */
        .panel-strip {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
            padding: 4px 2px;
        }
        .panel-thumb {
            background: rgba(8,13,26,0.8);
            border: 2px solid rgba(0,240,255,0.3);
            border-radius: 8px;
            cursor: pointer;
            min-width: 45px;
            height: 35px;
            object-fit: cover;
            scroll-snap-align: start;
            transition: all 0.1s ease;
            position: relative;
        }
        .panel-thumb.active {
            border-color: #ff007f;
            box-shadow: 0 0 20px rgba(255,0,127,0.6);
        }

        /* Compact HUD */
        .hud-compact {
            max-height: 80px;
            overflow-y: auto;
            padding: 4px 8px;
            gap: 4px;
        }
        .hud-compact::-webkit-scrollbar { display: none; }

        /* Vault grid */
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 6px;
        }
        .vault-item {
            background: rgba(8,13,26,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 4px;
            cursor: pointer;
            transition: all 0.1s ease;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .vault-item img { width: 100%; height: auto; max-height: 80%; object-fit: contain; }
        .vault-item:active { transform: scale(0.92); border-color: #00f0ff; box-shadow: var(--cyber-glow); }
    </style>
</head>

    <script>
        // ========== STATE ==========
        let library = [];
        let vaultItems = [];
        let panels = [];
        let currentPanelIndex = -1;
        let layers = [];
        let filterLayers = [];
        let overlays = [];
        let adjustments = { brightness: 0, contrast: 0, saturation: 100 };
        let currentMode = 'comic';
        let activeWheelTarget = 'size';
        let isCropActive = false;
        let cropBox = { x: 10, y: 10, w: 200, h: 200 };
        let selectedOverlayIndex = null;
        let activeOverlaySize = 75;
        let activeOverlayRotation = 0;
        let selectedColor = '#ffffff';
        let brushSize = 10;
        let brushMode = false;
        let eraserMode = false;
        let maskMode = false;
        let currentGridPreset = 'none';
        let currentResolution = 512;
        let historyStack = [];
        let historyPointer = -1;
        let isDraggingItem = false;
        let dragStartX = 0, dragStartY = 0;
        let initialPinchDist = null;
        let initialZoom = 1;
        let isPanning = false;
        let lastPanX = 0, lastPanY = 0;

        let canvas = document.getElementById('studio-canvas');
        let ctx = canvas.getContext('2d', { willReadFrequently: true });
        let currentZoom = 1.0, panX = 0, panY = 0;
        const zoomViewport = document.getElementById('zoom-viewport');
        const container = document.getElementById('canvas-container');

        const nodeCanvas = document.getElementById('node-connection-canvas');
        const nodeCtx = nodeCanvas.getContext('2d');
        let nodeParticles = [];

        // ========== TOAST ==========
        function showToast(msg, type='success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `px-4 py-2 rounded-xl text-[10px] font-bold shadow-2xl flex items-center gap-2 transition transform translate-y-2 opacity-0 pointer-events-auto ${
                type === 'success' ? 'bg-cyberpurple/95 text-white border border-cyberblue/40 backdrop-blur-md' : 'bg-red-600/95 text-white backdrop-blur-md'
            }`;
            t.innerHTML = `<span>${type==='success'?'⚡':'⚠️'}</span> ${msg}`;
            c.appendChild(t);
            requestAnimationFrame(() => t.classList.remove('translate-y-2','opacity-0'));
            setTimeout(()=>{ t.classList.add('translate-y-2','opacity-0'); setTimeout(()=>t.remove(),300); },1800);
        }

        // ========== MODE ==========
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-pill').forEach(p=>p.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            if(mode==='comic') applyStyle('comic');
            else if(mode==='manga') applyStyle('manga');
            else if(mode==='anime') applyStyle('anime');
            else if(mode==='neon') applyStyle('neon');
            else if(mode==='pixel') applyStyle('pixel');
            else if(mode==='paperdoll') applyStyle('paperdoll');
            else if(mode==='street') applyStyle('street');
            else if(mode==='jrpg') applyStyle('jrpg');
            showToast(`📖 ${mode}`);
        }

        // ========== SPHERIC WHEELS ==========
        const wheels = [
            { element: document.getElementById('spheric-style-wheel'), target: 'style' },
            { element: document.getElementById('spheric-intensity-wheel'), target: 'intensity' },
            { element: document.getElementById('spheric-size-wheel'), target: 'size' },
            { element: document.getElementById('spheric-color-wheel'), target: 'color' },
            { element: document.getElementById('spheric-brush-wheel'), target: 'brush' },
            { element: document.getElementById('spheric-res-wheel'), target: 'res' },
        ];
        wheels.forEach(w => {
            let active = false, lastY = 0;
            w.element.addEventListener('touchstart', e=>{ e.preventDefault(); active=true; lastY=e.touches[0].clientY; }, {passive:false});
            w.element.addEventListener('touchmove', e=>{ e.preventDefault(); if(active){ const dy = lastY - e.touches[0].clientY; handleWheelInput(w.target, dy); lastY=e.touches[0].clientY; } }, {passive:false});
            w.element.addEventListener('touchend', ()=>{ active=false; });
            w.element.addEventListener('mousedown', e=>{ active=true; lastY=e.clientY; const move=ev=>{ if(active){ const dy=lastY-ev.clientY; handleWheelInput(w.target,dy); lastY=ev.clientY; } }; const up=()=>{ active=false; window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); }; window.addEventListener('mousemove',move); window.addEventListener('mouseup',up); });
        });

        function handleWheelInput(target, delta) {
            if(target === 'size') {
                activeOverlaySize = Math.max(10, Math.min(400, activeOverlaySize + delta * 3));
                if(selectedOverlayIndex!==null && overlays[selectedOverlayIndex]) overlays[selectedOverlayIndex].size = activeOverlaySize;
            } else if(target === 'intensity') {
                adjustments.brightness = Math.max(-100, Math.min(100, adjustments.brightness + delta));
                processImagePipeline();
            } else if(target === 'style') {
                const styles = ['anime','manga','comic','neon','ductus','pixel','street','jrpg'];
                const idx = Math.floor(Math.abs(delta) / 5) % styles.length;
                if(Math.abs(delta) > 2) applyStyle(styles[idx]);
            } else if(target === 'color') {
                const hue = (parseInt(selectedColor.slice(1),16) + delta * 2) % 360;
                selectedColor = `hsl(${hue}, 100%, 60%)`;
                if(selectedOverlayIndex!==null && overlays[selectedOverlayIndex]) overlays[selectedOverlayIndex].color = selectedColor;
            } else if(target === 'brush') {
                brushSize = Math.max(2, Math.min(80, brushSize + delta));
                if(brushMode) showToast(`🖌️ Brush: ${brushSize}px`);
            } else if(target === 'res') {
                currentResolution = Math.max(64, Math.min(2048, currentResolution + delta * 16));
                showToast(`📐 Res: ${currentResolution}px`);
            }
            updateDialDisplay();
            compositeLayers();
        }

        // ========== STYLE PRESETS ==========
        function applyStyle(style) {
            if(!canvas.width) return;
            filterLayers = [];
            adjustments = { brightness: 0, contrast: 0, saturation: 100 };
            if(style==='anime') { adjustments={brightness:10,contrast:30,saturation:140}; filterLayers.push({type:'anime-ductus',strength:80,blendMode:'overlay'}); }
            else if(style==='manga') { adjustments={brightness:5,contrast:50,saturation:100}; filterLayers.push({type:'ductus-pro',strength:90,blendMode:'multiply'}); }
            else if(style==='comic') { adjustments={brightness:0,contrast:45,saturation:130}; filterLayers.push({type:'halftone-dots',strength:75,blendMode:'overlay'}); }
            else if(style==='neon') { adjustments={brightness:15,contrast:60,saturation:170}; filterLayers.push({type:'glitch-rgb',strength:60,blendMode:'screen'}); }
            else if(style==='ductus') { adjustments={brightness:8,contrast:55,saturation:90}; filterLayers.push({type:'ductus-pro',strength:85,blendMode:'soft-light'}); }
            else if(style==='pixel') { adjustments={brightness:0,contrast:40,saturation:100}; filterLayers.push({type:'pixel-art',strength:100,blendMode:'normal'}); }
            else if(style==='paperdoll') { adjustments={brightness:0,contrast:20,saturation:110}; filterLayers.push({type:'anime-ductus',strength:50,blendMode:'overlay'}); }
            else if(style==='street') { adjustments={brightness:-5,contrast:65,saturation:160}; filterLayers.push({type:'glitch-rgb',strength:70,blendMode:'screen'}); }
            else if(style==='jrpg') { adjustments={brightness:0,contrast:35,saturation:120}; filterLayers.push({type:'anime-ductus',strength:60,blendMode:'overlay'}); }
            processImagePipeline();
            showToast(`✨ ${style}`);
        }

        function applyAnonymize() {
            if(!canvas.width) return;
            // pixelate face area
            const w = Math.min(200, canvas.width/4);
            const h = Math.min(200, canvas.height/4);
            const x = canvas.width/2 - w/2;
            const y = canvas.height/2 - h/2;
            const imgData = ctx.getImageData(x,y,w,h);
            const d = imgData.data;
            const block = 8;
            for(let by=0; by<h; by+=block){
                for(let bx=0; bx<w; bx+=block){
                    let r=0,g=0,b=0,a=0,count=0;
                    for(let yy=0; yy<block && by+yy<h; yy++){
                        for(let xx=0; xx<block && bx+xx<w; xx++){
                            const idx = ((by+yy)*w + (bx+xx))*4;
                            r += d[idx]; g += d[idx+1]; b += d[idx+2]; a += d[idx+3]; count++;
                        }
                    }
                    r/=count; g/=count; b/=count; a/=count;
                    for(let yy=0; yy<block && by+yy<h; yy++){
                        for(let xx=0; xx<block && bx+xx<w; xx++){
                            const idx = ((by+yy)*w + (bx+xx))*4;
                            d[idx]=r; d[idx+1]=g; d[idx+2]=b; d[idx+3]=a;
                        }
                    }
                }
            }
            ctx.putImageData(imgData, x, y);
            saveState();
            showToast('🎭 Anonymized');
        }

        // ========== RESOLUTION ==========
        function openResolutionMenu() { document.getElementById('resolution-modal').classList.remove('hidden'); }
        function closeResolutionModal() { document.getElementById('resolution-modal').classList.add('hidden'); }
        function setResolution(px) {
            currentResolution = px;
            closeResolutionModal();
            showToast(`📐 Res set to ${px}px`);
        }
        function applyResolutionToCanvas() {
            if(!canvas.width || !layers.length) return;
            const targetW = currentResolution;
            const targetH = Math.round(canvas.height * (targetW / canvas.width));
            const tmpCanvas = document.createElement('canvas');
            tmpCanvas.width = targetW; tmpCanvas.height = targetH;
            tmpCanvas.getContext('2d').drawImage(canvas, 0, 0, targetW, targetH);
            // update base layer
            canvas.width = targetW; canvas.height = targetH;
            ctx.drawImage(tmpCanvas, 0, 0);
            if(layers.length){
                layers[0].canvas.width = targetW; layers[0].canvas.height = targetH;
                layers[0].ctx.drawImage(tmpCanvas, 0, 0);
                layers[0].originalImg = new Image();
                layers[0].originalImg.src = tmpCanvas.toDataURL();
            }
            compositeLayers();
            saveState();
        }

        // ========== GRID ==========
        const gridPresets = {
            'none': { label:'❌', cols:1, rows:1 },
            '2x2': { label:'▦2x2', cols:2, rows:2 },
            '3x3': { label:'▦3x3', cols:3, rows:3 },
            '2x1': { label:'▯2x1', cols:2, rows:1 },
            '1x2': { label:'▮1x2', cols:1, rows:2 },
            '4x4': { label:'▦4x4', cols:4, rows:4 },
            '3x2': { label:'▦3x2', cols:3, rows:2 },
            '2x3': { label:'▦2x3', cols:2, rows:3 },
            '4x4jrpg': { label:'⚔️4x4', cols:4, rows:4 }
        };
        function toggleGridPreset() {
            const modal = document.getElementById('grid-modal');
            const container = document.getElementById('grid-presets');
            container.innerHTML = Object.entries(gridPresets).map(([key,val])=>
                `<button onclick="applyGridPreset('${key}')" class="glass-btn py-2 text-[8px] font-bold ${currentGridPreset===key?'active':''}">${val.label}<span class="text-nano">${val.cols}×${val.rows}</span></button>`
            ).join('');
            modal.classList.remove('hidden');
        }
        function closeGridModal(){ document.getElementById('grid-modal').classList.add('hidden'); }
        function applyGridPreset(key){ currentGridPreset=key; closeGridModal(); compositeLayers(); showToast(`📐 ${key}`); }

        // ========== PANEL SYSTEM ==========
        function pinFrame() {
            if(!canvas.width) return;
            const dataUrl = canvas.toDataURL('image/png');
            panels.push({ id:'panel_'+Date.now(), dataUrl:dataUrl, thumb:dataUrl });
            renderPanelStrip();
            showToast('📌 Frame pinned');
        }
        function renderPanelStrip() {
            const strip = document.getElementById('panel-strip');
            strip.innerHTML = panels.map((p,i)=>
                `<img src="${p.thumb}" class="panel-thumb ${i===currentPanelIndex?'active':''}" onclick="loadPanel(${i})">`
            ).join('');
        }
        function loadPanel(index) {
            if(index >= panels.length) return;
            currentPanelIndex = index;
            const img = new Image();
            img.onload = ()=>{
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img,0,0);
                if(layers.length){
                    layers[0].canvas.width=img.width; layers[0].canvas.height=img.height;
                    layers[0].ctx.drawImage(img,0,0);
                }
                compositeLayers();
                saveState();
            };
            img.src = panels[index].dataUrl;
            renderPanelStrip();
        }

        // ========== FILE HANDLING ==========
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            files.forEach(file=>{
                const reader = new FileReader();
                reader.onload = ev=>{
                    const item = { id:'f_'+Math.random().toString(36).substr(2,8), name:file.name, dataUrl:ev.target.result, type:file.type.startsWith('image')?'image':'file' };
                    library.push(item);
                    if(library.length===1 && item.type==='image') loadImageToCanvas(item.dataUrl);
                    spawnNodeParticle();
                    showToast(`📂 ${file.name}`);
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }

        function loadImageToCanvas(dataUrl) {
            document.getElementById('canvas-placeholder').classList.add('hidden');
            const img = new Image();
            img.onload = ()=>{
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img,0,0);
                const baseLayer = { canvas: document.createElement('canvas'), originalImg: img, ctx: null };
                baseLayer.canvas.width = img.width; baseLayer.canvas.height = img.height;
                baseLayer.ctx = baseLayer.canvas.getContext('2d', { willReadFrequently:true });
                baseLayer.ctx.drawImage(img,0,0);
                layers = [baseLayer];
                overlays = []; filterLayers = []; adjustments = { brightness:0, contrast:0, saturation:100 };
                historyStack = []; historyPointer = -1;
                selectedOverlayIndex = null; activeOverlaySize = 75; activeOverlayRotation = 0;
                processImagePipeline();
                saveState();
            };
            img.src = dataUrl;
        }

        function spawnNodeParticle() {
            for(let i=0;i<5;i++){
                nodeParticles.push({
                    x: Math.random()*nodeCanvas.width,
                    y: nodeCanvas.height + Math.random()*20,
                    vx: (Math.random()-0.5)*0.8,
                    vy: -Math.random()*2-0.5,
                    life: 255,
                    color: `hsl(${Math.random()*360},100%,60%)`
                });
            }
        }

        function animateNodes() {
            nodeCanvas.width = window.innerWidth; nodeCanvas.height = window.innerHeight;
            nodeCtx.clearRect(0,0,nodeCanvas.width,nodeCanvas.height);
            if(library.length > 1) {
                const startY = nodeCanvas.height - 40;
                const spacing = nodeCanvas.width / library.length;
                for(let i=0;i<library.length;i++){
                    const x = spacing*i + spacing/2;
                    if(i>0){
                        const prevX = spacing*(i-1)+spacing/2;
                        nodeCtx.beginPath();
                        nodeCtx.moveTo(prevX, startY);
                        nodeCtx.lineTo(x, startY);
                        nodeCtx.strokeStyle = 'rgba(0,240,255,0.3)';
                        nodeCtx.lineWidth = 1.5;
                        nodeCtx.stroke();
                    }
                    nodeCtx.beginPath();
                    nodeCtx.arc(x, startY, 6, 0, Math.PI*2);
                    nodeCtx.fillStyle = '#00f0ff';
                    nodeCtx.fill();
                    nodeCtx.shadowColor = '#00f0ff';
                    nodeCtx.shadowBlur = 10;
                    nodeCtx.fill();
                    nodeCtx.shadowBlur = 0;
                }
            }
            nodeParticles.forEach((p,idx)=>{
                p.x += p.vx; p.y += p.vy; p.life -= 2;
                if(p.life <= 0){ nodeParticles.splice(idx,1); return; }
                nodeCtx.beginPath();
                nodeCtx.arc(p.x, p.y, 2, 0, Math.PI*2);
                nodeCtx.fillStyle = p.color;
                nodeCtx.globalAlpha = p.life/255;
                nodeCtx.fill();
                nodeCtx.globalAlpha = 1;
            });
            requestAnimationFrame(animateNodes);
        }
        animateNodes();

        // ========== IMAGE PIPELINE ==========
        function processImagePipeline() {
            if(!layers.length) return;
            const base = layers[0];
            const w = base.canvas.width, h = base.canvas.height;
            base.ctx.clearRect(0,0,w,h);
            base.ctx.drawImage(base.originalImg,0,0);
            let imgData = base.ctx.getImageData(0,0,w,h);
            let d = imgData.data;
            const bright = adjustments.brightness;
            const contrast = adjustments.contrast;
            const sat = adjustments.saturation/100;
            const factor = (259*(contrast+255))/(255*(259-contrast));
            for(let i=0;i<d.length;i+=4){
                let r=d[i],g=d[i+1],b=d[i+2];
                r = factor*(r+bright-128)+128; g = factor*(g+bright-128)+128; b = factor*(b+bright-128)+128;
                let gray = 0.299*r + 0.587*g + 0.114*b;
                d[i] = Math.min(255,Math.max(0,gray+(r-gray)*sat));
                d[i+1] = Math.min(255,Math.max(0,gray+(g-gray)*sat));
                d[i+2] = Math.min(255,Math.max(0,gray+(b-gray)*sat));
            }
            base.ctx.putImageData(imgData,0,0);
            filterLayers.forEach(fl=>{
                const fC=document.createElement('canvas'); fC.width=w; fC.height=h;
                const fCtx=fC.getContext('2d'); fCtx.drawImage(base.canvas,0,0);
                if(fl.type==='anime-ductus'||fl.type==='ductus-pro'){
                    const fd=fCtx.getImageData(0,0,w,h); const px=fd.data; const steps=fl.type==='ductus-pro'?6:4;
                    for(let i=0;i<px.length;i+=4){ px[i]=Math.floor(px[i]/(256/steps))*(256/steps); px[i+1]=Math.floor(px[i+1]/(256/steps))*(256/steps); px[i+2]=Math.floor(px[i+2]/(256/steps))*(256/steps); }
                    fCtx.putImageData(fd,0,0);
                } else if(fl.type==='pixel-art'){
                    const pSize=8; fCtx.imageSmoothingEnabled=false; fCtx.drawImage(base.canvas,0,0,w/pSize,h/pSize); fCtx.drawImage(fC,0,0,w/pSize,h/pSize,0,0,w,h);
                } else if(fl.type==='halftone-dots') {
                    // simple halftone
                    fCtx.fillStyle = 'rgba(0,0,0,0.3)';
                    for(let y=0;y<h;y+=6){ for(let x=0;x<w;x+=6){ fCtx.beginPath(); fCtx.arc(x,y,2,0,Math.PI*2); fCtx.fill(); } }
                } else if(fl.type==='glitch-rgb') {
                    const slice = fCtx.getImageData(0,0,w,h);
                    const sd = slice.data;
                    for(let y=0;y<h;y+=3){ for(let x=0;x<w;x++){ const idx=(y*w+x)*4; const shift = Math.floor(Math.random()*4)*4; if(idx+shift+2<sd.length){ sd[idx] = sd[idx+shift]; sd[idx+1]=sd[idx+shift+1]; sd[idx+2]=sd[idx+shift+2]; } } }
                    fCtx.putImageData(slice,0,0);
                }
                base.ctx.save(); base.ctx.globalAlpha=fl.strength/100; base.ctx.globalCompositeOperation=fl.blendMode||'overlay'; base.ctx.drawImage(fC,0,0); base.ctx.restore();
            });
            compositeLayers();
        }

        function compositeLayers() {
            if(!canvas.width || !layers.length) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.drawImage(layers[0].canvas,0,0);
            overlays.forEach(item=>{
                ctx.save(); ctx.translate(item.x,item.y);
                if(item.rotation) ctx.rotate(item.rotation);
                ctx.font = `bold ${item.size}px sans-serif`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillStyle = item.color || '#ffffff';
                ctx.fillText(item.content,0,0);
                ctx.restore();
            });
            if(currentGridPreset!=='none' && gridPresets[currentGridPreset]){
                const preset=gridPresets[currentGridPreset];
                ctx.save(); ctx.strokeStyle='rgba(0,240,255,0.25)'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
                for(let i=1;i<preset.cols;i++){ const x=(canvas.width/preset.cols)*i; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
                for(let i=1;i<preset.rows;i++){ const y=(canvas.height/preset.rows)*i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
                ctx.setLineDash([]); ctx.restore();
            }
            if(eraserMode){ ctx.save(); ctx.strokeStyle='#ff5500'; ctx.lineWidth=2; ctx.setLineDash([3,3]); ctx.strokeRect(0,0,canvas.width,canvas.height); ctx.setLineDash([]); ctx.restore(); }
            if(brushMode){ ctx.save(); ctx.strokeStyle=selectedColor; ctx.lineWidth=brushSize; ctx.setLineDash([2,2]); ctx.strokeRect(0,0,canvas.width,canvas.height); ctx.setLineDash([]); ctx.restore(); }
        }

        // ========== HISTORY ==========
        function saveState(){ if(!canvas.width) return; if(historyPointer<historyStack.length-1) historyStack=historyStack.slice(0,historyPointer+1); historyStack.push(canvas.toDataURL()); if(historyStack.length>25) historyStack.shift(); historyPointer=historyStack.length-1; }
        function undo(){ if(historyPointer>0){ historyPointer--; loadHistoryState(historyStack[historyPointer]); showToast('⏪ Undo'); } else showToast('⏪ At oldest','error'); }
        function redo(){ if(historyPointer<historyStack.length-1){ historyPointer++; loadHistoryState(historyStack[historyPointer]); showToast('⏩ Redo'); } else showToast('⏩ At newest','error'); }
        function loadHistoryState(dataUrl){ const img=new Image(); img.onload=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); if(layers.length&&layers[0].ctx){ layers[0].ctx.clearRect(0,0,layers[0].canvas.width,layers[0].canvas.height); layers[0].ctx.drawImage(img,0,0); } }; img.src=dataUrl; }

        // ========== OVERLAYS & BRUSH ==========
        function addText(){ const input=prompt('Enter text','⚡'); if(input){ overlays.push({content:input,x:canvas.width/2,y:canvas.height/2,size:activeOverlaySize,rotation:activeOverlayRotation*(Math.PI/180),color:selectedColor}); selectedOverlayIndex=overlays.length-1; compositeLayers(); saveState(); showToast('💬 Added'); } }
        function addSticker(){ const stickers=['😎','🕶️','🎭','🧿','💢','✨','🦋','🌈','🔥','💎']; const s=stickers[Math.floor(Math.random()*stickers.length)]; overlays.push({content:s,x:canvas.width/2,y:canvas.height/2,size:activeOverlaySize,rotation:0,color:'#ffffff'}); selectedOverlayIndex=overlays.length-1; compositeLayers(); saveState(); showToast('🩹 Sticker'); }
        function toggleEraser(){ eraserMode=!eraserMode; brushMode=false; document.getElementById('eraser-btn').classList.toggle('active',eraserMode); document.getElementById('brush-btn').classList.remove('active'); canvas.style.cursor=eraserMode?'cell':'default'; }
        function toggleMaskMode(){ maskMode=!maskMode; document.getElementById('mask-btn').classList.toggle('active',maskMode); showToast(`🎭 Mask ${maskMode?'ON':'OFF'}`); }
        function toggleBrushMode(){ brushMode=!brushMode; eraserMode=false; document.getElementById('brush-btn').classList.toggle('active',brushMode); document.getElementById('eraser-btn').classList.remove('active'); canvas.style.cursor=brushMode?'crosshair':'default'; }

        // Canvas touch for brush
        container.addEventListener('touchstart', e=>{
            if(e.touches.length===2){ initialPinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); initialZoom=currentZoom; return; }
            if(e.touches.length===1 && e.target===canvas){
                const rect=canvas.getBoundingClientRect();
                const pt={ x:(e.touches[0].clientX-rect.left)*(canvas.width/rect.width), y:(e.touches[0].clientY-rect.top)*(canvas.height/rect.height) };
                if(brushMode){ ctx.beginPath(); ctx.arc(pt.x,pt.y,brushSize/2,0,Math.PI*2); ctx.fillStyle=selectedColor; ctx.fill(); saveState(); return; }
                if(eraserMode){ eraseAt(pt.x,pt.y); return; }
                if(maskMode){ maskAt(pt.x,pt.y); return; }
                for(let i=overlays.length-1;i>=0;i--){
                    if(Math.hypot(pt.x-overlays[i].x, pt.y-overlays[i].y) < Math.max(40, overlays[i].size)){
                        selectedOverlayIndex=i; isDraggingItem=true; dragStartX=pt.x-overlays[i].x; dragStartY=pt.y-overlays[i].y; return;
                    }
                }
                isPanning=true; lastPanX=e.touches[0].clientX; lastPanY=e.touches[0].clientY;
            }
        }, {passive:false});
        container.addEventListener('touchmove', e=>{
            if(e.touches.length===2 && initialPinchDist){ e.preventDefault(); const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); currentZoom=Math.min(6,Math.max(0.1, initialZoom*(dist/initialPinchDist))); updateTransform(); return; }
            if(e.touches.length===1 && isDraggingItem){ e.preventDefault(); const rect=canvas.getBoundingClientRect(); const pt={ x:(e.touches[0].clientX-rect.left)*(canvas.width/rect.width), y:(e.touches[0].clientY-rect.top)*(canvas.height/rect.height) }; if(selectedOverlayIndex!==null && overlays[selectedOverlayIndex]){ overlays[selectedOverlayIndex].x=pt.x-dragStartX; overlays[selectedOverlayIndex].y=pt.y-dragStartY; } compositeLayers(); }
            else if(e.touches.length===1 && isPanning){ e.preventDefault(); panX += (e.touches[0].clientX-lastPanX); panY += (e.touches[0].clientY-lastPanY); lastPanX=e.touches[0].clientX; lastPanY=e.touches[0].clientY; updateTransform(); }
        }, {passive:false});
        container.addEventListener('touchend', ()=>{ initialPinchDist=null; if(isDraggingItem) saveState(); isDraggingItem=false; isPanning=false; });

        function eraseAt(x,y){ ctx.save(); ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill(); ctx.restore(); saveState(); }
        function maskAt(x,y){ const imgData=ctx.getImageData(x-10,y-10,20,20); const d=imgData.data; for(let i=0;i<d.length;i+=4) d[i+3]=0; ctx.putImageData(imgData,x-10,y-10); saveState(); }

        function updateTransform(){ zoomViewport.style.transform=`translate(${panX}px, ${panY}px) scale(${currentZoom})`; }
        function resetZoom(){ currentZoom=1; panX=0; panY=0; updateTransform(); }

        // ========== VAULT & SPRITE SHEET ==========
        function openVault(){ renderVaultList(); document.getElementById('vault-modal').classList.remove('hidden'); }
        function closeVault(){ document.getElementById('vault-modal').classList.add('hidden'); }
        function saveToVault(){ if(canvas.width){ vaultItems.push({id:'vault_'+Date.now(), dataUrl:canvas.toDataURL('image/png'), thumb:canvas.toDataURL('image/png')}); showToast('🔐 Saved'); } }
        function renderVaultList(){ const list=document.getElementById('vault-list'); if(!vaultItems.length){ list.innerHTML='<div class="col-span-full text-center text-slate-500 py-4">Empty</div>'; return; } list.innerHTML = vaultItems.map((v,i)=>`<div class="vault-item" onclick="loadVaultItem('${v.id}')"><img src="${v.thumb}"><span class="text-nano text-slate-400">${i+1}</span></div>`).join(''); }
        function loadVaultItem(id){ const item=vaultItems.find(v=>v.id===id); if(item){ closeVault(); const img=new Image(); img.onload=()=>{ canvas.width=img.width; canvas.height=img.height; ctx.drawImage(img,0,0); if(layers.length){ layers[0].canvas.width=img.width; layers[0].canvas.height=img.height; layers[0].ctx.drawImage(img,0,0); } compositeLayers(); saveState(); }; img.src=item.dataUrl; } }
        function downloadAllVault(){ vaultItems.forEach((v,i)=>{ const a=document.createElement('a'); a.href=v.dataUrl; a.download=`vault_${i+1}.png`; a.click(); }); }
        function downloadSpriteSheet(){ if(!vaultItems.length) return; const cols=Math.ceil(Math.sqrt(vaultItems.length)); const rows=Math.ceil(vaultItems.length/cols); const thumbSize=128; const sheet=document.createElement('canvas'); sheet.width=cols*thumbSize; sheet.height=rows*thumbSize; const sctx=sheet.getContext('2d'); vaultItems.forEach((v,i)=>{ const col=i%cols; const row=Math.floor(i/cols); const img=new Image(); img.onload=()=>{ sctx.drawImage(img,col*thumbSize,row*thumbSize,thumbSize,thumbSize); if(i===vaultItems.length-1){ const a=document.createElement('a'); a.href=sheet.toDataURL('image/png'); a.download='sprite_sheet.png'; a.click(); showToast('💾 Sprite sheet'); } }; img.src=v.thumb; }); }
        function exportSpriteSheet(){ downloadSpriteSheet(); }

        // ========== EXPORT ==========
        function openExportModal(){ if(canvas.width) document.getElementById('export-modal').classList.remove('hidden'); }
        function closeModals(){ document.getElementById('export-modal').classList.add('hidden'); document.getElementById('vault-modal').classList.add('hidden'); document.getElementById('grid-modal').classList.add('hidden'); document.getElementById('resolution-modal').classList.add('hidden'); }
        function exportFile(fmt){ if(!canvas.width) return; try{ const a=document.createElement('a'); a.href=canvas.toDataURL(fmt==='jpg'?'image/jpeg':fmt==='webp'?'image/webp':'image/png',0.95); a.download=`panel_${Date.now()}.${fmt}`; a.click(); showToast(`💾 ${fmt}`); }catch(e){ showToast('Export failed','error'); } }

        // ========== INIT ==========
        renderPanelStrip();
        applyStyle('comic');
        console.log('⚡ NEON COMIC VAULT STUDIO v13 — JRPG & Cyberpunk ready');
    </script>
</body>
