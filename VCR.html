<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>VRoid Studio Pro — Fixed & Enhanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #070b13;
            --panel: rgba(13,18,30,.85);
            --line: #29364b;
            --txt: #edf2f7;
            --pink: #ec4899;
            --cyan: #22d3ee;
            --green: #34d399;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100dvh; /* Fix for iOS Safari */
            overflow: hidden;
            background: var(--bg);
            color: var(--txt);
            font-family: Inter, system-ui, sans-serif;
        }
        button { user-select: none; -webkit-user-select: none; }
        .glass {
            background: var(--panel);
            border: 1px solid rgba(72,88,112,.65);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            box-shadow: 0 12px 40px rgba(0,0,0,.25);
        }
        .btn { border:1px solid #2b3950; background:#172133; color:#e8eef7; transition:.16s; cursor:pointer; }
        .btn:hover { background:#213047; }
        .btn:active { transform:scale(.96); }
        .tab-btn { padding:6px 8px; border-radius:10px; font-size:10px; font-weight:600; border:1px solid transparent; }
        .tab-btn.active { color:#ec4899; background:#ec48991a; border-color:#ec489966; }
        .asset-card { min-height:48px; border:1px solid #2b3950; background:#1e293b80; border-radius:10px; padding:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; cursor:pointer; transition:.16s; }
        .asset-card:hover, .asset-card.active { border-color:#ec4899; background:#ec489922; }
        .asset-card.hidden-part { opacity:.4; }
        .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
        .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
        .swipe-control { cursor:ew-resize; background:#1e293b; border:1px solid #2a3a4e; border-radius:6px; padding:4px 8px; display:flex; justify-content:space-between; align-items:center; font-size:10px; touch-action:none; }
        .swipe-value { font-weight:700; color:#ec4899; min-width:30px; }
        #joystick { position:fixed; left:20px; bottom:180px; width:110px; height:110px; border-radius:50%; border:2px solid #ec489955; background:#11182799; display:none; touch-action:none; z-index:50; }
        #joy-thumb { position:absolute; left:30px; top:30px; width:46px; height:46px; border-radius:50%; background:#ec4899aa; border:2px solid #fff4; }
        #viewport {
            position: fixed;
            inset: 0;
            z-index: 0;
            transform: translateZ(0); /* Force GPU layer */
        }
        .camera-btn { font-size:10px; padding:4px 8px; }
        @media (max-width:760px) {
            .hide-mobile { display:none!important; }
            .grid-3 { grid-template-columns:repeat(2,1fr); }
            .grid-4 { grid-template-columns:repeat(2,1fr); }
        }
    </style>
</head>
<body>
<div id="viewport"></div>

<!-- Upload Overlay (will disappear after load) -->
<div id="upload-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 p-4" style="display:flex">
    <div class="max-w-md bg-slate-900/90 border border-slate-700 p-8 rounded-3xl shadow-2xl text-center space-y-4">
        <div class="w-16 h-16 bg-pink-500/20 border border-pink-500/40 rounded-2xl flex items-center justify-center mx-auto text-2xl">🧍</div>
        <h2 class="text-xl font-bold">VRoid Studio Pro</h2>
        <p class="text-xs text-slate-400">Upload GLB/GLTF avatar</p>
        <label class="inline-flex items-center gap-2 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold px-6 py-3 rounded-2xl cursor-pointer shadow-xl text-sm">
            <i class="fa-solid fa-cloud-arrow-up"></i> Upload Avatar
            <input type="file" id="upload-hero" accept=".glb,.gltf" class="hidden">
        </label>
    </div>
</div>

<!-- Top Bar -->
<div class="fixed top-3 left-3 right-3 z-30 flex items-center justify-between pointer-events-none">
    <div class="glass rounded-2xl px-3 py-2 flex items-center gap-2 pointer-events-auto">
        <span id="status" class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
        <div><div class="text-[9px] uppercase font-bold text-slate-500">VRoid Studio Pro</div><div id="modelName" class="text-xs font-bold text-pink-400 truncate max-w-[130px]">No model</div></div>
    </div>
    <div class="flex gap-1.5 pointer-events-auto">
        <button id="skeletonBtn" class="btn rounded-xl px-3 py-2 text-xs"><i class="fa-solid fa-bone text-emerald-400"></i><span class="hide-mobile"> Skeleton</span></button>
        <button id="dotsBtn" class="btn rounded-xl px-3 py-2 text-xs"><i class="fa-solid fa-circle-dot text-sky-400"></i><span class="hide-mobile"> Dots</span></button>
        <button id="focusBtn" class="btn rounded-xl px-3 py-2 text-xs"><i class="fa-solid fa-crosshairs"></i><span class="hide-mobile"> Focus</span></button>
        <label class="btn rounded-xl px-3 py-2 text-xs cursor-pointer"><i class="fa-solid fa-upload text-sky-400"></i><span class="hide-mobile"> Upload</span><input type="file" id="upload" accept=".glb,.gltf" class="hidden"></label>
        <button id="exportBtn" class="btn rounded-xl px-3 py-2 text-xs text-emerald-300"><i class="fa-solid fa-download"></i><span class="hide-mobile"> GLB</span></button>
    </div>
</div>

<!-- Mode & Emotes -->
<div class="fixed left-3 z-30 flex flex-col gap-1 pointer-events-auto" style="bottom:180px;">
    <div class="glass rounded-2xl p-1.5 flex flex-col gap-1">
        <button onclick="setMode('pose')" id="mode-pose-btn" class="px-2 py-1.5 rounded-lg text-xs font-bold bg-pink-600/30 border border-pink-500/50 text-pink-300">Pose</button>
        <button onclick="setMode('game')" id="mode-game-btn" class="px-2 py-1.5 rounded-lg text-xs font-bold bg-slate-800/70 border border-slate-600 text-slate-300">Game</button>
        <button onclick="setMode('anim')" id="mode-anim-btn" class="px-2 py-1.5 rounded-lg text-xs font-bold bg-slate-800/70 border border-slate-600 text-slate-300">Timeline</button>
    </div>
    <div class="glass rounded-2xl p-1.5 grid grid-cols-3 gap-0.5">
        <button onclick="playEmote('idle')" class="w-7 h-7 rounded-md bg-slate-800/70 text-xs">🧘</button>
        <button onclick="playEmote('wave')" class="w-7 h-7 rounded-md bg-slate-800/70 text-xs">👋</button>
        <button onclick="playEmote('dance')" class="w-7 h-7 rounded-md bg-slate-800/70 text-xs">💃</button>
        <button onclick="playEmote('run')" class="w-7 h-7 rounded-md bg-slate-800/70 text-xs">🏃</button>
        <button onclick="playEmote('jump')" class="w-7 h-7 rounded-md bg-slate-800/70 text-xs">🦘</button>
        <button onclick="playEmote('spin')" class="w-7 h-7 rounded-md bg-slate-800/70 text-xs">🌀</button>
    </div>
</div>

<!-- Joystick -->
<div id="joystick"><div id="joy-thumb"></div></div>

<!-- Camera Views -->
<div class="fixed right-3 z-30 flex flex-col gap-1" style="top:50%; transform:translateY(-50%);">
    <button class="btn rounded-lg px-3 py-2 camera-btn" data-cam="front">👤</button>
    <button class="btn rounded-lg px-3 py-2 camera-btn" data-cam="back">🔙</button>
    <button class="btn rounded-lg px-3 py-2 camera-btn" data-cam="left">⬅️</button>
    <button class="btn rounded-lg px-3 py-2 camera-btn" data-cam="right">➡️</button>
    <button class="btn rounded-lg px-3 py-2 camera-btn" data-cam="top">⬇️</button>
    <button class="btn rounded-lg px-3 py-2 camera-btn" data-cam="persp">🔲</button>
</div>

<!-- Toast -->
<div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-40 bg-slate-900/95 px-3 py-1.5 rounded-full text-xs opacity-0 pointer-events-none"></div>

<!-- Bottom HUD -->
<div class="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur-2xl border-t border-slate-700 flex flex-col" style="height:170px;">
    <div class="flex items-center justify-between px-2 pt-1 pb-1 border-b border-slate-800">
        <div class="flex gap-0.5">
            <button onclick="switchTab('parts')" id="tab-parts-btn" class="tab-btn active"><i class="fa-solid fa-shirt"></i> Parts</button>
            <button onclick="switchTab('bones')" id="tab-bones-btn" class="tab-btn"><i class="fa-solid fa-bone"></i> Bones</button>
            <button onclick="switchTab('pose')" id="tab-pose-btn" class="tab-btn"><i class="fa-solid fa-child"></i> Pose</button>
            <button onclick="switchTab('materials')" id="tab-materials-btn" class="tab-btn"><i class="fa-solid fa-palette"></i> Mats</button>
            <button onclick="switchTab('anims')" id="tab-anims-btn" class="tab-btn"><i class="fa-solid fa-film"></i> Anims</button>
            <button onclick="switchTab('settings')" id="tab-settings-btn" class="tab-btn"><i class="fa-solid fa-gear"></i> Set</button>
        </div>
        <span id="stats" class="text-[8px] text-slate-500 font-mono">0b · 0p</span>
    </div>
    <div class="flex-1 overflow-hidden p-1.5" id="hud-content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

<script>
    // ===== STATE =====
    let scene, camera, renderer, controls, character = null;
    let skeletonHelper = null;
    let bones = [], parts = [], boneMap = {}, markers = [];
    let selectedBone = null, selectedPart = 'all';
    let showSkeleton = false, showBoneDots = true, category = 'All';
    let mode = 'pose';
    let clock = new THREE.Clock();
    let keys = [], playing = false, playTime = 0, recording = false, keyInterval = .45;
    let originalMaterials = new Map();
    let activeDrag = null, pointerDown = null;
    let gltfAnimations = [], animationActions = [], mixer = null, currentAnimAction = null, bakedAnimations = [];
    let gravity = 0.9, lightIntensity = 1.5;
    let game = { w:false, s:false, a:false, d:false, jump:false, crouch:false, vy:0, currentAnim:null };
    let ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
    const categories = [
        ['All','fa-layer-group'],['Head','fa-face-smile'],['Torso','fa-person'],['L Arm','fa-hand'],['R Arm','fa-hand'],['L Leg','fa-person-running'],['R Leg','fa-person-running'],['Hair','fa-wand-magic-sparkles'],['Other','fa-cubes']
    ];

    const $ = id => document.getElementById(id);
    function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' '); }
    function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function showToast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1; clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity=0,1800); }

    // ===== SWIPE CONTROL =====
    function createSwipeControl(label,min,max,step,initial,onChange){
        const container=document.createElement('div');
        container.className='swipe-control';
        container.innerHTML=`<span>${label}</span><span class="swipe-value">${initial.toFixed(2)}</span>`;
        let val=initial,startX=0,startVal=0,dragging=false;
        function setVal(v){ val=Math.min(max,Math.max(min,v)); container.querySelector('.swipe-value').textContent=val.toFixed(2); }
        container.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startVal=val;container.setPointerCapture(e.pointerId);container.classList.add('dragging');e.preventDefault();});
        container.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-startX;let newVal=startVal+(dx/100)*(max-min);if(step)newVal=Math.round(newVal/step)*step;setVal(newVal);onChange(val);});
        container.addEventListener('pointerup',()=>{dragging=false;container.classList.remove('dragging');});
        container.addEventListener('pointercancel',()=>{dragging=false;container.classList.remove('dragging');});
        return {el:container,setValue:(v)=>{setVal(v);onChange(v)},getValue:()=>val};
    }

    let poseSwipes={}, matSwipes={}, gravitySwipe, lightSwipe;
    function createSwipeControls(){
        poseSwipes={};
        const poseContainer=$('poseSwipeContainer');
        poseSwipes.rx=createSwipeControl('Pitch',-3.14,3.14,0.01,0,v=>{if(selectedBone)selectedBone.rotation.x=v});
        poseSwipes.ry=createSwipeControl('Yaw',-3.14,3.14,0.01,0,v=>{if(selectedBone)selectedBone.rotation.y=v});
        poseSwipes.rz=createSwipeControl('Roll',-3.14,3.14,0.01,0,v=>{if(selectedBone)selectedBone.rotation.z=v});
        poseContainer.appendChild(poseSwipes.rx.el);poseContainer.appendChild(poseSwipes.ry.el);poseContainer.appendChild(poseSwipes.rz.el);

        matSwipes={};
        const matContainer=$('matSwipeContainer');
        matSwipes.rough=createSwipeControl('Rough',0,1,0.01,0.5,v=>getMaterials().forEach(m=>m.roughness=v));
        matSwipes.metal=createSwipeControl('Metal',0,1,0.01,0.1,v=>getMaterials().forEach(m=>m.metalness=v));
        matSwipes.opacity=createSwipeControl('Opacity',0,1,0.01,1,v=>getMaterials().forEach(m=>{m.opacity=v;m.transparent=v<0.999}));
        matContainer.appendChild(matSwipes.rough.el);matContainer.appendChild(matSwipes.metal.el);matContainer.appendChild(matSwipes.opacity.el);

        gravitySwipe=createSwipeControl('Gravity',0.1,3,0.05,gravity,v=>{gravity=v});
        lightSwipe=createSwipeControl('Light',0.2,3,0.05,lightIntensity,v=>{lightIntensity=v;updateLightIntensity()});
        $('gravitySwipe').replaceWith(gravitySwipe.el);
        $('lightSwipe').replaceWith(lightSwipe.el);
    }
    function updateSwipeValues(){
        if(!selectedBone||!poseSwipes.rx)return;
        poseSwipes.rx.setValue(selectedBone.rotation.x);
        poseSwipes.ry.setValue(selectedBone.rotation.y);
        poseSwipes.rz.setValue(selectedBone.rotation.z);
    }

    // ===== CAMERA =====
    function setCamera(view){
        if(!character)return;
        const box=new THREE.Box3().setFromObject(character),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
        const dist=Math.max(size.y*1.8,3);
        controls.target.copy(center);
        switch(view){
            case 'front': camera.position.set(center.x,center.y+dist*.3,center.z+dist); break;
            case 'back': camera.position.set(center.x,center.y+dist*.3,center.z-dist); break;
            case 'left': camera.position.set(center.x-dist,center.y+dist*.3,center.z); break;
            case 'right': camera.position.set(center.x+dist,center.y+dist*.3,center.z); break;
            case 'top': camera.position.set(center.x,center.y+dist*1.5,center.z+0.01); break;
            default: camera.position.set(center.x+dist*.65,center.y+dist*.35,center.z+dist);
        }
        controls.update();
        showToast(view+' view');
    }
    function focusModel(){setCamera('persp')}

    // ===== MODEL LOADING =====
    function loadFile(file){
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
        loader.setDRACOLoader(dracoLoader);
        const url = URL.createObjectURL(file);
        loader.load(url, (gltf) => {
            URL.revokeObjectURL(url);
            if (character) {
                scene.remove(character);
                if (skeletonHelper) { scene.remove(skeletonHelper); skeletonHelper = null; }
                markers.forEach(m=>scene.remove(m.s)); markers=[];
                if(mixer) mixer.stopAllAction();
            }
            character = gltf.scene;
            character.position.set(0,0,0);
            character.rotation.set(0,0,0);
            character.scale.set(1,1,1);
            scene.add(character);
            if (mixer) mixer.stopAllAction();
            mixer = new THREE.AnimationMixer(character);
            gltfAnimations = gltf.animations || [];
            animationActions = gltfAnimations.map(clip=>mixer.clipAction(clip));
            updateAnimGrid();
            scanRig();
            normalizeModel();
            focusModel();
            $('modelName').textContent = file.name;
            $('status').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
            $('upload-overlay').style.display='none';
            showToast('Loaded '+file.name);
            if(gltfAnimations.length) showToast(gltfAnimations.length+' embedded animation(s)');
        }, undefined, (error) => { console.error(error); showToast('Load failed'); });
    }

    function scanRig(){
        bones=[];parts=[];boneMap={};originalMaterials.clear();
        character.traverse(o=>{
            if(o.isBone||o.type==='Bone'){bones.push(o);o.userData.baseRotation=o.rotation.clone();mapBone(o)}
            if(o.isMesh||o.isSkinnedMesh){parts.push(o);o.castShadow=true;o.receiveShadow=true;saveMaterials(o)}
        });
        if(!boneMap.spine&&bones[0])boneMap.spine=bones[0];
        if(!boneMap.head&&bones[1])boneMap.head=bones[1];
        selectedBone=boneMap.spine||bones[0]||null;
        createMarkers();
        renderAssets();
        populateBoneSelect();
        populateMaterials();
        $('stats').textContent=`${bones.length} bones · ${parts.length} parts`;
        updateSwipeValues();
    }

    function mapBone(b){
        const n=norm(b.name);
        const side=n.includes('left')||/(^|[_\\.\\-])l($|[_\\.\\-])/.test(n)?'L':n.includes('right')||/(^|[_\\.\\-])r($|[_\\.\\-])/.test(n)?'R':'';
        const set=(k)=>{if(!boneMap[k])boneMap[k]=b};
        if(/hip|pelvis|spine|chest|torso/.test(n))set('spine');
        else if(/head|neck/.test(n))set('head');
        else if(/forearm|lowerarm|elbow/.test(n))set(side==='L'?'leftForearm':'rightForearm');
        else if(/upperarm|shoulder|arm/.test(n))set(side==='L'?'leftArm':'rightArm');
        else if(/shin|calf|lowerleg|knee/.test(n))set(side==='L'?'leftShin':'rightShin');
        else if(/thigh|upperleg|upleg|leg/.test(n))set(side==='L'?'leftLeg':'rightLeg');
    }

    function normalizeModel(){
        character.updateMatrixWorld(true);
        let box=new THREE.Box3().setFromObject(character),size=box.getSize(new THREE.Vector3());
        if(size.y<.5){showToast('Model orientation may need manual adjustment')}
        const h=Math.max(size.y,.001);const s=2.15/h;character.scale.setScalar(s);character.updateMatrixWorld(true);
        box.setFromObject(character);character.position.y-=box.min.y;
    }

    function createMarkers(){
        markers.forEach(m=>scene.remove(m.s));markers=[];
        if(!showBoneDots)return;
        const geo=new THREE.SphereGeometry(.055,10,10);
        bones.forEach(b=>{const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x34d399,depthTest:false,transparent:true,opacity:.9}));m.renderOrder=999;m.userData.bone=b;scene.add(m);markers.push({s:m,b})});
    }
    function updateMarkers(){if(!character)return;character.updateMatrixWorld(true);markers.forEach(m=>m.b.getWorldPosition(m.s.position));}

    function partCategory(p){
        const n=norm(p.name);
        if(/hair|ponytail|bang|face|eye|mouth|head/.test(n))return n.includes('hair')||n.includes('ponytail')||n.includes('bang')?'Hair':'Head';
        if(/arm|hand|shoulder|sleeve/.test(n))return /left|_l|\.l/.test(n)?'L Arm':'R Arm';
        if(/leg|thigh|foot|shoe|shin|calf/.test(n))return /left|_l|\.l/.test(n)?'L Leg':'R Leg';
        if(/body|chest|torso|shirt|dress|skirt|coat/.test(n))return'Torso';return'Other';
    }
    function boneCategory(b){
        const n=norm(b.name);
        if(/head|neck/.test(n))return'Head';
        if(/arm|hand|shoulder/.test(n))return /left|_l|\.l/.test(n)?'L Arm':'R Arm';
        if(/leg|foot|toe|shin|thigh/.test(n))return /left|_l|\.l/.test(n)?'L Leg':'R Leg';
        if(/hair/.test(n))return'Hair';
        if(/spine|chest|hip|pelvis/.test(n))return'Torso';
        return'Other';
    }
    function renderCategories(){
        $('cats').innerHTML=categories.map(([n,i])=>`<button class="cat ${n===category?'active':''}" data-cat="${n}"><i class="fa-solid ${i}"></i> ${n}</button>`).join('');
        $('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderCategories();renderAssets()});
    }
    function renderAssets(){
        const items=[...bones.map(b=>({kind:'bone',obj:b,cat:boneCategory(b)})),...parts.map(p=>({kind:'part',obj:p,cat:partCategory(p)}))];
        const filtered=items.filter(x=>category==='All'||x.cat===category);
        $('asset-scroll').innerHTML=`<div class="grid-3">${filtered.map((x,i)=>{
            const sel=x.kind==='bone'&&selectedBone===x.obj?'active':x.kind==='part'&&selectedPart===x.obj.uuid?'active':'';
            const icon=x.kind==='bone'?'fa-bone':'fa-cube';
            const hidden=x.kind==='part'&&!x.obj.visible?'hidden-part':'';
            return `<button class="asset-card ${sel} ${hidden}" data-i="${i}"><i class="asset-icon fa-solid ${icon}"></i><span class="asset-name">${esc(x.obj.name||x.kind)}</span><span class="mini">${x.cat}</span></button>`;
        }).join('')}</div>`;
        $('asset-scroll').querySelectorAll('.asset-card').forEach((el,i)=>{el.onclick=()=>{const x=filtered[i];if(x.kind==='bone'){selectBone(x.obj);switchTab('pose')}else{selectedPart=x.obj.uuid;renderAssets();showToast(x.obj.name||'Part selected')}}});
    }
    function populateBoneSelect(){
        const opts=['spine','head','leftArm','rightArm','leftForearm','rightForearm','leftLeg','rightLeg','leftShin','rightShin'];
        $('boneSelect').innerHTML=opts.map(k=>`<option value="${k}">${k}</option>`).join('');
        if(selectedBone){const k=Object.keys(boneMap).find(k=>boneMap[k]===selectedBone);if(k)$('boneSelect').value=k}
        updateSwipeValues();
    }
    function populateMaterials(){
        $('matTarget').innerHTML='<option value="all">All parts</option>'+parts.map(p=>`<option value="${p.uuid}">${esc(p.name||'Part')}</option>`).join('');
    }
    function saveMaterials(mesh){
        const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material];
        originalMaterials.set(mesh.uuid,mats.map(m=>({color:m.color?.clone(),roughness:m.roughness,metalness:m.metalness,opacity:m.opacity,transparent:m.transparent,emissive:m.emissive?.clone(),emissiveIntensity:m.emissiveIntensity,map:m.map})));
    }
    function getMaterials(){
        const list=selectedPart==='all'?parts:parts.filter(p=>p.uuid===selectedPart);
        return list.flatMap(p=>Array.isArray(p.material)?p.material:(p.material?[p.material]:[]));
    }
    function applyFX(fx){
        getMaterials().forEach(m=>{
            if(fx==='normal'){
                const mesh=parts.find(p=>(Array.isArray(p.material)?p.material:[p.material]).includes(m));
                const o=mesh&&originalMaterials.get(mesh.uuid)?.[0];
                if(o){m.roughness=o.roughness;m.metalness=o.metalness;m.opacity=o.opacity;m.transparent=o.transparent;m.emissive?.copy(o.emissive||new THREE.Color(0));m.emissiveIntensity=o.emissiveIntensity||0;m.map=o.map}
            }else{
                m.transparent=true;
                if(fx==='cyber'){m.roughness=.12;m.metalness=.85;m.emissive?.set(0xec4899);m.emissiveIntensity=.25;m.opacity=.9}
                if(fx==='holo'){m.roughness=.05;m.metalness=.8;m.emissive?.set(0x22d3ee);m.emissiveIntensity=.65;m.opacity=.62}
                if(fx==='ghost'){m.roughness=.3;m.metalness=.1;m.emissive?.set(0xa78bfa);m.emissiveIntensity=.35;m.opacity=.45}
            }
            m.needsUpdate=true;
        });
        showToast(fx+' material');
    }
    function selectBone(b){if(!b)return;selectedBone=b;const k=Object.keys(boneMap).find(k=>boneMap[k]===b);if(k)$('boneSelect').value=k;renderAssets();updateSwipeValues();showToast('Selected '+(b.name||'bone'))}
    function resetSelected(){if(!selectedBone)return;selectedBone.rotation.copy(selectedBone.userData.baseRotation||new THREE.Euler());updateSwipeValues()}

    // Pointer interactions
    function onPointerDown(e){
        if(mode==='game')return;
        pointerDown={x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};
        const hit=pickBone(e.clientX,e.clientY);
        if(hit){
            e.preventDefault();
            renderer.domElement.setPointerCapture(e.pointerId);
            controls.enabled=false;
            selectBone(hit);
            activeDrag={bone:hit,x:e.clientX,y:e.clientY,rx:hit.rotation.x,ry:hit.rotation.y,rz:hit.rotation.z};
            $('reticle').style.left=e.clientX+'px';
            $('reticle').style.top=e.clientY+'px';
            $('reticle').style.display='block';
        }
    }
    function onPointerMove(e){
        if(!pointerDown)return;
        const dx=e.clientX-pointerDown.x,dy=e.clientY-pointerDown.y;
        if(Math.hypot(dx,dy)>5)pointerDown.moved=true;
        if(!activeDrag)return;
        e.preventDefault();
        const scale=(e.shiftKey||e.ctrlKey)?0.014:0.007;
        activeDrag.bone.rotation.y=THREE.MathUtils.clamp(activeDrag.ry+dx*scale,-Math.PI,Math.PI);
        activeDrag.bone.rotation.x=THREE.MathUtils.clamp(activeDrag.rx-dy*scale,-Math.PI,Math.PI);
        updateSwipeValues();
    }
    function onPointerUp(e){
        if(activeDrag){
            try{renderer.domElement.releasePointerCapture(e.pointerId)}catch{}
            controls.enabled=true;
            activeDrag=null;
            $('reticle').style.display='none';
        }
        pointerDown=null;
    }
    function pickBone(x,y){
        const r=renderer.domElement.getBoundingClientRect();
        mouse.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);
        ray.setFromCamera(mouse,camera);
        const hits=ray.intersectObjects(markers.map(m=>m.s),false);
        return hits[0]?.object?.userData?.bone||null;
    }

    // Tab & Mode
    function switchTab(t){
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
        ['parts','bones','pose','materials','anims','settings'].forEach(id=>{
            const panel=$('panel-'+id);
            if(panel) panel.style.display = id===t ? 'block' : 'none';
        });
        if(t==='game') setMode('game');
        else if(mode==='game') setMode('pose');
    }
    function setMode(m){
        mode=m;
        $('joystick').style.display = m==='game' ? 'block' : 'none';
        if(m==='game'){controls.enabled=true;showToast('Game mode')}
        else showToast(m+' mode');
    }
    function toggleSkeleton(){
        showSkeleton=!showSkeleton;
        if(showSkeleton&&character){skeletonHelper=new THREE.SkeletonHelper(character);scene.add(skeletonHelper)}
        else if(skeletonHelper){scene.remove(skeletonHelper);skeletonHelper=null}
    }
    function toggleBoneDots(){
        showBoneDots=!showBoneDots;
        if(showBoneDots)createMarkers();
        else markers.forEach(m=>scene.remove(m.s)),markers=[];
    }

    // Timeline & Animations
    function recordKey(){
        if(!character)return;
        keys.push({time:keys.length?keys[keys.length-1].time+keyInterval:0,pose:Object.fromEntries(bones.map(b=>[b.uuid,[b.rotation.x,b.rotation.y,b.rotation.z]]))});
        renderTimeline();
        showToast('Keyframe '+keys.length);
    }
    function renderTimeline(){
        $('keyCount').textContent=keys.length+' keys';
        $('timeline').innerHTML=keys.map((k,i)=>`<button class="btn rounded-lg px-3 py-2 text-[9px]" data-k="${i}">K${i+1}<br><span class="mini">${k.time.toFixed(2)}s</span></button>`).join('');
        $('timeline').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>applyKey(keys[+b.dataset.k]));
    }
    function applyKey(k){if(!k)return;bones.forEach(b=>{const p=k.pose[b.uuid];if(p)b.rotation.set(p[0],p[1],p[2])});updateSwipeValues();}
    function clearKeys(){keys=[];playing=false;renderTimeline()}
    function exportAnimation(){const blob=new Blob([JSON.stringify({version:1,frameRate:1/keyInterval,keyframes:keys},null,2)],{type:'application/json'});downloadBlob(blob,'animation.json');}
    function bakeSequence(){if(keys.length<2){showToast('Need at least 2 keyframes');return;}const name='Baked_'+Date.now();bakedAnimations.push({name,frames:JSON.parse(JSON.stringify(keys))});updateAnimGrid();showToast('Baked: '+name);}
    function updateAnimGrid(){
        const container=$('animGrid');
        container.innerHTML='';
        const allAnims=[...gltfAnimations.map((a,i)=>({name:a.name||`Embedded ${i+1}`,index:i,type:'gltf'})),...bakedAnimations.map((a,i)=>({name:a.name,index:i,type:'baked'}))];
        if(allAnims.length===0){container.innerHTML='<span class="mini italic">No animations</span>';return;}
        allAnims.forEach(a=>{
            const btn=document.createElement('button');
            btn.className='btn rounded-lg px-2 py-1 text-[10px]';
            btn.textContent=a.name;
            btn.onclick=()=>{if(a.type==='gltf')playEmbeddedAnimation(a.index);else playBakedAnimation(a.index);};
            container.appendChild(btn);
        });
    }
    function playEmbeddedAnimation(index){
        if(!mixer||index>=animationActions.length)return;
        if(currentAnimAction)currentAnimAction.stop();
        currentAnimAction=animationActions[index];
        currentAnimAction.reset().play();
        mode='anim';
        showToast('Playing '+gltfAnimations[index].name);
    }
    function playBakedAnimation(index){
        const anim=bakedAnimations[index];
        if(!anim)return;
        keys=JSON.parse(JSON.stringify(anim.frames));
        renderTimeline();
        playing=true;playTime=0;mode='anim';
        showToast('Playing baked: '+anim.name);
    }
    function assignGameAnim(type){
        if(bakedAnimations.length===0){showToast('Bake an animation first');return;}
        const anim=bakedAnimations[bakedAnimations.length-1];
        game.currentAnim=type;
        showToast(`Assigned ${type} to last baked animation`);
    }
    function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}

    // Keyboard & Joystick
    function keyDown(e){const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')game.w=true;if(k==='s'||k==='arrowdown')game.s=true;if(k==='a'||k==='arrowleft')game.a=true;if(k==='d'||k==='arrowright')game.d=true;if(k===' ')game.jump=true;if(k==='shift')game.crouch=true;}
    function keyUp(e){const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')game.w=false;if(k==='s'||k==='arrowdown')game.s=false;if(k==='a'||k==='arrowleft')game.a=false;if(k==='d'||k==='arrowright')game.d=false;if(k===' ')game.jump=false;if(k==='shift')game.crouch=false;}
    function setupJoystick(){
        const z=$('joystick'),t=$('joy-thumb');
        let active=false,cx=0,cy=0;
        const move=e=>{if(!active)return;const dx=e.clientX-cx,dy=e.clientY-cy,d=Math.min(Math.hypot(dx,dy),40),a=Math.atan2(dy,dx);t.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;game.a=dx<-12;game.d=dx>12;game.w=dy<-12;game.s=dy>12;};
        z.onpointerdown=e=>{active=true;const r=z.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;z.setPointerCapture(e.pointerId);move(e)};
        z.onpointermove=move;
        z.onpointerup=z.onpointercancel=()=>{active=false;t.style.transform='translate(0,0)';game.w=game.s=game.a=game.d=false};
    }

    // Game update
    function updateGame(dt){
        if(!character)return;
        const x=(game.d?1:0)-(game.a?1:0),z=(game.w?1:0)-(game.s?1:0),moving=x||z;
        if(moving){
            const a=Math.atan2(x,z);
            character.rotation.y=a;
            character.position.x+=Math.sin(a)*dt*1.8;
            character.position.z+=Math.cos(a)*dt*1.8;
            const t=performance.now()*.012,swing=Math.sin(t)*.65;
            if(boneMap.leftLeg)boneMap.leftLeg.rotation.x=-swing;
            if(boneMap.rightLeg)boneMap.rightLeg.rotation.x=swing;
            if(boneMap.leftArm)boneMap.leftArm.rotation.x=swing*.7;
            if(boneMap.rightArm)boneMap.rightArm.rotation.x=-swing*.7;
        } else {
            if(boneMap.leftLeg)boneMap.leftLeg.rotation.x*=0.9;
            if(boneMap.rightLeg)boneMap.rightLeg.rotation.x*=0.9;
        }
        if(game.jump&&character.position.y<=.001)game.vy=.3;
        game.vy-=dt*gravity;
        character.position.y=Math.max(0,character.position.y+game.vy*dt);
        if(character.position.y===0)game.vy=0;
        character.scale.y=game.crouch?.82:1;
        if(game.crouch)character.position.y=.02;
    }

    // Timeline update
    function updateTimeline(dt){
        if(!playing||keys.length<2)return;
        playTime+=dt;
        const total=keys[keys.length-1].time;
        if(playTime>total)playTime=0;
        let a=keys[0],b=keys[keys.length-1];
        for(let i=0;i<keys.length-1;i++)if(playTime>=keys[i].time&&playTime<=keys[i+1].time){a=keys[i];b=keys[i+1];break}
        const t=(playTime-a.time)/Math.max(.0001,b.time-a.time);
        const eased=t*t*(3-2*t);
        bones.forEach(bone=>{
            const pa=a.pose[bone.uuid],pb=b.pose[bone.uuid];
            if(pa&&pb)bone.rotation.set(THREE.MathUtils.lerp(pa[0],pb[0],eased),THREE.MathUtils.lerp(pa[1],pb[1],eased),THREE.MathUtils.lerp(pa[2],pb[2],eased));
        });
    }

    // Main loop
    function animate(){
        requestAnimationFrame(animate);
        const dt=Math.min(clock.getDelta(),.033);
        if(mixer)mixer.update(dt);
        if(mode==='game')updateGame(dt);
        if(mode==='anim')updateTimeline(dt);
        updateMarkers();
        if(skeletonHelper)skeletonHelper.update();
        controls.update();
        renderer.render(scene,camera);
    }

    // UI initialisation
    function renderHUD(){
        const container=$('hud-content');
        container.innerHTML=`
        <section id="panel-parts">
            <div class="flex justify-between items-center mb-1"><span class="text-[10px] font-bold">Parts</span><div class="flex gap-1"><button onclick="toggleAllParts(true)">Show</button><button onclick="toggleAllParts(false)">Hide</button></div></div>
            <div class="catbar" id="cats"></div>
            <div id="asset-scroll" class="max-h-16 overflow-y-auto"></div>
        </section>
        <section id="panel-bones" style="display:none">
            <div class="flex justify-between items-center mb-1"><span class="text-[10px] font-bold">Bones (tap to select)</span><button onclick="autoRig()">Re-detect</button></div>
            <div id="bones-grid" class="grid-4 max-h-24 overflow-y-auto"></div>
        </section>
        <section id="panel-pose" style="display:none">
            <div class="flex items-center gap-2 mb-2"><select id="boneSelect" class="flex-1 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs"></select><button id="resetBone">↺</button><button id="keyBtn">＋Key</button></div>
            <div class="grid grid-cols-3 gap-2" id="poseSwipeContainer"></div>
        </section>
        <section id="panel-materials" style="display:none">
            <div class="flex items-center gap-2 mb-2"><select id="matTarget" class="flex-1 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs"><option value="all">All</option></select><input type="color" id="color" value="#ffffff" class="w-6 h-6"></div>
            <div class="grid grid-cols-3 gap-2" id="matSwipeContainer"></div>
            <div class="flex gap-1 mt-2"><button data-fx="normal">N</button><button data-fx="cyber">C</button><button data-fx="holo">H</button><button data-fx="ghost">G</button></div>
        </section>
        <section id="panel-anims" style="display:none">
            <div class="mb-1"><div id="animGrid" class="grid grid-cols-4 gap-1"></div></div>
            <div class="flex flex-wrap gap-1"><button id="record">●Rec</button><button id="play">▶Play</button><button id="stop">■Stop</button><button id="clearKeys">Clear</button><button id="exportAnim">Exp JSON</button><button id="bakeSeq">Bake</button><span id="keyCount">0 keys</span></div>
            <div id="timeline" class="flex gap-1 overflow-x-auto"></div>
        </section>
        <section id="panel-settings" style="display:none">
            <div class="grid grid-cols-2 gap-2"><div id="gravitySwipe" class="swipe-control"><span>Gravity</span><span class="swipe-value">0.9</span></div><div id="lightSwipe" class="swipe-control"><span>Light</span><span class="swipe-value">1.5</span></div></div>
        </section>
        <section id="panel-game" style="display:none">
            <div class="flex flex-wrap gap-1"><button id="gameMode">Enable Game</button><button data-gameanim="idle">Idle</button><button data-gameanim="run">Run</button><button data-gameanim="jump">Jump</button><button data-gameanim="duck">Duck</button></div>
        </section>
        `;
        switchTab('parts');
        createSwipeControls();
        bindAdditionalEvents();
    }

    function bindAdditionalEvents(){
        document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>applyFX(b.dataset.fx));
        document.querySelectorAll('[data-gameanim]').forEach(b=>b.onclick=()=>assignGameAnim(b.dataset.gameanim));
        $('boneSelect').onchange=()=>selectBone(boneMap[$('boneSelect').value]||null);
        $('resetBone').onclick=resetSelected;
        $('keyBtn').onclick=recordKey;
        $('record').onclick=()=>{recording=!recording;$('record').textContent=recording?'■Rec':'●Rec';showToast(recording?'Recording':'Stopped')};
        $('play').onclick=()=>{if(keys.length){playing=true;playTime=0;mode='anim';showToast('Playing timeline')}};
        $('stop').onclick=()=>playing=false;
        $('clearKeys').onclick=clearKeys;
        $('exportAnim').onclick=exportAnimation;
        $('bakeSeq').onclick=bakeSequence;
        $('gameMode').onclick=()=>setMode(mode==='game'?'pose':'game');
    }

    function toggleAllParts(show){ parts.forEach(p=>p.visible=show); renderAssets(); }

    // Init everything
    function init(){
        scene=new THREE.Scene(); scene.background=new THREE.Color(0x070b13);
        camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.05,100);
        camera.position.set(2.8,1.9,4.6);
        renderer=new THREE.WebGLRenderer({antialias:true});
        renderer.setPixelRatio(Math.min(devicePixelRatio,2)); // iOS safe
        renderer.setSize(innerWidth,innerHeight);
        renderer.shadowMap.enabled=true;
        renderer.outputColorSpace=THREE.SRGBColorSpace;
        $('viewport').appendChild(renderer.domElement);
        controls=new THREE.OrbitControls(camera,renderer.domElement);
        controls.enableDamping=true; controls.dampingFactor=.08; controls.minDistance=1.2; controls.maxDistance=12; controls.maxPolarAngle=Math.PI*.92;
        scene.add(new THREE.HemisphereLight(0xddeeff,0x182033,1.2));
        const keyLight=new THREE.DirectionalLight(0xffffff,1.8); keyLight.position.set(4,7,5); keyLight.castShadow=true; scene.add(keyLight);
        const rim=new THREE.DirectionalLight(0xff9ac8,1.0); rim.position.set(-4,4,-5); scene.add(rim);
        const grid=new THREE.GridHelper(20,40,0x334155,0x172033); scene.add(grid);
        window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
        // Upload handlers
        $('upload').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value='';});
        $('upload-hero').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value='';});
        $('skeletonBtn').addEventListener('click',toggleSkeleton);
        $('dotsBtn').addEventListener('click',toggleBoneDots);
        $('focusBtn').addEventListener('click',()=>setCamera('persp'));
        document.querySelectorAll('.camera-btn').forEach(b=>b.addEventListener('click',()=>setCamera(b.dataset.cam)));
        $('exportBtn').addEventListener('click',exportGLB);
        // Pointer events
        renderer.domElement.addEventListener('pointerdown',onPointerDown,{passive:false});
        renderer.domElement.addEventListener('pointermove',onPointerMove,{passive:false});
        renderer.domElement.addEventListener('pointerup',onPointerUp,{passive:false});
        window.addEventListener('keydown',keyDown);
        window.addEventListener('keyup',keyUp);
        setupJoystick();
        renderHUD();
        renderCategories();
        updateAnimGrid();
        animate();
    }

    async function exportGLB(){
        if(!character)return;
        const exporter=new THREE.GLTFExporter();
        exporter.parse(character,(result)=>{const blob=new Blob([result],{type:'application/octet-stream'});downloadBlob(blob,'avatar.glb');});
    }

    init();
</script>
</body>
</html>
