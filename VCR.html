<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VRoid Studio X — Ultimate Editor</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827e6;
            --panel-solid: #111827;
            --border: #2a3a4e;
            --border-strong: #3b4a5e;
            --text: #eef2f7;
            --text-dim: #9ca3af;
            --accent: #ec4899;
            --accent2: #a855f7;
            --accent3: #22d3ee;
            --accent4: #34d399;
            --radius: 12px;
            --radius-sm: 8px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #ec4899;
            border-radius: 9999px;
        }
        .glass {
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
        }
        .tab-btn {
            cursor: pointer;
            border-radius: 8px;
            padding: 4px 6px;
            font-size: 9px;
            font-weight: 600;
            border: 1px solid transparent;
            transition: all 0.15s;
            text-align: center;
            white-space: nowrap;
        }
        .tab-btn.active {
            color: #ec4899;
            background: rgba(236, 72, 153, 0.15);
            border-color: rgba(236, 72, 153, 0.4);
        }
        .asset-card {
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #2a3a4e;
            background: #1e293b80;
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 10px;
            text-align: center;
            color: #eef2f7;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }
        .asset-card:hover {
            border-color: #ec4899;
            background: #ec489922;
        }
        .asset-card.active {
            border-color: #ec4899;
            background: #ec489933;
        }
        .wheel-control {
            cursor: ew-resize;
            background: #1e293b;
            border: 1px solid #2a3a4e;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 28px;
            transition: all 0.2s;
            touch-action: none;
        }
        .wheel-control:active {
            border-color: #ec4899;
            background: #ec489922;
        }
        .wheel-control .wheel-value {
            font-weight: 700;
            color: #ec4899;
            font-size: 11px;
            min-width: 30px;
        }
        .btn {
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #2a3a4e;
            background: #1e293b;
            color: #eef2f7;
        }
        .btn:hover {
            background: #2a3a4e;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .fade-in {
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Grid layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .grid-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .grid-6 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }
        @media (min-width: 640px) {
            .grid-2 {
                grid-template-columns: repeat(3, 1fr);
            }
            .grid-3 {
                grid-template-columns: repeat(4, 1fr);
            }
            .grid-4 {
                grid-template-columns: repeat(5, 1fr);
            }
            .grid-5 {
                grid-template-columns: repeat(6, 1fr);
            }
            .grid-6 {
                grid-template-columns: repeat(8, 1fr);
            }
        }
        /* Joystick */
        #joystick-zone {
            position: fixed;
            bottom: 180px;
            left: 16px;
            width: 100px;
            height: 100px;
            background: rgba(17, 24, 39, 0.5);
            border-radius: 50%;
            border: 2px solid rgba(236, 72, 153, 0.3);
            display: none;
            pointer-events: auto;
            z-index: 40;
            touch-action: none;
        }
        #joystick-thumb {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(236, 72, 153, 0.7);
            border-radius: 50%;
            top: 30px;
            left: 30px;
            pointer-events: none;
        }
        .bone-marker-sphere {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="canvas-container" class="fixed inset-0 z-0"></div>

    <!-- Upload Overlay -->
    <div id="upload-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 p-4">
        <div class="max-w-lg w-full bg-slate-900/95 border border-slate-700 p-6 sm:p-10 rounded-3xl shadow-2xl text-center space-y-5">
            <div class="w-20 h-20 bg-gradient-to-br from-pink-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-lg"><i class="fa-solid fa-cube"></i></div>
            <h1 class="text-2xl font-bold">VRoid Studio X</h1>
            <p class="text-sm text-slate-400">Ultimate GLB avatar editor. Animations, baking, touch controls.</p>
            <label class="inline-flex items-center gap-2 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold px-6 py-3 rounded-2xl cursor-pointer shadow-xl text-sm">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Avatar
                <input type="file" id="file-upload-hero" accept=".glb,.gltf" class="hidden">
            </label>
            <p class="text-[10px] text-slate-500">VRM not supported — convert to GLB</p>
        </div>
    </div>

    <!-- Top Bar -->
    <div class="fixed top-2 left-2 right-2 z-20 flex items-center justify-between pointer-events-none">
        <div class="glass rounded-xl px-2.5 py-1.5 shadow-lg pointer-events-auto flex items-center gap-2">
            <div id="status-dot" class="w-2 h-2 rounded-full bg-rose-500"></div>
            <div>
                <div class="text-[8px] font-bold text-slate-500 uppercase">VRoid X</div>
                <div id="model-name" class="text-[10px] font-bold text-pink-400 truncate max-w-[110px] sm:max-w-xs">No Model</div>
            </div>
        </div>
        <div class="flex items-center gap-1.5 pointer-events-auto">
            <button id="btn-skeleton" class="btn px-2.5 py-1.5 rounded-lg text-[10px] font-semibold"><i class="fa-solid fa-bone text-emerald-400"></i> Bones</button>
            <button id="btn-bone-dots" class="btn px-2.5 py-1.5 rounded-lg text-[10px] font-semibold"><i class="fa-solid fa-circle-dot text-sky-400"></i> Dots</button>
            <button id="btn-export" class="btn px-2.5 py-1.5 rounded-lg text-[10px] font-semibold text-emerald-300"><i class="fa-solid fa-download"></i></button>
            <label class="btn px-2.5 py-1.5 rounded-lg text-[10px] font-semibold cursor-pointer text-sky-300">
                <i class="fa-solid fa-upload text-sky-400"></i>
                <input type="file" id="file-upload" accept=".glb,.gltf" class="hidden">
            </label>
        </div>
    </div>

    <!-- Mode Selector & Emotes (left) -->
    <div class="fixed left-2 z-20 flex flex-col gap-1.5 pointer-events-auto" style="bottom: 165px;">
        <div class="glass rounded-xl p-1.5 flex flex-col gap-1 shadow-lg">
            <button onclick="setMode('pose')" id="mode-pose-btn" class="px-2 py-1.5 rounded-lg text-[9px] font-bold bg-pink-600/30 border border-pink-500/50 text-pink-300">Pose</button>
            <button onclick="setMode('game')" id="mode-game-btn" class="px-2 py-1.5 rounded-lg text-[9px] font-bold bg-slate-800/70 border border-slate-600 text-slate-300">Game</button>
            <button onclick="setMode('anim')" id="mode-anim-btn" class="px-2 py-1.5 rounded-lg text-[9px] font-bold bg-slate-800/70 border border-slate-600 text-slate-300">Timeline</button>
        </div>
        <div class="glass rounded-xl p-1.5 grid grid-cols-3 gap-0.5 shadow-lg">
            <button onclick="playEmote('idle')" class="w-7 h-7 rounded-md bg-slate-800/70 hover:bg-slate-700 flex items-center justify-center text-xs">🧘</button>
            <button onclick="playEmote('wave')" class="w-7 h-7 rounded-md bg-slate-800/70 hover:bg-slate-700 flex items-center justify-center text-xs">👋</button>
            <button onclick="playEmote('dance')" class="w-7 h-7 rounded-md bg-slate-800/70 hover:bg-slate-700 flex items-center justify-center text-xs">💃</button>
            <button onclick="playEmote('run')" class="w-7 h-7 rounded-md bg-slate-800/70 hover:bg-slate-700 flex items-center justify-center text-xs">🏃</button>
            <button onclick="playEmote('jump')" class="w-7 h-7 rounded-md bg-slate-800/70 hover:bg-slate-700 flex items-center justify-center text-xs">🦘</button>
            <button onclick="playEmote('spin')" class="w-7 h-7 rounded-md bg-slate-800/70 hover:bg-slate-700 flex items-center justify-center text-xs">🌀</button>
        </div>
    </div>

    <!-- Joystick -->
    <div id="joystick-zone"><div id="joystick-thumb"></div></div>

    <!-- Toast -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-40 bg-slate-900/95 px-3 py-1.5 rounded-full border border-slate-700 text-[10px] text-slate-200 opacity-0 transition-opacity pointer-events-none"></div>

    <!-- Bottom HUD -->
    <div class="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur-2xl border-t border-slate-700 flex flex-col" style="height: 155px;">
        <div class="flex items-center justify-between px-1.5 pt-1 pb-0.5 border-b border-slate-800">
            <div class="flex gap-0.5">
                <button onclick="switchTab('parts')" id="tab-parts-btn" class="tab-btn active"><i class="fa-solid fa-shirt"></i> Parts</button>
                <button onclick="switchTab('bones')" id="tab-bones-btn" class="tab-btn"><i class="fa-solid fa-bone"></i> Bones</button>
                <button onclick="switchTab('pose')" id="tab-pose-btn" class="tab-btn"><i class="fa-solid fa-child"></i> Pose</button>
                <button onclick="switchTab('materials')" id="tab-materials-btn" class="tab-btn"><i class="fa-solid fa-palette"></i> Mats</button>
                <button onclick="switchTab('anims')" id="tab-anims-btn" class="tab-btn"><i class="fa-solid fa-film"></i> Anims</button>
                <button onclick="switchTab('settings')" id="tab-settings-btn" class="tab-btn"><i class="fa-solid fa-gear"></i> Set</button>
            </div>
            <span id="stats" class="text-[8px] text-slate-500 font-mono pr-1">0b · 0p</span>
        </div>
        <div class="flex-1 overflow-hidden p-1.5 text-xs" id="hud-content">
            <!-- Dynamic content -->
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // ============ STATE ============
        let scene, camera, renderer, controls, mixer;
        let character = null;
        let skeletonHelper = null;
        let showSkeleton = false;
        let showBoneDots = true;
        let allBones = [];
        let boneMap = { spine: null, head: null, leftArm: null, rightArm: null, leftForearm: null, rightForearm: null,
            leftLeg: null, rightLeg: null, leftShin: null, rightShin: null };
        let allParts = [];
        let hiddenParts = new Set();
        let selectedPartUuid = 'all';
        let mode = 'pose';
        let activeEmote = null;
        let customAnimPlaying = false;
        let animPlaybackTime = 0;
        let recordedFrames = [];
        let physicsEnabled = { hair: true, cloth: true };
        let springGroups = { hair: [], cloth: [] };
        let boneMarkers = [];
        let originalMaterials = new Map();
        let gameKeys = { forward: false, backward: false, left: false, right: false, jump: false, duck: false };
        let gameVel = { y: 0 };
        let clock = new THREE.Clock();
        let joystickActive = false;
        let joystickCenter = { x: 0, y: 0 };
        let joystickVector = { x: 0, y: 0 };
        let gltfAnimations = [];
        let animationActions = [];
        let bakedAnimButtons = [];
        let gravity = 0.02;
        let lightIntensity = 1.0;
        let currentAnimAction = null;
        let activeTab = 'parts';

        // ============ INIT ============
        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f1a);
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(3, 3, 5);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.2, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.maxPolarAngle = Math.PI * 0.7;
            controls.update();

            setupLights();
            setupEnvironment();
            window.addEventListener('resize', onResize);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            bindUI();
            animate();
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.6 * lightIntensity));
            const key = new THREE.DirectionalLight(0xfff0e6, 1.5 * lightIntensity);
            key.position.set(6, 10, 6);
            key.castShadow = true;
            key.shadow.mapSize.width = 1024;
            key.shadow.mapSize.height = 1024;
            scene.add(key);
            const rim = new THREE.DirectionalLight(0xffc8d8, 0.5 * lightIntensity);
            rim.position.set(-3, 6, -4);
            scene.add(rim);
        }

        function setupEnvironment() {
            const grid = new THREE.GridHelper(20, 40, 0x3b4a5e, 0x1a2332);
            scene.add(grid);
            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============ MODEL LOADING ============
        function loadModel(file) {
            const url = URL.createObjectURL(file);
            const loader = new GLTFLoader();
            loader.load(url, (gltf) => {
                if (character) {
                    scene.remove(character);
                    if (skeletonHelper) { scene.remove(skeletonHelper);
                        skeletonHelper = null; }
                    clearBoneMarkers();
                    if (mixer) mixer.stopAllAction();
                }
                character = gltf.scene;
                character.position.set(0, 0, 0);
                character.rotation.set(0, 0, 0);
                character.scale.set(1, 1, 1);
                mixer = new THREE.AnimationMixer(character);

                // Store animations
                gltfAnimations = gltf.animations || [];
                animationActions = gltfAnimations.map(anim => mixer.clipAction(anim));

                allBones = [];
                boneMap = { spine: null, head: null, leftArm: null, rightArm: null, leftForearm: null, rightForearm: null,
                    leftLeg: null, rightLeg: null, leftShin: null, rightShin: null };
                allParts = [];
                hiddenParts = new Set();
                selectedPartUuid = 'all';
                springGroups = { hair: [], cloth: [] };
                recordedFrames = [];
                originalMaterials.clear();

                character.traverse((child) => {
                    if (child.isBone || child.type === 'Bone' || child.name.toLowerCase().includes('bone') || child.name
                        .startsWith('J_Bip_')) {
                        allBones.push(child);
                        const b = child.name.toLowerCase();
                        if (!boneMap.spine && (b.includes('spine') || b.includes('chest') || b.includes('hips') || b.includes(
                                'torso'))) boneMap.spine = child;
                        if (!boneMap.head && (b.includes('head') || b.includes('neck'))) boneMap.head = child;
                        if (!boneMap.leftArm && (b.includes('leftarm') || b.includes('upperarm_l') || b.includes('arm.l') ||
                                b.includes('l_upperarm'))) boneMap.leftArm = child;
                        if (!boneMap.rightArm && (b.includes('rightarm') || b.includes('upperarm_r') || b.includes('arm.r') ||
                                b.includes('r_upperarm'))) boneMap.rightArm = child;
                        if (!boneMap.leftForearm && (b.includes('leftforearm') || b.includes('lowerarm_l') || b.includes(
                                'forearm_l') || b.includes('l_lowerarm'))) boneMap.leftForearm = child;
                        if (!boneMap.rightForearm && (b.includes('rightforearm') || b.includes('lowerarm_r') || b.includes(
                                'forearm_r') || b.includes('r_lowerarm'))) boneMap.rightForearm = child;
                        if (!boneMap.leftLeg && (b.includes('leftleg') || b.includes('upleg_l') || b.includes('leg.l') || b
                            .includes('l_upperleg'))) boneMap.leftLeg = child;
                        if (!boneMap.rightLeg && (b.includes('rightleg') || b.includes('upleg_r') || b.includes('leg.r') || b
                            .includes('r_upperleg'))) boneMap.rightLeg = child;
                        if (!boneMap.leftShin && (b.includes('leftshin') || b.includes('lowerleg_l') || b.includes('shin_l') ||
                                b.includes('l_lowerleg'))) boneMap.leftShin = child;
                        if (!boneMap.rightShin && (b.includes('rightshin') || b.includes('lowerleg_r') || b.includes('shin_r') ||
                                b.includes('r_lowerleg'))) boneMap.rightShin = child;
                    }
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        allParts.push(child);
                        if (child.material) {
                            const mats = Array.isArray(child.material) ? child.material : [child.material];
                            originalMaterials.set(child.uuid, mats.map(m => ({ color: m.color.clone(), roughness: m.roughness,
                                metalness: m.metalness, opacity: m.opacity, transparent: m.transparent, map: m.map,
                                emissive: m.emissive ? m.emissive.clone() : null, emissiveIntensity: m.emissiveIntensity })));
                        }
                        const mn = (child.name || '').toLowerCase();
                        if (mn.includes('hair') || mn.includes('beard')) springGroups.hair.push({ mesh: child, baseRot: child
                                .rotation.clone() });
                        else if (mn.includes('skirt') || mn.includes('cloth') || mn.includes('dress')) springGroups.cloth.push({ mesh: child,
                            baseRot: child.rotation.clone() });
                    }
                });

                orientAndScale();
                scene.add(character);

                if (allBones.length > 0) {
                    if (!boneMap.spine) boneMap.spine = allBones[0];
                    if (!boneMap.head && allBones.length > 1) boneMap.head = allBones[1];
                    if (!boneMap.leftArm && allBones.length > 2) boneMap.leftArm = allBones[2];
                    if (!boneMap.rightArm && allBones.length > 3) boneMap.rightArm = allBones[3];
                    if (!boneMap.leftLeg && allBones.length > 4) boneMap.leftLeg = allBones[4];
                    if (!boneMap.rightLeg && allBones.length > 5) boneMap.rightLeg = allBones[5];
                }

                createBoneMarkers();
                updateAllUI();
                populateBoneMappingDropdowns();
                populateMaterialTarget();
                updateAnimList();
                document.getElementById('upload-overlay').style.display = 'none';
                document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-emerald-500';
                document.getElementById('model-name').textContent = file.name;
                document.getElementById('stats').textContent = `${allBones.length}b · ${allParts.length}p · ${gltfAnimations.length}a`;
                showToast('Model loaded');
            });
        }

        function orientAndScale() {
            if (!character) return;
            character.rotation.set(0, 0, 0);
            character.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(character);
            const size = box.getSize(new THREE.Vector3());
            if (size.y < Math.max(size.x, size.z) * 0.7) {
                character.rotation.x = -Math.PI / 2;
                character.updateMatrixWorld(true);
                const newBox = new THREE.Box3().setFromObject(character);
                const newSize = newBox.getSize(new THREE.Vector3());
                if (newSize.y <= size.y) {
                    character.rotation.x = 0;
                    character.rotation.z = -Math.PI / 2;
                }
            }
            character.updateMatrixWorld(true);
            const finalBox = new THREE.Box3().setFromObject(character);
            const finalHeight = finalBox.getSize(new THREE.Vector3()).y;
            if (finalHeight > 0) {
                const scale = 2.0 / finalHeight;
                character.scale.setScalar(scale);
                character.updateMatrixWorld(true);
                const afterScale = new THREE.Box3().setFromObject(character);
                character.position.y = -afterScale.min.y;
                character.position.x = 0;
                character.position.z = 0;
            }
        }

        // ============ BONE MARKERS ============
        function createBoneMarkers() {
            clearBoneMarkers();
            if (!character || !showBoneDots) return;
            const geo = new THREE.SphereGeometry(0.045, 8, 8);
            allBones.forEach(bone => {
                const mat = new THREE.MeshStandardMaterial({ color: 0x34d399, emissive: 0x34d399, emissiveIntensity: 0.5 });
                const sphere = new THREE.Mesh(geo, mat);
                sphere.userData.bone = bone;
                sphere.userData.isMarker = true;
                sphere.renderOrder = 999;
                sphere.material.depthTest = false;
                scene.add(sphere);
                boneMarkers.push({ sphere, bone });
            });
        }

        function clearBoneMarkers() {
            boneMarkers.forEach(({ sphere }) => scene.remove(sphere));
            boneMarkers = [];
        }

        function updateBoneMarkers() {
            if (!character) return;
            character.updateMatrixWorld(true);
            boneMarkers.forEach(({ sphere, bone }) => bone.getWorldPosition(sphere.position));
        }

        // Bone marker click
        renderer.domElement.addEventListener('pointerup', (event) => {
            if (!character || boneMarkers.length === 0) return;
            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(boneMarkers.map(m => m.sphere), false);
            if (intersects.length > 0) {
                selectBone(intersects[0].object.userData.bone);
            }
        });

        function selectBone(bone) {
            const b = bone.name.toLowerCase();
            let key = null;
            if (b.includes('spine') || b.includes('chest') || b.includes('hips') || b.includes('torso')) key = 'spine';
            else if (b.includes('head') || b.includes('neck')) key = 'head';
            else if (b.includes('leftforearm') || b.includes('lowerarm_l') || b.includes('forearm_l')) key = 'leftForearm';
            else if (b.includes('rightforearm') || b.includes('lowerarm_r') || b.includes('forearm_r')) key = 'rightForearm';
            else if (b.includes('leftarm') || b.includes('upperarm_l') || b.includes('arm.l')) key = 'leftArm';
            else if (b.includes('rightarm') || b.includes('upperarm_r') || b.includes('arm.r')) key = 'rightArm';
            else if (b.includes('leftshin') || b.includes('lowerleg_l') || b.includes('shin_l')) key = 'leftShin';
            else if (b.includes('rightshin') || b.includes('lowerleg_r') || b.includes('shin_r')) key = 'rightShin';
            else if (b.includes('leftleg') || b.includes('upleg_l') || b.includes('leg.l')) key = 'leftLeg';
            else if (b.includes('rightleg') || b.includes('upleg_r') || b.includes('leg.r')) key = 'rightLeg';

        // ============ WHEEL CONTROL COMPONENT ============
        function createWheelControl(label, min, max, step, value, onChange) {
            const div = document.createElement('div');
            div.className = 'wheel-control';
            div.innerHTML = `<span class="text-slate-400 text-[9px]">${label}</span><span class="wheel-value">${value.toFixed(2)}</span>`;
            let currentValue = value;
            let startX = 0;
            let startValue = 0;
            let isDragging = false;

            function updateDisplay() {
                div.querySelector('.wheel-value').textContent = currentValue.toFixed(2);
            }

            div.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startValue = currentValue;
                div.setPointerCapture(e.pointerId);
                div.style.borderColor = '#ec4899';
            });

            div.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const range = max - min;
                const sensitivity = 0.01 * range;
                currentValue = Math.min(max, Math.max(min, startValue + (dx / 100) * range));
                if (step > 0) currentValue = Math.round(currentValue / step) * step;
                currentValue = Math.min(max, Math.max(min, currentValue));
                updateDisplay();
                onChange(currentValue);
            });

            div.addEventListener('pointerup', () => {
                isDragging = false;
                div.style.borderColor = '#2a3a4e';
            });

            return { element: div, getValue: () => currentValue, setValue: (v) => { currentValue = Math.min(max, Math.max(min,
                        v));
                    updateDisplay(); } };
        }

        window.applyEffect = function(effect) {
            const mats = getTargetMaterials();
            if (!mats.length) return;
            const useTint = document.getElementById('mat-use-tint')?.checked ?? true;
            mats.forEach(mat => {
                if (effect === 'normal') {
                    const orig = originalMaterials.get(mat.uuid);
                    if (orig && orig.length > 0) {
                        mat.color.copy(orig[0].color);
                        mat.roughness = orig[0].roughness;
                        mat.metalness = orig[0].metalness;
                        mat.opacity = orig[0].opacity;
                        mat.transparent = orig[0].transparent;
                        if (orig[0].map) mat.map = orig[0].map;
                        if (orig[0].emissive) mat.emissive.copy(orig[0].emissive);
                        mat.emissiveIntensity = orig[0].emissiveIntensity || 0;
                    }
                } else {
                    mat.transparent = true;
                    mat.emissive = mat.emissive || new THREE.Color(0x000000);
                    mat.emissive.set(0x000000);
                    mat.emissiveIntensity = 0;
                    if (effect === 'cyberglitch') { mat.color.set(0xec4899); mat.roughness = 0.1; mat.metalness = 0.9; mat.emissive.set(0xec4899); mat.emissiveIntensity = 0.3; }
                    else if (effect === 'ghost') { mat.color.set(0xa78bfa); mat.roughness = 0.3; mat.metalness = 0.1; mat.opacity = 0.55; mat.emissive.set(0xa78bfa); mat.emissiveIntensity = 0.5; }
                    else if (effect === 'holo') { mat.color.set(0x22d3ee); mat.roughness = 0.05; mat.metalness = 0.8; mat.opacity = 0.65; mat.emissive.set(0x22d3ee); mat.emissiveIntensity = 0.7; }
                }
                if (!useTint && mat.map) mat.color.set(0xffffff);
                mat.needsUpdate = true;
            });
            showToast(`Effect: ${effect}`);
        };
        function getTargetMaterials() {
            if (selectedPartUuid === 'all') {
                let mats = [];
                allParts.forEach(p => { if (p.material) { const arr = Array.isArray(p.material)?p.material:[p.material]; mats.push(...arr); } });
                return mats;
            }
            const part = allParts.find(p => p.uuid === selectedPartUuid);
            if (!part?.material) return [];
            return Array.isArray(part.material)?part.material:[part.material];
        }
        window.recordPose = function() {
            if (!character || allBones.length === 0) return;
            const frame = {};
            allBones.forEach((bone, idx) => { frame[bone.name || `bone_${idx}`] = { rx:bone.rotation.x, ry:bone.rotation.y, rz:bone.rotation.z }; });
            recordedFrames.push({ time: recordedFrames.length * 0.4, pose: frame });
            showToast(`Recorded frame #${recordedFrames.length}`);
            generateHUD();
        };
        window.playTimeline = function() {
            if (recordedFrames.length === 0) { showToast('No frames'); return; }
            customAnimPlaying = true;
            animPlaybackTime = 0;
            activeEmote = null;
            if (currentAnimAction) { currentAnimAction.stop(); currentAnimAction = null; }
            setMode('anim');
            showToast('Playing timeline');
        };
        window.exportAnim = function() {
            if (recordedFrames.length === 0) return;
            const blob = new Blob([JSON.stringify(recordedFrames)], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'animation.json';
            a.click();
            showToast('Animation exported');
        };

        function playGLTFAnimation(index) {
            if (!mixer || index >= animationActions.length) return;
            if (currentAnimAction) currentAnimAction.stop();
            currentAnimAction = animationActions[index];
            currentAnimAction.reset().play();
            activeEmote = null;
            customAnimPlaying = false;
            showToast(`Playing: ${gltfAnimations[index].name || 'Animation'}`);
        }

        function bakeSequence() {
            if (recordedFrames.length < 2) { showToast('Need at least 2 frames'); return; }
            // Create a simple baked animation by storing the sequence
            const bakedName = `Baked_${Date.now()}`;
            const baked = { name: bakedName, frames: recordedFrames.map(f => JSON.parse(JSON.stringify(f))) };
            gltfAnimations.push(baked);
            animationActions.push(null); // placeholder
            showToast(`Baked: ${bakedName}`);
            updateAnimList();
            generateHUD();
        }

        // ============ KEYBOARD & JOYSTICK ============
        function onKeyDown(e) {
            if (mode !== 'game') return;
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': gameKeys.forward = true; e.preventDefault(); break;
                case 's': case 'arrowdown': gameKeys.backward = true; e.preventDefault(); break;
                case 'a': case 'arrowleft': gameKeys.left = true; e.preventDefault(); break;
                case 'd': case 'arrowright': gameKeys.right = true; e.preventDefault(); break;
                case ' ': gameKeys.jump = true; e.preventDefault(); break;
                case 'shift': gameKeys.duck = true; e.preventDefault(); break;
            }
        }
        function onKeyUp(e) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': gameKeys.forward = false; break;
                case 's': case 'arrowdown': gameKeys.backward = false; break;
                case 'a': case 'arrowleft': gameKeys.left = false; break;
                case 'd': case 'arrowright': gameKeys.right = false; break;
                case ' ': gameKeys.jump = false; break;
                case 'shift': gameKeys.duck = false; break;
            }
        }

        const joystickZone = document.getElementById('joystick-zone');
        const joystickThumb = document.getElementById('joystick-thumb');
        joystickZone.addEventListener('pointerdown', (e) => {
            joystickActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter.x = rect.left + rect.width/2;
            joystickCenter.y = rect.top + rect.height/2;
            updateJoystick(e.clientX, e.clientY);
        });
        joystickZone.addEventListener('pointermove', (e) => { if (joystickActive) updateJoystick(e.clientX, e.clientY); });
        window.addEventListener('pointerup', () => {
            joystickActive = false;
            joystickThumb.style.transform = 'translate(0px, 0px)';
            gameKeys.forward = gameKeys.backward = gameKeys.left = gameKeys.right = false;
        });
        function updateJoystick(clientX, clientY) {
            const dx = clientX - joystickCenter.x;
            const dy = clientY - joystickCenter.y;
            const dist = Math.sqrt(dx*dx+dy*dy);
            const maxDist = 35;
            const clampedDist = Math.min(dist, maxDist);
            const angle = Math.atan2(dy, dx);
            const tx = Math.cos(angle) * clampedDist;
            const ty = Math.sin(angle) * clampedDist;
            joystickThumb.style.transform = `translate(${tx}px, ${ty}px)`;
            const intensity = clampedDist / maxDist;
            gameKeys.forward = Math.sin(angle) * intensity > 0.2;
            gameKeys.backward = Math.sin(angle) * intensity < -0.2;
            gameKeys.right = Math.cos(angle) * intensity > 0.2;
            gameKeys.left = Math.cos(angle) * intensity < -0.2;
        }

        // ============ BIND UI ============
        function bindUI() {
            document.getElementById('file-upload').addEventListener('change', e => { if(e.target.files[0]) loadModel(e.target.files[0]); e.target.value=''; });
            document.getElementById('file-upload-hero').addEventListener('change', e => { if(e.target.files[0]) loadModel(e.target.files[0]); e.target.value=''; });
            document.getElementById('btn-skeleton').addEventListener('click', () => {
                showSkeleton = !showSkeleton;
                if (showSkeleton) { if (!skeletonHelper && character) { skeletonHelper = new THREE.SkeletonHelper(character); scene.add(skeletonHelper); } }
                else { if (skeletonHelper) { scene.remove(skeletonHelper); skeletonHelper = null; } }
            });
            document.getElementById('btn-bone-dots').addEventListener('click', () => {
                showBoneDots = !showBoneDots;
                if (showBoneDots) createBoneMarkers();
                else clearBoneMarkers();
            });
            document.getElementById('btn-export').addEventListener('click', exportGLB);
        }

        function exportGLB() {
            if (!character) return;
            const exporter = new GLTFExporter();
            exporter.parse(character, (result) => {
                const blob = new Blob([result], { type: 'application/octet-stream' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'avatar.glb';
                a.click();
                showToast('Exported');
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = '1';
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.style.opacity = '0', 2000);
        }

        // ============ ANIMATION LOOP ============
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = Date.now() * 0.001;
            if (mixer) mixer.update(delta);

            if (character) {
                if (mode === 'game') {
                    handleGameMovement(delta);
                } else if (mode === 'anim' && customAnimPlaying && recordedFrames.length > 0) {
                    animPlaybackTime += delta;
                    const frameIdx = Math.floor(animPlaybackTime / 0.4) % recordedFrames.length;
                    const frame = recordedFrames[frameIdx];
                    if (frame) {
                        allBones.forEach((bone, idx) => {
                            const pose = frame.pose[bone.name || `bone_${idx}`];
                            if (pose) bone.rotation.set(pose.rx, pose.ry, pose.rz);
                        });
                    }
                } else if (mode === 'pose' && activeEmote) {
                    applyEmote(activeEmote, time);
                }

                if (physicsEnabled.hair) {
                    springGroups.hair.forEach((item, i) => {
                        const t = time * 1.2 + i;
                        const tx = item.baseRot.x + Math.sin(t) * 0.03;
                        const tz = item.baseRot.z + Math.cos(t * 0.8) * 0.02;
                        item.mesh.rotation.x += (tx - item.mesh.rotation.x) * 0.05;
                        item.mesh.rotation.z += (tz - item.mesh.rotation.z) * 0.05;
                    });
                }
                if (physicsEnabled.cloth) {
                    springGroups.cloth.forEach((item, i) => {
                        const t = time * 1.0 + i;
                        const tx = item.baseRot.x + Math.sin(t) * 0.05;
                        const tz = item.baseRot.z + Math.cos(t * 0.9) * 0.04;
                        item.mesh.rotation.x += (tx - item.mesh.rotation.x) * 0.07;
                        item.mesh.rotation.z += (tz - item.mesh.rotation.z) * 0.07;
                    });
                }
                updateBoneMarkers();
                if (skeletonHelper) skeletonHelper.update();
            }
            controls.update();
            renderer.render(scene, camera);
        }

        function handleGameMovement(delta) {
            const speed = gameKeys.duck ? 0.5 : 1.0;
            const moveX = (gameKeys.right ? 1 : 0) - (gameKeys.left ? 1 : 0);
            const moveZ = (gameKeys.forward ? 1 : 0) - (gameKeys.backward ? 1 : 0);
            if (moveX !== 0 || moveZ !== 0) {
                const angle = Math.atan2(moveX, moveZ);
                character.rotation.y = angle;
                character.position.x += Math.sin(angle) * moveX * speed * delta * 3;
                character.position.z += Math.cos(angle) * moveZ * speed * delta * 3;
                if (boneMap.leftLeg && boneMap.rightLeg) {
                    boneMap.leftLeg.rotation.x = Math.sin(Date.now() * 0.015) * 0.8 * speed;
                    boneMap.rightLeg.rotation.x = -Math.sin(Date.now() * 0.015) * 0.8 * speed;
                }
                if (boneMap.leftArm && boneMap.rightArm) {
                    boneMap.leftArm.rotation.x = -Math.sin(Date.now() * 0.015) * 0.6;
                    boneMap.rightArm.rotation.x = Math.sin(Date.now() * 0.015) * 0.6;
                }
            }
            if (gameKeys.jump && character.position.y <= 0.01) gameVel.y = 0.3;
            gameVel.y -= gravity;
            character.position.y += gameVel.y;
            if (character.position.y <= 0) { character.position.y = 0; gameVel.y = 0; }
            if (gameKeys.duck) character.scale.y = 0.8;
            else character.scale.y = 1.0;
        }

        function applyEmote(emote, time) {
            switch(emote) {
                case 'idle': if (boneMap.spine) boneMap.spine.rotation.x = Math.sin(time*1.5)*0.02; break;
                case 'wave': if (boneMap.rightArm) { boneMap.rightArm.rotation.z = Math.sin(time*6)*0.5-0.6; } break;
                case 'dance':
                    if (boneMap.leftArm) boneMap.leftArm.rotation.z = Math.sin(time*4.5)*0.6;
                    if (boneMap.rightArm) boneMap.rightArm.rotation.z = -Math.sin(time*4.5)*0.6;
                    if (boneMap.leftLeg) boneMap.leftLeg.rotation.x = -Math.sin(time*4.5)*0.5;
                    if (boneMap.rightLeg) boneMap.rightLeg.rotation.x = Math.sin(time*4.5)*0.5;
                    break;
                case 'run':
                    if (boneMap.leftArm) boneMap.leftArm.rotation.x = Math.sin(time*10)*0.5;
                    if (boneMap.rightArm) boneMap.rightArm.rotation.x = -Math.sin(time*10)*0.5;
                    if (boneMap.leftLeg) boneMap.leftLeg.rotation.x = -Math.sin(time*10)*0.8;
                    if (boneMap.rightLeg) boneMap.rightLeg.rotation.x = Math.sin(time*10)*0.8;
                    break;
                case 'jump':
                    if (character) character.position.y = Math.abs(Math.sin(time*5))*0.35;
                    break;
                case 'spin': if (character) character.rotation.y += 0.03; break;
            }
        }

        init();
    </script>
</body>
</html>
