<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ NEON COMIC VAULT v20 — Full Media & Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#03050b', darkcard: '#080d1a', cyberblue: '#00f0ff', cyberpurple: '#9d00ff',
                        cyberpink: '#ff007f', cyberorange: '#ff5500', neongreen: '#00ffcc'
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite', 'glow-pulse': 'glowPulse 2.5s ease-in-out infinite',
                        'grid-shift': 'gridShift 8s linear infinite', 'bubble-rise': 'bubbleRise 6s ease-in-out infinite',
                        'shimmer': 'shimmer 3s ease-in-out infinite', 'butterfly': 'butterflyFlap 0.8s ease-in-out infinite',
                        'particle': 'particleMove 4s linear infinite', 'bunny-hop': 'bunnyHop 0.6s ease-in-out infinite'
                    },
                    keyframes: {
                        float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-8px)' } },
                        glowPulse: { '0%,100%': { boxShadow: '0 0 20px rgba(0,240,255,0.3)' }, '50%': { boxShadow: '0 0 40px rgba(0,240,255,0.7)' } },
                        gridShift: { '0%': { backgroundPosition: '0 0, 0 0' }, '100%': { backgroundPosition: '32px 32px, 32px 32px' } },
                        bubbleRise: { '0%,100%': { transform: 'translateY(0) scale(1)' }, '50%': { transform: 'translateY(-12px) scale(1.05)' } },
                        shimmer: { '0%,100%': { opacity: '0.6' }, '50%': { opacity: '1' } },
                        butterflyFlap: { '0%,100%': { transform: 'rotate(10deg)' }, '50%': { transform: 'rotate(-10deg)' } },
                        particleMove: { '0%': { transform: 'translateY(0) scale(1)', opacity: '0.8' }, '100%': { transform: 'translateY(-80px) scale(0)', opacity: '0' } },
                        bunnyHop: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');
        :root {
            --glass-bg: rgba(10,15,30,0.45); --glass-border: rgba(0,240,255,0.2);
            --glass-shadow: 0 4px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
            --cyber-glow: 0 0 25px rgba(0,240,255,0.5); --glass-radius: 12px;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk','Inter',sans-serif; background: #03050b;
            overscroll-behavior-y: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            overflow: hidden; height: 100dvh; width: 100vw; touch-action: none; color: #e2e8f0;
        }
        ::-webkit-scrollbar { width:0px; height:0px; display:none; }
        * { scrollbar-width: none; }
        .animated-bg {
            background-color:#03050b;
            background-image: radial-gradient(circle at 50% 50%, rgba(157,0,255,0.10) 0%, transparent 70%), radial-gradient(circle at 15% 25%, rgba(0,240,255,0.08) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(255,0,127,0.06) 0%, transparent 50%), linear-gradient(to right, rgba(0,240,255,0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,85,0,0.03) 1px, transparent 1px);
            background-size:100% 100%,100% 100%,100% 100%,32px 32px,32px 32px;
            animation: gridShift 12s linear infinite;
        }
        .glass {
            background: var(--glass-bg); backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%);
            border:1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--glass-radius);
        }
        .glass-btn {
            background: transparent; border:1px solid rgba(255,255,255,0.15); box-shadow:0 2px 8px rgba(0,0,0,0.4);
            border-radius:10px; transition:all 0.07s ease; cursor:pointer; touch-action:manipulation;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display:flex; align-items:center; justify-content:center;
            flex-direction:column; gap:2px; padding:6px 8px; font-size:13px; font-weight:700; letter-spacing:0.5px;
            color:#e2e8f0; white-space:nowrap; min-width:44px; min-height:44px;
        }
        .glass-btn:active,.glass-btn.active { transform:scale(0.94); background:linear-gradient(135deg, rgba(157,0,255,0.5), rgba(0,240,255,0.4)); border-color:#00f0ff; box-shadow:var(--cyber-glow); }
        .glass-btn .btn-num { font-size:9px; color:#00f0ff; font-weight:800; }
        .spheric-wheel {
            background: radial-gradient(circle at 30% 30%, #fff, #00f0ff 20%, #9d00ff 55%, #03050b 90%);
            box-shadow: inset 0 -10px 25px rgba(0,0,0,0.85), inset 0 6px 15px rgba(255,255,255,0.2), 0 0 20px rgba(0,240,255,0.4);
            border:2px solid rgba(255,255,255,0.7); border-radius:50%; width:52px; height:52px; touch-action:none; cursor:grab;
            transition:border-radius 0.3s ease, transform 0.1s ease; display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .spheric-wheel:active { transform:scale(0.85); border-color:#ff007f; box-shadow:0 0 40px rgba(255,0,127,0.8); }
        .butterfly { position:absolute; font-size:24px; animation: butterflyFlap 0.5s ease-in-out infinite, float 4s ease-in-out infinite; filter:drop-shadow(0 0 6px rgba(0,255,204,0.7)); pointer-events:none; z-index:30; }
        .node-connector-canvas { position:absolute; inset:0; pointer-events:none; z-index:20; }
        .timeline-track { display:flex; gap:4px; overflow-x:auto; padding:4px; scroll-snap-type:x proximity; }
        .timeline-frame { background:rgba(8,13,26,0.7); border:2px solid rgba(0,240,255,0.3); border-radius:6px; min-width:48px; height:48px; object-fit:cover; scroll-snap-align:start; cursor:pointer; transition:all 0.1s ease; position:relative; }
        .timeline-frame.active { border-color:#ff007f; box-shadow:0 0 20px rgba(255,0,127,0.6); }
        .vault-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(70px,1fr)); gap:6px; }
        .vault-item { background:rgba(8,13,26,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:4px; cursor:pointer; transition:all 0.1s ease; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(6px); }
        .vault-item img { width:100%; height:auto; max-height:80%; object-fit:contain; }
        .vault-item:active { transform:scale(0.92); border-color:#00f0ff; box-shadow:var(--cyber-glow); }
        .top-library { position:absolute; top:4px; left:4px; right:4px; z-index:45; display:flex; gap:6px; overflow-x:auto; pointer-events:auto; padding:4px; }
        .lib-item { min-width:40px; height:40px; background:rgba(8,13,26,0.7); border:1px solid rgba(255,255,255,0.2); border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.1s ease; backdrop-filter:blur(4px); }
        .lib-item img { max-width:32px; max-height:32px; object-fit:contain; }
        .lib-item .media-icon { font-size:20px; }
        .lib-item:active { transform:scale(0.9); border-color:#00f0ff; }
        .bunny-progress { position:relative; width:100%; height:30px; background:rgba(255,255,255,0.1); border-radius:15px; margin:10px 0; overflow:visible; }
        .bunny { position:absolute; top:-8px; left:0; font-size:28px; animation:bunnyHop 0.6s ease-in-out infinite; transform:translateX(-50%); }
        .carrot { position:absolute; right:-10px; top:-6px; font-size:24px; }
        .stars { position:absolute; right:30px; top:-5px; font-size:18px; }
        .rabbit-hole { position:absolute; left:-10px; bottom:-5px; font-size:18px; }
        .red-thread { position:absolute; bottom:10px; left:0; right:0; height:2px; background:linear-gradient(to right,#ff007f,#00f0ff); opacity:0.5; }
        .reader-panel { transition:opacity 0.5s ease; }
        .fade-out { opacity:0; }
        .fade-in { opacity:1; }
        .audio-spheres { display:flex; gap:4px; align-items:center; }
        .audio-sphere { width:12px; height:12px; border-radius:50%; background:#00f0ff; box-shadow:0 0 8px rgba(0,240,255,0.8); }
        .card-preview { background:linear-gradient(145deg, #1a1a2e, #16213e); border:2px solid #ffd700; border-radius:12px; padding:10px; text-align:center; }
        .card-value { font-size:18px; font-weight:800; color:#ffd700; }
    </style>
</head>
<body class="text-slate-100 h-[100dvh] w-screen flex flex-col overflow-hidden animated-bg">
    <div class="butterfly" style="top:15%;left:10%;">🦋</div>
    <div class="butterfly" style="top:65%;left:80%;">🦋</div>
    <div class="butterfly" style="top:30%;left:85%;">🦋</div>
    <div class="butterfly" style="top:80%;left:20%;">🦋</div>
    <div class="butterfly" style="top:45%;left:55%;">🦋</div>
    <canvas id="node-connection-canvas" class="node-connector-canvas"></canvas>
    <div id="top-library" class="top-library glass"></div>
    <div id="toast-container" class="fixed top-14 right-3 left-3 sm:left-auto z-[300] flex flex-col gap-2 pointer-events-none items-center sm:items-end"></div>

    <!-- LEFT HUD (modes & filters) -->
    <aside class="absolute left-2 top-16 bottom-24 z-50 hud-side" id="left-hud">
        <button onclick="setMode('jrpg')" id="mode-jrpg" class="glass-btn active">⚔️<span class="btn-num">1</span></button>
        <button onclick="setMode('comic')" id="mode-comic" class="glass-btn">📖<span class="btn-num">2</span></button>
        <button onclick="setMode('manga')" id="mode-manga" class="glass-btn">🌸<span class="btn-num">3</span></button>
        <button onclick="setMode('anime')" id="mode-anime" class="glass-btn">⚡<span class="btn-num">4</span></button>
        <button onclick="setMode('neon')" id="mode-neon" class="glass-btn">🌈<span class="btn-num">5</span></button>
        <button onclick="setMode('pixel')" id="mode-pixel" class="glass-btn">👾<span class="btn-num">6</span></button>
        <button onclick="setMode('lichtenstein')" id="mode-lichtenstein" class="glass-btn">🎯<span class="btn-num">7</span></button>
        <button onclick="setMode('psp')" id="mode-psp" class="glass-btn">🎮<span class="btn-num">8</span></button>
        <button onclick="applyStyle('flat')" class="glass-btn">🔳<span class="btn-num">9</span></button>
        <button onclick="applyStyle('xray')" class="glass-btn">👻<span class="btn-num">10</span></button>
    </aside>

    <!-- RIGHT HUD (actions) -->
    <aside class="absolute right-2 top-16 bottom-24 z-50 hud-side items-end" id="right-hud">
        <button onclick="undo()" class="glass-btn">⏪<span class="btn-num">1</span></button>
        <button onclick="redo()" class="glass-btn">⏩<span class="btn-num">2</span></button>
        <button onclick="openVault()" class="glass-btn">🔐<span class="btn-num">3</span></button>
        <button onclick="pinFrame()" class="glass-btn">📌<span class="btn-num">4</span></button>
        <button onclick="openResolutionMenu()" class="glass-btn">📐<span class="btn-num">5</span></button>
        <button onclick="document.getElementById('file-input-placeholder').click()" class="glass-btn">📂<span class="btn-num">6</span></button>
        <button onclick="toggleGridPreset()" class="glass-btn">🔲<span class="btn-num">7</span></button>
        <button onclick="addText()" class="glass-btn">💬<span class="btn-num">8</span></button>
        <button onclick="addSticker()" class="glass-btn">🩹<span class="btn-num">9</span></button>
        <button onclick="toggleBrushMode()" id="brush-btn" class="glass-btn">🖌️<span class="btn-num">10</span></button>
        <button onclick="toggleEraser()" id="eraser-btn" class="glass-btn">🧹<span class="btn-num">11</span></button>
        <button onclick="toggleMaskMode()" id="mask-btn" class="glass-btn">🎭<span class="btn-num">12</span></button>
        <button onclick="enterReaderMode()" class="glass-btn">📖▶️<span class="btn-num">13</span></button>
        <button onclick="openCardCreator()" class="glass-btn">🃏<span class="btn-num">14</span></button>
    </aside>

    <!-- CANVAS AREA -->
    <div id="canvas-container" class="absolute inset-x-0 top-16 bottom-28 z-0 touch-none flex items-center justify-center overflow-hidden">
        <div id="zoom-viewport" class="relative w-full h-full flex items-center justify-center origin-center transition-transform duration-75 cursor-grab active:cursor-grabbing" style="transform: scale(1);">
            <canvas id="studio-canvas" class="max-w-full max-h-full object-contain shadow-2xl rounded-lg border border-cyberblue/30"></canvas>
        </div>
        <div id="canvas-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-darkbg/60 backdrop-blur-xl z-30 pointer-events-auto p-4 text-center">
            <div class="glass p-6 flex flex-col items-center gap-3 rounded-3xl animate-float max-w-sm">
                <span class="text-4xl">⚡🌆</span>
                <span class="text-sm font-bold">Drop Media • Load Assets</span>
                <span class="text-[8px] text-cyberblue font-bold">✨ GLB • PNG • GIF • MP4 • MP3 • HTML • PDF • TXT ✨</span>
                <button onclick="document.getElementById('file-input-placeholder').click()" class="glass-btn px-4 py-2 text-sm font-bold text-neongreen">📂 BROWSE</button>
                <input type="file" id="file-input-placeholder" multiple accept="*/*" class="hidden" onchange="handleFileSelect(event)">
            </div>
        </div>
    </div>

    <!-- BOTTOM BAR (only wheel + timeline + play controls) -->
    <div class="absolute bottom-0 left-0 right-0 z-60 flex flex-col gap-1 p-2 pointer-events-none">
        <div class="flex items-center justify-center gap-2 pointer-events-auto glass px-2 py-1 rounded-xl mx-auto">
            <span class="text-[9px] text-cyberblue font-bold uppercase">🎨STYLE</span>
            <div id="spheric-style-wheel" class="spheric-wheel" data-wheel="style" style="width:40px;height:40px;"><i class="fa-solid fa-palette text-neongreen text-xs"></i></div>
            <span class="text-[9px] text-cyberblue font-bold uppercase">🔥INT</span>
            <div id="spheric-intensity-wheel" class="spheric-wheel" data-wheel="intensity" style="width:40px;height:40px;"><i class="fa-solid fa-fire text-cyberpink text-xs"></i></div>
            <span class="text-[9px] text-cyberblue font-bold uppercase">📏SIZE</span>
            <div id="spheric-size-wheel" class="spheric-wheel" data-wheel="size" style="width:40px;height:40px;"><i class="fa-solid fa-expand text-neongreen text-xs"></i></div>
            <span class="text-[9px] text-cyberblue font-bold uppercase">🌈COL</span>
            <div id="spheric-color-wheel" class="spheric-wheel" data-wheel="color" style="width:40px;height:40px;background:var(--rainbow);"><i class="fa-solid fa-circle text-white text-xs"></i></div>
            <span class="text-[9px] text-cyberblue font-bold uppercase">🖌️BR</span>
            <div id="spheric-brush-wheel" class="spheric-wheel" data-wheel="brush" style="width:40px;height:40px;"><i class="fa-solid fa-paint-brush text-white text-xs"></i></div>
        </div>
        <div class="pointer-events-auto px-2"><div id="timeline-strip" class="timeline-track no-scrollbar"></div></div>
        <div class="flex items-center gap-2 justify-center pointer-events-auto px-2 py-1">
            <button onclick="playAnimation()" class="glass-btn px-3 py-1 text-xs">▶️PLAY</button>
            <button onclick="stopAnimation()" class="glass-btn px-3 py-1 text-xs">⏹️STOP</button>
            <button onclick="captureFrame()" class="glass-btn px-3 py-1 text-xs">📸CAP</button>
            <button onclick="pinFrame()" class="glass-btn px-3 py-1 text-xs">📌PIN</button>
        </div>
    </div>

    <!-- MODALS (simplified) -->
    <div id="vault-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[100] hidden flex items-center justify-center p-3">
        <div class="glass rounded-3xl w-full max-w-md p-4 space-y-3 max-h-[80vh] overflow-y-auto no-scrollbar">
            <div class="flex items-center justify-between border-b border-white/10 pb-2"><span class="text-xl font-bold text-cyberblue">🔐 VAULT GRID</span><button onclick="closeVault()" class="text-2xl text-slate-400">✕</button></div>
            <div id="vault-list" class="vault-grid"></div>
            <button onclick="downloadSpriteSheet()" class="glass-btn w-full py-2 text-sm font-bold text-neongreen">💾 SPRITE SHEET</button>
            <button onclick="downloadAllVault()" class="glass-btn w-full py-2 text-sm font-bold text-neongreen">💾 ALL PNG</button>
        </div>
    </div>
    <div id="resolution-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[100] hidden flex items-center justify-center p-3">
        <div class="glass rounded-3xl w-full max-w-sm p-4 space-y-3">
            <div class="flex justify-between items-center border-b border-white/10 pb-2"><span class="text-xl font-bold text-cyberorange">📐 RESOLUTION</span><button onclick="closeModals()" class="text-2xl">✕</button></div>
            <div class="space-y-2">
                <button onclick="setResolution(64)" class="glass-btn w-full py-2 text-sm">64x64</button>
                <button onclick="setResolution(128)" class="glass-btn w-full py-2 text-sm">128x128</button>
                <button onclick="setResolution(256)" class="glass-btn w-full py-2 text-sm">256x256</button>
                <button onclick="setResolution(512)" class="glass-btn w-full py-2 text-sm">512x512</button>
                <button onclick="setResolution(1024)" class="glass-btn w-full py-2 text-sm">1024x1024</button>
                <button onclick="setResolution(2048)" class="glass-btn w-full py-2 text-sm">2048x2048</button>
            </div>
        </div>
    </div>
    <div id="card-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[100] hidden flex items-center justify-center p-3">
        <div class="glass rounded-3xl w-full max-w-sm p-4 space-y-3">
            <div class="flex justify-between items-center border-b border-white/10 pb-2"><span class="text-xl font-bold text-cyberorange">🃏 CARD CREATOR</span><button onclick="closeCardCreator()" class="text-2xl">✕</button></div>
            <div class="grid grid-cols-2 gap-2 text-sm">
                <input id="card-name" placeholder="Card Name" class="bg-darkbg border border-white/20 rounded p-2">
                <input id="card-value" type="number" min="1" max="10" placeholder="Value (1-10)" class="bg-darkbg border border-white/20 rounded p-2">
                <select id="card-suit" class="bg-darkbg border border-white/20 rounded p-2">
                    <option value="♥️">♥️ Love</option>
                    <option value="♦️">♦️ Eternity</option>
                    <option value="♠️">♠️ Hate</option>
                    <option value="♣️">♣️ Decay</option>
                </select>
                <input id="card-ulti" placeholder="Ulti Emoji (🧶♾️📲💌🏮)" class="bg-darkbg border border-white/20 rounded p-2">
                <button onclick="generateCard()" class="glass-btn col-span-2 py-2 text-sm">✨ CREATE CARD</button>
            </div>
            <div id="card-preview-container" class="card-preview hidden"></div>
        </div>
    </div>

    <!-- READER OVERLAY (floating) -->
    <div id="reader-overlay" class="fixed inset-0 z-[150] hidden" style="pointer-events:none;">
        <div style="pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
            <div class="bunny-progress" id="bunny-progress" style="width:80%;">
                <div class="red-thread"></div>
                <span class="rabbit-hole">🕳️</span>
                <span class="bunny" id="bunny" style="left:0%;">🐰</span>
                <span class="carrot">🥕</span>
                <span class="stars">✨</span>
            </div>
            <div id="audio-spheres-container" class="audio-spheres" style="margin:5px 0;"></div>
            <img id="reader-panel-img" class="reader-panel" src="" style="max-width:90vw; max-height:70vh; border:2px solid #00f0ff; border-radius:20px; pointer-events:auto;">
            <div style="display:flex; gap:20px; margin-top:10px; pointer-events:auto;">
                <button onclick="readerPrev()" class="glass-btn px-6 py-3 text-xl">⏪</button>
                <button onclick="readerNext()" class="glass-btn px-6 py-3 text-xl">⏩</button>
                <button onclick="exitReaderMode()" class="glass-btn px-6 py-3 text-xl">✕</button>
            </div>
        </div>
    </div>

    <script>
        // ========== FULL STATE ==========
        let library = [];
        let vaultItems = [];
        let panels = [];
        let animationFrames = [];
        let layers = [];
        let filterLayers = [];
        let overlays = [];
        let adjustments = { brightness:0, contrast:0, saturation:100 };
        let currentMode = 'jrpg';
        let activeWheelTarget = 'size';
        let selectedOverlayIndex = null;
        let activeOverlaySize = 75;
        let selectedColor = '#ffffff';
        let brushSize = 10;
        let brushMode = false;
        let eraserMode = false;
        let maskMode = false;
        let currentGridPreset = 'none';
        let currentResolution = 512;
        let historyStack = [];
        let historyPointer = -1;
        let currentZoom = 1, panX = 0, panY = 0;
        let overlayCounter = 0;
        let isDraggingItem = false, dragStartX = 0, dragStartY = 0;
        let initialPinchDist = null, initialZoom = 1, isPanning = false, lastPanX = 0, lastPanY = 0;
        let isPlayingAnimation = false, animationInterval = null;

        const canvas = document.getElementById('studio-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const zoomViewport = document.getElementById('zoom-viewport');
        const container = document.getElementById('canvas-container');

        function showToast(msg, type='success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `px-4 py-2 rounded-xl text-sm font-bold shadow-2xl flex items-center gap-2 transition transform translate-y-2 opacity-0 pointer-events-auto ${type==='success'?'bg-cyberpurple/95 text-white border border-cyberblue/40 backdrop-blur-md':'bg-red-600/95 text-white backdrop-blur-md'}`;
            t.innerHTML = `<span>${type==='success'?'⚡':'⚠️'}</span> ${msg}`;
            c.appendChild(t);
            requestAnimationFrame(()=>t.classList.remove('translate-y-2','opacity-0'));
            setTimeout(()=>{t.classList.add('translate-y-2','opacity-0'); setTimeout(()=>t.remove(),300);},2000);
        }

        // Wheels
        const wheels = [
            { element: document.getElementById('spheric-style-wheel'), target:'style' },
            { element: document.getElementById('spheric-intensity-wheel'), target:'intensity' },
            { element: document.getElementById('spheric-size-wheel'), target:'size' },
            { element: document.getElementById('spheric-color-wheel'), target:'color' },
            { element: document.getElementById('spheric-brush-wheel'), target:'brush' }
        ];
        wheels.forEach(w => {
            let active=false, lastY=0;
            w.element.addEventListener('touchstart', e=>{e.preventDefault(); active=true; lastY=e.touches[0].clientY;}, {passive:false});
            w.element.addEventListener('touchmove', e=>{e.preventDefault(); if(active){const dy=lastY-e.touches[0].clientY; handleWheelInput(w.target,dy); lastY=e.touches[0].clientY;}}, {passive:false});
            w.element.addEventListener('touchend', ()=>{active=false;});
        });

        function handleWheelInput(target, delta) {
            if(target==='size') { activeOverlaySize = Math.max(10, Math.min(600, activeOverlaySize + delta*4)); if(selectedOverlayIndex!==null && overlays[selectedOverlayIndex]) overlays[selectedOverlayIndex].size = activeOverlaySize; }
            else if(target==='intensity') { adjustments.brightness = Math.max(-100, Math.min(100, adjustments.brightness + delta)); processImagePipeline(); }
            else if(target==='style') { const styles=['anime','manga','comic','neon','ductus','pixel','lichtenstein','jrpg','psp','flat','xray']; const idx=Math.floor(Math.abs(delta)/5)%styles.length; if(Math.abs(delta)>2) applyStyle(styles[idx]); }
            else if(target==='color') { const hue=(parseInt(selectedColor.slice(1),16)+delta*2)%360; selectedColor=`hsl(${hue},100%,60%)`; if(selectedOverlayIndex!==null && overlays[selectedOverlayIndex]) overlays[selectedOverlayIndex].color=selectedColor; compositeLayers(); }
            else if(target==='brush') { brushSize=Math.max(2,Math.min(100,brushSize+delta)); if(brushMode) showToast(`🖌️ Brush: ${brushSize}px`); }
        }

        // Style presets
        function applyStyle(style) {
            if(!canvas.width) return;
            filterLayers=[]; adjustments={brightness:0,contrast:0,saturation:100};
            if(style==='jrpg'){ adjustments={brightness:12,contrast:30,saturation:140}; filterLayers.push({type:'cel-shade',strength:60,blendMode:'overlay'}); }
            else if(style==='comic'){ adjustments={brightness:0,contrast:50,saturation:135}; filterLayers.push({type:'halftone-dots',strength:65,blendMode:'overlay'}); }
            else if(style==='manga'){ adjustments={brightness:5,contrast:55,saturation:90}; filterLayers.push({type:'ductus-pro',strength:85,blendMode:'multiply'}); }
            else if(style==='anime'){ adjustments={brightness:8,contrast:35,saturation:145}; filterLayers.push({type:'anime-ductus',strength:70,blendMode:'overlay'}); }
            else if(style==='neon'){ adjustments={brightness:15,contrast:70,saturation:180}; filterLayers.push({type:'neon-glow',strength:75,blendMode:'screen'}); }
            else if(style==='pixel'){ adjustments={brightness:0,contrast:40,saturation:100}; filterLayers.push({type:'pixel-art',strength:100,blendMode:'normal'}); }
            else if(style==='street'){ adjustments={brightness:-5,contrast:70,saturation:160}; filterLayers.push({type:'glitch-rgb',strength:65,blendMode:'screen'}); }
            else if(style==='lichtenstein'){ adjustments={brightness:5,contrast:65,saturation:200}; filterLayers.push({type:'lichtenstein',strength:90,blendMode:'overlay'}); }
            else if(style==='psp'){ adjustments={brightness:5,contrast:25,saturation:130}; filterLayers.push({type:'psp-render',strength:55,blendMode:'soft-light'}); }
            else if(style==='flat'){ adjustments={brightness:5,contrast:40,saturation:70}; filterLayers.push({type:'posterize',strength:4,blendMode:'normal'}); }
            else if(style==='xray'){ adjustments={brightness:0,contrast:80,saturation:0}; filterLayers.push({type:'xray',strength:100,blendMode:'screen'}); }
            processImagePipeline();
        }

        function processImagePipeline(){ if(!layers.length)return; const base=layers[0]; base.ctx.clearRect(0,0,base.canvas.width,base.canvas.height); base.ctx.drawImage(base.originalImg,0,0); compositeLayers(); }
        function compositeLayers(){ if(!canvas.width||!layers.length)return; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(layers[0].canvas,0,0); overlays.forEach(item=>{ctx.save();ctx.translate(item.x,item.y);if(item.rotation)ctx.rotate(item.rotation);ctx.font=`bold ${item.size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=item.color||'#fff';ctx.shadowColor=item.color;ctx.shadowBlur=12;ctx.fillText(item.content,0,0);ctx.shadowBlur=0;ctx.restore();}); }

        // File handling: all types, preview
        function handleFileSelect(e){
            const files=Array.from(e.target.files);
            files.forEach(file=>{
                const reader=new FileReader();
                reader.onload=ev=>{
                    const type = file.type.startsWith('image') ? 'image' :
                        file.type.startsWith('video') ? 'video' :
                        file.type.startsWith('audio') ? 'audio' :
                        file.name.endsWith('.glb') ? 'glb' :
                        file.name.endsWith('.html') ? 'html' :
                        file.name.endsWith('.pdf') ? 'pdf' : 'file';
                    const item={id:'f_'+Math.random().toString(36).substr(2,8), name:file.name, dataUrl:ev.target.result, type:type, thumb: type==='image' ? ev.target.result : null};
                    library.push(item);
                    updateTopLibrary();
                    if(library.length===1 && type==='image') loadImageToCanvas(item.dataUrl);
                    if(type==='audio') showToast('🔊 Audio added');
                    if(type==='video') showToast('🎬 Video added');
                    if(type==='glb') showToast('🧊 GLB added');
                    if(type==='html') showToast('🌐 HTML added');
                    if(type==='pdf') showToast('📄 PDF added');
                };
                reader.readAsDataURL(file);
            });
            e.target.value='';
        }

        function updateTopLibrary(){
            const container=document.getElementById('top-library');
            container.innerHTML=library.map(item=>{
                if(item.type==='image') return `<div class="lib-item" onclick="addLibrarySticker('${item.id}')"><img src="${item.dataUrl}"></div>`;
                else if(item.type==='video') return `<div class="lib-item" onclick="playMedia('${item.dataUrl}','video')"><span class="media-icon">🎬</span></div>`;
                else if(item.type==='audio') return `<div class="lib-item" onclick="playMedia('${item.dataUrl}','audio')"><span class="media-icon">🎵</span></div>`;
                else if(item.type==='glb') return `<div class="lib-item" onclick="showToast('GLB viewer coming soon')"><span class="media-icon">🧊</span></div>`;
                else if(item.type==='html') return `<div class="lib-item" onclick="showToast('HTML interactive ready')"><span class="media-icon">🌐</span></div>`;
                else if(item.type==='pdf') return `<div class="lib-item" onclick="showToast('PDF loaded')"><span class="media-icon">📄</span></div>`;
                else return `<div class="lib-item" onclick="showToast('${item.name}')"><span class="media-icon">📄</span></div>`;
            }).join('');
        }

        function addLibrarySticker(id){
            const item=library.find(x=>x.id===id);
            if(!item) return;
            overlayCounter++;
            const overlay={content:`${item.name} #${overlayCounter}`, x:canvas.width/2, y:canvas.height/2, size:activeOverlaySize, rotation:0, color:selectedColor, name:item.name};
            overlays.push(overlay);
            selectedOverlayIndex=overlays.length-1;
            compositeLayers();
            saveState();
            showToast(`📌 ${item.name} added as #${overlayCounter}`);
        }

        function playMedia(dataUrl,type){
            if(type==='audio'){const audio=new Audio(dataUrl); audio.play().catch(err=>showToast('Audio failed','error'));}
            else if(type==='video'){showToast('🎬 Video playback would open here');}
        }

        function loadImageToCanvas(dataUrl){
            document.getElementById('canvas-placeholder').classList.add('hidden');
            const img=new Image();
            img.onload=()=>{
                canvas.width=img.width; canvas.height=img.height; ctx.drawImage(img,0,0);
                const base={canvas:document.createElement('canvas'), originalImg:img, ctx:null};
                base.canvas.width=img.width; base.canvas.height=img.height;
                base.ctx=base.canvas.getContext('2d',{willReadFrequently:true}); base.ctx.drawImage(img,0,0);
                layers=[base]; overlays=[]; filterLayers=[]; adjustments={brightness:0,contrast:0,saturation:100};
                historyStack=[]; historyPointer=-1; applyStyle('jrpg'); saveState();
            };
            img.src=dataUrl;
        }

        // Timeline
        function pinFrame(){ if(!canvas.width)return; const dataUrl=canvas.toDataURL('image/png'); panels.push({id:'panel_'+Date.now(),dataUrl:dataUrl,thumb:dataUrl}); renderPanelStrip(); showToast('📌 Frame pinned'); }
        function captureFrame(){ if(!canvas.width)return; const dataUrl=canvas.toDataURL('image/png'); animationFrames.push({dataUrl:dataUrl,thumb:dataUrl}); renderPanelStrip(); showToast(`📸 Frame ${animationFrames.length}`); }
        function renderPanelStrip(){ const strip=document.getElementById('timeline-strip'); strip.innerHTML=panels.map((p,i)=>`<img src="${p.thumb}" class="timeline-frame" onclick="loadPanel(${i})">`).join('') + animationFrames.map((f,i)=>`<img src="${f.thumb}" class="timeline-frame" onclick="loadAnimationFrame(${i})">`).join(''); }
        function loadPanel(index){ if(index>=panels.length)return; const img=new Image(); img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0); if(layers.length){layers[0].canvas.width=img.width;layers[0].canvas.height=img.height;layers[0].ctx.drawImage(img,0,0);} compositeLayers(); saveState();}; img.src=panels[index].dataUrl; }
        function loadAnimationFrame(index){ const img=new Image(); img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);}; img.src=animationFrames[index].dataUrl; }
        function playAnimation(){ if(!animationFrames.length){showToast('No frames','error');return;} if(animationInterval)clearInterval(animationInterval); let idx=0; animationInterval=setInterval(()=>{loadAnimationFrame(idx); idx=(idx+1)%animationFrames.length;},200); }
        function stopAnimation(){ if(animationInterval)clearInterval(animationInterval); animationInterval=null; }

        // Reader mode
        function enterReaderMode(){ if(!panels.length){showToast('No panels','error');return;} readerIndex=0; document.getElementById('reader-overlay').classList.remove('hidden'); updateReader(); }
        function exitReaderMode(){ document.getElementById('reader-overlay').classList.add('hidden'); }
        function readerPrev(){ if(readerIndex>0){readerIndex--; updateReader();} }
        function readerNext(){ if(readerIndex<panels.length-1){readerIndex++; updateReader();} }
        function updateReader(){ const img=document.getElementById('reader-panel-img'); img.src=panels[readerIndex].dataUrl; const progress=(readerIndex/(panels.length-1))*100; document.getElementById('bunny').style.left=progress+'%'; }

        // Vault
        function openVault(){ renderVaultList(); document.getElementById('vault-modal').classList.remove('hidden'); }
        function closeVault(){ document.getElementById('vault-modal').classList.add('hidden'); }
        function renderVaultList(){ const list=document.getElementById('vault-list'); if(!vaultItems.length){list.innerHTML='<div class="col-span-full text-center text-slate-500 py-4">Empty</div>';return;} list.innerHTML=vaultItems.map((v,i)=>`<div class="vault-item" onclick="loadVaultItem('${v.id}')"><img src="${v.thumb}"></div>`).join(''); }
        function loadVaultItem(id){ const item=vaultItems.find(v=>v.id===id); if(item){closeVault(); const img=new Image(); img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0); if(layers.length){layers[0].canvas.width=img.width;layers[0].canvas.height=img.height;layers[0].ctx.drawImage(img,0,0);} compositeLayers(); saveState();}; img.src=item.dataUrl; } }
        function downloadAllVault(){ vaultItems.forEach((v,i)=>{const a=document.createElement('a'); a.href=v.dataUrl; a.download=`vault_${i+1}.png`; a.click();}); }
        function downloadSpriteSheet(){ if(!vaultItems.length)return; const cols=Math.ceil(Math.sqrt(vaultItems.length)); const rows=Math.ceil(vaultItems.length/cols); const thumbSize=128; const sheet=document.createElement('canvas'); sheet.width=cols*thumbSize; sheet.height=rows*thumbSize; const sctx=sheet.getContext('2d'); vaultItems.forEach((v,i)=>{const col=i%cols; const row=Math.floor(i/cols); const img=new Image(); img.onload=()=>{sctx.drawImage(img,col*thumbSize,row*thumbSize,thumbSize,thumbSize); if(i===vaultItems.length-1){const a=document.createElement('a'); a.href=sheet.toDataURL('image/png'); a.download='sprite_sheet.png'; a.click();}}; img.src=v.thumb;}); }

        // Card creator
        function openCardCreator(){ document.getElementById('card-modal').classList.remove('hidden'); }
        function closeCardCreator(){ document.getElementById('card-modal').classList.add('hidden'); }
        function generateCard(){
            const name=document.getElementById('card-name').value||'Card';
            const value=document.getElementById('card-value').value||'1';
            const suit=document.getElementById('card-suit').value;
            const ulti=document.getElementById('card-ulti').value||'🧶';
            const container=document.getElementById('card-preview-container');
            container.classList.remove('hidden');
            container.innerHTML=`<div class="card-preview"><h3>${name}</h3><div class="card-value">${suit} ${value}</div><div style="font-size:30px;">${ulti}</div><div style="font-size:12px;">⚔️ Attack: ${value} | 🛡️ Defense: ${10-value}</div></div>`;
        }

        // Other essential
        function setMode(mode){ currentMode=mode; document.querySelectorAll('.hud-side .glass-btn').forEach(p=>p.classList.remove('active')); const btn=document.getElementById(`mode-${mode}`); if(btn)btn.classList.add('active'); applyStyle(mode); }
        function toggleGridPreset(){ showToast('Grid presets available'); }
        function openResolutionMenu(){ document.getElementById('resolution-modal').classList.remove('hidden'); }
        function closeModals(){ document.getElementById('resolution-modal').classList.add('hidden'); document.getElementById('vault-modal').classList.add('hidden'); }
        function setResolution(px){ currentResolution=px; closeModals(); showToast(`📐 Res: ${px}px`); }
        function addText(){ const input=prompt('Enter text','⚡'); if(input){overlays.push({content:input,x:canvas.width/2,y:canvas.height/2,size:activeOverlaySize,rotation:0,color:selectedColor});selectedOverlayIndex=overlays.length-1;compositeLayers();saveState();showToast('💬 Added');} }
        function addSticker(){ const stickers=['😎','🕶️','🎭','🧿','💢','✨','🦋','🌈','🔥','💎']; const s=stickers[Math.floor(Math.random()*stickers.length)]; overlays.push({content:s,x:canvas.width/2,y:canvas.height/2,size:activeOverlaySize*1.5,rotation:0,color:'#fff'}); selectedOverlayIndex=overlays.length-1; compositeLayers(); saveState(); showToast('🩹 Sticker'); }
        function toggleBrushMode(){ brushMode=!brushMode; eraserMode=false; document.getElementById('brush-btn').classList.toggle('active',brushMode); document.getElementById('eraser-btn').classList.remove('active'); }
        function toggleEraser(){ eraserMode=!eraserMode; brushMode=false; document.getElementById('eraser-btn').classList.toggle('active',eraserMode); document.getElementById('brush-btn').classList.remove('active'); }
        function toggleMaskMode(){ maskMode=!maskMode; document.getElementById('mask-btn').classList.toggle('active',maskMode); }
        function saveState(){ if(!canvas.width)return; if(historyPointer<historyStack.length-1)historyStack=historyStack.slice(0,historyPointer+1); historyStack.push(canvas.toDataURL()); if(historyStack.length>30)historyStack.shift(); historyPointer=historyStack.length-1; }
        function undo(){ if(historyPointer>0){historyPointer--; loadHistoryState(historyStack[historyPointer]);} else showToast('⏪ At oldest','error'); }
        function redo(){ if(historyPointer<historyStack.length-1){historyPointer++; loadHistoryState(historyStack[historyPointer]);} else showToast('⏩ At newest','error'); }
        function loadHistoryState(dataUrl){ const img=new Image(); img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);if(layers.length&&layers[0].ctx){layers[0].ctx.clearRect(0,0,layers[0].canvas.width,layers[0].canvas.height);layers[0].ctx.drawImage(img,0,0);}}; img.src=dataUrl; }
        function updateTransform(){ zoomViewport.style.transform=`translate(${panX}px, ${panY}px) scale(${currentZoom})`; }

        // Touch events for canvas
        container.addEventListener('touchstart', e=>{
            if(e.touches.length===2){ initialPinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); initialZoom=currentZoom; return; }
            if(e.touches.length===1 && e.target===canvas){
                const rect=canvas.getBoundingClientRect();
                const pt={ x:(e.touches[0].clientX-rect.left)*(canvas.width/rect.width), y:(e.touches[0].clientY-rect.top)*(canvas.height/rect.height) };
                if(brushMode){ ctx.beginPath(); ctx.arc(pt.x,pt.y,brushSize/2,0,Math.PI*2); ctx.fillStyle=selectedColor; ctx.fill(); saveState(); return; }
                if(eraserMode){ ctx.save(); ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(pt.x,pt.y,20,0,Math.PI*2); ctx.fill(); ctx.restore(); saveState(); return; }
                for(let i=overlays.length-1;i>=0;i--){ if(Math.hypot(pt.x-overlays[i].x,pt.y-overlays[i].y)<Math.max(40,overlays[i].size)){ selectedOverlayIndex=i; isDraggingItem=true; dragStartX=pt.x-overlays[i].x; dragStartY=pt.y-overlays[i].y; return; } }
                isPanning=true; lastPanX=e.touches[0].clientX; lastPanY=e.touches[0].clientY;
            }
        }, {passive:false});
        container.addEventListener('touchmove', e=>{
            if(e.touches.length===2 && initialPinchDist){ e.preventDefault(); const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); currentZoom=Math.min(6,Math.max(0.1,initialZoom*(dist/initialPinchDist))); updateTransform(); return; }
            if(e.touches.length===1 && isDraggingItem){ e.preventDefault(); const rect=canvas.getBoundingClientRect(); const pt={ x:(e.touches[0].clientX-rect.left)*(canvas.width/rect.width), y:(e.touches[0].clientY-rect.top)*(canvas.height/rect.height) }; if(selectedOverlayIndex!==null && overlays[selectedOverlayIndex]){ overlays[selectedOverlayIndex].x=pt.x-dragStartX; overlays[selectedOverlayIndex].y=pt.y-dragStartY; } compositeLayers(); }
            else if(e.touches.length===1 && isPanning){ e.preventDefault(); panX += (e.touches[0].clientX-lastPanX); panY += (e.touches[0].clientY-lastPanY); lastPanX=e.touches[0].clientX; lastPanY=e.touches[0].clientY; updateTransform(); }
        }, {passive:false});
        container.addEventListener('touchend', ()=>{ initialPinchDist=null; if(isDraggingItem)saveState(); isDraggingItem=false; isPanning=false; });

        // Init
        updateTopLibrary();
        setMode('jrpg');
        applyStyle('jrpg');
    </script>
</body>
</html>
