<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Neon Game Boy v0.1</title>
    <style>
        body {
            margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
            background: radial-gradient(circle at 50% 50%, #0a0f1e, #03050b);
            font-family: 'Segoe UI', sans-serif;
        }
        .gameboy {
            width: 420px; height: 700px;
            background: rgba(20,25,40,0.65);
            backdrop-filter: blur(20px) saturate(160%);
            border: 2px solid rgba(0,240,255,0.3);
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(0,240,255,0.2), inset 0 0 20px rgba(255,255,255,0.05);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 15px;
            position: relative;
        }
        .screen {
            width: 360px; height: 320px;
            background: #000;
            border-radius: 15px;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 20px #00f0ff, inset 0 0 10px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        canvas {
            image-rendering: pixelated;
            background: #111;
        }
        .controls {
            display: flex; gap: 20px; margin-top: 30px;
        }
        .dpad {
            width: 120px; height: 120px; position: relative;
        }
        .dpad button {
            position: absolute; width: 40px; height: 40px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(0,240,255,0.5);
            border-radius: 8px; color: #00f0ff; font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .dpad .up { top:0; left:40px; }
        .dpad .down { bottom:0; left:40px; }
        .dpad .left { top:40px; left:0; }
        .dpad .right { top:40px; right:0; }
        .dpad .center { top:40px; left:40px; background: #00f0ff22; }
        .ab-buttons {
            display: flex; flex-direction: column; gap: 10px; justify-content: center;
        }
        .ab-buttons button {
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff00ff, #9d00ff);
            border: 2px solid #ff007f;
            color: white; font-weight: bold;
            box-shadow: 0 0 15px #ff00ff88;
            cursor: pointer;
        }
        .hint {
            color: #7f8c8d; font-size: 12px; margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="gameboy">
        <div class="screen">
            <canvas id="pixelCanvas" width="128" height="128"></canvas>
        </div>
        <div class="controls">
            <div class="dpad">
                <button class="up">▲</button>
                <button class="down">▼</button>
                <button class="left">◀</button>
                <button class="right">▶</button>
                <button class="center">✦</button>
            </div>
            <div class="ab-buttons">
                <button>A</button>
                <button>B</button>
            </div>
        </div>
        <div class="hint">⚡ Doll Editor v0.1 — draw with D‑Pad & A/B</div>
    </div>
    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        // Draw a simple pixel horse silhouette
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(50, 60, 30, 10);  // body
        ctx.fillRect(55, 40, 10, 25);  // neck
        ctx.fillRect(45, 45, 15, 10);  // head
        ctx.fillRect(50, 70, 5, 15);   // leg1
        ctx.fillRect(75, 70, 5, 15);   // leg2
        ctx.fillRect(65, 70, 5, 10);   // leg3
        ctx.fillRect(80, 55, 20, 5);   // tail
        // Add a little star
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(30, 30, 5, 5);
    </script>
</body>
</html>
