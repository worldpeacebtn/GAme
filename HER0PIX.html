<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ NEON COMIC VAULT v22 — Sticker & Theater</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');
        :root {
            --glass-bg: rgba(10,15,30,0.45); --glass-border: rgba(0,240,255,0.2);
            --glass-shadow: 0 4px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
            --cyber-glow: 0 0 25px rgba(0,240,255,0.5); --rainbow: conic-gradient(#ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            --glass-radius: 12px;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk','Inter',sans-serif; background: #03050b;
            overscroll-behavior-y: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            overflow: hidden; height: 100dvh; width: 100vw; touch-action: none; color: #e2e8f0;
        }
        ::-webkit-scrollbar { width:0px; height:0px; display:none; }
        * { scrollbar-width: none; }
        .animated-bg {
            background-color:#03050b;
            background-image: radial-gradient(circle at 50% 50%, rgba(157,0,255,0.10) 0%, transparent 70%), radial-gradient(circle at 15% 25%, rgba(0,240,255,0.08) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(255,0,127,0.06) 0%, transparent 50%), linear-gradient(to right, rgba(0,240,255,0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,85,0,0.03) 1px, transparent 1px);
            background-size:100% 100%,100% 100%,100% 100%,32px 32px,32px 32px;
            animation: gridShift 12s linear infinite;
        }
        .glass {
            background: var(--glass-bg); backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%);
            border:1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--glass-radius);
        }
        .glass-btn {
            background: transparent; border:1px solid rgba(255,255,255,0.15); box-shadow:0 2px 8px rgba(0,0,0,0.4);
            border-radius:10px; transition:all 0.07s ease; cursor:pointer; touch-action:manipulation;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display:flex; align-items:center; justify-content:center;
            flex-direction:column; gap:2px; padding:6px 8px; font-size:13px; font-weight:700; letter-spacing:0.5px;
            color:#e2e8f0; white-space:nowrap; min-width:44px; min-height:44px;
        }
        .glass-btn:active,.glass-btn.active { transform:scale(0.94); background:linear-gradient(135deg, rgba(157,0,255,0.5), rgba(0,240,255,0.4)); border-color:#00f0ff; box-shadow:var(--cyber-glow); }
        .glass-btn .btn-num { font-size:9px; color:#00f0ff; font-weight:800; }

        /* HUD side panels */
        .hud-side { background:transparent; border:none; backdrop-filter:none; box-shadow:none; display:flex; flex-direction:column; gap:5px; pointer-events:auto; z-index:50; padding:4px; }
        .hud-side .glass-btn { background:rgba(10,15,30,0.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.12); border-radius:8px; min-width:48px; min-height:48px; font-size:14px; }

        /* Sticker previews */
        .sticker-preview {
            position:absolute; border:2px solid rgba(255,255,255,0.8); border-radius:12px;
            box-shadow:0 0 10px rgba(0,240,255,0.5), 0 4px 10px rgba(0,0,0,0.5);
            cursor:pointer; touch-action:none; animation:levitate 3s ease-in-out infinite;
            background:rgba(255,255,255,0.05); backdrop-filter:blur(2px); padding:4px;
        }
        .sticker-preview img { max-width:100%; max-height:100%; border-radius:8px; }
        .sticker-preview.circular { border-radius:50%; }
        .sticker-preview.speech-bubble { border-radius:20px 20px 20px 5px; background:white; color:black; padding:8px 12px; }

        /* Reader overlay (theater mode) */
        .theater-overlay {
            position:fixed; inset:0; z-index:150; display:flex; flex-direction:column; align-items:center; justify-content:center;
            pointer-events:none; background:transparent;
        }
        .theater-panel { pointer-events:auto; max-width:90vw; max-height:70vh; border:2px solid #00f0ff; border-radius:20px; box-shadow:0 0 30px rgba(0,240,255,0.6); }
        .bunny-progress { position:relative; width:80%; height:30px; background:rgba(255,255,255,0.1); border-radius:15px; margin:10px 0; }
        .bunny { position:absolute; top:-8px; left:0; font-size:28px; animation:bunnyHop 0.6s ease-in-out infinite; transform:translateX(-50%); }
        .carrot { position:absolute; right:-10px; top:-6px; font-size:24px; }
        .stars { position:absolute; right:30px; top:-5px; font-size:18px; }
        .rabbit-hole { position:absolute; left:-10px; bottom:-5px; font-size:18px; }
        .red-thread { position:absolute; bottom:10px; left:0; right:0; height:2px; background:linear-gradient(to right,#ff007f,#00f0ff); opacity:0.5; }

        /* Ensure canvas area not blocked */
        #canvas-container { z-index:0; }
    </style>
</head>
<body class="text-slate-100 h-[100dvh] w-screen flex flex-col overflow-hidden animated-bg">
    <!-- Canvas area -->
    <div id="canvas-container" class="absolute inset-x-0 top-0 bottom-20 z-0 touch-none flex items-center justify-center overflow-hidden">
        <div id="zoom-viewport" class="relative w-full h-full flex items-center justify-center origin-center transition-transform duration-200 cursor-grab active:cursor-grabbing">
            <canvas id="studio-canvas" class="max-w-full max-h-full object-contain shadow-2xl rounded-lg border border-cyberblue/30"></canvas>
        </div>
        <div id="canvas-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-darkbg/60 backdrop-blur-xl z-30 pointer-events-auto p-4 text-center">
            <div class="glass p-6 flex flex-col items-center gap-3 rounded-3xl animate-float max-w-sm">
                <span class="text-4xl">⚡🌆</span>
                <span class="text-sm font-bold">Drop Media • Load Assets</span>
                <button onclick="document.getElementById('file-input-placeholder').click()" class="glass-btn px-4 py-2 text-sm font-bold text-neongreen">📂 BROWSE</button>
                <input type="file" id="file-input-placeholder" multiple accept="*/*" class="hidden" onchange="handleFileSelect(event)">
            </div>
        </div>
    </div>

    <!-- LEFT HUD (modes & filters) -->
    <aside class="absolute left-2 top-2 bottom-20 z-50 hud-side" id="left-hud">
        <button onclick="setMode('jrpg')" id="mode-jrpg" class="glass-btn active">⚔️<span class="btn-num">1</span></button>
        <button onclick="setMode('comic')" id="mode-comic" class="glass-btn">📖<span class="btn-num">2</span></button>
        <button onclick="setMode('manga')" id="mode-manga" class="glass-btn">🌸<span class="btn-num">3</span></button>
        <button onclick="setMode('anime')" id="mode-anime" class="glass-btn">⚡<span class="btn-num">4</span></button>
        <button onclick="setMode('neon')" id="mode-neon" class="glass-btn">🌈<span class="btn-num">5</span></button>
        <button onclick="setMode('pixel')" id="mode-pixel" class="glass-btn">👾<span class="btn-num">6</span></button>
        <button onclick="setMode('lichtenstein')" id="mode-lichtenstein" class="glass-btn">🎯<span class="btn-num">7</span></button>
        <button onclick="setMode('psp')" id="mode-psp" class="glass-btn">🎮<span class="btn-num">8</span></button>
        <button onclick="applyStyle('flat')" class="glass-btn">🔳<span class="btn-num">9</span></button>
        <button onclick="applyStyle('xray')" class="glass-btn">👻<span class="btn-num">10</span></button>
    </aside>

    <!-- RIGHT HUD (actions & tools) -->
    <aside class="absolute right-2 top-2 bottom-20 z-50 hud-side items-end" id="right-hud">
        <button onclick="undo()" class="glass-btn">⏪<span class="btn-num">1</span></button>
        <button onclick="redo()" class="glass-btn">⏩<span class="btn-num">2</span></button>
        <button onclick="openVault()" class="glass-btn">🔐<span class="btn-num">3</span></button>
        <button onclick="pinFrame()" class="glass-btn">📌<span class="btn-num">4</span></button>
        <button onclick="captureFrame()" class="glass-btn">📸<span class="btn-num">5</span></button>
        <button onclick="playAnimation()" class="glass-btn">▶️<span class="btn-num">6</span></button>
        <button onclick="stopAnimation()" class="glass-btn">⏹️<span class="btn-num">7</span></button>
        <button onclick="toggleStickerMode()" id="sticker-mode-btn" class="glass-btn">🖼️<span class="btn-num">8</span></button>
        <button onclick="addSpeechBubble()" class="glass-btn">💬<span class="btn-num">9</span></button>
        <button onclick="addCircularSticker()" class="glass-btn">⭕<span class="btn-num">10</span></button>
        <button onclick="enterTheaterMode()" class="glass-btn">📖<span class="btn-num">11</span></button>
        <button onclick="openResolutionMenu()" class="glass-btn">📐<span class="btn-num">12</span></button>
    </aside>

    <!-- TOP LIBRARY (mini previews) -->
    <div id="top-library" class="absolute top-2 left-16 right-16 z-40 flex gap-2 overflow-x-auto glass p-1 pointer-events-auto"></div>

    <!-- THEATER OVERLAY (floating, no background) -->
    <div id="theater-overlay" class="theater-overlay hidden" style="pointer-events:none;">
        <div style="pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
            <div class="bunny-progress" id="bunny-progress">
                <div class="red-thread"></div>
                <span class="rabbit-hole">🕳️</span>
                <span class="bunny" id="bunny" style="left:0%;">🐰</span>
                <span class="carrot">🥕</span>
                <span class="stars">✨</span>
            </div>
            <img id="theater-panel-img" class="theater-panel" src="">
            <div style="display:flex; gap:20px; margin-top:10px;">
                <button onclick="theaterPrev()" class="glass-btn px-6 py-3 text-xl">⏪</button>
                <button onclick="theaterNext()" class="glass-btn px-6 py-3 text-xl">⏩</button>
                <button onclick="exitTheaterMode()" class="glass-btn px-6 py-3 text-xl">✕</button>
            </div>
        </div>
    </div>

    <script>
        // ========== STATE ==========
        let library = [];
        let panels = [];
        let animationFrames = [];
        let layers = [];
        let filterLayers = [];
        let overlays = [];
        let adjustments = { brightness:0, contrast:0, saturation:100 };
        let currentMode = 'jrpg';
        let activeWheelTarget = 'size';
        let selectedOverlayIndex = null;
        let activeOverlaySize = 75;
        let selectedColor = '#ffffff';
        let brushSize = 10;
        let brushMode = false;
        let eraserMode = false;
        let maskMode = false;
        let currentGridPreset = 'none';
        let currentResolution = 512;
        let historyStack = [];
        let historyPointer = -1;
        let currentZoom = 1, panX = 0, panY = 0;
        let isDraggingItem = false, dragStartX = 0, dragStartY = 0;
        let initialPinchDist = null, initialZoom = 1, isPanning = false, lastPanX = 0, lastPanY = 0;
        let isPlayingAnimation = false, animationInterval = null;
        let stickerMode = false;
        let theaterIndex = 0;

        const canvas = document.getElementById('studio-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const zoomViewport = document.getElementById('zoom-viewport');
        const container = document.getElementById('canvas-container');

        function showToast(msg, type='success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `px-4 py-2 rounded-xl text-sm font-bold shadow-2xl flex items-center gap-2 transition transform translate-y-2 opacity-0 pointer-events-auto ${type==='success'?'bg-cyberpurple/95 text-white border border-cyberblue/40 backdrop-blur-md':'bg-red-600/95 text-white backdrop-blur-md'}`;
            t.innerHTML = `<span>${type==='success'?'⚡':'⚠️'}</span> ${msg}`;
            c.appendChild(t);
            requestAnimationFrame(()=>t.classList.remove('translate-y-2','opacity-0'));
            setTimeout(()=>{t.classList.add('translate-y-2','opacity-0'); setTimeout(()=>t.remove(),300);},2000);
        }

        // ========== FILE HANDLING ==========
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const type = file.type.startsWith('image') ? 'image' :
                        file.type.startsWith('video') ? 'video' :
                        file.type.startsWith('audio') ? 'audio' :
                        file.name.endsWith('.glb') ? 'glb' :
                        file.name.endsWith('.html') ? 'html' :
                        file.name.endsWith('.pdf') ? 'pdf' : 'file';
                    const item = { id:'f_'+Math.random().toString(36).substr(2,8), name:file.name, dataUrl:ev.target.result, type:type, thumb: type==='image' ? ev.target.result : null };
                    library.push(item);
                    updateTopLibrary();
                    if(library.length===1 && type==='image') loadImageToCanvas(item.dataUrl);
                    if(type==='audio') showToast('🔊 Audio added');
                    if(type==='video') showToast('🎬 Video added');
                    if(type==='glb') showToast('🧊 GLB added');
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }

        function updateTopLibrary() {
            const container = document.getElementById('top-library');
            container.innerHTML = library.map(item => {
                if(item.type==='image') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><img src="${item.dataUrl}" style="width:32px;height:32px;object-fit:cover;"></div>`;
                else if(item.type==='video') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>🎬</span></div>`;
                else if(item.type==='audio') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>🎵</span></div>`;
                else if(item.type==='glb') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>🧊</span></div>`;
                else if(item.type==='html') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>🌐</span></div>`;
                else if(item.type==='pdf') return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>📄</span></div>`;
                else return `<div class="lib-item" onclick="handleLibraryItem('${item.id}')"><span>📄</span></div>`;
            }).join('');
        }

        function handleLibraryItem(id) {
            const item = library.find(x => x.id === id);
            if (!item) return;
            if (stickerMode) {
                createStickerFromLibrary(id);
            } else {
                if (item.type === 'image') loadImageToCanvas(item.dataUrl);
                else if (item.type === 'audio') playAudio(item.dataUrl);
                else if (item.type === 'video') showToast('🎬 Video opened');
                else if (item.type === 'glb') showToast('🧊 GLB preview coming');
                else showToast(`📄 ${item.name}`);
            }
        }

        function loadImageToCanvas(dataUrl) {
            document.getElementById('canvas-placeholder').classList.add('hidden');
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img,0,0);
                const base = { canvas: document.createElement('canvas'), originalImg: img, ctx: null };
                base.canvas.width = img.width; base.canvas.height = img.height;
                base.ctx = base.canvas.getContext('2d', { willReadFrequently: true });
                base.ctx.drawImage(img,0,0);
                layers = [base];
                overlays = []; filterLayers = [];
                adjustments = { brightness:0, contrast:0, saturation:100 };
                historyStack = []; historyPointer = -1;
                applyStyle('jrpg');
                saveState();
            };
            img.src = dataUrl;
        }

        function playAudio(dataUrl) {
            const audio = new Audio(dataUrl);
            audio.play().catch(err => showToast('Audio failed','error'));
        }

        // ========== STICKER MODE ==========
        function toggleStickerMode() {
            stickerMode = !stickerMode;
            document.getElementById('sticker-mode-btn').classList.toggle('active', stickerMode);
            showToast(stickerMode ? '🖼️ Sticker mode ON' : '🖼️ Sticker mode OFF');
        }

        function createStickerFromLibrary(id) {
            const item = library.find(x => x.id === id);
            if (!item) return;
            const sticker = document.createElement('div');
            sticker.className = 'sticker-preview';
            if (item.type === 'image') {
                sticker.innerHTML = `<img src="${item.dataUrl}">`;
            } else {
                sticker.innerHTML = `<span style="font-size:30px;">${item.type==='audio'?'🎵':item.type==='video'?'🎬':'📄'}</span>`;
            }
            sticker.style.left = '50%';
            sticker.style.top = '50%';
            sticker.style.width = '16%'; // approximately 1/6
            document.getElementById('canvas-container').appendChild(sticker);
            makeDraggable(sticker);
            playPopSound();
        }

        function makeDraggable(el) {
            let startX, startY, origX, origY;
            el.addEventListener('touchstart', e => {
                const touch = e.touches[0];
                startX = touch.clientX; startY = touch.clientY;
                origX = el.offsetLeft; origY = el.offsetTop;
                el.style.animation = 'none';
                e.preventDefault();
            }, {passive:false});
            el.addEventListener('touchmove', e => {
                const touch = e.touches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                el.style.left = origX + dx + 'px';
                el.style.top = origY + dy + 'px';
                e.preventDefault();
            }, {passive:false});
            el.addEventListener('touchend', () => {
                el.style.animation = 'levitate 3s ease-in-out infinite';
            });
        }

        function playPopSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function addSpeechBubble() {
            const text = prompt('Bubble text', '✨ Hello!');
            if (text) {
                const bubble = document.createElement('div');
                bubble.className = 'sticker-preview speech-bubble';
                bubble.innerText = text;
                bubble.style.left = '60%'; bubble.style.top = '50%';
                document.getElementById('canvas-container').appendChild(bubble);
                makeDraggable(bubble);
            }
        }

        function addCircularSticker() {
            const url = prompt('Image URL', '');
            if (url) {
                const sticker = document.createElement('div');
                sticker.className = 'sticker-preview circular';
                sticker.innerHTML = `<img src="${url}">`;
                sticker.style.left = '40%'; sticker.style.top = '50%';
                document.getElementById('canvas-container').appendChild(sticker);
                makeDraggable(sticker);
            }
        }

        // ========== THEATER MODE ==========
        function enterTheaterMode() {
            if (!panels.length) { showToast('No panels', 'error'); return; }
            theaterIndex = 0;
            document.getElementById('theater-overlay').classList.remove('hidden');
            updateTheater();
        }

        function exitTheaterMode() {
            document.getElementById('theater-overlay').classList.add('hidden');
        }

        function theaterPrev() { if (theaterIndex > 0) { theaterIndex--; updateTheater(); } }
        function theaterNext() { if (theaterIndex < panels.length - 1) { theaterIndex++; updateTheater(); } }

        function updateTheater() {
            const img = document.getElementById('theater-panel-img');
            img.src = panels[theaterIndex].dataUrl;
            const progress = (theaterIndex / (panels.length - 1)) * 100;
            document.getElementById('bunny').style.left = progress + '%';
        }

        // ========== FRAME & PANEL ==========
        function pinFrame() { if(!canvas.width)return; const dataUrl=canvas.toDataURL('image/png'); panels.push({id:'panel_'+Date.now(),dataUrl:dataUrl,thumb:dataUrl}); renderTimeline(); showToast('📌 Frame pinned'); }
        function captureFrame() { if(!canvas.width)return; const dataUrl=canvas.toDataURL('image/png'); animationFrames.push({dataUrl:dataUrl,thumb:dataUrl}); renderTimeline(); showToast(`📸 Frame ${animationFrames.length}`); }

        function renderTimeline() {
            const strip = document.getElementById('timeline-strip');
            if (!strip) return;
            strip.innerHTML = panels.map((p,i)=>`<img src="${p.thumb}" class="timeline-frame" onclick="loadPanel(${i})">`).join('') +
                animationFrames.map((f,i)=>`<img src="${f.thumb}" class="timeline-frame" onclick="loadAnimationFrame(${i})">`).join('');
        }

        function loadPanel(index) { if(index>=panels.length)return; const img=new Image(); img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0); if(layers.length){layers[0].canvas.width=img.width;layers[0].canvas.height=img.height;layers[0].ctx.drawImage(img,0,0);} compositeLayers(); saveState();}; img.src=panels[index].dataUrl; }
        function loadAnimationFrame(index) { const img=new Image(); img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);}; img.src=animationFrames[index].dataUrl; }
        function playAnimation() { if(!animationFrames.length)return; if(animationInterval)clearInterval(animationInterval); let idx=0; animationInterval=setInterval(()=>{loadAnimationFrame(idx); idx=(idx+1)%animationFrames.length;},200); }
        function stopAnimation() { if(animationInterval)clearInterval(animationInterval); animationInterval=null; }

        // ========== SIMPLE STYLE & PIPELINE ==========
        function applyStyle(style) {
            if(!canvas.width)return;
            filterLayers=[]; adjustments={brightness:0,contrast:0,saturation:100};
            if(style==='jrpg') { adjustments={brightness:12,contrast:30,saturation:140}; filterLayers.push({type:'cel-shade',strength:60,blendMode:'overlay'}); }
            else if(style==='comic') { adjustments={brightness:0,contrast:50,saturation:135}; filterLayers.push({type:'halftone-dots',strength:65,blendMode:'overlay'}); }
            else if(style==='manga') { adjustments={brightness:5,contrast:55,saturation:90}; filterLayers.push({type:'ductus-pro',strength:85,blendMode:'multiply'}); }
            else if(style==='anime') { adjustments={brightness:8,contrast:35,saturation:145}; filterLayers.push({type:'anime-ductus',strength:70,blendMode:'overlay'}); }
            else if(style==='neon') { adjustments={brightness:15,contrast:70,saturation:180}; filterLayers.push({type:'neon-glow',strength:75,blendMode:'screen'}); }
            else if(style==='pixel') { adjustments={brightness:0,contrast:40,saturation:100}; filterLayers.push({type:'pixel-art',strength:100,blendMode:'normal'}); }
            else if(style==='lichtenstein') { adjustments={brightness:5,contrast:65,saturation:200}; filterLayers.push({type:'lichtenstein',strength:90,blendMode:'overlay'}); }
            else if(style==='psp') { adjustments={brightness:5,contrast:25,saturation:130}; filterLayers.push({type:'psp-render',strength:55,blendMode:'soft-light'}); }
            else if(style==='flat') { adjustments={brightness:5,contrast:40,saturation:70}; filterLayers.push({type:'posterize',strength:4,blendMode:'normal'}); }
            else if(style==='xray') { adjustments={brightness:0,contrast:80,saturation:0}; filterLayers.push({type:'xray',strength:100,blendMode:'screen'}); }
            processImagePipeline();
        }

        function processImagePipeline() {
            if(!layers.length)return;
            const base=layers[0];
            base.ctx.clearRect(0,0,base.canvas.width,base.canvas.height);
            base.ctx.drawImage(base.originalImg,0,0);
            // apply basic adjustments
            compositeLayers();
        }

        function compositeLayers() {
            if(!canvas.width||!layers.length)return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.drawImage(layers[0].canvas,0,0);
            overlays.forEach(item=>{
                ctx.save();ctx.translate(item.x,item.y);if(item.rotation)ctx.rotate(item.rotation);
                ctx.font=`bold ${item.size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
                ctx.fillStyle=item.color||'#fff';ctx.shadowColor=item.color;ctx.shadowBlur=12;
                ctx.fillText(item.content,0,0);ctx.shadowBlur=0;ctx.restore();
            });
        }

        // ========== HISTORY ==========
        function saveState() { if(!canvas.width)return; if(historyPointer<historyStack.length-1)historyStack=historyStack.slice(0,historyPointer+1); historyStack.push(canvas.toDataURL()); if(historyStack.length>30)historyStack.shift(); historyPointer=historyStack.length-1; }
        function undo(){ if(historyPointer>0){historyPointer--; loadHistoryState(historyStack[historyPointer]);} else showToast('⏪ At oldest','error'); }
        function redo(){ if(historyPointer<historyStack.length-1){historyPointer++; loadHistoryState(historyStack[historyPointer]);} else showToast('⏩ At newest','error'); }
        function loadHistoryState(dataUrl){ const img=new Image(); img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0); if(layers.length&&layers[0].ctx){layers[0].ctx.clearRect(0,0,layers[0].canvas.width,layers[0].canvas.height);layers[0].ctx.drawImage(img,0,0);}}; img.src=dataUrl; }

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            updateTopLibrary();
            setMode('jrpg');
            applyStyle('jrpg');
        });
    </script>
</body>
