<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🕹️ NEON ISLAND FARM & GAME EDITOR</title>
    <style>
        body {
            margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
            background: radial-gradient(circle at 50% 30%, #0a0f1e, #03050b);
            font-family: 'Courier New', monospace;
            touch-action: manipulation;
        }
        .gameboy {
            position: relative;
            width: 800px; height: 900px;
            background: rgba(15,20,35,0.35);
            backdrop-filter: blur(15px) saturate(180%);
            border: 2px solid rgba(0,240,255,0.4);
            border-radius: 40px;
            box-shadow: 0 0 80px rgba(0,240,255,0.2), inset 0 0 40px rgba(255,255,255,0.05);
            display:flex; flex-direction:column; align-items:center;
            padding: 20px 15px;
            overflow:hidden;
        }
        .gameboy::before {
            content:''; position:absolute; inset:0; pointer-events:none;
            background:
                linear-gradient(to right, rgba(0,255,255,0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,0,255,0.07) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index:0;
        }
        .screen-area {
            display:flex; gap:15px; margin-bottom:15px; z-index:1;
        }
        canvas {
            image-rendering: pixelated;
            background: #0a0a0f;
            border: 2px solid rgba(0,240,255,0.7);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,240,255,0.25), inset 0 0 10px rgba(0,0,0,0.7);
        }
        .main-screen {
            width: 500px; height: 500px;
        }
        .side-screens {
            display:flex; flex-direction:column; gap:10px;
        }
        .hud-screen {
            width: 200px; height: 180px;
        }
        .mini-screen {
            width: 200px; height: 300px;
        }
        .controls {
            display:flex; gap:30px; align-items:center; z-index:1;
        }
        .dpad {
            position: relative; width: 130px; height: 130px;
        }
        .dpad button {
            position:absolute; width: 40px; height: 40px;
            background: rgba(0,240,255,0.1);
            border: 1px solid rgba(0,240,255,0.5);
            border-radius: 8px; color:#0ff; font-size:20px;
            cursor:pointer; backdrop-filter: blur(4px);
        }
        .dpad .up{ top:0; left:45px; }
        .dpad .down{ bottom:0; left:45px; }
        .dpad .left{ top:45px; left:0; }
        .dpad .right{ top:45px; right:0; }
        .dpad .center{ top:45px; left:45px; background:#0ff2; }
        .action-buttons {
            display:flex; gap:10px; flex-wrap:wrap; max-width:200px;
        }
        .action-buttons button {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,0,127,0.25);
            border: 2px solid #ff007f;
            color:white; font-weight:bold; cursor:pointer;
            box-shadow:0 0 12px rgba(255,0,127,0.6);
        }
        .hint {
            color:#7f8c8d; font-size:12px; margin-top:15px; text-align:center; z-index:1;
        }
        .editor-overlay {
            position:absolute; bottom:10px; left:10px; right:10px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            border-radius: 15px; padding:10px; display:none; z-index:2;
            color:white;
        }
        .editor-overlay.active { display:block; }
        .editor-tools {
            display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;
        }
        .editor-tools button {
            background: rgba(0,240,255,0.2); border:1px solid #0ff;
            border-radius:6px; padding:6px 12px; color:#0ff; cursor:pointer;
        }
        .sprite-preview {
            width:100%; height:150px; background:#111; border:1px solid #0ff;
            image-rendering: pixelated; margin-top:10px;
        }
        .dialogue-box {
            position:absolute; left:20px; right:20px; bottom:80px;
            background: rgba(0,0,0,0.85); border:2px solid #ff007f;
            border-radius:10px; padding:15px; color:white; font-size:16px;
            display:none; z-index:3;
        }
        .dialogue-box.active { display:block; }
        .hp-bar {
            position:absolute; top:20px; left:20px; width:200px;
            height:20px; background:#333; border-radius:5px; overflow:hidden;
            border:1px solid #0ff; z-index:4;
        }
        .hp-fill {
            height:100%; background: linear-gradient(90deg, #f00, #ff0);
            transition: width 0.3s;
        }
        .emoji-set {
            position:absolute; top:20px; right:20px; display:flex; gap:5px;
            z-index:5; background:rgba(0,0,0,0.4); padding:5px; border-radius:10px;
        }
        .emoji-set span { font-size:24px; cursor:pointer; }
    </style>
</head>
<body>
<div class="gameboy" id="gameboy">
    <div class="screen-area">
        <canvas id="mainCanvas" class="main-screen" width="500" height="500"></canvas>
        <div class="side-screens">
            <canvas id="hudCanvas" class="hud-screen" width="200" height="180"></canvas>
            <canvas id="miniCanvas" class="mini-screen" width="200" height="300"></canvas>
        </div>
    </div>

    <div class="controls">
        <div class="dpad">
            <button class="up" id="btnUp">▲</button>
            <button class="down" id="btnDown">▼</button>
            <button class="left" id="btnLeft">◀</button>
            <button class="right" id="btnRight">▶</button>
            <button class="center" id="btnCenter">✦</button>
        </div>
        <div class="action-buttons">
            <button id="btnA">A</button>
            <button id="btnB">B</button>
            <button id="btnX">X</button>
            <button id="btnY">Y</button>
            <button id="btnL">L</button>
            <button id="btnR">R</button>
            <button id="btnStart">⏵</button>
            <button id="btnSelect">⏺</button>
        </div>
    </div>

    <div class="hint">🐴 Move: D-Pad • A=Interact • B=Attack • X=Day/Night • Y=Toggle Editor • L/R=Zoom • Start=Menu • Select=Dialogue</div>

    <!-- HP bar -->
    <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>

    <!-- Emoji emotional set -->
    <div class="emoji-set" id="emojiSet">
        <span data-emotion="love">❤️</span>
        <span data-emotion="spade">♠️</span>
        <span data-emotion="club">♣️</span>
        <span data-emotion="diamond">♦️</span>
        <span data-emotion="wave">🌊</span>
        <span data-emotion="whale">🐋</span>
        <span data-emotion="letter">💌</span>
        <span data-emotion="sparkle">✨</span>
    </div>

    <!-- Sprite Editor Overlay -->
    <div class="editor-overlay" id="editorOverlay">
        <div class="editor-tools">
            <button onclick="setTool('brush')">🖌️ Brush</button>
            <button onclick="setTool('eraser')">🧹 Eraser</button>
            <button onclick="setTool('fill')">🪣 Fill</button>
            <button onclick="setTool('picker')">💧 Pick</button>
            <button onclick="toggleHitboxMode()">⬜ Hitbox</button>
            <button onclick="clearSprite()">🗑️ Clear</button>
            <button onclick="saveSprite()">💾 Save</button>
            <button onclick="closeEditor()">✖️ Close</button>
        </div>
        <canvas id="spriteCanvas" class="sprite-preview" width="200" height="200"></canvas>
        <div style="margin-top:5px;">
            <span style="color:#0ff">Sprite Editor: Draw pixels below</span>
        </div>
    </div>

    <!-- Dialogue box -->
    <div class="dialogue-box" id="dialogueBox">
        <span id="dialogueText">Hello! Welcome to the island.</span>
        <button onclick="closeDialogue()" style="float:right; background:none; border:none; color:#ff007f; cursor:pointer;">Close</button>
    </div>
</div>

<script>
    // ========== GAME STATE ==========
    let player = { x: 6, y: 6, hp: 42, maxHp: 42, emotion: 'love' };
    let horse = { x: 12, y: 10, health: 5, maxHealth: 5 };
    let dayTime = 0;
    let wireframeMode = false;
    let zoomLevel = 1.0;
    let cameraX = 0, cameraY = 0;
    let hitboxMode = false;
    let dialogueActive = false;
    let editorActive = false;
    let spriteTool = 'brush';
    let spriteData = Array.from({length: 20}, () => Array(20).fill('#000000'));
    let timeline = [];
    let gameStarted = false;

    // ========== CANVASES ==========
    const mainCtx = document.getElementById('mainCanvas').getContext('2d');
    const hudCtx = document.getElementById('hudCanvas').getContext('2d');
    const miniCtx = document.getElementById('miniCanvas').getContext('2d');
    const spriteCanvas = document.getElementById('spriteCanvas');
    const spriteCtx = spriteCanvas.getContext('2d');

    const TILE = 25; // base tile size (scaled by zoom)

    function updateHpBar() {
        const fill = document.getElementById('hpFill');
        fill.style.width = (player.hp / player.maxHp) * 100 + '%';
    }

    function drawIsland(ctx, w, h, isMain) {
        ctx.clearRect(0,0,w,h);
        // grass
        ctx.fillStyle = '#2d5a1e';
        ctx.fillRect(0,0,w,h);
        // sand beach (right bottom)
        ctx.fillStyle = '#d4b06a';
        ctx.beginPath();
        ctx.moveTo(w*0.6,h);
        ctx.lineTo(w,h*0.7);
        ctx.lineTo(w,h);
        ctx.fill();
        // water
        ctx.fillStyle = '#1a5276';
        ctx.fillRect(0,h*0.8,w,h*0.2);
        // fire area (center)
        ctx.fillStyle = '#ff4500';
        ctx.beginPath();
        ctx.arc(w/2, h/2, 30, 0, Math.PI*2);
        ctx.fill();
        // tree
        ctx.fillStyle = '#4a2e0e';
        ctx.fillRect(20,20,10,30);
        ctx.fillStyle = '#1e7b1e';
        ctx.beginPath();
        ctx.arc(25,15,20,0,Math.PI*2);
        ctx.fill();

        // horse
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(horse.x*TILE, horse.y*TILE, 25, 15);
        ctx.fillRect(horse.x*TILE+5, horse.y*TILE-10, 8, 15);
        ctx.fillRect(horse.x*TILE-5, horse.y*TILE+5, 15, 8);
        // player
        ctx.fillStyle = '#ff00ff';
        ctx.fillRect(player.x*TILE, player.y*TILE, 10, 15);
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(player.x*TILE+2, player.y*TILE-5, 6, 5);

        // spider
        ctx.fillStyle = '#333';
        ctx.fillRect(50, 50, 8, 8);
        // jellyfish
        ctx.fillStyle = 'rgba(255,0,255,0.6)';
        ctx.beginPath();
        ctx.arc(180, 220, 15, 0, Math.PI*2);
        ctx.fill();

        // day/night overlay
        if (isMain) {
            if (dayTime < 6 || dayTime > 18) {
                ctx.fillStyle = 'rgba(10,10,40,0.4)';
                ctx.fillRect(0,0,w,h);
            } else if (dayTime > 6 && dayTime < 8) {
                ctx.fillStyle = 'rgba(255,150,50,0.2)';
                ctx.fillRect(0,0,w,h);
            }
        }
        if (wireframeMode && isMain) {
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 1;
            for (let x=0; x<w; x+=TILE) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
            for (let y=0; y<h; y+=TILE) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
        }
        // hitbox visualization
        if (hitboxMode && isMain) {
            ctx.strokeStyle = '#f0f';
            ctx.strokeRect(player.x*TILE, player.y*TILE, 10, 15);
            ctx.strokeStyle = '#ff0';
            ctx.strokeRect(horse.x*TILE, horse.y*TILE, 25, 15);
        }
    }

    function drawHUD() {
        hudCtx.clearRect(0,0,200,180);
        hudCtx.fillStyle = '#000';
        hudCtx.fillRect(0,0,200,180);
        hudCtx.fillStyle = 'white';
        hudCtx.font = '14px monospace';
        hudCtx.fillText('HP '+player.hp+'/'+player.maxHp, 10, 25);
        hudCtx.fillText('Horse '+horse.health+'/'+horse.maxHealth, 10, 45);
        let timeIcon = dayTime < 6 ? '🌙' : dayTime < 18 ? '☀️' : '🌙';
        hudCtx.fillText(timeIcon+' '+Math.floor(dayTime)+':00', 10, 70);
        hudCtx.fillText('Zoom: '+zoomLevel.toFixed(1), 10, 95);
        hudCtx.fillText('Emotion: '+player.emotion, 10, 120);
        hudCtx.fillText('Stage: Island', 10, 140);
    }

    function drawMiniMap() {
        miniCtx.clearRect(0,0,200,300);
        miniCtx.fillStyle = '#111';
        miniCtx.fillRect(0,0,200,300);
        miniCtx.strokeStyle = '#0ff';
        miniCtx.strokeRect(5,5,190,290);
        // simple island shape
        miniCtx.fillStyle = '#2d5a1e';
        miniCtx.beginPath();
        miniCtx.moveTo(40,280);
        miniCtx.lineTo(160,280);
        miniCtx.lineTo(100,60);
        miniCtx.fill();
        // player dot
        miniCtx.fillStyle = '#ff0';
        miniCtx.fillRect(player.x*3+40, player.y*3+60, 6,6);
    }

    function drawSpriteEditor() {
        if (!editorActive) return;
        spriteCtx.clearRect(0,0,200,200);
        for (let y=0; y<20; y++) {
            for (let x=0; x<20; x++) {
                spriteCtx.fillStyle = spriteData[y][x];
                spriteCtx.fillRect(x*10, y*10, 10, 10);
            }
        }
    }

    function updateGame() {
        // day cycle
        dayTime = (dayTime + 0.05) % 24;

        // hazard interactions
        let dx = Math.abs(player.x - 10);
        let dy = Math.abs(player.y - 10);
        let distToFire = Math.sqrt(dx*dx + dy*dy);
        if (distToFire < 5) { // near fire
            player.hp = Math.max(0, player.hp - 1);
        }
        // water healing
        if (player.y > 15) { // in water area
            player.hp = Math.min(player.maxHp, player.hp + 0.1);
        }
        // grass healing
        if (player.x < 5 && player.y < 5) {
            player.hp = Math.min(player.maxHp, player.hp + 0.05);
        }

        drawIsland(mainCtx, 500, 500, true);
        drawHUD();
        drawMiniMap();
        drawSpriteEditor();
        updateHpBar();
        requestAnimationFrame(updateGame);
    }

    // ========== CONTROLS ==========
    document.getElementById('btnUp').addEventListener('click', () => { player.y = Math.max(0, player.y-1); captureTimeline(); });
    document.getElementById('btnDown').addEventListener('click', () => { player.y = Math.min(19, player.y+1); captureTimeline(); });
    document.getElementById('btnLeft').addEventListener('click', () => { player.x = Math.max(0, player.x-1); captureTimeline(); });
    document.getElementById('btnRight').addEventListener('click', () => { player.x = Math.min(19, player.x+1); captureTimeline(); });
    document.getElementById('btnCenter').addEventListener('click', () => { toggleEmotion(); });
    document.getElementById('btnA').addEventListener('click', () => { horse.health = Math.min(horse.maxHealth, horse.health+1); });
    document.getElementById('btnB').addEventListener('click', () => { horse.health = Math.max(0, horse.health-1); });
    document.getElementById('btnX').addEventListener('click', () => { dayTime = (dayTime+6) % 24; });
    document.getElementById('btnY').addEventListener('click', () => { wireframeMode = !wireframeMode; });
    document.getElementById('btnL').addEventListener('click', () => { zoomLevel = Math.max(0.5, zoomLevel-0.1); });
    document.getElementById('btnR').addEventListener('click', () => { zoomLevel = Math.min(2.0, zoomLevel+0.1); });
    document.getElementById('btnStart').addEventListener('click', () => { gameStarted = !gameStarted; });
    document.getElementById('btnSelect').addEventListener('click', () => { toggleDialogue('This is a peaceful island. Care for animals!'); });

    // Emoji set
    document.querySelectorAll('#emojiSet span').forEach(el => {
        el.addEventListener('click', () => {
            player.emotion = el.dataset.emotion;
            showDialogue('Emotion changed to '+player.emotion);
        });
    });

    // Sprite editor toggling
    document.getElementById('btnY').addEventListener('click', () => {
        editorActive = !editorActive;
        document.getElementById('editorOverlay').classList.toggle('active', editorActive);
    });

    function toggleHitboxMode() { hitboxMode = !hitboxMode; }
    function clearSprite() { spriteData = Array.from({length:20}, () => Array(20).fill('#000')); }
    function saveSprite() { showDialogue('Sprite saved to asset library (placeholder)'); }
    function closeEditor() { editorActive = false; document.getElementById('editorOverlay').classList.remove('active'); }

    // Timeline capture
    function captureTimeline() {
        timeline.push({ x: player.x, y: player.y, hp: player.hp, time: dayTime, emotion: player.emotion });
        if (timeline.length > 100) timeline.shift();
    }

    function replayTimeline() {
        // simple replay: set player pos to last captured
        if (timeline.length > 0) {
            const last = timeline[timeline.length-1];
            player.x = last.x; player.y = last.y; player.hp = last.hp;
        }
    }

    // Dialogue
    function showDialogue(text) {
        document.getElementById('dialogueText').innerText = text;
        document.getElementById('dialogueBox').classList.add('active');
        dialogueActive = true;
    }
    function closeDialogue() {
        document.getElementById('dialogueBox').classList.remove('active');
        dialogueActive = false;
    }
    function toggleDialogue(text) {
        if (dialogueActive) closeDialogue(); else showDialogue(text);
    }

    // Start
    updateGame();
</script>
</body>
</html>
