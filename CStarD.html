    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // State
        const state = {
            characters: [],
            activeCharId: null,
            selectedPart: null,
            activeTab: 'chars',
            panelOpen: false,
            animationMixer: null,
            animationAction: null,
            animationPlaying: false,
            charLayout: 'single',
            charOffsets: {},
            transformMode: 'position',
            transformAxis: 'x',
            libraryCat: null,
        };

        // Three.js
        const container = document.getElementById('viewport-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06060e);
        scene.fog = new THREE.Fog(0x06060e, 6, 20);
        const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.05, 100);
        camera.position.set(0, 1.5, 4);
        camera.lookAt(0, 1.1, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // Lights
        const ambient = new THREE.AmbientLight(0x1a1a2e, 1.0);
        scene.add(ambient);
        const keyLight = new THREE.DirectionalLight(0xffccee, 2.2);
        keyLight.position.set(2, 3, 3);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);
        const rimLight = new THREE.DirectionalLight(0x00e5ff, 3.0);
        rimLight.position.set(-2, 1, -2);
        scene.add(rimLight);
        const fillLight = new THREE.DirectionalLight(0x8338ec, 1.5);
        fillLight.position.set(0, 0.5, 2);
        scene.add(fillLight);
        const glowLight = new THREE.PointLight(0xff006e, 1.5, 6);
        glowLight.position.set(0, 0, 0.5);
        scene.add(glowLight);
        const gridHelper = new THREE.GridHelper(12, 50, 0x1a1a3a, 0x0a0a1a);
        gridHelper.position.y = -0.8;
        scene.add(gridHelper);

        // Particles
        const particlesGeo = new THREE.BufferGeometry();
        const pCount = 150;
        const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount * 3; i++) pPos[i] = (Math.random() - 0.5) * 14;
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const particlesMat = new THREE.PointsMaterial({ color: 0x00e5ff, size: 0.012, transparent: true, opacity: 0.4,
            blending: THREE.AdditiveBlending, depthWrite: false });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        const characterGroup = new THREE.Group();
        characterGroup.name = 'characterGroup';
        scene.add(characterGroup);

        const controls = new OrbitControls(camera, renderer.domElement);

        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 0.8;
        controls.maxDistance = 15;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.minPolarAngle = Math.PI * 0.15;
        controls.update();

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let pointerDown = false;
        let pointerMoved = false;
        let swipeStart = { x: 0, y: 0 };

        // Loaders
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        // Categorization
        const CAT_ICONS = { body: '🧍', head: '👤', hair: '💇', eyes: '👁️', mouth: '👄', ears: '👂', nose: '👃', arms: '💪',
            hands: '✋', legs: '🦵', feet: '🦶', top: '👕', bottom: '👖', dress: '👗', shoes: '👟', socks: '🧦',
            underwear: '🩲', gloves: '🧤', hats: '🎩', accessories: '💍', other: '📦' };
        const CAT_KEYWORDS = {

            head: ['head', 'face', 'skull', 'neck', 'jaw', 'chin', 'forehead', 'cheek', 'cranium', 'temple'],
            hair: ['hair', 'fringe', 'bangs', 'ponytail', 'braid', 'strand', 'curl', 'lock', 'mane', 'quiff',

            ],

            underwear: ['underwear', 'bra', 'panty', 'brief', 'boxer', 'thong', 'lingerie', 'slip', 'undershirt',
                'underpant', 'camisole', 'jockstrap'
            ],

            hats: ['hat', 'cap', 'beanie', 'hood', 'beret', 'fedora', 'helmet', 'crown', 'tiara', 'visor', 'beanie',

            ],
            accessories: ['accessory', 'jewelry', 'necklace', 'earring', 'ring', 'bracelet', 'scarf', 'collar', 'tie',
                'bow', 'belt', 'watch', 'glasses', 'choker', 'chain', 'pin', 'brooch', 'pendant', 'amulet', 'medallion',
                'anklet', 'cufflink', 'bangle'
            ],
        };

        function categorize(name, pos) {
            const n = (name || '').toLowerCase();
            for (const [cat, kws] of Object.entries(CAT_KEYWORDS)) {
                for (const kw of kws) { if (n.includes(kw)) return cat; }
            }
            if (pos) {
                const y = pos.y;
                if (y > 1.7) return 'hats';
                if (y > 1.5) return 'hair';
                if (y > 1.3) return 'head';
                if (y > 1.15) return 'eyes';
                if (y > 0.9) return 'top';
                if (y > 0.55) return 'bottom';
                if (y > 0.3) return 'legs';
                if (y > 0.05) return 'feet';
                if (y > -0.2) return 'shoes';
            }
            return 'other';
        }

        // Character management
        function genId() { return 'c_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5); }

        function parseChar(gltf, fileName, id) {
            const parts = {};
            const bones = [];
            const animations = [];
            const allMeshes = [];
            gltf.scene.traverse(n => { if (n.isMesh || n.isSkinnedMesh) allMeshes.push(n); });
            const groups = new Map();
            for (const mesh of allMeshes) {
                let parentName = mesh.parent ? mesh.parent.name : '';
                const combined = `${mesh.name || ''} ${parentName || ''}`.toLowerCase();
                const wPos = new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
                let cat = categorize(combined, wPos);
                if (mesh.parent && mesh.parent.name && mesh.parent.name.length > 0) {
                    const pc = categorize(mesh.parent.name, null);
                    if (pc !== 'other') cat = pc;
                }
                if (!groups.has(cat)) groups.set(cat, { id: `${id}_${cat}`, name: cat, category: cat, meshes: [],
                    sourceCharId: id, sourceCharName: fileName });
                const g = groups.get(cat);
                g.meshes.push(mesh);
                if (mesh.material) {
                    const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
                    for (const m of mats) { if (!g.materials) g.materials = [];
                        g.materials.push(m); }
                }
            }
            for (const [cat, g] of groups) { if (g.meshes.length) { g.materials = Array.from(new Set(g.materials || []));
                    parts[cat] = g; } }
            const boneSet = new Set();
            gltf.scene.traverse(n => { if (n.isBone || n.type === 'Bone') boneSet.add(n); });
            for (const b of boneSet) bones.push({ name: b.name, parent: b.parent && b.parent.isBone ? b.parent.name : null });
            bones.sort((a, b) => (a.parent ? 1 : 0) - (b.parent ? 1 : 0));
            if (gltf.animations) for (const clip of gltf.animations) animations.push({ name: clip.name ||
                    'anim_' + animations.length, duration: clip.duration || 0, clip });
            return { id, name: fileName.replace(/\.(glb|gltf)$/i, ''), fileName, gltf, parts, bones, animations,
                meshCount: allMeshes.length, offset: new THREE.Vector3(0, 0, 0) };
        }

        function addCharacter(gltf, fileName) {
            const id = genId();
            const cd = parseChar(gltf, fileName, id);
            state.characters.push(cd);
            state.charOffsets[id] = { x: 0, y: 0, z: 0 };
            state.activeCharId = id;
            updateBadge();
            return cd;
        }

        function removeCharacter(id) {
            const idx = state.characters.findIndex(c => c.id === id);
            if (idx === -1) return;
            const c = state.characters[idx];
            if (c.gltf?.scene) characterGroup.remove(c.gltf.scene);
            state.characters.splice(idx, 1);
            delete state.charOffsets[id];
            if (state.activeCharId === id) state.activeCharId = state.characters.length ? state.characters[0].id : null;
            if (state.selectedPart?.charId === id) state.selectedPart = null;
            updateBadge();
            updateScene();
            renderPanel();
            updateMiniLibrary();
        }

        function getActiveChar() { return state.characters.find(c => c.id === state.activeCharId) || null; }

        function updateBadge() { const b = document.getElementById('upload-badge'); if (state.characters.length) { b.style
                    .display = 'flex';
                b.textContent = state.characters.length } else b.style.display = 'none'; }

        function updateScene() {
            while (characterGroup.children.length) characterGroup.remove(characterGroup.children[0]);
            if (state.animationMixer) { state.animationMixer.stopAllAction();
                state.animationMixer = null;
                state.animationAction = null;
                state.animationPlaying = false; }
            const active = getActiveChar();
            if (active?.gltf?.scene) {
                characterGroup.add(active.gltf.scene);
                const off = state.charOffsets[active.id] || { x: 0, y: 0, z: 0 };
                active.gltf.scene.position.set(off.x, off.y, off.z);
                active.gltf.scene.rotation.set(0, 0, 0);
                active.gltf.scene.scale.set(1, 1, 1);
                if (active.animations.length) state.animationMixer = new THREE.AnimationMixer(active.gltf.scene);
                document.getElementById('char-name-overlay').textContent = active.name.toUpperCase();
            } else { document.getElementById('char-name-overlay').textContent = 'NO CHARACTER'; }
            if (state.charLayout === 'multi') {
                let idx = 0;
                for (const c of state.characters) {
                    if (c.id === active?.id) continue;
                    if (c.gltf?.scene) {
                        characterGroup.add(c.gltf.scene);
                        const off = state.charOffsets[c.id] || { x: 0, y: 0, z: 0 };
                        c.gltf.scene.position.set(off.x + (idx + 1) * 1.8, off.y, off.z);
                        c.gltf.scene.scale.set(1, 1, 1);
                        idx++;
                    }
                }
            }
            state.selectedPart = null;
            updateMiniLibrary();
        }

        function selectPartByMesh(mesh) {
            const ac = getActiveChar();
            if (!ac) return;
            for (const [cat, part] of Object.entries(ac.parts)) {
                if (part.meshes.includes(mesh)) {
                    state.selectedPart = { charId: ac.id, partId: part.id, partName: cat, meshes: part.meshes,
                        category: cat };
                    showToast(`Selected: ${cat.toUpperCase()}`);
                    if (state.panelOpen) renderPanel();
                    updateMiniLibrary();
                    return;
                }
            }
        }

        function swapPartFromLibrary(srcCharId, srcCat) {
            const ac = getActiveChar();
            if (!ac || !ac.parts[srcCat]) return;
            const sc = state.characters.find(c => c.id === srcCharId);
            if (!sc || !sc.parts[srcCat]) return;
            for (const m of ac.parts[srcCat].meshes) { if (m.parent) m.parent.remove(m); }
            const newMeshes = [];
            for (const m of sc.parts[srcCat].meshes) {
                const clone = m.clone(true);
                ac.gltf.scene.add(clone);
                clone.position.copy(m.position);
                clone.rotation.copy(m.rotation);
                clone.scale.copy(m.scale);
                newMeshes.push(clone);
            }
            ac.parts[srcCat] = { ...ac.parts[srcCat], meshes: newMeshes, sourceCharId: srcCharId, sourceCharName: sc
                    .name };
            showToast(`Swapped ${srcCat} from ${sc.name}`);
            updateScene();
            renderPanel();
            updateMiniLibrary();
        }

        // Transform with circular knobs
        function applyTransform(prop, axis, value) {
            if (!state.selectedPart) return;
            for (const mesh of state.selectedPart.meshes) {
                if (prop === 'position') mesh.position[axis] = parseFloat(value);
                if (prop === 'rotation') mesh.rotation[axis] = parseFloat(value);
                if (prop === 'scale') mesh.scale[axis] = parseFloat(value);
            }
        }

        function getTransformValue(prop, axis) {
            if (!state.selectedPart || !state.selectedPart.meshes.length) return 0;
            const m = state.selectedPart.meshes[0];
            if (prop === 'position') return m.position[axis]?.toFixed(2) || 0;
            if (prop === 'rotation') return m.rotation[axis]?.toFixed(2) || 0;
            if (prop === 'scale') return m.scale[axis]?.toFixed(2) || 0;
            return 0;
        }

        // Circular Knob Handler
        function createCircularKnob(container, label, initialValue, min, max, step, onChange) {
            const wrapper = document.createElement('div');
            wrapper.style.display = 'flex';
            wrapper.style.alignItems = 'center';
            wrapper.style.gap = '4px';
            wrapper.style.margin = '2px 0';
            const labelEl = document.createElement('span');
            labelEl.textContent = label;
            labelEl.style.fontSize = '7px';
            labelEl.style.color = 'var(--text-secondary)';
            labelEl.style.minWidth = '20px';
            const knob = document.createElement('div');
            knob.className = 'circular-knob';
            knob.style.width = '36px';
            knob.style.height = '36px';
            const dot = document.createElement('div');
            dot.className = 'knob-dot';
            knob.appendChild(dot);
            const valueDisplay = document.createElement('span');
            valueDisplay.className = 'val-display';
            valueDisplay.textContent = initialValue;
            wrapper.appendChild(labelEl);
            wrapper.appendChild(knob);
            wrapper.appendChild(valueDisplay);
            container.appendChild(wrapper);

            let isDragging = false;
            let startY = 0;
            let currentVal = parseFloat(initialValue);

            function updateDot() {
                const ratio = (currentVal - min) / (max - min);
                const angle = ratio * 270 - 135; // from -135 to 135
                dot.style.transform = `translate(-50%, 0) rotate(${angle}deg)`;
            }

            function setValue(val, notify = true) {
                val = Math.min(max, Math.max(min, val));
                currentVal = val;
                valueDisplay.textContent = val.toFixed(2);
                updateDot();
                if (notify && onChange) onChange(val);
            }

            updateDot();

            knob.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startY = e.clientY;
                knob.setPointerCapture(e.pointerId);
                e.preventDefault();
            });
            knob.addEventListener('pointermove', (e) => {
                if (isDragging) {
                    const dy = startY - e.clientY;
                    const sensitivity = (max - min) / 150;
                    setValue(currentVal + dy * sensitivity);
                    startY = e.clientY;
                }
            });
            knob.addEventListener('pointerup', () => { isDragging = false; });
            knob.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -step : step;
                setValue(currentVal + delta);
            }, { passive: false });
            return { setValue, getValue: () => currentVal };
        }

        function renderTransformPanel(c, ac) {
            if (!state.selectedPart) { c.innerHTML =
                    '<div class="empty-state"><div class="empty-icon">⚙️</div><div class="empty-text">Tap a part in 3D view to transform it.</div></div>'; return; }
            const modes = ['position', 'rotation', 'scale'];
            const labels = { position: 'Pos', rotation: 'Rot', scale: 'Scl' };
            let html = `<div style="font-size:8px;color:var(--neon-cyan);margin-bottom:4px;">${state.selectedPart.partName.toUpperCase()} — ${labels[state.transformMode]}</div>`;
            html += `<div class="transform-controls">`;
            for (const m of modes) {
                html +=
                    `<button class="tf-btn ${state.transformMode===m?'active':''}" data-tf-mode="${m}">${labels[m]}</button>`;
            }
            html += `</div>`;
            const axes = ['x', 'y', 'z'];
            for (const ax of axes) {
                const val = getTransformValue(state.transformMode, ax);
                const min = state.transformMode === 'scale' ? 0.1 : 0;
                const max = state.transformMode === 'scale' ? 3 : 5;
                const step = state.transformMode === 'rotation' ? 0.1 : 0.01;
                html += `<div class="knob-row" data-axis="${ax}" data-val="${val}" data-min="${min}" data-max="${max}" data-step="${step}"></div>`;
            }
            html +=
                `<div style="margin-top:4px;"><button class="cat-pill active" id="tf-reset">Reset</button></div>`;
            c.innerHTML = html;
            c.querySelectorAll('[data-tf-mode]').forEach(b => {
                b.addEventListener('click', () => { state.transformMode = b.dataset.tfMode;
                    renderPanel() });
            });
            c.querySelectorAll('.knob-row').forEach(row => {
                const axis = row.dataset.axis;
                const val = parseFloat(row.dataset.val);
                const min = parseFloat(row.dataset.min);
                const max = parseFloat(row.dataset.max);
                const step = parseFloat(row.dataset.step);
                const knob = createCircularKnob(row, axis.toUpperCase(), val, min, max, step, (newVal) => {
                    applyTransform(state.transformMode, axis, newVal);
                });
            });
            c.querySelector('#tf-reset')?.addEventListener('click', () => {
                for (const mesh of state.selectedPart.meshes) {
                    mesh.position.set(0, 0, 0);
                    mesh.rotation.set(0, 0, 0);
                    mesh.scale.set(1, 1, 1);
                }
                renderPanel();
                showToast('Reset');
            });
        }

        function exportChar() {
            const ac = getActiveChar();
            if (!ac) return showToast('No character');
            showToast('Exporting...');
            const exporter = new GLTFExporter();
            exporter.parse(ac.gltf.scene, (res) => {
                const blob = res instanceof ArrayBuffer ? new Blob([res], { type: 'application/octet-stream' }) : new Blob(
                    [JSON.stringify(res)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${ac.name}_edited.glb`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Exported!');
            }, (e) => { showToast('Export failed');
                console.error(e); }, { binary: true });
        }

        // Loading
        function loadFiles(files) {
            const valid = Array.from(files).filter(f => /\.(glb|gltf)$/i.test(f.name));
            if (!valid.length) return showToast('Use .glb or .gltf');
            showLoading(true);
            let done = 0;
            for (const f of valid) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    gltfLoader.load(e.target.result, (gltf) => {
                        addCharacter(gltf, f.name);
                        done++;
                        if (done === valid.length) { showLoading(false);
                            updateScene();
                            renderPanel();
                            updateMiniLibrary();
                            showToast(`Loaded ${done} model(s)`) } else { updateScene();
                            renderPanel();
                            updateMiniLibrary() }
                    }, undefined, (err) => { console.error(err);
                        done++;
                        showToast(`Failed: ${f.name}`); if (done === valid.length) { showLoading(false);
                            updateScene();
                            renderPanel();
                            updateMiniLibrary() } });
                };
                reader.readAsDataURL(f);
            }
        }

        function showLoading(s) { document.getElementById('loading-overlay').classList.toggle('hidden', !s); }

        // Toast
        let toastT;
        function showToast(msg) { const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastT);
            toastT = setTimeout(() => t.classList.remove('show'), 1800); }

        // Panel
        function openPanel(tab) { state.activeTab = tab;
            state.panelOpen = true;
            document.getElementById('bottom-panel').classList.add('open');
            document.getElementById('panel-overlay').classList.add('visible');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            renderPanel(); }

        function closePanel() { state.panelOpen = false;
            document.getElementById('bottom-panel').classList.remove('open');
            document.getElementById('panel-overlay').classList.remove('visible'); }

        function renderPanel() {
            const content = document.getElementById('panel-content');
            const title = document.getElementById('panel-title');
            const ac = getActiveChar();
            switch (state.activeTab) {
                case 'chars':
                    title.textContent = 'CHARACTERS';
                    renderCharsPanel(content, ac);
                    break;
                case 'library':
                    title.textContent = 'PART LIBRARY';
                    renderLibraryPanel(content, ac);
                    break;
                case 'transform':
                    title.textContent = 'TRANSFORM';
                    renderTransformPanel(content, ac);
                    break;
                case 'textures':
                    title.textContent = 'TEXTURES';
                    renderTexturesPanel(content, ac);
                    break;
                case 'anims':
                    title.textContent = 'ANIMATIONS';
                    renderAnimsPanel(content, ac);
                    break;
                case 'bones':
                    title.textContent = 'SKELETON';
                    renderBonesPanel(content, ac);
                    break;
            }
        }

        function renderCharsPanel(c, ac) {
            if (!state.characters.length) {
                c.innerHTML =
                    `<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-text">Upload GLB files to begin.</div><div class="upload-zone" id="empty-upload"><div style="font-size:16px;">📁</div><div style="font-size:7px;">UPLOAD MODEL</div></div></div>`;
                c.querySelector('#empty-upload')?.addEventListener('click', () => document.getElementById('file-input')
                    .click());
                return;
            }
            let html = `<div class="char-grid">`;
            html += state.characters.map(ch => `
            <div class="char-card ${ch.id===state.activeCharId?'active':''}" data-id="${ch.id}">
              <div class="char-avatar">${ch.meshCount>0?'👤':'❓'}</div>
              <div class="char-name">${ch.name}</div>
              <button class="delete-btn" data-del="${ch.id}">✕</button>
            </div>`).join('');
            html +=
                `<div class="char-card" id="add-char" style="border-style:dashed;"><div class="char-avatar" style="background:rgba(255,255,255,0.05);">➕</div><div class="char-name">Add</div></div></div>`;
            html +=
                `<div style="margin-top:6px;font-size:7px;color:var(--text-muted);display:flex;gap:4px;align-items:center;"><span>Layout:</span><button class="cat-pill ${state.charLayout==='single'?'active':''}" id="layout-single">Single</button><button class="cat-pill ${state.charLayout==='multi'?'active':''}" id="layout-multi">Side-by-Side</button></div>`;
            c.innerHTML = html;
            c.querySelectorAll('.char-card[data-id]').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.dataset.del) return;
                    state.activeCharId = el.dataset.id;
                    state.selectedPart = null;
                    updateScene();
                    renderPanel();
                    updateMiniLibrary();
                    showToast(getActiveChar()?.name || '');
                });
            });
            c.querySelectorAll('.delete-btn').forEach(b => {
                b.addEventListener('click', (e) => { e.stopPropagation();
                    removeCharacter(b.dataset.del);
                    showToast('Removed') });
            });
            c.querySelector('#add-char')?.addEventListener('click', () => document.getElementById('file-input').click());
            c.querySelector('#layout-single')?.addEventListener('click', () => { state.charLayout = 'single';
                updateScene();
                renderPanel();
                updateMiniLibrary() });
            c.querySelector('#layout-multi')?.addEventListener('click', () => { state.charLayout = 'multi';
                updateScene();
                renderPanel();
                updateMiniLibrary() });
        }

        function renderLibraryPanel(c, ac) {
            if (!ac) { c.innerHTML = '<div class="empty-state"><div class="empty-icon">🗂️</div><div class="empty-text">Load a character first.</div></div>'; return; }
            const allCats = new Set();
            for (const ch of state.characters) for (const cat of Object.keys(ch.parts)) allCats.add(cat);
            const cats = Array.from(allCats).sort();
            if (!cats.length) { c.innerHTML =
                    '<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">No parts found.</div></div>'; return; }
            let html = `<div class="cat-pills">`;
            html +=
                `<button class="cat-pill ${!state.libraryCat?'active':''}" id="lib-all">All</button>`;
            html += cats.map(cat =>
                `<button class="cat-pill ${state.libraryCat===cat?'active':''}" data-libcat="${cat}">${CAT_ICONS[cat]||'📦'} ${cat}</button>`
                ).join('');
            html += `</div>`;
            const filterCat = state.libraryCat || null;
            html += `<div class="part-grid" style="margin-top:4px;">`;
            for (const ch of state.characters) {
                for (const [cat, part] of Object.entries(ch.parts)) {
                    if (filterCat && cat !== filterCat) continue;
                    html += `
                <div class="part-card" data-srcchar="${ch.id}" data-srccat="${cat}" title="Apply to current">
                  <div class="part-icon">${CAT_ICONS[cat]||'📦'}</div>
                  <div class="part-name">${cat}</div>
                  <div class="part-source">${ch.name.substring(0,6)}</div>
                </div>`;
                }
            }
            html += `</div>`;
            c.innerHTML = html;
            c.querySelectorAll('.cat-pill').forEach(p => {
                p.addEventListener('click', () => {
                    state.libraryCat = p.dataset.libcat || null;
                    renderPanel();
                });
            });
            c.querySelectorAll('.part-card[data-srcchar]').forEach(card => {
                card.addEventListener('click', () => {
                    swapPartFromLibrary(card.dataset.srcchar, card.dataset.srccat);
                    closePanel();
                });
            });
        }

        function renderTexturesPanel(c, ac) {
            if (!ac) { c.innerHTML = '<div class="empty-state"><div class="empty-icon">🎨</div><div class="empty-text">Load a character.</div></div>'; return; }
            if (!state.selectedPart) { c.innerHTML =
                    '<div class="empty-state"><div class="empty-icon">🎨</div><div class="empty-text">Select a part in 3D to edit materials.</div></div>'; return; }
            const mats = new Set();
            for (const m of state.selectedPart.meshes) { const ms = Array.isArray(m.material) ? m.material : [m
                    .material]; for (const mat of ms) mats.add(mat); }
            const matArr = Array.from(mats);
            let html =
                `<div style="font-size:8px;color:var(--neon-cyan);margin-bottom:4px;">${state.selectedPart.partName.toUpperCase()} — ${matArr.length} material(s)</div>`;
            matArr.forEach((mat, i) => {
                html +=
                    `<div style="padding:4px;border-radius:6px;border:1px solid rgba(255,0,110,0.15);margin-bottom:3px;background:rgba(255,255,255,0.02);">`;
                html +=
                    `<div style="font-size:7px;color:var(--text-secondary);margin-bottom:2px;">MAT ${i+1}</div>`;
                html += `<div class="slider-row"><label>Color</label><input type="color" class="mat-color" data-i="${i}" value="${mat.color?'#'+mat.color.getHexString():'#ffffff'}"></div>`;
                html +=
                    `<div class="slider-row"><label>Rough</label><input type="range" min="0" max="1" step="0.01" value="${mat.roughness??0.5}" class="mat-rough" data-i="${i}"><span class="val-display">${(mat.roughness??0.5).toFixed(2)}</span></div>`;
                html +=
                    `<div class="slider-row"><label>Metal</label><input type="range" min="0" max="1" step="0.01" value="${mat.metalness??0}" class="mat-metal" data-i="${i}"><span class="val-display">${(mat.metalness??0).toFixed(2)}</span></div>`;
                html +=
                    `<div class="slider-row"><label>Glow</label><input type="range" min="0" max="3" step="0.05" value="${mat.emissiveIntensity??0}" class="mat-emis" data-i="${i}"><span class="val-display">${(mat.emissiveIntensity??0).toFixed(2)}</span></div>`;
                html += `</div>`;
            });
            html +=
                `<div style="display:flex;gap:4px;"><button class="cat-pill active" id="mat-reset">Reset All</button></div>`;
            c.innerHTML = html;
            c.querySelectorAll('.mat-color').forEach(el => {
                el.addEventListener('input', () => { const i = parseInt(el.dataset.i); if (matArr[i]?.color) { matArr[i]
                            .color.set(el.value);
                        matArr[i].needsUpdate = true; } });
            });
            c.querySelectorAll('.mat-rough').forEach(el => {
                el.addEventListener('input', () => { const i = parseInt(el.dataset.i); if (matArr[i]) { matArr[i]
                            .roughness = parseFloat(el.value);
                        matArr[i].needsUpdate = true;
                        el.nextElementSibling.textContent = parseFloat(el.value).toFixed(2); } });
            });
            c.querySelectorAll('.mat-metal').forEach(el => {
                el.addEventListener('input', () => { const i = parseInt(el.dataset.i); if (matArr[i]) { matArr[i]
                            .metalness = parseFloat(el.value);
                        matArr[i].needsUpdate = true;
                        el.nextElementSibling.textContent = parseFloat(el.value).toFixed(2); } });
            });
            c.querySelectorAll('.mat-emis').forEach(el => {
                el.addEventListener('input', () => { const i = parseInt(el.dataset.i); if (matArr[i]) { matArr[i]
                            .emissiveIntensity = parseFloat(el.value);
                        matArr[i].needsUpdate = true;
                        el.nextElementSibling.textContent = parseFloat(el.value).toFixed(2); } });
            });
            c.querySelector('#mat-reset')?.addEventListener('click', () => { for (const m of state.selectedPart.meshes) {
                    const ms = Array.isArray(m.material) ? m.material : [m.material]; for (const mat of ms) { mat
                            .color.set(0xffffff);
                        mat.roughness = 0.5;
                        mat.metalness = 0;
                        mat.emissiveIntensity = 0;
                        mat.needsUpdate = true; } }
                renderPanel();
                showToast('Reset') });
        }

        function renderAnimsPanel(c, ac) {
            if (!ac) { c.innerHTML = '<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-text">Load a character.</div></div>'; return; }
            if (!ac.animations.length) { c.innerHTML =
                    '<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-text">No baked animations detected.</div></div>'; return; }
            let html = '';
            for (const a of ac.animations) {
                const playing = state.animationPlaying && state.animationAction?.getClip?.() === a.clip;
                html +=
                    `<div class="anim-row ${playing?'active':''}" data-anim="${a.name}"><button class="anim-play-btn">${playing?'⏸':'▶'}</button><span class="anim-name">${a.name}</span><span style="font-size:6px;color:var(--text-muted);">${a.duration.toFixed(1)}s</span></div>`;
            }
            if (state.animationPlaying) html +=
                `<div style="margin-top:3px;"><button class="cat-pill active" id="anim-stop">Stop</button></div>`;
            c.innerHTML = html;
            c.querySelectorAll('[data-anim]').forEach(el => {
                el.addEventListener('click', () => {
                    const aName = el.dataset.anim;
                    const a = ac.animations.find(x => x.name === aName);
                    if (a && state.animationMixer) {
                        if (state.animationAction && state.animationPlaying) { state.animationAction.stop();
                            state.animationPlaying = false;
                            state.animationAction = null; } else { state.animationAction = state.animationMixer
                                .clipAction(a.clip);
                            state.animationAction.reset();
                            state.animationAction.play();
                            state.animationPlaying = true; }
                        renderPanel();
                    }
                });
            });
            c.querySelector('#anim-stop')?.addEventListener('click', () => { if (state.animationAction) { state
                        .animationAction.stop();
                    state.animationPlaying = false;
                    state.animationAction = null; }
                renderPanel() });
        }

        function renderBonesPanel(c, ac) {
            if (!ac) { c.innerHTML = '<div class="empty-state"><div class="empty-icon">🦴</div><div class="empty-text">Load a character.</div></div>'; return; }
            if (!ac.bones.length) { c.innerHTML =
                    '<div class="empty-state"><div class="empty-icon">🦴</div><div class="empty-text">No bones found.</div></div>'; return; }
            const map = new Map();
            for (const b of ac.bones) map.set(b.name, { ...b, children: [] });
            const roots = [];
            for (const b of ac.bones) { if (b.parent && map.has(b.parent)) map.get(b.parent).children.push(map.get(b
                    .name));
                else roots.push(map.get(b.name)); }

            function buildHtml(b, depth = 0) {
                let h = `<li style="padding-left:${depth*3}px;">🦴 ${b.name}</li>`;
                if (b.children.length) { h += '<ul>'; for (const ch of b.children) h += buildHtml(ch, depth + 1);
                    h += '</ul>'; }
                return h;
            }
            let tree = '<ul class="bone-tree">';
            for (const r of roots) tree += buildHtml(r);
            tree += '</ul>';
            c.innerHTML =
                `<div style="font-size:8px;color:var(--neon-cyan);margin-bottom:3px;">${ac.bones.length} BONES</div>${tree}`;
        }

        // Mini Library
        function updateMiniLibrary() {
            const ml = document.getElementById('mini-library');
            const ac = getActiveChar();
            if (!ac) { ml.innerHTML = ''; return; }
            // Show parts of active character + quick access to other characters' parts
            let html = '';
            for (const [cat, part] of Object.entries(ac.parts)) {
                const activeClass = state.selectedPart?.category === cat ? 'active' : '';
                html +=
                    `<div class="mini-item ${activeClass}" data-mini-cat="${cat}" title="${cat}">${CAT_ICONS[cat]||'📦'}<span class="mini-label">${cat}</span></div>`;
            }
            // Add other characters parts quick swap (show first 4)
            const otherChars = state.characters.filter(ch => ch.id !== ac.id);
            for (const ch of otherChars) {
                const firstCat = Object.keys(ch.parts)[0];
                if (firstCat) {
                    html +=
                        `<div class="mini-item" data-swap-char="${ch.id}" data-swap-cat="${firstCat}" title="Swap ${firstCat} from ${ch.name}">👤<span class="mini-label">${ch.name.substring(0,4)}</span></div>`;
                }
            }
            ml.innerHTML = html;
            ml.querySelectorAll('.mini-item[data-mini-cat]').forEach(el => {
                el.addEventListener('click', () => {
                    const cat = el.dataset.miniCat;
                    // select that part
                    if (ac.parts[cat]) {
                        state.selectedPart = { charId: ac.id, partId: ac.parts[cat].id, partName: cat, meshes: ac
                                .parts[cat].meshes,
                            category: cat };
                        showToast(`Selected: ${cat}`);
                        updateMiniLibrary();
                        if (state.panelOpen && state.activeTab === 'transform') renderPanel();
                    }
                });
            });
            ml.querySelectorAll('.mini-item[data-swap-char]').forEach(el => {
                el.addEventListener('click', () => {
                    const srcChar = el.dataset.swapChar;
                    const srcCat = el.dataset.swapCat;
                    swapPartFromLibrary(srcChar, srcCat);
                });
            });
        }

        // Events
        document.getElementById('btn-upload').addEventListener('click', () => document.getElementById('file-input')
            .click());
        document.getElementById('file-input').addEventListener('change', (e) => { if (e.target.files.length) loadFiles(e
                .target.files);
            e.target.value = '' });
        document.getElementById('btn-export').addEventListener('click', exportChar);
        document.getElementById('btn-layout').addEventListener('click', () => { state.charLayout = state.charLayout ===
                'single' ? 'multi' : 'single';
            updateScene();
            renderPanel();
            updateMiniLibrary();
            showToast(`Layout: ${state.charLayout}`) });
        document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => { const t = b.dataset.tab; if (
                state.panelOpen && state.activeTab === t) closePanel();
            else openPanel(t) }));
        document.getElementById('panel-close').addEventListener('click', closePanel);
        document.getElementById('panel-overlay').addEventListener('click', closePanel);

        // 3D pointer events
        renderer.domElement.addEventListener('pointerdown', (e) => { pointerDown = true;
            pointerMoved = false;
            swipeStart = { x: e.clientX, y: e.clientY };
            swipeActive = true; });
        renderer.domElement.addEventListener('pointermove', (e) => { if (pointerDown) { const dx = e.clientX - swipeStart
                    .x,
                    dy = e.clientY - swipeStart.y; if (Math.abs(dx) > 8 || Math.abs(dy) > 8) pointerMoved = true; } });
        renderer.domElement.addEventListener('pointerup', (e) => {
            if (pointerDown && !pointerMoved) {
                const rect = renderer.domElement.getBoundingClientRect();
                pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                const ac = getActiveChar();
                if (ac?.gltf) {
                    const meshes = [];
                    ac.gltf.scene.traverse(n => { if (n.isMesh || n.isSkinnedMesh) meshes.push(n) });
                    const hits = raycaster.intersectObjects(meshes, true);
                    if (hits.length) selectPartByMesh(hits[0].object);
                }
            }
            if (swipeActive) {
                const dx = e.clientX - swipeStart.x,
                    dy = e.clientY - swipeStart.y;
                if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    const chars = state.characters;
                    if (chars.length > 1) {
                        const idx = chars.findIndex(c => c.id === state.activeCharId);
                        if (dx < 0 && idx < chars.length - 1) { state.activeCharId = chars[idx + 1].id;
                            updateScene();
                            renderPanel();
                            updateMiniLibrary();
                            showToast(chars[idx + 1].name) } else if (dx > 0 && idx > 0) { state.activeCharId = chars[
                                idx - 1].id;
                            updateScene();
                            renderPanel();
                            updateMiniLibrary();
                            showToast(chars[idx - 1].name) }
                    }
                } else if (Math.abs(dy) > 50 && dy < 0 && !state.panelOpen) { openPanel(state.activeTab || 'chars') }
            }
            pointerDown = false;
            swipeActive = false;
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'o') document.getElementById('file-input').click();
            if (e.key === 'e') exportChar();
            if (e.key === 'Escape') closePanel();
        });
        window.addEventListener('resize', () => { camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight) });
        document.addEventListener('dragover', e => e.preventDefault());
        document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) loadFiles(e
                .dataTransfer.files) });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (state.animationMixer) state.animationMixer.update(0.016);
            particles.rotation.y += 0.0004;
            glowLight.intensity = 1.2 + Math.sin(Date.now() * 0.002) * 0.4;
            renderer.render(scene, camera);
        }

        // Init
        updateScene();
        renderPanel();
        updateMiniLibrary();
        setTimeout(() => showLoading(false), 600);
        animate();
        showToast('CYBERDOLL v3 — Transparent HUD, Circular Knobs');
        console.log('CYBERDOLL SCHRANK v3 ready');
    </script>
</body>
</html>
