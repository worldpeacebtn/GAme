    <script type="module">
        import * as THREE from 'three';

        // ==================== THREE.JS SETUP ====================

        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 6, 25);

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // --- Lighting (robust) ---
        const ambient = new THREE.AmbientLight(0x404060, 1.5);
        scene.add(ambient);
        const hemi = new THREE.HemisphereLight(0xffffff, 0x444466, 1.0);

        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);
        const rim = new THREE.DirectionalLight(0x00e5ff, 2.0);
        rim.position.set(-2, 1, -2);
        scene.add(rim);

        fill.position.set(0, 0.5, 2);

        const characterGroup = new THREE.Group();

        const controls = new OrbitControls(camera, renderer.domElement);

        controls.update();

        const raycaster = new THREE.Raycaster();

        let pointerDown = false, pointerMoved = false, swipeStart = { x: 0, y: 0 }, swipeActive = false;

        // ==================== LOADERS ====================
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        // ==================== CATEGORIZATION ====================
        const CAT_ICONS = {
            body: '🧍', head: '👤', hair: '💇', eyes: '👁️', mouth: '👄', ears: '👂', nose: '👃',
            arms: '💪', hands: '✋', legs: '🦵', feet: '🦶', top: '👕', bottom: '👖', dress: '👗',
            shoes: '👟', socks: '🧦', underwear: '🩲', gloves: '🧤', hats: '🎩', accessories: '💍', other: '📦'
        };
        const CAT_KEYWORDS = {
            body: ['body','skin','torso','chest','waist','hip','pelvis','belly','core','abdomen','trunk'],
            head: ['head','face','skull','neck','jaw','chin','forehead','cheek','cranium','temple'],
            hair: ['hair','fringe','bangs','ponytail','braid','strand','curl','lock','mane','quiff','sideburn','weave','toupee','wig','bob','bun'],
            eyes: ['eye','brow','lash','pupil','iris','cornea','sclera','eyeball','eyelid','eyelash','orbit'],
            mouth: ['mouth','lip','teeth','tooth','tongue','gum','oral','dental','incisor','molar','canine'],
            ears: ['ear','lobe','auricle','eardrum','cochlea'],
            nose: ['nose','nostril','bridge','septum','nasal'],
            arms: ['arm','elbow','wrist','shoulder','forearm','upperarm','bicep','tricep','clavicle','scapula','humerus','radius','ulna'],
            hands: ['hand','palm','finger','thumb','knuckle','fingertip','phalanx','metacarpal'],
            legs: ['leg','ankle','knee','thigh','calf','shin','femur','tibia','fibula','patella','quad','hamstring'],
            feet: ['foot','feet','toe','heel','sole','ankle','metatarsal','tarsal'],
            top: ['top','shirt','jacket','coat','blouse','sweater','vest','hoodie','cardigan','tee','tank','crop','jersey','pullover','knitwear','blazer','anorak'],
            bottom: ['bottom','pants','skirt','shorts','jeans','trousers','slacks','culottes','capri','legging','chino','denim','sweatpant'],
            dress: ['dress','gown','robe','frock','sundress','kimono','sarong','tunic','kaftan'],
            shoes: ['shoe','boot','sneaker','heel','sandal','loafer','pump','flat','slipper','flipflop','trainer','mule','clog','espadrille'],
            socks: ['sock','stocking','legging','tight','hosiery','nylon','kneesock','anklet','tights'],
            underwear: ['underwear','bra','panty','brief','boxer','thong','lingerie','slip','undershirt','underpant','camisole','jockstrap'],
            gloves: ['glove','mitten','gauntlet','fingerless','mitt'],
            hats: ['hat','cap','beanie','hood','beret','fedora','helmet','crown','tiara','visor','beanie','headband','bonnet','toque'],
            accessories: ['accessory','jewelry','necklace','earring','ring','bracelet','scarf','collar','tie','bow','belt','watch','glasses','choker','chain','pin','brooch','pendant','amulet','medallion','anklet','cufflink','bangle']
        };

        function categorize(name, pos) {
            const n = (name || '').toLowerCase();
            for (const [cat, kws] of Object.entries(CAT_KEYWORDS)) {
                for (const kw of kws) { if (n.includes(kw)) return cat; }
            }
            if (pos) {
                const y = pos.y;
                if (y > 1.7) return 'hats';
                if (y > 1.5) return 'hair';
                if (y > 1.3) return 'head';
                if (y > 1.15) return 'eyes';
                if (y > 0.9) return 'top';
                if (y > 0.55) return 'bottom';
                if (y > 0.3) return 'legs';
                if (y > 0.05) return 'feet';
                if (y > -0.2) return 'shoes';
            }
            return 'other';
        }

        function fixTextureColorSpace(root) {
            root.traverse(node => {
                if (node.isMesh || node.isSkinnedMesh) {
                    const mats = Array.isArray(node.material) ? node.material : [node.material];
                    mats.forEach(mat => {
                        if (mat.map) {
                            mat.map.colorSpace = THREE.SRGBColorSpace;
                            mat.color.set(0xffffff);
                            mat.needsUpdate = true;
                        }
                    });
                }
            });
        }

        // ==================== CHARACTER MANAGEMENT ====================
        function genId() { return 'c_' + Date.now() + '_' + Math.random().toString(36).substr(2,5); }

        function parseChar(gltf, fileName, id) {
            fixTextureColorSpace(gltf.scene);
            const parts = {}, bones = [], animations = [], allMeshes = [];
            gltf.scene.traverse(n => { if (n.isMesh || n.isSkinnedMesh) allMeshes.push(n); });
            const groups = new Map();
            for (const mesh of allMeshes) {
                let parentName = mesh.parent ? mesh.parent.name : '';
                const combined = `${mesh.name||''} ${parentName||''}`.toLowerCase();
                const wPos = new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
                let cat = categorize(combined, wPos);
                if (mesh.parent && mesh.parent.name && mesh.parent.name.length > 0) {
                    const pc = categorize(mesh.parent.name, null);
                    if (pc !== 'other') cat = pc;
                }
                if (!groups.has(cat)) groups.set(cat, { id:`${id}_${cat}`, name:cat, category:cat, meshes:[], sourceCharId:id, sourceCharName:fileName });
                const g = groups.get(cat);
                g.meshes.push(mesh);
                if (mesh.material) {
                    const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
                    for (const m of mats) { if (!g.materials) g.materials=[]; g.materials.push(m); }
                }
            }
            for (const [cat, g] of groups) {
                if (g.meshes.length) {
                    g.materials = Array.from(new Set(g.materials || []));
                    parts[cat] = g;
                }
            }
            const boneSet = new Set();
            gltf.scene.traverse(n => { if (n.isBone || n.type === 'Bone') boneSet.add(n); });
            for (const b of boneSet) bones.push({ name:b.name, parent: b.parent && b.parent.isBone ? b.parent.name : null });
            bones.sort((a,b) => (a.parent?1:0) - (b.parent?1:0));
            if (gltf.animations) for (const clip of gltf.animations) animations.push({ name: clip.name || 'anim_'+animations.length, duration: clip.duration || 0, clip });
            return { id, name: fileName.replace(/\.(glb|gltf)$/i,''), fileName, gltf, parts, bones, animations, meshCount: allMeshes.length, offset: new THREE.Vector3(0,0,0) };
        }

        function addCharacter(gltf, fileName) {
            const id = genId();
            const cd = parseChar(gltf, fileName, id);
            state.characters.push(cd);
            state.charOffsets[id] = {x:0,y:0,z:0};
            state.activeCharId = id;
            return cd;
        }

        function removeCharacter(id) {
            const idx = state.characters.findIndex(c => c.id === id);
            if (idx === -1) return;
            const c = state.characters[idx];
            if (c.gltf?.scene) characterGroup.remove(c.gltf.scene);
            state.characters.splice(idx,1);
            delete state.charOffsets[id];
            if (state.activeCharId === id) state.activeCharId = state.characters.length ? state.characters[0].id : null;
            if (state.selectedPart?.charId === id) state.selectedPart = null;
            updateScene();
            updateMiniLibrary();
        }

        function getActiveChar() { return state.characters.find(c => c.id === state.activeCharId) || null; }

        // ==================== DEFAULT HUMAN BASE ====================
        function createDefaultHuman() {

            const handR = new THREE.Mesh(handGeo, skinMat); handR.name='hand_right'; handR.position.set(0.55,0.65,0); group.add(handR);

            const legGeo = new THREE.CylinderGeometry(0.15,0.15,0.8,8); legGeo.translate(0,0.4,0);
            const legL = new THREE.Mesh(legGeo, skinMat); legL.name='leg_left'; legL.position.set(-0.2,0.8,0); group.add(legL);

        }

        function addDefaultCharacter() {
            const gltf = { scene: createDefaultHuman(), animations: [] };
            const id = genId();
            const cd = parseChar(gltf, 'base_human.glb', id);
            cd.name = 'Standard Human'; cd.fileName = 'base_human.glb';
            state.characters.push(cd);
            state.charOffsets[id] = {x:0,y:0,z:0};
            state.activeCharId = id;
            return cd;
        }

        // ==================== SCENE UPDATE ====================
        function updateScene() {
            while (characterGroup.children.length) characterGroup.remove(characterGroup.children[0]);
            if (state.animationMixer) { state.animationMixer.stopAllAction(); state.animationMixer=null; state.animationAction=null; state.animationPlaying=false; }
            const active = getActiveChar();
            if (active?.gltf?.scene) {
                characterGroup.add(active.gltf.scene);
                const off = state.charOffsets[active.id] || {x:0,y:0,z:0};
                active.gltf.scene.position.set(off.x,off.y,off.z);
                active.gltf.scene.rotation.set(0,0,0); active.gltf.scene.scale.set(1,1,1);
                if (active.animations.length) state.animationMixer = new THREE.AnimationMixer(active.gltf.scene);
            }
            if (state.charLayout === 'multi') {
                let idx = 0;
                for (const c of state.characters) {
                    if (c.id === active?.id) continue;
                    if (c.gltf?.scene) {
                        characterGroup.add(c.gltf.scene);
                        const off = state.charOffsets[c.id] || {x:0,y:0,z:0};
                        c.gltf.scene.position.set(off.x + (idx+1)*1.8, off.y, off.z);
                        c.gltf.scene.scale.set(1,1,1);
                        idx++;
                    }
                }
            }
            state.selectedPart = null;
            updateMiniLibrary();
            updateTransformPanelVisibility();
        }

        function selectPartByMesh(mesh) {
            const ac = getActiveChar(); if (!ac) return;
            for (const [cat, part] of Object.entries(ac.parts)) {
                if (part.meshes.includes(mesh)) {
                    state.selectedPart = { charId:ac.id, partId:part.id, partName:cat, meshes:part.meshes, category:cat };
                    showToast(`Selected: ${cat.toUpperCase()}`);
                    updateMiniLibrary();
                    updateTransformPanelVisibility();
                    return;
                }
            }
        }

        // ==================== PART SWAP / LIBRARY ====================
        function swapPartFromLibrary(srcCharId, srcCat) {
            const ac = getActiveChar(); if (!ac || !ac.parts[srcCat]) return;
            const sc = state.characters.find(c => c.id === srcCharId); if (!sc || !sc.parts[srcCat]) return;
            for (const m of ac.parts[srcCat].meshes) { if (m.parent) m.parent.remove(m); }
            const newMeshes = [];
            for (const m of sc.parts[srcCat].meshes) {
                const clone = m.clone(true);
                ac.gltf.scene.add(clone);
                clone.position.copy(m.position); clone.rotation.copy(m.rotation); clone.scale.copy(m.scale);
                newMeshes.push(clone);
            }
            ac.parts[srcCat] = { ...ac.parts[srcCat], meshes:newMeshes, sourceCharId:srcCharId, sourceCharName:sc.name };
            showToast(`Swapped ${srcCat} from ${sc.name}`);
            updateScene();
            updateMiniLibrary();
        }

        // ==================== XIII RANDOM DOLL GENERATOR ====================
        function randomDollGenerator() {
            // Collect parts by category from all characters
            const partPool = {};
            for (const ch of state.characters) {
                for (const [cat, part] of Object.entries(ch.parts)) {
                    if (!partPool[cat]) partPool[cat] = [];
                    partPool[cat].push({ charId:ch.id, part });
                }
            }
            // Categories we want for a doll
            const desired = ['body', 'head', 'hair', 'top', 'bottom', 'shoes', 'accessories'];
            const newGroup = new THREE.Group();
            newGroup.name = 'random_doll_xiii';
            const newId = genId();
            const newChar = { id:newId, name:`XIII_${Math.floor(Math.random()*1000)}`, fileName:'xiii_random.glb', gltf:{scene:newGroup, animations:[]}, parts:{}, bones:[], animations:[], meshCount:0 };
            state.characters.push(newChar);
            state.charOffsets[newId] = {x:0,y:0,z:0};
            state.activeCharId = newId;

            for (const cat of desired) {
                if (partPool[cat] && partPool[cat].length) {
                    const pick = partPool[cat][Math.floor(Math.random()*partPool[cat].length)];
                    const srcPart = pick.part;
                    // Clone meshes and add to group
                    for (const mesh of srcPart.meshes) {
                        const clone = mesh.clone(true);
                        newGroup.add(clone);
                        clone.position.copy(mesh.position); clone.rotation.copy(mesh.rotation); clone.scale.copy(mesh.scale);
                        if (!newChar.parts[cat]) newChar.parts[cat] = { id:`${newId}_${cat}`, name:cat, category:cat, meshes:[], sourceCharId:pick.charId, sourceCharName:pick.part.sourceCharName };
                        newChar.parts[cat].meshes.push(clone);
                    }
                    if (newChar.parts[cat]) newChar.meshCount += newChar.parts[cat].meshes.length;
                }
            }
            updateScene();
            updateMiniLibrary();
            showToast('XIII generated a new doll!');
        }

        // ==================== TRANSFORM CONTROLS ====================
        function applyTransform(axis, value) {
            if (!state.selectedPart) return;
            for (const mesh of state.selectedPart.meshes) {
                mesh.position[axis] = parseFloat(value);
            }
        }
        function getTransformValue(axis) {
            if (!state.selectedPart || !state.selectedPart.meshes.length) return 0;
            const m = state.selectedPart.meshes[0];
            return m.position[axis]?.toFixed(2) || 0;
        }
        function resetTransform() {
            if (!state.selectedPart) return;
            for (const mesh of state.selectedPart.meshes) { mesh.position.set(0,0,0); }
            updateTransformPanelVisibility();
            showToast('Transform reset');
        }
        function updateTransformPanelVisibility() {
            const panel = document.getElementById('transform-panel');
            if (state.selectedPart) {
                panel.classList.add('visible');
                document.getElementById('val-x').textContent = getTransformValue('x');
                document.getElementById('val-y').textContent = getTransformValue('y');
                document.getElementById('val-z').textContent = getTransformValue('z');
            } else {
                panel.classList.remove('visible');
            }
        }

        // ==================== UI: MINI LIBRARY ====================
        function updateMiniLibrary() {
            const ml = document.getElementById('mini-library');
            const ac = getActiveChar();
            if (!ac) { ml.innerHTML = ''; return; }
            // Show parts of active character + quick swap from others
            let html = '';
            // Parts of active char
            for (const [cat, part] of Object.entries(ac.parts)) {
                const activeClass = state.selectedPart?.category === cat ? 'active' : '';
                html += `<div class="mini-item ${activeClass}" data-mini-cat="${cat}" title="${cat}">${CAT_ICONS[cat]||'📦'}<span class="lbl">${cat}</span></div>`;
            }
            // Other characters' parts (first category of each)
            const otherChars = state.characters.filter(ch => ch.id !== ac.id);
            for (const ch of otherChars) {
                const firstCat = Object.keys(ch.parts)[0];
                if (firstCat) html += `<div class="mini-item" data-swap-char="${ch.id}" data-swap-cat="${firstCat}" title="Swap ${firstCat} from ${ch.name}">👤<span class="lbl">${ch.name.substring(0,4)}</span></div>`;
            }
            ml.innerHTML = html;
            // Event listeners
            ml.querySelectorAll('.mini-item[data-mini-cat]').forEach(el => {
                el.addEventListener('click', () => {
                    const cat = el.dataset.miniCat;
                    if (ac.parts[cat]) {
                        state.selectedPart = { charId:ac.id, partId:ac.parts[cat].id, partName:cat, meshes:ac.parts[cat].meshes, category:cat };
                        showToast(`Selected: ${cat}`);
                        updateMiniLibrary();
                        updateTransformPanelVisibility();
                    }
                });
            });
            ml.querySelectorAll('.mini-item[data-swap-char]').forEach(el => {
                el.addEventListener('click', () => swapPartFromLibrary(el.dataset.swapChar, el.dataset.swapCat));
            });
        }

        // ==================== UI: CATEGORY BUTTONS ====================
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const cat = btn.dataset.cat;
                state.activeCategory = cat;
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // If 'chars' category, show current characters in mini library (already done)
                // Otherwise we could filter parts but for simplicity just update mini library
                if (cat === 'chars') {
                    // Show character cards in mini library? We'll just use existing mini library.
                } else {
                    // Could filter parts by category in mini library, but we'll just let user click parts from current char or swap.
                    showToast(`Category: ${cat}`);
                }
                updateMiniLibrary();
            });
        });

        // ==================== FILE UPLOAD / LOADING ====================
        function loadFiles(files) {
            const valid = Array.from(files).filter(f => /\.(glb|gltf)$/i.test(f.name));
            if (!valid.length) return showToast('Use .glb or .gltf');
            showLoading(true);
            let done = 0;
            for (const f of valid) {
                const reader = new FileReader();
                reader.onload = e => {
                    gltfLoader.load(e.target.result, gltf => {
                        addCharacter(gltf, f.name);
                        done++;
                        if (done === valid.length) { showLoading(false); updateScene(); updateMiniLibrary(); showToast(`Loaded ${done} model(s)`); }
                        else { updateScene(); updateMiniLibrary(); }
                    }, undefined, err => { console.error(err); done++; showToast(`Failed: ${f.name}`); if (done===valid.length) { showLoading(false); updateScene(); updateMiniLibrary(); } });
                };
                reader.readAsDataURL(f);
            }
        }
        function showLoading(s) {
            const overlay = document.getElementById('loading-overlay');
            if (s) { overlay.classList.remove('hidden'); } else { overlay.classList.add('hidden'); }
        }
        // Toast
        let toastT;
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 1800); }

        // ==================== EXPORT ====================
        function exportChar() {
            const ac = getActiveChar(); if (!ac) return showToast('No character');
            showToast('Exporting...');
            const exporter = new GLTFExporter();
            exporter.parse(ac.gltf.scene, res => {
                const blob = res instanceof ArrayBuffer ? new Blob([res], {type:'application/octet-stream'}) : new Blob([JSON.stringify(res)], {type:'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href=url; a.download=`${ac.name}_edited.glb`; a.click(); URL.revokeObjectURL(url);
                showToast('Exported!');
            }, e => { console.error(e); showToast('Export failed'); }, {binary:true});
        }

        // ==================== EVENT LISTENERS ====================
        document.getElementById('btn-upload').addEventListener('click', ()=>document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', e=>{ if(e.target.files.length) loadFiles(e.target.files); e.target.value=''; });
        document.getElementById('btn-export').addEventListener('click', exportChar);
        document.getElementById('btn-layout').addEventListener('click', ()=>{ state.charLayout = state.charLayout==='single'?'multi':'single'; updateScene(); updateMiniLibrary(); showToast(`Layout: ${state.charLayout}`); });
        document.getElementById('xiii-btn').addEventListener('click', randomDollGenerator);
        document.getElementById('tf-reset').addEventListener('click', resetTransform);

        // 3D viewport interactions
        renderer.domElement.addEventListener('pointerdown', e=>{ pointerDown=true; pointerMoved=false; swipeStart={x:e.clientX,y:e.clientY}; swipeActive=true; });
        renderer.domElement.addEventListener('pointermove', e=>{ if(pointerDown){ const dx=e.clientX-swipeStart.x, dy=e.clientY-swipeStart.y; if(Math.abs(dx)>8||Math.abs(dy)>8) pointerMoved=true; } });
        renderer.domElement.addEventListener('pointerup', e=>{
            if(pointerDown && !pointerMoved){
                const rect = renderer.domElement.getBoundingClientRect();
                pointer.x = ((e.clientX-rect.left)/rect.width)*2-1;
                pointer.y = -((e.clientY-rect.top)/rect.height)*2+1;
                raycaster.setFromCamera(pointer, camera);
                const ac = getActiveChar();
                if(ac?.gltf){
                    const meshes=[]; ac.gltf.scene.traverse(n=>{ if(n.isMesh||n.isSkinnedMesh) meshes.push(n); });
                    const hits = raycaster.intersectObjects(meshes, true);
                    if(hits.length) selectPartByMesh(hits[0].object);
                }
            }
            if(swipeActive){
                const dx=e.clientX-swipeStart.x, dy=e.clientY-swipeStart.y;
                if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
                    const chars=state.characters;
                    if(chars.length>1){
                        const idx=chars.findIndex(c=>c.id===state.activeCharId);
                        if(dx<0 && idx<chars.length-1){ state.activeCharId=chars[idx+1].id; updateScene(); updateMiniLibrary(); showToast(chars[idx+1].name); }
                        else if(dx>0 && idx>0){ state.activeCharId=chars[idx-1].id; updateScene(); updateMiniLibrary(); showToast(chars[idx-1].name); }
                    }
                }
            }
            pointerDown=false; swipeActive=false;
        });
        document.addEventListener('keydown', e=>{ if(e.key==='o') document.getElementById('file-input').click(); if(e.key==='e') exportChar(); });
        window.addEventListener('resize', ()=>{ camera.aspect=container.clientWidth/container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });
        document.addEventListener('dragover', e=>e.preventDefault());
        document.addEventListener('drop', e=>{ e.preventDefault(); if(e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

        // Transform knobs
        document.querySelectorAll('.circular-knob').forEach(knob => {
            let dragging = false, startY = 0, currentVal = 0;
            const axis = knob.dataset.axis;
            const valDisplay = document.getElementById(`val-${axis}`);
            function updateDot() {
                const val = parseFloat(valDisplay.textContent) || 0;
                const ratio = Math.min(1, Math.max(0, (val+2.5)/5)); // -2.5 to 2.5 range
                const angle = ratio*270-135;
                knob.querySelector('.knob-dot').style.transform = `translate(-50%,0) rotate(${angle}deg)`;
            }
            knob.addEventListener('pointerdown', e => { dragging=true; startY=e.clientY; knob.setPointerCapture(e.pointerId); e.preventDefault(); });
            knob.addEventListener('pointermove', e => {
                if(dragging){
                    const dy = startY - e.clientY;
                    const sensitivity = 0.02;
                    let newVal = parseFloat(valDisplay.textContent) + dy*sensitivity;
                    newVal = Math.max(-5, Math.min(5, newVal));
                    valDisplay.textContent = newVal.toFixed(2);
                    applyTransform(axis, newVal);
                    startY = e.clientY;
                    updateDot();
                }
            });
            knob.addEventListener('pointerup', ()=>{ dragging=false; });
            updateDot();
        });

        // ==================== ANIMATION LOOP ====================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if(state.animationMixer) state.animationMixer.update(0.016);
            renderer.render(scene, camera);
        }

        // ==================== INIT ====================
        if(state.characters.length===0) { addDefaultCharacter(); }
        updateScene();
        updateMiniLibrary();
        updateTransformPanelVisibility();
        setTimeout(()=>showLoading(false), 400);
        animate();
        showToast('CYBERDOLL // FRANKENSTEIN LAB READY');
        console.log('Initialized. If canvas black, ensure WebGL enabled or try reloading.');
    </script>
</body>
</html>
