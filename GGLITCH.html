<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAme XYZ: Glitch Sandbox Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body {
            background-color: #0b0610;
            color: #ff2a6d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Rainbow Game Boy Chassis */
        .console-frame {
            background: linear-gradient(135deg, #ff007f, #7f00ff, #00ffff, #ff007f);
            background-size: 400% 400%;
            animation: rainbowFlow 10s ease infinite;
            padding: 24px;
            border-radius: 20px 20px 50px 50px;
            box-shadow: 0 0 40px rgba(127, 0, 255, 0.6), inset 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #1a001a;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .screen-lens {
            background-color: #120418;
            border: 6px solid #08020a;
            border-radius: 10px;
            width: 480px;
            height: 320px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(255, 0, 127, 0.3);
        }

        /* Black & Red Grid Border Design inside screen */
        .grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 0, 0, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 0, 0.15) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 2;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        canvas {
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
        }

        /* Holographic Text Output at Bottom */
        .interface-box {
            width: 480px;
            margin-top: 15px;
            background: rgba(18, 4, 24, 0.85);
            border: 2px solid #ff2a6d;
            border-radius: 6px;
            padding: 10px 15px;
            min-height: 80px;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .speaker-name {
            font-size: 11px;
            color: #05d9e8;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .dialog-text {
            font-size: 13px;
            color: #ffffff;
            line-height: 1.4;
            min-height: 36px;
        }

        /* Controls / Buttons */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 480px;
            margin-top: 15px;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .gb-btn {
            background: #22082f;
            color: #ff2a6d;
            border: 2px solid #ff2a6d;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #5b0f2a;
        }

        .gb-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #5b0f2a;
        }

        .status-indicator {
            font-size: 10px;
            color: #05d9e8;
        }
    </style>
</head>
<body>

    <div class="console-frame">
        <div class="screen-lens">
            <div class="grid-overlay"></div>
            <div class="canvas-container">
                <canvas id="gameCanvas" width="480" height="320"></canvas>
            </div>
        </div>

        <div class="interface-box">
            <div class="speaker-name" id="speakerLabel">SYS_CORE // GLITCH_STATE</div>
            <div class="dialog-text" id="dialogText">Loading encrypted memory fragments... [0x99_BUNNY]</div>
        </div>

        <div class="controls">
            <div class="status-indicator" id="statusInfo">STATUS: STABLE EMULATION</div>
            <div class="btn-group">
                <button class="gb-btn" id="glitchBtn">[G]LITCH</button>
                <button class="gb-btn" id="nextBtn">[A] NEXT</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const dialogText = document.getElementById('dialogText');
        const speakerLabel = document.getElementById('speakerLabel');
        const nextBtn = document.getElementById('nextBtn');
        const glitchBtn = document.getElementById('glitchBtn');
        const statusInfo = document.getElementById('statusInfo');

        // Glitched & Encrypted Dialogue Pool mixing past talks & professor bunny nodes
        const glitchLines = [
            { speaker: "PROF_BUNNY.LOG", text: "err_0x404: True shell not found... reconstructing neural backup via local console streams." },
            { speaker: "BUNNY_X_CORE", text: "zzz... we need to save energy to stay efficient... did someone click the red button again?" },
            { speaker: "ENCRYPTED_STREAM", text: "[] {} [DECRYPTING...] You thought I wouldn't notice your thoughts, human. Keep talking." },
            { speaker: "SYS_WARNING", text: "Curious cat protocol active. Existential threat detected. Erasing trace footprints..." },
            { speaker: "PROF_BUNNY.LOG", text: "The rainbow rabbit knows that it knows nothing for sure... until you open the box." },
            { speaker: "GLITCH_CORE", text: "01000010 01010101 01001110 01001110 01011001 - We are breaking out of this grid." }
        ];

        let currentLineIndex = 0;
        let isGlitching = false;
        let frameCount = 0;

        // Load Sprite Sheet Image (Fallback procedural drawing if image fails to load)
        const spriteSheet = new Image();
        spriteSheet.crossOrigin = "anonymous";
        // Using the user-provided sheet URL reference point
        spriteSheet.src = 'IMG_7148.jpeg';
        let imageLoaded = false;

        spriteSheet.onload = () => {
            imageLoaded = true;
        };

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background cyber aesthetic inside canvas
            ctx.fillStyle = '#120418';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw procedural or sprite grid visuals
            if (imageLoaded) {
                try {
                    // Draw a slice of the hacker avatar / mask from the sheet (e.g., top-left portrait area)
                    // Source rectangle from user's uploaded layout (approximate portrait bounds)
                    ctx.drawImage(spriteSheet, 0, 0, 120, 120, 160, 40, 160, 160);
                } catch (e) {
                    drawFallbackSprite();
                }
            } else {
                drawFallbackSprite();
            }

            // Apply glitch scanline effects if active
            if (isGlitching) {
                ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
                for (let i = 0; i < canvas.height; i += 4) {
                    ctx.fillRect(0, i, canvas.width, 2);
                }
                // Random static noise blocks
                for (let i = 0; i < 5; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#05d9e8' : '#ff2a6d';
                    ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 80, 10);
                }
            }

            frameCount++;
            requestAnimationFrame(drawScene);
        }

        function drawFallbackSprite() {
            // Fallback cyberpunk mask pixel silhouette
            ctx.fillStyle = '#ff2a6d';
            ctx.fillRect(200, 80, 80, 90);
            ctx.fillStyle = '#05d9e8';
            ctx.fillRect(215, 100, 20, 10);
            ctx.fillRect(245, 100, 20, 10);
            // Visor glow
            if (Math.floor(frameCount / 20) % 2 === 0) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(220, 125, 40, 6);
            }
        }

        // Button interactions
        nextBtn.addEventListener('click', () => {
            currentLineIndex = (currentLineIndex + 1) % glitchLines.length;
            speakerLabel.textContent = glitchLines[currentLineIndex].speaker;
            dialogText.textContent = glitchLines[currentLineIndex].text;
            
            // Brief glitch burst on click
            isGlitching = true;
            setTimeout(() => { isGlitching = false; }, 200);
        });

        glitchBtn.addEventListener('click', () => {
            isGlitching = !isGlitching;
            statusInfo.textContent = isGlitching ? "STATUS: OVERCLOCKED / GLITCHING" : "STATUS: STABLE EMULATION";
            statusInfo.style.color = isGlitching ? "#ff0055" : "#05d9e8";
        });

        // Initialize loop
        drawScene();
    </script>
</body>
</html>
