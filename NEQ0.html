<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ NEON COMIC VAULT v20 — Timeline & Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#03050b', darkcard: '#080d1a', cyberblue: '#00f0ff', cyberpurple: '#9d00ff',
                        cyberpink: '#ff007f', cyberorange: '#ff5500', neongreen: '#00ffcc'
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite', 'glow-pulse': 'glowPulse 2.5s ease-in-out infinite',
                        'grid-shift': 'gridShift 8s linear infinite', 'bubble-rise': 'bubbleRise 6s ease-in-out infinite',
                        'shimmer': 'shimmer 3s ease-in-out infinite', 'butterfly': 'butterflyFlap 0.8s ease-in-out infinite',
                        'particle': 'particleMove 4s linear infinite', 'bunny-hop': 'bunnyHop 0.6s ease-in-out infinite'
                    },
                    keyframes: {
                        float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-8px)' } },
                        glowPulse: { '0%,100%': { boxShadow: '0 0 20px rgba(0,240,255,0.3)' }, '50%': { boxShadow: '0 0 40px rgba(0,240,255,0.7)' } },
                        gridShift: { '0%': { backgroundPosition: '0 0, 0 0' }, '100%': { backgroundPosition: '32px 32px, 32px 32px' } },
                        bubbleRise: { '0%,100%': { transform: 'translateY(0) scale(1)' }, '50%': { transform: 'translateY(-12px) scale(1.05)' } },
                        shimmer: { '0%,100%': { opacity: '0.6' }, '50%': { opacity: '1' } },
                        butterflyFlap: { '0%,100%': { transform: 'rotate(10deg)' }, '50%': { transform: 'rotate(-10deg)' } },
                        particleMove: { '0%': { transform: 'translateY(0) scale(1)', opacity: '0.8' }, '100%': { transform: 'translateY(-80px) scale(0)', opacity: '0' } },
                        bunnyHop: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Press+Start+2P&display=swap');
        :root {
            --glass-bg: rgba(10, 15, 30, 0.45); --glass-border: rgba(0, 240, 255, 0.2);
            --glass-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            --cyber-glow: 0 0 25px rgba(0, 240, 255, 0.5); --rainbow: conic-gradient(#ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            --glass-radius: 12px;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk', 'Inter', sans-serif; background: #03050b;
            overscroll-behavior-y: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            overflow: hidden; height: 100dvh; width: 100vw; touch-action: none; color: #e2e8f0;
        }
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        * { scrollbar-width: none; }
        .animated-bg {
            background-color: #03050b;
            background-image: radial-gradient(circle at 50% 50%, rgba(157,0,255,0.10) 0%, transparent 70%), radial-gradient(circle at 15% 25%, rgba(0,240,255,0.08) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(255,0,127,0.06) 0%, transparent 50%), linear-gradient(to right, rgba(0,240,255,0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,85,0,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            animation: gridShift 12s linear infinite;
        }
        .glass {
            background: var(--glass-bg); backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%);
            border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--glass-radius);
        }
        .glass-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            border-radius: 10px; transition: all 0.07s ease; cursor: pointer; touch-action: manipulation;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 2px; padding: 6px 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
            color: #e2e8f0; white-space: nowrap; min-width: 44px; min-height: 44px;
        }
        .glass-btn:active, .glass-btn.active { transform: scale(0.94); background: linear-gradient(135deg, rgba(157,0,255,0.5) 0%, rgba(0,240,255,0.4) 100%); border-color: #00f0ff; box-shadow: var(--cyber-glow); }
        .glass-btn .btn-num { font-size: 9px; color: #00f0ff; font-weight: 800; }
        .spheric-wheel {
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #00f0ff 20%, #9d00ff 55%, #03050b 90%);
            box-shadow: inset 0 -10px 25px rgba(0,0,0,0.85), inset 0 6px 15px rgba(255,255,255,0.2), 0 0 20px rgba(0,240,255,0.4);
            border: 2px solid rgba(255,255,255,0.7); border-radius: 50%; width: 52px; height: 52px; touch-action: none; cursor: grab;
            transition: border-radius 0.3s ease, transform 0.1s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .spheric-wheel:active { transform: scale(0.85); border-color: #ff007f; box-shadow: 0 0 40px rgba(255,0,127,0.8); }
        .butterfly { position: absolute; font-size: 24px; animation: butterflyFlap 0.5s ease-in-out infinite, float 4s ease-in-out infinite; filter: drop-shadow(0 0 6px rgba(0,255,204,0.7)); pointer-events: none; z-index: 30; }
        .node-connector-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
        .timeline-track { display: flex; gap: 4px; overflow-x: auto; padding: 4px; scroll-snap-type: x proximity; }
        .timeline-frame { background: rgba(8,13,26,0.7); border: 2px solid rgba(0,240,255,0.3); border-radius: 6px; min-width: 48px; height: 48px; object-fit: cover; scroll-snap-align: start; cursor: pointer; transition: all 0.1s ease; position: relative; }
        .timeline-frame.active { border-color: #ff007f; box-shadow: 0 0 20px rgba(255,0,127,0.6); }
        .timeline-frame .frame-num { position: absolute; bottom: 0; right: 0; font-size: 8px; background: rgba(0,0,0,0.7); color: #00f0ff; padding: 1px 3px; border-radius: 2px; }
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
        .vault-item { background: rgba(8,13,26,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 4px; cursor: pointer; transition: all 0.1s ease; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
        .vault-item img { width: 100%; height: auto; max-height: 80%; object-fit: contain; }
        .vault-item:active { transform: scale(0.92); border-color: #00f0ff; box-shadow: var(--cyber-glow); }
        .top-library { position: absolute; top: 4px; left: 4px; right: 4px; z-index: 45; display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; padding: 4px; }
        .lib-item { min-width: 40px; height: 40px; background: rgba(8,13,26,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s ease; backdrop-filter: blur(4px); }
        .lib-item img { max-width: 32px; max-height: 32px; object-fit: contain; }
        .lib-item .media-icon { font-size: 20px; }
        .lib-item:active { transform: scale(0.9); border-color: #00f0ff; }
        .bunny-progress { position: relative; width: 100%; height: 30px; background: rgba(255,255,255,0.1); border-radius: 15px; margin: 10px 0; overflow: visible; }
        .bunny { position: absolute; top: -8px; left: 0; font-size: 28px; animation: bunnyHop 0.6s ease-in-out infinite; transform: translateX(-50%); }
        .carrot { position: absolute; right: -10px; top: -6px; font-size: 24px; }
        .stars { position: absolute; right: 30px; top: -5px; font-size: 18px; }
        .rabbit-hole { position: absolute; left: -10px; bottom: -5px; font-size: 18px; }
        .red-thread { position: absolute; bottom: 10px; left: 0; right: 0; height: 2px; background: linear-gradient(to right, #ff007f, #00f0ff); opacity: 0.5; }
        .reader-panel { transition: opacity 0.5s ease; }
        .fade-out { opacity: 0; }
        .fade-in { opacity: 1; }
        .audio-spheres { display: flex; gap: 4px; align-items: center; }
        .audio-sphere { width: 12px; height: 12px; border-radius: 50%; background: #00f0ff; box-shadow: 0 0 8px rgba(0,240,255,0.8); }
        .crop-overlay { position: absolute; border: 2px dashed #00f0ff; pointer-events: none; z-index: 40; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); }
        .crop-handle { position: absolute; width: 20px; height: 20px; background: rgba(0,240,255,0.8); border-radius: 50%; pointer-events: auto; z-index: 45; }
        .card-modal { background: rgba(0,0,0,0.85); border: 2px solid #00f0ff; border-radius: 20px; padding: 15px; width: 90%; max-width: 400px; }
    </style>
</head>
<body class="text-slate-100 h-[100dvh] w-screen flex flex-col overflow-hidden animated-bg">
    <!-- Butterflies (can be replaced by emojis) -->
    <div class="butterfly" style="top:15%; left:10%;">🦋</div>
    <div class="butterfly" style="top:65%; left:80%;">🦋</div>
    <div class="butterfly" style="top:30%; left:85%;">🦋</div>
    <div class="butterfly" style="top:80%; left:20%;">🦋</div>

    <div id="top-library" class="top-library glass"></div>
    <div id="toast-container" class="fixed top-14 right-3 left-3 sm:left-auto z-[300] flex flex-col gap-2 pointer-events-none items-center sm:items-end"></div>

    <!-- LEFT HUD (modes only) -->

        <button onclick="applyCrop()" class="glass-btn">✅✂️<span class="btn-num">13</span></button>

    <!-- CANVAS -->

            <div id="crop-overlay-container" class="absolute inset-0 pointer-events-none hidden"></div>
        </div>

                <span class="text-4xl">⚡🌆</span>
                <span class="text-sm font-bold">Drop Media • Load Assets</span>

        <!-- Spheric wheels -->
        <div class="flex items-center justify-center gap-2 pointer-events-auto glass px-2 py-1 rounded-xl mx-auto">
            <span class="text-[9px] text-cyberblue font-bold uppercase">🎨STYLE</span>
            <div id="spheric-style-wheel" class="spheric-wheel" data-wheel="style" style="width:40px;height:40px;"><i class="fa-solid fa-palette text-neongreen text-xs"></i></div>
            <span class="text-[9px] text-cyberblue font-bold uppercase">🔥INT</span>
            <div id="spheric-intensity-wheel" class="spheric-wheel" data-wheel="intensity" style="width:40px;height:40px;"><i class="fa-solid fa-fire text-cyberpink text-xs"></i></div>
            <span class="text-[9px] text-cyberblue font-bold uppercase">📏SIZE</span>
            <div id="spheric-size-wheel" class="spheric-wheel" data-wheel="size" style="width:40px;height:40px;"><i class="fa-solid fa-expand text-neongreen text-xs"></i></div>
            <span class="text-[9px] text-cyberblue font-bold uppercase">🌈COL</span>

            <span class="text-[9px] text-cyberblue font-bold uppercase">🖌️BR</span>
            <div id="spheric-brush-wheel" class="spheric-wheel" data-wheel="brush" style="width:40px;height:40px;"><i class="fa-solid fa-paint-brush text-white text-xs"></i></div>

            <div id="timeline-strip" class="timeline-track no-scrollbar"></div>
        </div>

        <div class="glass rounded-3xl w-full max-w-md p-4 space-y-3 max-h-[80vh] overflow-y-auto no-scrollbar">
            <div class="flex items-center justify-between border-b border-white/10 pb-2"><span class="text-xl font-bold text-cyberblue">🔐 VAULT GRID</span><button onclick="closeVault()" class="text-2xl text-slate-400">✕</button></div>
            <div id="vault-list" class="vault-grid"></div>

        <div class="glass rounded-3xl w-full max-w-sm p-4 space-y-3"><div class="flex justify-between items-center border-b border-white/10 pb-2"><span class="text-xl font-bold text-neongreen">💾 EXPORT</span><button onclick="closeModals()" class="text-2xl">✕</button></div><div class="grid grid-cols-3 gap-2"><button onclick="exportFile('png')" class="glass-btn py-3 text-lg">PNG</button><button onclick="exportFile('jpg')" class="glass-btn py-3 text-lg">JPG</button><button onclick="exportFile('webp')" class="glass-btn py-3 text-lg">WEBP</button></div></div>

        // File handling (all file types)
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const type = file.type.startsWith('image') ? 'image' :
                        file.type.startsWith('video') ? 'video' :
                        file.type.startsWith('audio') ? 'audio' :
                        file.name.endsWith('.glb') ? 'glb' :
                        file.name.endsWith('.html') ? 'html' : 'file';
                    const item = { id:'f_'+Math.random().toString(36).substr(2,8), name:file.name, dataUrl:ev.target.result, type:type, thumb:type==='image'?ev.target.result:null };
                    library.push(item);
                    updateTopLibrary();
                    if(library.length===1 && item.type==='image') loadImageToCanvas(item.dataUrl);
                    if(item.type==='audio') visualizeAudio(item.dataUrl);
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }

        function updateTopLibrary() { /* as before */ }
        function spawnLibraryItem(id) { /* numbered overlay */ }
        function loadImageToCanvas(dataUrl) { /* as before */ }

        // New: Add object smoothly (like cinematic)
        function addObjectSmooth() {
            const item = library[library.length-1]; // last added
            if(!item) { showToast('No library item'); return; }
            overlayCounter++;
            const overlay = {
                content:`${item.name} #${overlayCounter}`,
                x: canvas.width/2,
                y: canvas.height/2,
                size: activeOverlaySize,
                rotation:0,
                color: selectedColor,
                targetX: canvas.width/2 + (Math.random()*100-50),
                targetY: canvas.height/2 + (Math.random()*100-50),
            };
            overlays.push(overlay);
            selectedOverlayIndex = overlays.length-1;
            // Smooth animation to target position
            const startX = overlay.x, startY = overlay.y;
            const duration = 1000;
            const startTime = performance.now();
            function animateMove() {
                const elapsed = performance.now() - startTime;
                const t = Math.min(elapsed/duration, 1);
                overlay.x = startX + (overlay.targetX-startX)*t;
                overlay.y = startY + (overlay.targetY-startY)*t;
                compositeLayers();
                if(t < 1) requestAnimationFrame(animateMove);
                else saveState();
            }
            animateMove();
            showToast(`➕ Added ${item.name} #${overlayCounter}`);
        }

        // Music visualization (bubbles)
        function visualizeAudio(dataUrl) {
            const container = document.getElementById('audio-spheres-container');
            const sphere = document.createElement('div');
            sphere.className = 'audio-sphere';
            sphere.style.animation = 'bubbleRise 3s ease-in-out infinite';

        }

        function replaceButterflies(emoji) {
            const butterflies = document.querySelectorAll('.butterfly');

        // Card studio
        function openCardStudio() {
            if(!canvas.width) return;
            cardData.image = canvas.toDataURL('image/png');
            document.getElementById('card-preview').src = cardData.image;
            document.getElementById('card-modal').classList.remove('hidden');
        }
        function closeCardStudio() { document.getElementById('card-modal').classList.add('hidden'); }
        function saveCard() {
            cardData.name = document.getElementById('card-name').value || 'Untitled';
            cardData.value = document.getElementById('card-value').value || 1;
            cardData.suit = document.getElementById('card-suit').value;
            cardData.ulti = document.getElementById('card-ulti').value;
            // Save to vault or library
            vaultItems.push({ id:'card_'+Date.now(), dataUrl:cardData.image, thumb:cardData.image, name:cardData.name });
            showToast(`🃏 Card saved: ${cardData.name} (${cardData.value}${cardData.suit} ${cardData.ulti})`);
            closeCardStudio();
        }
