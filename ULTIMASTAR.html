<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE AniMAstAR — Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{overscroll-behavior:none;touch-action:none;font-family:'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden;height:100vh;width:100vw;background:#0a0a14;color:#e2e8f0}
        ::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:rgba(20,20,35,.4)}::-webkit-scrollbar-thumb{background:#ec4899;border-radius:9999px}
        .panel{background:rgba(18,18,31,.85);border:1px solid #2a2a3e;backdrop-filter:blur(16px);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
        .btn-glow{transition:all .15s;cursor:pointer;padding:3px 7px;border-radius:6px;font-size:9px;border:1px solid transparent}
        .btn-glow:hover{box-shadow:0 0 14px rgba(236,72,153,.3);border-color:#ec4899}
        .btn-glow:active{transform:scale(.94)}
        .tab-btn{padding:3px 8px;border-radius:6px;font-size:8px;transition:all .15s;cursor:pointer;border:1px solid transparent;background:transparent;color:#94a3b8}
        .tab-btn.active{background:rgba(236,72,153,.15);color:#ec4899;border-color:#ec4899}
        .timeline-track{background:rgba(30,30,50,.6);border:1px solid #2a2a3e;border-radius:6px;height:32px;position:relative;cursor:pointer}
        .keyframe-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#ec4899;top:50%;transform:translateY(-50%);cursor:pointer;box-shadow:0 0 6px rgba(236,72,153,.5)}
        .playhead{position:absolute;width:2px;height:100%;background:#fff;top:0;pointer-events:none;box-shadow:0 0 8px #fff}
        .toast-enter{animation:toastIn .3s ease forwards}@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .part-card{padding:3px 6px;border-radius:6px;border:1px solid #2a2a3e;background:#1a1a2e;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:8px;transition:all .15s}
        .part-card:hover{border-color:#8b5cf6}
        .part-card.selected{border-color:#ec4899;background:rgba(236,72,153,.12)}
        .bone-group-item{padding:2px 6px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:8px;border:1px solid transparent;transition:all .15s}
        .bone-group-item:hover{border-color:#8b5cf6;background:rgba(139,92,246,.08)}
        .bone-group-item.active{border-color:#ec4899;background:rgba(236,72,153,.1)}
        .swipe-value{font-family:monospace;font-size:11px;text-align:center;min-width:36px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:4px;padding:2px 4px;color:#fff;cursor:pointer;touch-action:none}
        .xyz-btn{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:1px solid #2a2a3e;background:#1a1a2e;color:#94a3b8;transition:all .15s}
        .xyz-btn:hover{filter:brightness(1.3)}
        .xyz-btn:active{transform:scale(.92)}
        .xyz-btn.x-color{border-color:#ec4899;color:#ec4899}
        .xyz-btn.y-color{border-color:#8b5cf6;color:#8b5cf6}
        .xyz-btn.z-color{border-color:#06b6d4;color:#06b6d4}
        .joystick-base{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.15);position:relative;touch-action:none}
        .joystick-thumb{width:22px;height:22px;border-radius:50%;background:rgba(236,72,153,.8);position:absolute;top:21px;left:21px;border:1px solid #fff;transition:transform .05s linear}
        .joystick-actions{display:flex;gap:3px;margin-top:4px;justify-content:center}
        .joystick-actions button{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:50%;width:28px;height:28px;color:#fff;font-size:10px;cursor:pointer;backdrop-filter:blur(4px);transition:all .15s}
        .joystick-actions button:active{transform:scale(.88)}
        .anim-grid-item{transition:all .15s;cursor:pointer;border:1px solid #2a2a3e;border-radius:6px;padding:3px;text-align:center;background:#1a1a2e;font-size:7px}
        .anim-grid-item:hover{border-color:#ec4899}
        .anim-grid-item.active{border-color:#ec4899;background:rgba(236,72,153,.12)}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:center;justify-content:center}
        .modal-panel{background:#1a1a2e;border:1px solid #3a3a5e;border-radius:14px;padding:16px;max-width:90vw;max-height:85vh;overflow-y:auto}
        .neon-grid{position:fixed;inset:0;pointer-events:none;z-index:2;background:rgba(0,0,0,0);transition:background .5s}
        .neon-grid.active{background:rgba(0,0,0,.4);background-image:linear-gradient(rgba(236,72,153,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.05) 1px,transparent 1px);background-size:16px 16px}
        #uh-joystick{position:fixed;bottom:165px;right:8px;z-index:40;display:none;pointer-events:auto}
        #uh-joystick.active{display:block}
        .timeline-overlay{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);z-index:35;pointer-events:none;width:85%;max-width:640px}
        .timeline-overlay .tl-panel{pointer-events:auto;background:rgba(18,18,31,.7);border:1px solid #2a2a3e;border-radius:12px;padding:4px 10px;backdrop-filter:blur(12px);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
        .timeline-overlay .tl-panel .tl-track-wrap{flex:1;min-width:60px}
        .timeline-overlay .tl-panel .tl-btns{display:flex;gap:2px;flex-wrap:wrap}
        .timeline-overlay .tl-panel .tl-btns button{background:rgba(30,30,50,.6);border:1px solid #2a2a3e;border-radius:4px;padding:2px 5px;color:#cbd5e1;font-size:7px;cursor:pointer;transition:.15s}
        .timeline-overlay .tl-panel .tl-btns button:hover{background:rgba(139,92,246,.2)}
        .timeline-overlay .tl-panel .tl-btns button.primary{background:rgba(236,72,153,.2);border-color:#ec4899}
        .library-panel{position:fixed;left:4px;top:40px;bottom:160px;width:140px;z-index:30;pointer-events:none;transition:transform .25s}
        .library-panel.open{transform:translateX(0)}.library-panel.closed{transform:translateX(-160px)}
        .library-panel .lib-inner{pointer-events:auto;height:100%;background:rgba(18,18,31,.85);border:1px solid #2a2a3e;border-radius:10px;backdrop-filter:blur(20px);padding:4px;overflow-y:auto}
        .library-panel .lib-inner .lib-item{padding:2px 5px;border-radius:3px;cursor:pointer;border:1px solid transparent;font-size:7px;display:flex;justify-content:space-between;align-items:center}
        .library-panel .lib-inner .lib-item:hover{background:rgba(139,92,246,.1);border-color:#8b5cf6}
        #toast-container{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(10,10,20,.9);padding:4px 14px;border-radius:999px;border:1px solid #2a2a3e;font-size:8px;color:#e2e8f0;opacity:0;transition:opacity .3s;pointer-events:none}
        .bone-section-header{font-size:6px;font-weight:700;color:#64748b;margin-top:2px;padding:1px 0;border-bottom:1px solid #1e293b}
        #persistent-dock{height:155px}
        .part-edit-panel{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;padding:4px;margin-top:4px}
        .info-hud{position:fixed;top:38px;right:6px;z-index:40;background:rgba(18,18,31,.8);border:1px solid #2a2a3e;border-radius:6px;padding:2px 8px;font-size:7px;color:#94a3b8;backdrop-filter:blur(12px);pointer-events:none}
    </style>
</head>
<body>
<div id="canvas-container" class="fixed inset-0 z-0"></div>
<div id="neon-grid" class="neon-grid"></div>
<div id="glitch-overlay" style="position:fixed;inset:0;pointer-events:none;z-index:100;opacity:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(236,72,153,0.04) 2px,rgba(236,72,153,0.04) 4px);"></div>

<!-- Info -->
<div class="info-hud" id="info-hud">Ready</div>

<!-- TOP BAR -->
<div class="fixed top-1 left-1 z-40 flex items-center gap-1 pointer-events-none flex-wrap">
    <div class="panel px-2 py-1 flex items-center gap-1 pointer-events-auto">
        <div id="status-dot" class="w-2 h-2 rounded-full bg-rose-500 animate-pulse flex-shrink-0"></div>
        <span id="asset-name" class="text-[8px] font-bold text-pink-400 truncate max-w-[60px]">Default</span>
    </div>
    <div class="flex items-center gap-1 pointer-events-auto flex-wrap">
        <button id="btn-toggle-skeleton" class="panel px-1.5 py-0.5 text-slate-300 btn-glow"><i class="fa-solid fa-bone text-emerald-400 text-[9px]"></i></button>
        <button id="btn-angle-spheres" class="panel px-1.5 py-0.5 text-sky-300 btn-glow"><i class="fa-solid fa-circle-dot text-[9px]"></i></button>
        <button id="btn-skeleton-map" class="panel px-1.5 py-0.5 text-amber-300 btn-glow"><i class="fa-solid fa-diagram-project text-[9px]"></i></button>
        <button id="btn-open-remap" class="panel px-1.5 py-0.5 text-sky-300 btn-glow"><i class="fa-solid fa-exchange-alt text-[9px]"></i></button>
        <button id="btn-toggle-texture-hud" class="panel px-1.5 py-0.5 text-sky-300 btn-glow"><i class="fa-solid fa-layer-group text-[9px]"></i></button>
        <button id="btn-toggle-hair" class="panel px-1.5 py-0.5 text-pink-300 btn-glow"><i class="fa-solid fa-scissors text-[9px]"></i></button>
        <button id="btn-neon-grid" class="panel px-1.5 py-0.5 text-cyan-300 btn-glow"><i class="fa-solid fa-grid-2 text-[9px]"></i></button>
        <button id="btn-cut" class="panel px-1.5 py-0.5 text-red-300 btn-glow"><i class="fa-solid fa-cut text-[9px]"></i></button>
        <button id="btn-export-model" class="panel px-1.5 py-0.5 text-emerald-300 btn-glow"><i class="fa-solid fa-download text-[9px]"></i></button>
        <label class="panel px-1.5 py-0.5 text-sky-300 btn-glow cursor-pointer"><i class="fa-solid fa-upload text-[9px]"></i><input type="file" id="gltf-upload" accept=".glb,.gltf,.vrm" class="hidden"></label>
        <button id="btn-game-mode" class="panel px-1.5 py-0.5 text-purple-300 btn-glow"><i class="fa-solid fa-gamepad text-[9px]"></i></button>
        <button id="btn-toggle-library" class="panel px-1.5 py-0.5 text-indigo-300 btn-glow"><i class="fa-solid fa-book text-[9px]"></i></button>
    </div>
</div>

<!-- TEXTURE HUD -->
<div id="texture-hud" class="fixed z-40 pointer-events-none hidden" style="top:38px;left:50%;transform:translateX(-50%);width:220px;">
    <div class="panel p-1.5 pointer-events-auto">
        <div class="flex items-center justify-between mb-0.5"><span class="text-[7px] font-bold text-sky-300">TEXTURES</span>
            <div class="flex gap-0.5">
                <button id="btn-texture-link" class="bg-slate-800 hover:bg-slate-700 px-1.5 py-0.5 rounded text-slate-300 text-[6px]"><i class="fa-solid fa-link"></i></button>
                <button id="btn-texture-undo" class="bg-slate-800 hover:bg-slate-700 px-1.5 py-0.5 rounded text-slate-300 text-[6px]"><i class="fa-solid fa-undo"></i></button>
                <button id="btn-texture-redo" class="bg-slate-800 hover:bg-slate-700 px-1.5 py-0.5 rounded text-slate-300 text-[6px]"><i class="fa-solid fa-redo"></i></button>
                <button id="btn-texture-delete" class="bg-slate-800 hover:bg-slate-700 px-1.5 py-0.5 rounded text-rose-400 text-[6px]"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        <div id="texture-hud-grid" class="grid grid-cols-4 gap-0.5 max-h-24 overflow-y-auto"></div>
        <label class="mt-0.5 block text-center bg-slate-800 hover:bg-slate-700 cursor-pointer px-2 py-0.5 rounded text-[6px] text-sky-300"><i class="fa-solid fa-upload mr-0.5"></i>Upload<input type="file" id="texture-hud-upload" accept=".png,.jpg,.jpeg,.webp" class="hidden"></label>
    </div>
</div>

<!-- SKELETON & BONE GROUPS (right) -->
<div class="fixed right-1 z-30 pointer-events-none" style="top:38px;bottom:155px;width:130px;">
    <div class="panel p-1 h-full flex flex-col pointer-events-auto overflow-hidden">
        <span class="text-[6px] font-bold text-slate-400 mb-0.5">BONES / GROUPS</span>
        <div id="bone-hierarchy-list" class="flex-1 overflow-y-auto"></div>
    </div>
</div>

<!-- LIBRARY (left) -->
<div id="library-panel" class="library-panel closed">
    <div class="lib-inner">
        <div class="flex justify-between items-center mb-0.5"><span class="text-[6px] font-bold text-indigo-300">ANIM LIB</span><button id="btn-close-lib" class="text-slate-400 hover:text-white text-[9px]">&times;</button></div>
        <div id="library-list" class="space-y-0.5"></div>
        <div class="text-[5px] text-slate-500 mt-0.5">Drag to timeline</div>
    </div>
</div>

<!-- TIMELINE OVERLAY -->
<div id="timeline-overlay" class="timeline-overlay">
    <div class="tl-panel">
        <div class="tl-btns">
            <button id="tl-record" class="primary"><i class="fa-solid fa-circle-dot"></i></button>
            <button id="tl-add-key"><i class="fa-solid fa-plus"></i></button>
            <button id="tl-play"><i class="fa-solid fa-play"></i></button>
            <button id="tl-loop"><i class="fa-solid fa-repeat"></i></button>
            <button id="tl-mirror"><i class="fa-solid fa-arrows-left-right"></i></button>
            <button id="tl-export"><i class="fa-solid fa-file-export"></i></button>
            <button id="tl-clear"><i class="fa-solid fa-trash"></i></button>
            <button id="tl-undo"><i class="fa-solid fa-undo"></i></button>
            <button id="tl-redo"><i class="fa-solid fa-redo"></i></button>
        </div>
        <div class="tl-track-wrap">
            <div id="tl-track" class="timeline-track"></div>
        </div>
        <span id="tl-frame-info" class="text-[6px] text-slate-400">0/0</span>
    </div>
</div>

<!-- JOYSTICK -->
<div id="uh-joystick" class="active">
    <div class="joystick-base" id="joystick-base"><div class="joystick-thumb" id="joystick-thumb"></div></div>
    <div class="joystick-actions">
        <button data-action="jump"><i class="fa-solid fa-arrow-up"></i></button>
        <button data-action="punch"><i class="fa-solid fa-hand-fist"></i></button>
        <button data-action="kick"><i class="fa-solid fa-shoe-prints"></i></button>
        <button data-action="dance"><i class="fa-solid fa-music"></i></button>
    </div>
</div>

<!-- BOTTOM DOCK -->
<div id="persistent-dock" class="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur-2xl border-t border-slate-800 flex flex-col select-none" style="height:155px;">
    <div class="grid grid-cols-5 bg-slate-950/80 border-b border-slate-800 p-0.5 text-[8px] font-bold text-center flex-shrink-0">
        <button onclick="switchTab('tab-pose')" id="btn-tab-pose" class="tab-btn">Pose</button>
        <button onclick="switchTab('tab-parts')" id="btn-tab-parts" class="tab-btn">Parts/FX</button>
        <button onclick="switchTab('tab-anim')" id="btn-tab-anim" class="tab-btn">Animations</button>
        <button onclick="switchTab('tab-library')" id="btn-tab-library" class="tab-btn">Library</button>
        <button onclick="switchTab('tab-game')" id="btn-tab-game" class="tab-btn">Game</button>
    </div>
    <div class="flex-1 overflow-y-auto p-1.5 text-xs space-y-1">
        <!-- POSE -->
        <div id="tab-pose" class="space-y-1">
            <div class="flex items-center gap-1 flex-wrap">
                <span class="text-slate-400 text-[7px]">Joint:</span>
                <select id="pose-bone-select" class="flex-1 min-w-[50px] bg-slate-950 border border-slate-700 rounded-lg px-1 py-0.5 text-white text-[8px]"></select>
                <button onclick="resetSelectedBone()" class="bg-slate-800 hover:bg-slate-700 px-1.5 py-0.5 rounded text-slate-300 text-[7px]"><i class="fa-solid fa-rotate-left"></i></button>
                <button id="btn-mirror-pose" class="bg-slate-800 hover:bg-slate-700 px-1.5 py-0.5 rounded text-slate-300 text-[7px]"><i class="fa-solid fa-arrows-left-right"></i></button>
            </div>
            <div class="grid grid-cols-3 gap-1">
                <div class="bg-slate-950/60 p-1 rounded-lg border border-slate-800 text-center"><div class="text-[6px] text-pink-400 font-bold">X</div><div class="flex items-center gap-0.5 justify-center"><button class="xyz-btn x-color" data-axis="x" data-dir="-0.1" style="width:18px;height:18px;font-size:9px">−</button><span class="swipe-value" id="swipe-x" data-axis="x" style="min-width:28px;font-size:9px">0°</span><button class="xyz-btn x-color" data-axis="x" data-dir="0.1" style="width:18px;height:18px;font-size:9px">+</button></div></div>
                <div class="bg-slate-950/60 p-1 rounded-lg border border-slate-800 text-center"><div class="text-[6px] text-purple-400 font-bold">Y</div><div class="flex items-center gap-0.5 justify-center"><button class="xyz-btn y-color" data-axis="y" data-dir="-0.1" style="width:18px;height:18px;font-size:9px">−</button><span class="swipe-value" id="swipe-y" data-axis="y" style="min-width:28px;font-size:9px">0°</span><button class="xyz-btn y-color" data-axis="y" data-dir="0.1" style="width:18px;height:18px;font-size:9px">+</button></div></div>
                <div class="bg-slate-950/60 p-1 rounded-lg border border-slate-800 text-center"><div class="text-[6px] text-sky-400 font-bold">Z</div><div class="flex items-center gap-0.5 justify-center"><button class="xyz-btn z-color" data-axis="z" data-dir="-0.1" style="width:18px;height:18px;font-size:9px">−</button><span class="swipe-value" id="swipe-z" data-axis="z" style="min-width:28px;font-size:9px">0°</span><button class="xyz-btn z-color" data-axis="z" data-dir="0.1" style="width:18px;height:18px;font-size:9px">+</button></div></div>
            </div>
            <div class="text-[5px] text-slate-500 text-center">Swipe ↔ fine · ↕ coarse</div>
        </div>

        <!-- PARTS / FX -->
        <div id="tab-parts" class="space-y-1 hidden">
            <div class="grid grid-cols-3 gap-0.5">
                <button onclick="toggleParts('all')" class="bg-slate-800 hover:bg-slate-700 p-0.5 rounded text-slate-300 text-[6px]">All</button>
                <button onclick="toggleParts('hair')" class="bg-slate-800 hover:bg-slate-700 p-0.5 rounded text-slate-300 text-[6px]">Hair</button>
                <button onclick="toggleParts('clothing')" class="bg-slate-800 hover:bg-slate-700 p-0.5 rounded text-slate-300 text-[6px]">Clothes</button>
                <button onclick="toggleParts('accessories')" class="bg-slate-800 hover:bg-slate-700 p-0.5 rounded text-slate-300 text-[6px]">Access</button>
                <button onclick="toggleParts('body')" class="bg-slate-800 hover:bg-slate-700 p-0.5 rounded text-slate-300 text-[6px]">Body</button>
                <button onclick="toggleParts('other')" class="bg-slate-800 hover:bg-slate-700 p-0.5 rounded text-slate-300 text-[6px]">Other</button>
            </div>
            <div id="asset-parts-grid" class="grid grid-cols-2 gap-0.5 max-h-12 overflow-y-auto"></div>
            <div id="part-edit-panel" class="part-edit-panel hidden">
                <div class="flex gap-1 items-center"><input type="text" id="part-edit-name" class="flex-1 bg-slate-950 border border-slate-700 rounded px-1 py-0.5 text-[7px] text-white"><button id="part-eye-toggle" class="bg-slate-800 hover:bg-slate-700 px-1.5 py-0.5 rounded text-slate-300 text-[7px]"><i class="fa-solid fa-eye"></i></button></div>
                <div class="grid grid-cols-3 gap-0.5 mt-0.5">
                    <button onclick="editPartScale('x',0.1)" class="bg-slate-800 p-0.5 rounded text-slate-300 text-[6px]">SX+</button><button onclick="editPartScale('y',0.1)" class="bg-slate-800 p-0.5 rounded text-slate-300 text-[6px]">SY+</button><button onclick="editPartScale('z',0.1)" class="bg-slate-800 p-0.5 rounded text-slate-300 text-[6px]">SZ+</button>
                    <button onclick="editPartScale('x',-0.1)" class="bg-slate-800 p-0.5 rounded text-slate-300 text-[6px]">SX−</button><button onclick="editPartScale('y',-0.1)" class="bg-slate-800 p-0.5 rounded text-slate-300 text-[6px]">SY−</button><button onclick="editPartScale('z',-0.1)" class="bg-slate-800 p-0.5 rounded text-slate-300 text-[6px]">SZ−</button>
                </div>
                <div class="flex gap-1 mt-0.5">
                    <button onclick="fxPart('glitch')" class="flex-1 bg-pink-600/30 border border-pink-500/50 p-0.5 rounded text-pink-300 text-[6px]">Glitch</button>
                    <button onclick="fxPart('ghost')" class="flex-1 bg-purple-600/30 border border-purple-500/50 p-0.5 rounded text-purple-300 text-[6px]">Ghost</button>
                    <button onclick="fxPart('holo')" class="flex-1 bg-sky-600/30 border border-sky-500/50 p-0.5 rounded text-sky-300 text-[6px]">Holo</button>
                    <button onclick="fxPart('pulse')" class="flex-1 bg-emerald-600/30 border border-emerald-500/50 p-0.5 rounded text-emerald-300 text-[6px]">Pulse</button>
                </div>
            </div>
        </div>

        </div>

        <!-- LIBRARY -->

            <button id="btn-game-toggle" class="bg-purple-600/30 border border-purple-500/50 p-1 rounded text-purple-300 text-[7px]">Toggle Game</button>
        </div>

</div>

<!-- MODALS -->
<div id="skeleton-map-modal" class="modal-overlay hidden"><div class="modal-panel w-[300px]"><div class="flex justify-between mb-1"><h3 class="text-sm font-bold text-amber-300">Skeleton Map</h3><button onclick="closeModal()" class="text-slate-400 text-xl">&times;</button></div><div id="skeleton-map-canvas" style="width:260px;height:300px;background:#0d0d1a;border-radius:8px;position:relative;"></div></div></div>
<div id="bone-remap-modal" class="modal-overlay hidden"><div class="modal-panel w-[460px] max-w-[92vw] max-h-[80vh] overflow-y-auto"><div class="flex justify-between mb-1"><h3 class="text-sm font-bold text-sky-300">Bone Remap</h3><button onclick="closeModal()" class="text-slate-400 text-xl">&times;</button></div><div id="bone-remap-grid" class="grid grid-cols-3 gap-1"></div><div class="flex gap-2 mt-2"><button id="btn-apply-remap" class="flex-1 bg-sky-600 text-white py-1 rounded text-xs">Apply</button><button id="btn-auto-detect" class="bg-slate-800 text-slate-300 px-3 py-1 rounded text-xs">Auto</button></div></div></div>

<div id="toast-container">Ready</div>

<script>
// ============================================================
// ULTIMATE AniMAstAR — Fixed Canvas + Textures + Timeline
// ============================================================

// ---------- CORE ----------
let scene,camera,renderer,character,clock=new THREE.Clock();
let charPos=new THREE.Vector3(0,0.7,0),charVel=new THREE.Vector3(0,0,0);
let cameraAngleX=0.3,cameraAngleY=0.35,cameraDistance=4.5;
let showSkeleton=false,showAngleSpheres=false,showHair=true;
let currentAnim='idle',selectedBoneKey=null;
let skeletonHelper=null,boneNodes=[],boneLines=[];
let primaryMaterials=[],allBones=[],springBones=[];
let assetParts={hair:[],clothing:[],body:[],accessories:[],other:[]};
let textureLibrary=[],selectedTex=null,texLinkMode=false;
let undoStack=[],redoStack=[],selectedPart=null,partPulses=[];
let gameMode=false,joystickActive=false,joyCenter={x:0,y:0},joyVec={x:0,y:0};
let isRecording=false,recTimer=0,timelinePlaying=false,timelineLoop=false;
let timelineKeyframes=[],replayTime=0,replaySpeed=1;
let timelineHistory=[],historyIdx=-1;
let glitchInterval=null,angleSpheres=[];
let gltfAnimations=[]; // baked-in animations from GLB

// Bone mapping
const boneGroups={
    head:{label:'Head',color:'#fbbf24'},neck:{label:'Neck',color:'#fbbf24'},
    chest:{label:'Chest',color:'#fb923c'},spine:{label:'Spine',color:'#fb923c'},hips:{label:'Hips',color:'#fb923c'},
    rightArm:{label:'Right Arm',color:'#f87171'},rightElbow:{label:'Right Elbow',color:'#f87171'},
    rightWrist:{label:'Right Wrist',color:'#f87171'},rightFingers:{label:'Right Fingers',color:'#f472b6'},
    leftArm:{label:'Left Arm',color:'#60a5fa'},leftElbow:{label:'Left Elbow',color:'#60a5fa'},
    leftWrist:{label:'Left Wrist',color:'#60a5fa'},leftFingers:{label:'Left Fingers',color:'#f472b6'},
    rightLeg:{label:'Right Leg',color:'#a78bfa'},rightKnee:{label:'Right Knee',color:'#a78bfa'},
    rightAnkle:{label:'Right Ankle',color:'#a78bfa'},leftLeg:{label:'Left Leg',color:'#34d399'},
    leftKnee:{label:'Left Knee',color:'#34d399'},leftAnkle:{label:'Left Ankle',color:'#34d399'}
};
const skeletonBones={};Object.keys(boneGroups).forEach(k=>skeletonBones[k]=null);
let boneRemapSelections={};

const animPresets=[
    {id:'idle',n:'Idle',i:'🧘'},{id:'walk',n:'Walk',i:'🚶'},{id:'run',n:'Run',i:'🏃'},
    {id:'wave',n:'Wave',i:'👋'},{id:'dance',n:'Dance',i:'💃'},{id:'jump',n:'Jump',i:'🦘'},
    {id:'bow',n:'Bow',i:'🙇'},{id:'sit',n:'Sit',i:'🪑'},{id:'punch',n:'Punch',i:'👊'},
    {id:'kick',n:'Kick',i:'🦵'},{id:'ghost',n:'Ghost',i:'👻'},{id:'glitch',n:'Glitch',i:'⚡'}
];

const animLibrary={
    'Whole':{'Idle':{id:'idle'},'Walk':{id:'walk'},'Run':{id:'run'},'Dance':{id:'dance'}},
    'Left Arm':{'Wave':{id:'wave_left'},'Punch':{id:'punch_left'},'Peace':{id:'peace_left'}},
    'Right Arm':{'Wave':{id:'wave_right'},'Punch':{id:'punch_right'},'Peace':{id:'peace_right'}},
    'Left Leg':{'Kick':{id:'kick_left'},'Step':{id:'step_left'}},
    'Right Leg':{'Kick':{id:'kick_right'},'Step':{id:'step_right'}}
};

// ---------- INIT ----------
function init(){
    const c=document.getElementById('canvas-container');
    scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a14);scene.fog=new THREE.FogExp2(0x0a0a14,0.02);
    camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.1,100);
    renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.outputEncoding=THREE.sRGBEncoding;
    c.appendChild(renderer.domElement);

    const amb=new THREE.AmbientLight(0xffffff,0.7);scene.add(amb);
    const dl=new THREE.DirectionalLight(0xfff5ee,1.5);dl.position.set(10,20,10);dl.castShadow=true;dl.shadow.mapSize.width=1024;dl.shadow.mapSize.height=1024;scene.add(dl);
    const hm=new THREE.HemisphereLight(0xb9c7ff,0x15101f,0.4);scene.add(hm);

    const grid=new THREE.GridHelper(60,30,0xec4899,0x1a1a2e);grid.position.y=-0.01;scene.add(grid);
    const fg=new THREE.PlaneGeometry(60,60);const fm=new THREE.MeshStandardMaterial({color:0x0d0d1a,roughness:0.9});const fl=new THREE.Mesh(fg,fm);fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);

    setupControls();setupBoneInteraction();setupTextureSystem();setupSwipeValues();setupJoystick();
    window.addEventListener('resize',onResize);

    // Create default character
    createDefaultCharacter();

    // Setup timeline & library
    setupTimeline();
    setupLibrary();

    // Start loop
    animate();

    // Switch to pose tab
    switchTab('tab-pose');
    showToast('ULTIMATE AniMAstAR ready');
}

// ---------- DEFAULT CHARACTER ----------
function createDefaultCharacter(){
    if(character){scene.remove(character);clearBoneVisuals();if(skeletonHelper){scene.remove(skeletonHelper);skeletonHelper=null}}
    character=new THREE.Group();character.position.set(0,0.7,0);

    // Build skeleton
    const hips=new THREE.Bone();hips.name='hips';hips.position.set(0,0.8,0);
    const spine=new THREE.Bone();spine.name='spine';spine.position.set(0,0.25,0);hips.add(spine);
    const chest=new THREE.Bone();chest.name='chest';chest.position.set(0,0.25,0);spine.add(chest);
    const neck=new THREE.Bone();neck.name='neck';neck.position.set(0,0.2,0);chest.add(neck);
    const head=new THREE.Bone();head.name='head';head.position.set(0,0.18,0);neck.add(head);
    const ra=new THREE.Bone();ra.name='rightArm';ra.position.set(0.3,0.45,0);chest.add(ra);
    const la=new THREE.Bone();la.name='leftArm';la.position.set(-0.3,0.45,0);chest.add(la);
    const re=new THREE.Bone();re.name='rightElbow';re.position.set(0,-0.25,0);ra.add(re);
    const le=new THREE.Bone();le.name='leftElbow';le.position.set(0,-0.25,0);la.add(le);
    const rw=new THREE.Bone();rw.name='rightWrist';rw.position.set(0,-0.2,0);re.add(rw);
    const lw=new THREE.Bone();lw.name='leftWrist';lw.position.set(0,-0.2,0);le.add(lw);
    const rf=new THREE.Bone();rf.name='rightFingers';rf.position.set(0,-0.12,0);rw.add(rf);
    const lf=new THREE.Bone();lf.name='leftFingers';lf.position.set(0,-0.12,0);lw.add(lf);
    const rl=new THREE.Bone();rl.name='rightLeg';rl.position.set(0.15,-0.05,0);hips.add(rl);
    const ll=new THREE.Bone();ll.name='leftLeg';ll.position.set(-0.15,-0.05,0);hips.add(ll);
    const rk=new THREE.Bone();rk.name='rightKnee';rk.position.set(0,-0.35,0);rl.add(rk);
    const lk=new THREE.Bone();lk.name='leftKnee';lk.position.set(0,-0.35,0);ll.add(lk);
    const rn=new THREE.Bone();rn.name='rightAnkle';rn.position.set(0,-0.3,0);rk.add(rn);
    const ln=new THREE.Bone();ln.name='leftAnkle';ln.position.set(0,-0.3,0);lk.add(ln);
    character.add(hips);

    const map={hips,spine,chest,neck,head,rightArm:ra,leftArm:la,rightElbow:re,leftElbow:le,rightWrist:rw,leftWrist:lw,rightFingers:rf,leftFingers:lf,rightLeg:rl,leftLeg:ll,rightKnee:rk,leftKnee:lk,rightAnkle:rn,leftAnkle:ln};
    Object.assign(skeletonBones,map);
    Object.keys(map).forEach(k=>boneRemapSelections[k]=map[k].name);
    allBones=Object.values(map);

    // Add meshes
    const makeMesh=(name,color,pos,scale)=>{
        const g=new THREE.BoxGeometry(scale.x,scale.y,scale.z);
        const m=new THREE.MeshStandardMaterial({color,roughness:0.5,metalness:0.1});
        const mesh=new THREE.Mesh(g,m);mesh.name=name;mesh.position.copy(pos);mesh.castShadow=mesh.receiveShadow=true;return mesh;
    };
    head.add(makeMesh('head',0xfbbf24,new THREE.Vector3(0,0.12,0),new THREE.Vector3(0.18,0.18,0.18)));
    chest.add(makeMesh('torso',0xfb923c,new THREE.Vector3(0,0.12,0),new THREE.Vector3(0.3,0.25,0.18)));
    hips.add(makeMesh('hips',0xfb923c,new THREE.Vector3(0,0,0),new THREE.Vector3(0.25,0.12,0.18)));
    ra.add(makeMesh('rightArm',0xf87171,new THREE.Vector3(0,-0.1,0),new THREE.Vector3(0.07,0.25,0.07)));
    la.add(makeMesh('leftArm',0x60a5fa,new THREE.Vector3(0,-0.1,0),new THREE.Vector3(0.07,0.25,0.07)));
    rl.add(makeMesh('rightLeg',0xa78bfa,new THREE.Vector3(0,-0.15,0),new THREE.Vector3(0.08,0.35,0.08)));
    ll.add(makeMesh('leftLeg',0x34d399,new THREE.Vector3(0,-0.15,0),new THREE.Vector3(0.08,0.35,0.08)));

    primaryMaterials=[];character.traverse(ch=>{if(ch.isMesh){const ms=Array.isArray(ch.material)?ch.material:[ch.material];primaryMaterials.push(...ms)}});
    scene.add(character);
    if(showSkeleton){skeletonHelper=new THREE.SkeletonHelper(character);scene.add(skeletonHelper)}
    buildBoneVisuals();

    // Asset parts
    assetParts={hair:[],clothing:[],body:[],accessories:[],other:[]};
    character.traverse(ch=>{if(!ch.isMesh)return;const nm=ch.name.toLowerCase();if(nm.includes('hair'))assetParts.hair.push(ch);else if(nm.includes('skirt')||nm.includes('shirt')||nm.includes('pant')||nm.includes('dress')||nm.includes('cloth'))assetParts.clothing.push(ch);else if(nm.includes('body')||nm.includes('skin')||nm.includes('face')||nm.includes('head')||nm.includes('torso'))assetParts.body.push(ch);else if(nm.includes('accessor')||nm.includes('glass')||nm.includes('hat'))assetParts.accessories.push(ch);else assetParts.other.push(ch)});

    updateBoneUI();updatePartsUI();updatePoseUI();updateTextureHUD();setupAnimGrid();
    document.getElementById('status-dot').className='w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
    document.getElementById('asset-name').innerText='Default';
    showToast('Default character loaded');
}

// ---------- UTILITY ----------
function switchTab(t){['tab-pose','tab-parts','tab-anim','tab-library','tab-game'].forEach(id=>document.getElementById(id).classList.add('hidden'));['btn-tab-pose','btn-tab-parts','btn-tab-anim','btn-tab-library','btn-tab-game'].forEach(id=>document.getElementById(id).className='tab-btn');document.getElementById(t).classList.remove('hidden');document.getElementById('btn-'+t).className='tab-btn active'}
function closeModal(){document.querySelectorAll('.modal-overlay').forEach(el=>el.style.display='none')}
function showToast(m){const t=document.getElementById('toast-container');t.textContent=m;t.style.opacity='1';clearTimeout(t._to);t._to=setTimeout(()=>t.style.opacity='0',1800)}
function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)}
function getPose(){const p={};Object.keys(skeletonBones).forEach(k=>{const b=skeletonBones[k];if(b)p[k]={rx:b.rotation.x,ry:b.rotation.y,rz:b.rotation.z}});return p}
function applyPoseToBones(pose,blend){Object.keys(pose).forEach(k=>{const b=skeletonBones[k];if(!b)return;const p=pose[k];if(blend>=1)b.rotation.set(p.rx,p.ry,p.rz);else{b.rotation.x+=(p.rx-b.rotation.x)*blend;b.rotation.y+=(p.ry-b.rotation.y)*blend;b.rotation.z+=(p.rz-b.rotation.z)*blend}});if(skeletonHelper)skeletonHelper.update()}
function pushHistory(){const state=JSON.stringify(getPose());if(timelineHistory[historyIdx]!==state){timelineHistory=timelineHistory.slice(0,historyIdx+1);timelineHistory.push(state);historyIdx++;if(timelineHistory.length>50)timelineHistory.shift()}}

// ---------- BONE UI ----------
function updateBoneUI(){
    const l=document.getElementById('bone-hierarchy-list');l.innerHTML='';
    const sections={Head:['head','neck'],Torso:['chest','spine','hips'],'Right Arm':['rightArm','rightElbow','rightWrist','rightFingers'],'Left Arm':['leftArm','leftElbow','leftWrist','leftFingers'],'Right Leg':['rightLeg','rightKnee','rightAnkle'],'Left Leg':['leftLeg','leftKnee','leftAnkle']};
    Object.keys(sections).forEach(sec=>{
        const h=document.createElement('div');h.className='bone-section-header';h.textContent=sec.toUpperCase();l.appendChild(h);
        sections[sec].forEach(key=>{
            const b=skeletonBones[key];if(!b)return;
            const d=document.createElement('div');d.className=`bone-group-item ${selectedBoneKey===key?'active':''}`;
            d.innerHTML=`<span style="width:5px;height:5px;border-radius:50%;background:${boneGroups[key].color};flex-shrink:0"></span><span style="flex:1">${boneGroups[key].label}</span><button class="zoom-btn" data-key="${key}" style="background:transparent;border:none;color:#94a3b8;cursor:pointer;font-size:7px"><i class="fa-solid fa-magnifying-glass"></i></button>`;
            d.querySelector('.zoom-btn').addEventListener('click',(e)=>{e.stopPropagation();zoomToBone(key)});
            d.onclick=()=>{selectedBoneKey=key;updateBoneUI();updateBoneVisualPositions();document.getElementById('pose-bone-name').textContent=boneGroups[key].label;updateSwipeValues()};
            l.appendChild(d);
        })
    });
}
function updatePoseUI(){const n=document.getElementById('pose-bone-name');if(selectedBoneKey&&skeletonBones[selectedBoneKey])n.textContent=boneGroups[selectedBoneKey].label;else n.textContent='None'}
function updateSwipeValues(){const b=skeletonBones[selectedBoneKey];if(!b){['swipe-x','swipe-y','swipe-z'].forEach(id=>document.getElementById(id).textContent='0°');return}document.getElementById('swipe-x').textContent=(b.rotation.x*180/Math.PI).toFixed(1)+'°';document.getElementById('swipe-y').textContent=(b.rotation.y*180/Math.PI).toFixed(1)+'°';document.getElementById('swipe-z').textContent=(b.rotation.z*180/Math.PI).toFixed(1)+'°'}
function zoomToBone(key){const b=skeletonBones[key];if(!b)return;const pos=new THREE.Vector3();b.getWorldPosition(pos);cameraAngleX=Math.atan2(pos.x-charPos.x,pos.z-charPos.z);cameraAngleY=Math.PI/4;cameraDistance=1.2;showToast('Zoom to '+boneGroups[key].label)}

// ---------- SWIPE ----------
function setupSwipeValues(){
    document.querySelectorAll('.swipe-value').forEach(el=>{
        let sx=0,sy=0,sv=0,act=false;
        el.addEventListener('pointerdown',e=>{act=true;sx=e.clientX;sy=e.clientY;sv=parseFloat(el.textContent)||0;el.style.background='#2a2a3e';el.setPointerCapture(e.pointerId)});
        el.addEventListener('pointermove',e=>{if(!act)return;const dx=e.clientX-sx,dy=e.clientY-sy;const coarse=Math.abs(dy)>20;const step=coarse?0.08:0.015;let val=sv+dx*step;val=Math.max(-180,Math.min(180,val));el.textContent=val.toFixed(1)+'°';const axis=el.dataset.axis;if(selectedBoneKey&&skeletonBones[selectedBoneKey]){skeletonBones[selectedBoneKey].rotation[axis]=val*(Math.PI/180);if(skeletonHelper)skeletonHelper.update();updateBoneVisualPositions();pushHistory()}});
        el.addEventListener('pointerup',()=>{act=false;el.style.background='#1a1a2e'});
    });
}

// ---------- PARTS ----------
function updatePartsUI(){
    const grid=document.getElementById('asset-parts-grid');grid.innerHTML='';const total=Object.values(assetParts).flat().length;if(!total){grid.innerHTML='<div class="text-slate-500 text-[6px]">No parts</div>';return}
    const cats=[{k:'hair',l:'💇'},{k:'clothing',l:'👕'},{k:'body',l:'🧍'},{k:'accessories',l:'💎'},{k:'other',l:'📦'}];
    cats.forEach(cat=>{assetParts[cat.k].forEach((p,i)=>{const d=document.createElement('div');d.className=`part-card ${selectedPart===p?'selected':''}`;d.innerHTML=`<span>${cat.l} ${p.name||cat.k+'_'+i}</span><button class="eye-btn" style="background:transparent;border:none;color:${p.visible?'#34d399':'#64748b'};cursor:pointer"><i class="fa-solid ${p.visible?'fa-eye':'fa-eye-slash'}"></i></button>`;d.onclick=e=>{if(e.target.closest('.eye-btn'))return;selectPart(p)};d.querySelector('.eye-btn').onclick=e=>{e.stopPropagation();p.visible=!p.visible;updatePartsUI();showToast(p.name+' '+(p.visible?'visible':'hidden'))};grid.appendChild(d)})});
    const panel=document.getElementById('part-edit-panel');if(selectedPart){panel.classList.remove('hidden');document.getElementById('part-edit-name').value=selectedPart.name||'';document.getElementById('part-eye-toggle').innerHTML=selectedPart.visible?'<i class="fa-solid fa-eye"></i>':'<i class="fa-solid fa-eye-slash"></i>'}else panel.classList.add('hidden');
    document.querySelectorAll('.part-card').forEach(el=>el.classList.remove('selected'));if(selectedPart){document.querySelectorAll('.part-card').forEach(el=>{if(el.textContent.includes(selectedPart.name||''))el.classList.add('selected')})}
}
function selectPart(p){if(selectedPart===p){selectedPart=null;updatePartsUI();return}selectedPart=p;updatePartsUI();character?.traverse(ch=>{if(ch.isMesh){const ms=Array.isArray(ch.material)?ch.material:[ch.material];ms.forEach(m=>{if(m.emissive){m.emissive.set(0x000000);m.emissiveIntensity=0;m.needsUpdate=true}})}});if(p){const ms=Array.isArray(p.material)?p.material:[p.material];ms.forEach(m=>{if(m.emissive){m.emissive.set(0xec4899);m.emissiveIntensity=0.5;m.needsUpdate=true}})}showToast('Selected: '+(p.name||'Part'))}
function editPartScale(axis,amount){if(!selectedPart)return;selectedPart.scale[axis]+=amount;showToast(axis.toUpperCase()+' '+selectedPart.scale[axis].toFixed(1))}
function fxPart(effect){if(!selectedPart)return;const ms=Array.isArray(selectedPart.material)?selectedPart.material:[selectedPart.material];ms.forEach(m=>{m.transparent=false;m.opacity=1;m.emissive=m.emissive||new THREE.Color(0);m.emissive.set(0);m.emissiveIntensity=0;m.wireframe=false;switch(effect){case'glitch':m.color.set(0xec4899);m.roughness=.1;m.metalness=.9;m.emissive.set(0xec4899);m.emissiveIntensity=.3;break;case'ghost':m.color.set(0xa78bfa);m.roughness=.25;m.metalness=.1;m.transparent=true;m.opacity=.55;break;case'holo':m.color.set(0x22d3ee);m.roughness=.05;m.metalness=.85;m.transparent=true;m.opacity=.7;break;case'pulse':m.color.set(0x34d399);m.emissive.set(0x34d399);m.emissiveIntensity=.5;break;default:m.color.set(0xf5f5f5);m.roughness=.4;m.metalness=.05;m.transparent=false;m.opacity=1}m.needsUpdate=true});showToast(effect+' applied')}
function toggleParts(type){character?.traverse(ch=>{if(!ch.isMesh)return;const nm=ch.name.toLowerCase();let t=false;if(type==='hair'&&(nm.includes('hair')||nm.includes('beard')||nm.includes('fur')))t=true;if(type==='clothing'&&(nm.includes('skirt')||nm.includes('shirt')||nm.includes('pant')||nm.includes('dress')||nm.includes('cloth')))t=true;if(type==='accessories'&&(nm.includes('accessor')||nm.includes('glass')||nm.includes('hat')||nm.includes('earring')||nm.includes('necklace')))t=true;if(type==='body'&&(nm.includes('body')||nm.includes('skin')||nm.includes('face')||nm.includes('head')||nm.includes('torso')))t=true;if(type==='other'&&!nm.includes('hair')&&!nm.includes('beard')&&!nm.includes('fur')&&!nm.includes('skirt')&&!nm.includes('shirt')&&!nm.includes('pant')&&!nm.includes('dress')&&!nm.includes('cloth')&&!nm.includes('accessor')&&!nm.includes('glass')&&!nm.includes('hat')&&!nm.includes('earring')&&!nm.includes('necklace')&&!nm.includes('body')&&!nm.includes('skin')&&!nm.includes('face')&&!nm.includes('head')&&!nm.includes('torso'))t=true;if(t)ch.visible=!ch.visible;if(type==='all')ch.visible=true});updatePartsUI()}

// ---------- TEXTURES ----------
function setupTextureSystem(){
    document.getElementById('texture-hud-upload').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const tl=new THREE.TextureLoader();tl.load(URL.createObjectURL(f),tex=>{tex.name=f.name;if(!textureLibrary.find(t=>t.name===f.name)){textureLibrary.push({name:f.name,texture:tex});updateTextureHUD();showToast('Texture added')}})});
    document.getElementById('btn-texture-link').addEventListener('click',e=>{texLinkMode=!texLinkMode;e.target.style.background=texLinkMode?'#ec4899':'#1e293b'});
    document.getElementById('btn-texture-undo').addEventListener('click',()=>{if(undoStack.length){const a=undoStack.pop();redoStack.push(a);applyTexAction(a,true);updateTextureHUD()}});
    document.getElementById('btn-texture-redo').addEventListener('click',()=>{if(redoStack.length){const a=redoStack.pop();undoStack.push(a);applyTexAction(a,false);updateTextureHUD()}});
    document.getElementById('btn-texture-delete').addEventListener('click',()=>{if(selectedTex){const i=textureLibrary.indexOf(selectedTex);if(i>-1){textureLibrary.splice(i,1);selectedTex=null;updateTextureHUD()}}});
}
function genThumb(tex,s=28){try{const cv=document.createElement('canvas');cv.width=cv.height=s;const ctx=cv.getContext('2d');const img=tex.image;if(img&&img.width){const asp=img.width/img.height;let sw=s,sh=s;if(asp>1)sh=s/asp;else sw=s*asp;ctx.drawImage(img,(s-sw)/2,(s-sh)/2,sw,sh)}else{ctx.fillStyle='#333';ctx.fillRect(0,0,s,s);ctx.fillStyle='#fff';ctx.font='7px sans-serif';ctx.textAlign='center';ctx.fillText('T',s/2,s/2)}return cv.toDataURL()}catch(e){return''}}
function updateTextureHUD(){const g=document.getElementById('texture-hud-grid');if(!textureLibrary.length){g.innerHTML='<div class="text-slate-500 text-[6px]">No textures</div>';return}g.innerHTML='';textureLibrary.forEach(t=>{const d=document.createElement('div');d.style.cssText='border:1px solid #2a2a3e;border-radius:4px;padding:1px;cursor:pointer;text-align:center;background:#1a1a2e';d.innerHTML=`<img src="${genThumb(t.texture)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px"><span style="font-size:5px;color:#94a3b8">${t.name}</span>`;if(selectedTex===t)d.style.borderColor='#06b6d4';d.onclick=()=>{selectedTex=t;updateTextureHUD()};g.appendChild(d)})}
function applyTexToPart(part,tex){const ms=Array.isArray(part.material)?part.material:[part.material];const old=ms.map(m=>m.map);undoStack.push({part,old,newTex:tex});redoStack=[];ms.forEach(m=>{m.map=tex.texture;m.color.set(0xffffff);m.needsUpdate=true})}

    recBtn.addEventListener('click',()=>{isRecording=!isRecording;if(isRecording){recTimer=0;recBtn.style.color='#ef4444';showToast('Recording...')}else{recBtn.style.color='';showToast('Recording stopped')}});
    addBtn.addEventListener('click',()=>{if(!character)return;const pose=getPose();const time=timelineKeyframes.length?timelineKeyframes[timelineKeyframes.length-1].time+0.5:0;timelineKeyframes.push({time,pose});timelineKeyframes.sort((a,b)=>a.time-b.time);updateTLUI();pushHistory();showToast('Keyframe added')});

    mirrorBtn.addEventListener('click',()=>{if(timelineKeyframes.length){const mirrored=timelineKeyframes.map(kf=>{const p={};Object.keys(kf.pose).forEach(k=>{const key=k.replace('left','right').replace('right','left');p[key]={rx:kf.pose[k].rx,ry:-kf.pose[k].ry,rz:-kf.pose[k].rz}});return{time:kf.time+0.1,pose:p}});timelineKeyframes.push(...mirrored);timelineKeyframes.sort((a,b)=>a.time-b.time);updateTLUI();pushHistory();showToast('Mirrored')}});
    expBtn.addEventListener('click',()=>{if(!timelineKeyframes.length)return;const blob=new Blob([JSON.stringify(timelineKeyframes)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='anim.json';a.click()});
    clearBtn.addEventListener('click',()=>{timelineKeyframes=[];replayTime=0;timelinePlaying=false;updateTLUI();showToast('Cleared')});

    track.addEventListener('click',(e)=>{if(timelineKeyframes.length<2)return;const rect=track.getBoundingClientRect();const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));const maxTime=timelineKeyframes[timelineKeyframes.length-1].time||10;replayTime=pct*maxTime;applyTimelineFrame(replayTime);updateTLUI()});

function updateTLUI(){
    const track=document.getElementById('tl-track');track.innerHTML='';const info=document.getElementById('tl-frame-info');const total=timelineKeyframes.length;info.textContent=total?`${replayTime.toFixed(1)}/${timelineKeyframes[total-1].time.toFixed(1)}`:'0/0';if(!total)return;
    const maxTime=timelineKeyframes[total-1].time||10;
    timelineKeyframes.forEach((kf,i)=>{const dot=document.createElement('div');dot.className='keyframe-dot';dot.style.left=`${(kf.time/maxTime)*100}%`;dot.addEventListener('click',(e)=>{e.stopPropagation();replayTime=kf.time;applyTimelineFrame(replayTime);updateTLUI()});track.appendChild(dot)});
    const ph=document.createElement('div');ph.className='playhead';ph.style.left=`${(replayTime/maxTime)*100}%`;track.appendChild(ph);
}
function applyTimelineFrame(time){if(!timelineKeyframes.length)return;let a=timelineKeyframes[0],b=timelineKeyframes[timelineKeyframes.length-1];if(time<=a.time){applyPoseToBones(a.pose,1);return}if(time>=b.time){applyPoseToBones(b.pose,1);return}let idx=0;for(let i=0;i<timelineKeyframes.length-1;i++){if(time>=timelineKeyframes[i].time&&time<timelineKeyframes[i+1].time){idx=i;break}}const fA=timelineKeyframes[idx],fB=timelineKeyframes[idx+1];if(!fA||!fB)return;const frac=(time-fA.time)/(fB.time-fA.time);const pose={};Object.keys(fA.pose).forEach(k=>{if(!fB.pose[k]){pose[k]=fA.pose[k];return}const a=fA.pose[k],b=fB.pose[k];pose[k]={rx:a.rx+(b.rx-a.rx)*frac,ry:a.ry+(b.ry-a.ry)*frac,rz:a.rz+(b.rz-a.rz)*frac}});applyPoseToBones(pose,1);}

function getAnimPoseFromLib(id){const pose={};switch(id){case'idle':pose.chest={rx:0.04,ry:0,rz:0};pose.head={rx:0.05,ry:0,rz:0};break;case'walk':pose.rightArm={rx:0.5,ry:0,rz:0};pose.leftArm={rx:-0.5,ry:0,rz:0};pose.rightLeg={rx:-0.7,ry:0,rz:0};pose.leftLeg={rx:0.7,ry:0,rz:0};break;case'run':pose.rightArm={rx:0.8,ry:0,rz:0};pose.leftArm={rx:-0.8,ry:0,rz:0};pose.rightLeg={rx:-1.0,ry:0,rz:0};pose.leftLeg={rx:1.0,ry:0,rz:0};break;case'dance':pose.rightArm={rx:0.7,ry:0,rz:0};pose.leftArm={rx:-0.7,ry:0,rz:0};pose.chest={rx:0.15,ry:0.1,rz:0.1};break;case'wave_left':pose.leftArm={rx:-1.2,ry:0,rz:0.5};break;case'wave_right':pose.rightArm={rx:-1.2,ry:0,rz:-0.5};break;case'punch_left':pose.leftArm={rx:-0.1,ry:0,rz:-1.2};break;case'punch_right':pose.rightArm={rx:-0.1,ry:0,rz:1.2};break;case'peace_left':pose.leftArm={rx:-0.8,ry:0,rz:0.2};pose.leftFingers={rx:0.5,ry:0,rz:0};break;case'peace_right':pose.rightArm={rx:-0.8,ry:0,rz:-0.2};pose.rightFingers={rx:0.5,ry:0,rz:0};break;case'kick_left':pose.leftLeg={rx:-0.3,ry:0,rz:0.9};break;case'kick_right':pose.rightLeg={rx:-0.3,ry:0,rz:-0.9};break;default:return null}return pose}

function updateJoy(cx,cy){const dx=cx-joyCenter.x,dy=cy-joyCenter.y;const dist=Math.sqrt(dx*dx+dy*dy);const maxR=20;const clamped=Math.min(dist,maxR);const angle=Math.atan2(dy,dx);document.getElementById('joystick-thumb').style.transform=`translate(${Math.cos(angle)*clamped}px,${Math.sin(angle)*clamped}px)`;joyVec.x=Math.cos(angle)*clamped/maxR;joyVec.y=Math.sin(angle)*clamped/maxR;}

    const conn=[['hips','spine'],['spine','chest'],['chest','neck'],['neck','head'],['chest','rightArm'],['chest','leftArm'],['rightArm','rightElbow'],['leftArm','leftElbow'],['rightElbow','rightWrist'],['leftElbow','leftWrist'],['rightWrist','rightFingers'],['leftWrist','leftFingers'],['hips','rightLeg'],['hips','leftLeg'],['rightLeg','rightKnee'],['leftLeg','leftKnee'],['rightKnee','rightAnkle'],['leftKnee','leftAnkle']];

function updateBoneVisualPositions(){if(!character)return;boneNodes.forEach(sp=>{const k=sp.userData.boneKey;const b=skeletonBones[k];if(!b){sp.visible=false;return}const wp=new THREE.Vector3();b.getWorldPosition(wp);sp.position.copy(wp);sp.visible=showSkeleton;sp.material.emissiveIntensity=selectedBoneKey===k?.8:.3;sp.scale.setScalar(selectedBoneKey===k?1.8:1)});boneLines.forEach(l=>{const ba=skeletonBones[l.userData.a],bb=skeletonBones[l.userData.b];if(!ba||!bb){l.visible=false;return}const pa=new THREE.Vector3(),pb=new THREE.Vector3();ba.getWorldPosition(pa);bb.getWorldPosition(pb);const arr=l.geometry.attributes.position.array;arr[0]=pa.x;arr[1]=pa.y;arr[2]=pa.z;arr[3]=pb.x;arr[4]=pb.y;arr[5]=pb.z;l.geometry.attributes.position.needsUpdate=true;l.geometry.computeBoundingSphere();l.visible=showSkeleton})}

    const conn=[['hips','spine'],['spine','chest'],['chest','neck'],['neck','head'],['chest','rightArm'],['chest','leftArm'],['rightArm','rightElbow'],['leftArm','leftElbow'],['rightElbow','rightWrist'],['leftElbow','leftWrist'],['rightWrist','rightFingers'],['leftWrist','leftFingers'],['hips','rightLeg'],['hips','leftLeg'],['rightLeg','rightKnee'],['leftLeg','leftKnee'],['rightKnee','rightAnkle'],['leftKnee','leftAnkle']];
    conn.forEach(([a,b])=>{const pa=pos[a],pb=pos[b];if(!pa||!pb)return;const l=document.createElement('div');l.style.cssText=`position:absolute;left:${pa[0]}px;top:${pa[1]}px;width:${Math.sqrt((pb[0]-pa[0])**2+(pb[1]-pa[1])**2)}px;height:2px;background:rgba(255,255,255,.15);transform-origin:left;transform:rotate(${Math.atan2(pb[1]-pa[1],pb[0]-pa[0])}rad)`;cv.appendChild(l)});
    Object.keys(boneGroups).forEach(k=>{const p=pos[k];if(!p)return;const b=skeletonBones[k];const d=document.createElement('div');d.style.cssText=`position:absolute;left:${p[0]-5}px;top:${p[1]-5}px;width:10px;height:10px;border-radius:50%;background:${b?boneGroups[k].color:'#444'};border:2px solid ${selectedBoneKey===k?'#fff':'rgba(255,255,255,.3)'};cursor:pointer`;d.onclick=()=>{selectedBoneKey=k;updateBoneUI();updateBoneVisualPositions();renderSkeletonMap()};cv.appendChild(d)});
}

// ---------- REMAP ----------
function openRemap(){
    document.getElementById('bone-remap-modal').style.display='flex';
    const g=document.getElementById('bone-remap-grid');g.innerHTML='';
    const opts=[{v:'',l:'—'},...allBones.map(b=>({v:b.name||b.uuid,l:b.name||b.uuid}))];
    Object.keys(boneGroups).forEach(k=>{const cur=skeletonBones[k];const cv=cur?.name||cur?.uuid||'';const c=document.createElement('div');c.className='bone-grid-item';c.innerHTML=`<div style="width:8px;height:8px;border-radius:50%;background:${boneGroups[k].color};margin:0 auto"></div><div style="font-size:7px;font-weight:bold;color:#cbd5e1">${boneGroups[k].label}</div><select class="remap-sel" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:4px;color:#fff;font-size:6px;padding:1px">${opts.map(o=>`<option value="${o.v}" ${o.v===cv?'selected':''}>${o.l}</option>`).join('')}</select>`;g.appendChild(c)});
    document.getElementById('btn-apply-remap').onclick=()=>{document.querySelectorAll('.remap-sel').forEach((s,i)=>{const key=Object.keys(boneGroups)[i];const v=s.value;if(!v){skeletonBones[key]=null;boneRemapSelections[key]=''}else{const b=allBones.find(x=>(x.name||x.uuid)===v);if(b){skeletonBones[key]=b;boneRemapSelections[key]=v}}});closeModal();buildBoneVisuals();updateBoneUI()};
    document.getElementById('btn-auto-detect').onclick=()=>{Object.keys(skeletonBones).forEach(k=>{skeletonBones[k]=null;boneRemapSelections[k]=''});allBones.forEach(b=>mapBoneToGroup(b));Object.keys(skeletonBones).forEach(k=>{if(skeletonBones[k])boneRemapSelections[k]=skeletonBones[k].name||skeletonBones[k].uuid});openRemap()};
}
function mapBoneToGroup(bone){const bn=bone.name.toLowerCase(),parts=bn.split('_');const isL=parts.some(p=>['l','left'].includes(p));const isR=parts.some(p=>['r','right'].includes(p));const as=k=>{if(!skeletonBones[k]){skeletonBones[k]=bone;boneRemapSelections[k]=bone.name||bone.uuid}};if(parts.includes('head'))as('head');else if(parts.includes('neck'))as('neck');else if(parts.includes('chest')||parts.includes('upperbody')||parts.includes('spine2'))as('chest');else if(parts.includes('spine')||parts.includes('hips')||parts.includes('pelvis')){as('spine');if(parts.includes('hips')||parts.includes('pelvis'))as('hips')}else if(parts.includes('upperarm')||parts.includes('shoulder')||parts.includes('arm')){if(isR||parts.includes('right'))as('rightArm');else if(isL||parts.includes('left'))as('leftArm')}else if(parts.includes('forearm')||parts.includes('elbow')||parts.includes('lowerarm')){if(isR)as('rightElbow');else if(isL)as('leftElbow')}else if(parts.includes('hand')||parts.includes('wrist')){if(isR)as('rightWrist');else if(isL)as('leftWrist')}else if(parts.includes('finger')||parts.includes('thumb')||parts.includes('index')){if(isR||parts.includes('right'))as('rightFingers');else if(isL||parts.includes('left'))as('leftFingers')}else if(parts.includes('upleg')||parts.includes('thigh')||parts.includes('leg')||parts.includes('upperleg')){if(isR)as('rightLeg');else if(isL)as('leftLeg')}else if(parts.includes('knee')||parts.includes('shin')||parts.includes('lowerleg')){if(isR)as('rightKnee');else if(isL)as('leftKnee')}else if(parts.includes('ankle')||parts.includes('foot')){if(isR)as('rightAnkle');else if(isL)as('leftAnkle')}}

// ---------- LOAD GLB ----------
function loadGLB(url,name){
    const loader=new THREE.GLTFLoader();const draco=new THREE.DRACOLoader();draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');loader.setDRACOLoader(draco);
    loader.load(url,gltf=>{
        if(character){scene.remove(character);clearBoneVisuals();if(skeletonHelper){scene.remove(skeletonHelper);skeletonHelper=null}stopGlitch()}
        character=gltf.scene;character.scale.set(1.2,1.2,1.2);character.position.copy(charPos);
        primaryMaterials=[];allBones=[];springBones=[];assetParts={hair:[],clothing:[],body:[],accessories:[],other:[]};textureLibrary=[];undoStack=[];redoStack=[];gltfAnimations=[];
        Object.keys(skeletonBones).forEach(k=>{skeletonBones[k]=null;boneRemapSelections[k]=''});
        character.traverse(ch=>{if(ch.isMesh){ch.castShadow=ch.receiveShadow=true;if(ch.material){const ms=Array.isArray(ch.material)?ch.material:[ch.material];primaryMaterials.push(...ms)}const nm=ch.name.toLowerCase();if(nm.includes('hair')||nm.includes('beard')||nm.includes('fur'))assetParts.hair.push(ch);else if(nm.includes('skirt')||nm.includes('shirt')||nm.includes('pant')||nm.includes('dress')||nm.includes('cloth'))assetParts.clothing.push(ch);else if(nm.includes('body')||nm.includes('skin')||nm.includes('face')||nm.includes('head')||nm.includes('torso'))assetParts.body.push(ch);else if(nm.includes('accessor')||nm.includes('glass')||nm.includes('hat'))assetParts.accessories.push(ch);else assetParts.other.push(ch)}if(ch.isBone||ch.type==='Bone'){allBones.push(ch);mapBoneToGroup(ch)}if(ch.name&&(ch.name.toLowerCase().includes('hair')||ch.name.toLowerCase().includes('skirt')||ch.name.toLowerCase().includes('cloth')))springBones.push({bone:ch,baseRotation:ch.rotation.clone()})});
        // Store animations
        if(gltf.animations&&gltf.animations.length){
            gltfAnimations=gltf.animations.map(a=>({name:a.name||'Animation',clip:a}));
            showToast(`Loaded ${gltfAnimations.length} animations`);
        }
        scene.add(character);
        if(showSkeleton){skeletonHelper=new THREE.SkeletonHelper(character);scene.add(skeletonHelper)}
        buildBoneVisuals();extractTextures();updateBoneUI();updatePartsUI();updatePoseUI();updateTextureHUD();setupAnimGrid();
        document.getElementById('status-dot').className='w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        document.getElementById('asset-name').innerText=name;showToast(`Loaded: ${name}`);
        cameraAngleX=0.3;cameraAngleY=0.35;cameraDistance=4.5;
    },undefined,err=>{console.error(err);showToast('Load failed')});
}
function extractTextures(){if(!character)return;const seen=new Set();character.traverse(ch=>{if(!ch.isMesh||!ch.material)return;const ms=Array.isArray(ch.material)?ch.material:[ch.material];ms.forEach(m=>{if(m.map&&!seen.has(m.map.uuid)){seen.add(m.map.uuid);const n=m.map.name||`tex_${textureLibrary.length+1}`;if(!textureLibrary.find(t=>t.texture===m.map||t.name===n))textureLibrary.push({name:n,texture:m.map})}})})}

// ---------- MAIN LOOP ----------
function animate(){
    requestAnimationFrame(animate);
    const delta=Math.min(0.05,clock.getDelta()),time=Date.now()*.001;
    // Recording
    if(isRecording&&character){recTimer+=delta;if(recTimer<10){const pose=getPose();timelineKeyframes.push({time:recTimer,pose});timelineKeyframes.sort((a,b)=>a.time-b.time);updateTLUI();pushHistory()}}
    // Playback
    if(timelinePlaying&&timelineKeyframes.length>=2){replayTime+=delta*replaySpeed;const max=timelineKeyframes[timelineKeyframes.length-1].time||10;if(replayTime>=max){if(timelineLoop)replayTime=0;else{timelinePlaying=false;document.getElementById('tl-play').innerHTML='<i class="fa-solid fa-play"></i>'}}applyTimelineFrame(replayTime);updateTLUI()}
    else if(character&&!timelinePlaying&&!isRecording){const pose=getAnimPose(time,currentAnim);applyPoseToBones(pose,.15)}
    // Physics
    if(character){
        if(gameMode&&joystickActive){const sp=0.08;charPos.x+=joyVec.x*sp;charPos.z+=joyVec.y*sp;}
        if(charPos.y>0||charVel.y!==0){charPos.y+=charVel.y;charVel.y-=.018;if(charPos.y<=0){charPos.y=0;charVel.y=0}}character.position.copy(charPos);
        springBones.forEach((s,i)=>{const st=time+i*.7;s.bone.rotation.x+=(s.baseRotation?.x??-0.3+Math.sin(st*2.5)*.05-s.bone.rotation.x)*.05});
        partPulses.forEach((pp,i)=>{if(!pp.part.parent){partPulses.splice(i,1);return}const el=(Date.now()-pp.start)/1000;const sc=1+Math.sin(el*pp.speed)*.03;pp.part.scale.set(sc,sc,sc)});
        if(skeletonHelper)skeletonHelper.update();updateBoneVisualPositions();
        const cx=charPos.x+Math.sin(cameraAngleX)*Math.cos(cameraAngleY)*cameraDistance;
        const cy=charPos.y+Math.sin(cameraAngleY)*cameraDistance+.7;
        const cz=charPos.z+Math.cos(cameraAngleX)*Math.cos(cameraAngleY)*cameraDistance;
        camera.position.lerp(new THREE.Vector3(cx,cy,cz),.12);
        camera.lookAt(charPos.x,charPos.y+.7,charPos.z);
    }
    renderer.render(scene,camera);
}
function getAnimPose(t,id){const p={};const s=(k,rx,ry,rz)=>p[k]={rx,ry,rz};switch(id){case'idle':s('chest',Math.sin(t*1.5)*.03,0,0);s('head',Math.sin(t*1.2)*.04,0,0);break;case'walk':const w=Math.sin(t*4);s('rightArm',w*.4,0,0);s('leftArm',-w*.4,0,0);s('rightLeg',-w*.6,0,0);s('leftLeg',w*.6,0,0);break;case'run':const r=Math.sin(t*6);s('rightArm',r*.7,0,0);s('leftArm',-r*.7,0,0);s('rightLeg',-r*.9,0,0);s('leftLeg',r*.9,0,0);break;case'wave':s('rightArm',-1.0,0,Math.sin(t*5)*.4);break;case'dance':s('rightArm',Math.sin(t*5)*.6,0,0);s('leftArm',-Math.sin(t*5)*.6,0,0);s('chest',Math.sin(t*6)*.1,0,0);break;case'ghost':s('rightArm',Math.sin(t*2)*.3,0,0);s('leftArm',-Math.sin(t*2)*.3,0,0);break;case'glitch':s('rightArm',Math.random()*.3,0,0);s('leftArm',Math.random()*.3,0,0);break;default:s('chest',Math.sin(t*1.5)*.02,0,0)}return p}
function stopGlitch(){document.getElementById('glitch-overlay').style.opacity='0';if(glitchInterval){clearInterval(glitchInterval);glitchInterval=null}}

// ---------- BOOT ----------
window.onload=function(){init();switchTab('tab-pose');updateBoneUI();updatePartsUI();updateTextureHUD();setupAnimGrid();updateTLUI();showToast('ULTIMATE AniMAstAR ready')};
window.switchTab=switchTab;window.closeModal=closeModal;window.editPartScale=editPartScale;window.fxPart=fxPart;window.toggleParts=toggleParts;window.applyTexToPart=applyTexToPart;
</script>
