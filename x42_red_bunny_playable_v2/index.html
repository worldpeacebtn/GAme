<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>X42 Red Bunny — Playable One Sheet Demo</title>
<style>
:root{--bg:#070a13;--glass:rgba(7,12,25,.82);--line:#435272;--cyan:#64e9ff;--pink:#ff5ddd;--green:#70f2b1;--red:#ff4968;--text:#f1f6ff}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}button{color:var(--text);background:#121a2e;border:1px solid var(--line);border-radius:14px;padding:9px 11px;cursor:pointer}button:active{transform:scale(.97)}#game{height:100dvh;position:relative;overflow:hidden}#world{position:absolute;inset:0;background:center/cover no-repeat url('assets/stage_1.jpg');transition:background-image .25s}#world:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#02061212,#02051077)}.top{position:absolute;left:9px;right:9px;top:9px;z-index:10;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 28px #0009;backdrop-filter:blur(12px)}.title{pointer-events:auto;padding:9px 12px;border-radius:15px;font-weight:900;font-size:12px;letter-spacing:.05em}.title span{color:var(--pink)}.status{padding:8px 10px;border-radius:15px;font-size:10px;min-width:150px}.meter{height:5px;background:#29334a;border-radius:9px;margin:3px 0 6px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:78%}.entity{position:absolute;z-index:6;transform:translate(-50%,-100%);pointer-events:none}.entity .tag{position:absolute;left:50%;top:-20px;transform:translateX(-50%);white-space:nowrap;padding:3px 7px;border-radius:8px;background:#070b15dd;border:1px solid var(--pink);font-size:9px}.entity img{display:block;object-fit:contain;filter:drop-shadow(0 12px 11px #000c)}#player{left:48%;top:67%;width:150px;height:210px}.enemy{left:73%;top:69%;width:130px;height:185px}.npc{left:28%;top:67%;width:100px;height:155px}.enemy img{width:100%;height:100%}.npc img{width:100%;height:100%}.enemy .tag{border-color:var(--red)}.npc .tag{border-color:var(--green)}#enemyHp{position:absolute;z-index:7;left:73%;top:47%;transform:translateX(-50%);width:105px;display:none}.enemyAlive #enemyHp{display:block}.hpbar{height:5px;background:#2a3143;border-radius:8px;overflow:hidden}.hpbar i{display:block;height:100%;background:var(--red);width:100%;transition:.2s}.controls{position:absolute;z-index:12;left:12px;bottom:14px;display:grid;grid-template-columns:48px 48px 48px;gap:5px}.controls button{width:48px;height:44px;padding:0;background:#0a1020dd}.blank{visibility:hidden}.actions{position:absolute;z-index:12;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px}.action{width:55px;height:54px;padding:4px;border-radius:18px;background:#0a1020ee;font-size:18px}.action small{display:block;font-size:8px;color:#aab8d2}.dialog{position:absolute;z-index:30;left:4%;right:4%;bottom:80px;padding:13px;border-radius:17px;display:none}.dialog.show{display:block}.speaker{color:var(--green);font-weight:900;font-size:11px}.line{margin-top:5px;line-height:1.4;font-size:12px}.dialog button{margin-top:8px;padding:7px 10px}.editor{position:absolute;z-index:40;right:8px;top:58px;width:min(390px,calc(100% - 16px));max-height:calc(100dvh - 66px);overflow:auto;padding:11px;border-radius:18px;display:none}.editor.show{display:block}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:8px}.tabs button{font-size:9px;padding:7px 9px;white-space:nowrap}.muted{color:#9baac4;font-size:10px;line-height:1.4}.section{border-top:1px solid #2d3952;padding-top:9px;margin-top:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.grid button{font-size:9px;text-align:left;padding:8px}.grid b{display:block;color:var(--cyan)}textarea{width:100%;min-height:120px;background:#080c16;color:#edf4ff;border:1px solid #3b4967;border-radius:10px;padding:8px;font:10px ui-monospace,monospace}input[type=file]{width:100%;font-size:10px}.sheet{width:100%;border-radius:10px;border:1px solid #394864}.stageBtns{display:grid;grid-template-columns:1fr 1fr;gap:5px}.stageBtns button{font-size:9px;padding:7px}.stageThumb{width:100%;height:55px;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}.toast{position:absolute;z-index:60;left:50%;top:70px;transform:translateX(-50%);padding:8px 12px;border-radius:999px;border:1px solid var(--cyan);background:#071021ee;font-size:10px;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}.assetPreview{display:flex;align-items:center;gap:9px}.assetPreview img{width:55px;height:55px;object-fit:contain;border-radius:9px;background:#050812}.fightHint{position:absolute;z-index:8;left:50%;top:20%;transform:translateX(-50%);padding:6px 9px;border-radius:999px;background:#080d1bd9;border:1px solid var(--red);font-size:9px;display:none}.enemyAlive .fightHint{display:block}@media(max-width:700px){.editor{top:auto;bottom:70px;max-height:63dvh}.status{min-width:125px}.title{font-size:10px}.dialog{bottom:70px}.controls{bottom:11px}.actions{bottom:11px}}
</style></head><body><div id="game">
<div id="world"></div><div class="top"><div class="title glass">🐇 <span>X42</span> RED BUNNY · ONE-SHEET PLAYTEST</div><div class="status glass">HP 120<div class="meter"><i style="width:80%"></i></div>FOCUS 85<div class="meter"><i style="width:68%"></i></div></div></div>
<div id="player" class="entity"><div class="tag">RED BUNNY · C01</div><img id="bunny" src="assets/bunny_idle_0.png"></div>
<div id="npc" class="entity npc"><div class="tag">MIKA · N01</div><img src="assets/npc_informant.png"></div>
<div id="enemy" class="entity enemy"><div class="tag">NETWORK HUNTER · E01</div><img src="assets/enemy_network.png"></div><div id="enemyHp"><div class="hpbar"><i id="enemyHpFill"></i></div></div><div class="fightHint">⚔ NETWORK HUNTER — tap ATTACK</div>
<div class="controls"><button class="blank"></button><button onclick="move(0,-3)">▲</button><button class="blank"></button><button onclick="move(-3,0)">◀</button><button onclick="move(0,3)">▼</button><button onclick="move(3,0)">▶</button></div>
<div class="actions"><button class="action" onclick="talk()">💬<small>MEET</small></button><button class="action" onclick="attack()">⚔<small>ATTACK</small></button><button class="action" onclick="skill()">✦<small>SKILL</small></button><button class="action" onclick="toggleEditor()">☰<small>EDIT</small></button></div>
<div id="dialog" class="dialog glass"><div id="speaker" class="speaker">Mika</div><div id="line" class="line">Psst… Red Bunny. The hunter is looking for you.</div><button onclick="nextLine()">Weiter →</button><button onclick="closeDialog()">×</button></div>
<div id="editor" class="editor glass"><div class="tabs"><button onclick="tab('story')">STORY</button><button onclick="tab('map')">MAP</button><button onclick="tab('fight')">FIGHT</button><button onclick="tab('assets')">ALL ASSETS</button><button onclick="tab('sheet')">SHEET</button></div><div id="editorBody"></div></div><div id="toast" class="toast"></div>
</div><script>
const M={"format": "X42-OneSheet-Playtest/0.4", "masterSheet": "assets/one_sheet.png", "stages": ["assets/stage_1.jpg", "assets/stage_2.jpg", "assets/stage_3.jpg", "assets/stage_4.jpg", "assets/stage_5.jpg", "assets/stage_6.jpg"], "player": {"id": "C01", "name": "Red Bunny", "frames": ["assets/bunny_idle_0.png", "assets/bunny_idle_1.png", "assets/bunny_idle_2.png"], "attack": "A21", "skill": "S31"}, "enemy": {"id": "E01", "name": "NETWORK Hunter", "sprite": "assets/enemy_network.png", "hp": 70}, "npc": {"id": "N01", "name": "Mika", "sprite": "assets/npc_informant.png"}, "otherAssets": {"vehicle": "assets/vehicle_bike.png", "item": "assets/item_drive.png", "object": "assets/object_terminal.png", "weapon": "assets/weapon_baton.png", "effect": "assets/effect_slash.png"}, "sections": ["characters", "enemies", "equipment", "accessories", "effects", "stages", "objects", "elements", "ui", "tiles", "npcs", "vehicles", "items"]};let px=.48,py=.67,frame=0,story=0,enemyHP=70,tabName='story';
const lines=[['Mika','Psst… Red Bunny. The hunter is looking for you.'],['Red Bunny','Then I need the Signal-Key.'],['Mika','Take the encrypted drive from the terminal and move to the harbor.'],['Red Bunny','Got it. If the NETWORK finds us, we run.']];
function place(){player.style.left=(px*100)+'%';player.style.top=(py*100)+'%'}
function move(dx,dy){px=Math.max(.08,Math.min(.92,px+dx/100));py=Math.max(.2,Math.min(.9,py+dy/100));place();toast('MOVE')}
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')move(0,-3);if(e.key==='ArrowDown')move(0,3);if(e.key==='ArrowLeft')move(-3,0);if(e.key==='ArrowRight')move(3,0);if(e.key===' '){e.preventDefault();attack()}});
setInterval(()=>{frame=(frame+1)%3;bunny.src=M.player.frames[frame]},420);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),650)}
function talk(){dialog.classList.add('show');speaker.textContent=lines[story][0];line.textContent=lines[story][1]}
function nextLine(){story=(story+1)%lines.length;talk()}function closeDialog(){dialog.classList.remove('show')}
function attack(){if(enemyHP<=0){toast('HUNTER DEFEATED');return}enemyHP=Math.max(0,enemyHP-18);enemyHpFill.style.width=(enemyHP/70*100)+'%';document.getElementById('enemy').animate([{transform:'translate(-50%,-100%) scale(1)'},{transform:'translate(-50%,-100%) scale(.9)'},{transform:'translate(-50%,-100%) scale(1)'}],{duration:240});toast('ATTACK A21 · -18 HP');if(enemyHP===0){document.getElementById('enemy').style.opacity='.35';toast('NETWORK HUNTER DEFEATED')}}
function skill(){enemyHP=Math.max(0,enemyHP-28);enemyHpFill.style.width=(enemyHP/70*100)+'%';toast('SKILL S31 · NETWORK JAM');if(enemyHP===0)document.getElementById('enemy').style.opacity='.35'}
function toggleEditor(){editor.classList.toggle('show');renderEditor()}
function tab(t){tabName=t;renderEditor()}
function renderEditor(){let b=document.getElementById('editorBody');if(tabName==='story')b.innerHTML=`<h3>Simple story editor</h3><div class="muted">Change what happens. Art and gameplay IDs stay intact.</div><textarea id="storyEdit">${lines.map(x=>x[0]+': '+x[1]).join('\n')}</textarea><button style="width:100%;margin-top:6px" onclick="saveStory()">SAVE STORY</button>`;
if(tabName==='map')b.innerHTML=`<h3>Map / stage presets</h3><div class="muted">Every preset is taken from the STAGES / BACKGROUNDS area of the one-sheet.</div><div class="stageBtns">${M.stages.map((s,i)=>`<button onclick="setStage(${i+1})"><img class="stageThumb" src="${s}">STAGE ${i+1}</button>`).join('')}</div><div class="section"><input type="file" accept="image/*" onchange="uploadBG(event)"></div>`;
if(tabName==='fight')b.innerHTML=`<h3>Playable encounter</h3><div class="assetPreview"><img src="assets/enemy_network.png"><div><b>NETWORK Hunter</b><div class="muted">E01 · ${enemyHP}/70 HP</div></div></div><div class="section"><button onclick="attack()">⚔ Attack</button> <button onclick="skill()">✦ Network Jam</button><button onclick="resetFight()">↻ Reset</button></div><div class="section muted">The demo uses the enemy, weapon, skill/effect and UI concepts shown on the sheet.</div>`;
if(tabName==='assets')b.innerHTML=`<h3>Everything on the sheet</h3><div class="grid">${M.sections.map(n=>`<button onclick="previewSection('${n}')"><b>${n.toUpperCase()}</b>sheet section</button>`).join('')}</div><div class="section" id="assetDetail"></div>`;
if(tabName==='sheet')b.innerHTML=`<h3>Master source sheet</h3><div class="muted">This exact sheet drives the demo's asset catalogue and stage presets.</div><img class="sheet" src="assets/one_sheet.png">`;}
function saveStory(){const raw=storyEdit.value.split('\n');raw.forEach((s,i)=>{let k=s.indexOf(':');if(k>0)lines[i]=[s.slice(0,k),s.slice(k+1).trim()]});toast('STORY SAVED');talk()}
function setStage(n){world.style.backgroundImage=`url("assets/stage_${n}.jpg")`;toast('STAGE '+n+' LOADED')}
function uploadBG(e){let f=e.target.files[0];if(!f)return;world.style.backgroundImage=`url("${URL.createObjectURL(f)}")`;toast('CUSTOM BACKGROUND LOADED')}
function resetFight(){enemyHP=70;enemyHpFill.style.width='100%';document.getElementById('enemy').style.opacity='1';toast('FIGHT RESET')}
function previewSection(n){document.getElementById('assetDetail').innerHTML=`<div class="muted">${n.toUpperCase()} — direct preview from the one-sheet</div><img class="sheet" src="assets/section_${n}.png">`}
place();renderEditor();
</script></body></html>
