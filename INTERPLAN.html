<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ NEON COMIC VAULT v24 — Sparkle & Movie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#03050b', darkcard: '#080d1a', cyberblue: '#00f0ff', cyberpurple: '#9d00ff',
                        cyberpink: '#ff007f', cyberorange: '#ff5500', neongreen: '#00ffcc'
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite', 'glow-pulse': 'glowPulse 2.5s ease-in-out infinite',
                        'grid-shift': 'gridShift 8s linear infinite', 'bubble-rise': 'bubbleRise 6s ease-in-out infinite',
                        'shimmer': 'shimmer 3s ease-in-out infinite', 'butterfly': 'butterflyFlap 0.8s ease-in-out infinite',
                        'particle': 'particleMove 4s linear infinite'
                    },
                    keyframes: {
                        float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-8px)' } },
                        glowPulse: { '0%,100%': { boxShadow: '0 0 20px rgba(0,240,255,0.3)' }, '50%': { boxShadow: '0 0 40px rgba(0,240,255,0.7)' } },
                        gridShift: { '0%': { backgroundPosition: '0 0, 0 0' }, '100%': { backgroundPosition: '32px 32px, 32px 32px' } },
                        bubbleRise: { '0%,100%': { transform: 'translateY(0) scale(1)' }, '50%': { transform: 'translateY(-12px) scale(1.05)' } },
                        shimmer: { '0%,100%': { opacity: '0.6' }, '50%': { opacity: '1' } },
                        butterflyFlap: { '0%,100%': { transform: 'rotate(10deg)' }, '50%': { transform: 'rotate(-10deg)' } },
                        particleMove: { '0%': { transform: 'translateY(0) scale(1)', opacity: '0.8' }, '100%': { transform: 'translateY(-80px) scale(0)', opacity: '0' } }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ... (previous styles, plus sparkle styles) ... */
        .sparkle {
            position: fixed;
            pointer-events: none;
            background: radial-gradient(circle, #fff 0%, #00f0ff 40%, transparent 70%);
            border-radius: 50%;
            animation: sparkle-anim 0.6s ease-out forwards;
            z-index: 999;
        }
        @keyframes sparkle-anim {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .glass-btn:active { animation: btn-press 0.1s; }
        @keyframes btn-press { 0% { transform: scale(1); } 50% { transform: scale(0.9); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="text-slate-100 h-[100dvh] w-screen flex flex-col overflow-hidden animated-bg">
    <!-- Ghost Bunny TV -->
    <div class="ghost-tv" id="ghost-tv">
        <div class="ghost-ears"><div class="ghost-ear left"></div><div class="ghost-ear right"></div></div>
        <span class="ghost-bunny">🐰</span>
    </div>

    <!-- Canvas & Layers -->
    <div id="canvas-container" class="absolute inset-x-0 top-0 bottom-36 z-0 touch-none flex items-center justify-center overflow-hidden">
        <div id="layer-stack" class="absolute inset-0 flex items-center justify-center opacity-50 pointer-events-none"></div>
        <div id="zoom-viewport" class="relative w-full h-full flex items-center justify-center origin-center transition-transform duration-300 ease-out cursor-grab active:cursor-grabbing">
            <canvas id="studio-canvas" class="max-w-full max-h-full object-contain shadow-2xl rounded-lg border border-cyberblue/30"></canvas>
        </div>
        <div id="canvas-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-darkbg/60 backdrop-blur-xl z-30 pointer-events-auto p-4 text-center">
            <div class="glass p-6 flex flex-col items-center gap-3 rounded-3xl animate-float max-w-sm">
                <span class="text-4xl">⚡🌆</span>
                <span class="text-sm font-bold">Drop Media • Load Assets</span>
                <button onclick="document.getElementById('file-input-placeholder').click()" class="glass-btn px-4 py-2 text-sm font-bold text-neongreen">📂 BROWSE</button>
                <input type="file" id="file-input-placeholder" multiple accept="*/*" class="hidden" onchange="handleFileSelect(event)">
            </div>
        </div>
    </div>

    <!-- TOP LIBRARY (mini previews) -->
    <div id="top-library" class="absolute top-2 left-2 right-2 z-40 flex gap-2 overflow-x-auto glass p-1 pointer-events-auto"></div>

    <!-- BOTTOM HUD (two rows: filters + actions) -->
    <div class="absolute bottom-0 left-0 right-0 z-50 flex flex-col gap-1 p-2 pointer-events-none">
        <!-- Row 1: Main Filters (3 visible) + More toggle -->
        <div class="flex items-center justify-center gap-2 pointer-events-auto glass px-2 py-1 rounded-xl mx-auto">
            <button onclick="applyStyle('comic')" class="glass-btn px-3 py-1 text-sm">💥COMIC</button>
            <button onclick="applyStyle('manga')" class="glass-btn px-3 py-1 text-sm">🌸MANGA</button>
            <button onclick="applyStyle('neon')" class="glass-btn px-3 py-1 text-sm">🌈NEON</button>
            <button onclick="toggleMoreFilters()" id="more-filters-btn" class="glass-btn px-3 py-1 text-sm">🎛️MORE</button>
        </div>
        <!-- Row 2: Hidden additional filters -->
        <div id="more-filters-row" class="hidden flex items-center justify-center gap-2 pointer-events-auto glass px-2 py-1 rounded-xl mx-auto">
            <button onclick="applyStyle('anime')" class="glass-btn px-2 py-1">⚡ANIME</button>
            <button onclick="applyStyle('pixel')" class="glass-btn px-2 py-1">👾PIXEL</button>
            <button onclick="applyStyle('jrpg')" class="glass-btn px-2 py-1">⚔️JRPG</button>
            <button onclick="applyStyle('ductus')" class="glass-btn px-2 py-1">🏮DUCTUS</button>
            <button onclick="applyStyle('flattened')" class="glass-btn px-2 py-1">🔳FLAT</button>
            <button onclick="applyStyle('xray')" class="glass-btn px-2 py-1">👻XRAY</button>
        </div>
        <!-- Row 3: Action Tools -->
        <div class="flex items-center justify-center gap-2 pointer-events-auto glass px-2 py-1 rounded-xl mx-auto">
            <button onclick="undo()" class="glass-btn">⏪</button>
            <button onclick="redo()" class="glass-btn">⏩</button>
            <button onclick="openVault()" class="glass-btn">🔐</button>
            <button onclick="pinFrame()" class="glass-btn">📌</button>
            <button onclick="captureFrame()" class="glass-btn">📸</button>
            <button onclick="playMovie()" id="play-movie-btn" class="glass-btn">🎬</button>
            <button onclick="stopMovie()" class="glass-btn">⏹️</button>
            <button onclick="toggleStickerMode()" id="sticker-mode-btn" class="glass-btn">🖼️</button>
            <button onclick="addSpeechBubble()" class="glass-btn">💬</button>
            <button onclick="addCircularSticker()" class="glass-btn">⭕</button>
            <button onclick="openResolutionMenu()" class="glass-btn">📐</button>
            <button onclick="enterTheaterMode()" class="glass-btn">📖</button>
            <button onclick="toggleEraser()" id="eraser-btn" class="glass-btn">🧹</button>
        </div>
    </div>

    <!-- Timeline strip (above bottom HUD) -->
    <div class="absolute bottom-36 left-0 right-0 z-40 pointer-events-none">
        <div id="timeline-strip" class="timeline-track no-scrollbar pointer-events-auto px-2"></div>
    </div>

    <!-- Modals etc. (same as previous) -->
    <!-- ... -->

    <script>
        // ========== GLOBAL SOUND & SPARKLE ==========
        function playClickSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
        function spawnSparkles(x, y) {
            for (let i=0; i<6; i++) {
                const spark = document.createElement('div');
                spark.className = 'sparkle';
                spark.style.left = (x + (Math.random()-0.5)*40) + 'px';
                spark.style.top = (y + (Math.random()-0.5)*40) + 'px';
                spark.style.width = spark.style.height = (4 + Math.random()*6) + 'px';
                spark.style.background = `hsl(${Math.random()*360}, 100%, 70%)`;
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }
        // Attach to all glass-btn clicks
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.glass-btn');
            if (btn) {
                const rect = btn.getBoundingClientRect();
                playClickSound();
                spawnSparkles(rect.left + rect.width/2, rect.top + rect.height/2);
            }
        });

        // ========== STATE (abbreviated for clarity) ==========
        let library = [];
        let panels = [];
        let animationFrames = [];
        let layers = [];
        let filterLayers = [];
        let overlays = [];
        let adjustments = { brightness:0, contrast:0, saturation:100 };
        let currentMode = 'comic';
        let stickerMode = false;
        let eraserMode = false;
        let movieInterval = null;
        let movieIndex = 0;

        const canvas = document.getElementById('studio-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        function showToast(msg, type='success') { /* ... */ }

        // ========== FILE HANDLING ==========
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const type = file.type.startsWith('image') ? 'image' : 'file';
                    const item = { id:'f_'+Math.random().toString(36).substr(2,8), name:file.name, dataUrl:ev.target.result, type:type, thumb: type==='image'?ev.target.result:null };
                    library.push(item);
                    updateTopLibrary();
                    if(library.length===1 && type==='image') loadImageToCanvas(item.dataUrl);
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }

        function updateTopLibrary() {
            const container = document.getElementById('top-library');
            container.innerHTML = library.map(item => 
                `<div class="lib-item" onclick="handleLibraryItem('${item.id}')" style="width:40px;height:40px;background:rgba(8,13,26,0.7);border:1px solid rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
                    ${item.type==='image' ? `<img src="${item.dataUrl}" style="width:32px;height:32px;object-fit:cover;">` : '<span style="font-size:20px;">📄</span>'}
                </div>`
            ).join('');
        }

        function handleLibraryItem(id) {
            const item = library.find(x => x.id === id);
            if (!item) return;
            if (stickerMode) {
                createStickerFromLibrary(id);
            } else {
                if (item.type === 'image') loadImageToCanvas(item.dataUrl);
            }
        }

        function loadImageToCanvas(dataUrl) {
            document.getElementById('canvas-placeholder').classList.add('hidden');
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img,0,0);
                const base = { canvas: document.createElement('canvas'), originalImg: img, ctx: null };
                base.canvas.width = img.width; base.canvas.height = img.height;
                base.ctx = base.canvas.getContext('2d', { willReadFrequently: true });
                base.ctx.drawImage(img,0,0);
                layers = [base]; overlays = []; filterLayers = [];
                historyStack = []; historyPointer = -1;
                applyStyle('comic');
            };
            img.src = dataUrl;
        }

        // ========== STICKER MODE ==========
        function toggleStickerMode() {
            stickerMode = !stickerMode;
            document.getElementById('sticker-mode-btn').classList.toggle('active', stickerMode);
        }

        function createStickerFromLibrary(id) {
            const item = library.find(x => x.id === id);
            if (!item) return;
            const sticker = document.createElement('div');
            sticker.className = 'sticker-preview';
            sticker.innerHTML = `<img src="${item.dataUrl}">`;
            sticker.style.left = '50%'; sticker.style.top = '50%'; sticker.style.width = '20%';
            document.getElementById('canvas-container').appendChild(sticker);
            makeDraggable(sticker);
        }

        function makeDraggable(el) { /* drag logic */ }

        // ========== FILTERS ==========
        function applyStyle(style) {
            if(!canvas.width) return;
            filterLayers = [];
            adjustments = { brightness:0, contrast:0, saturation:100 };
            switch(style) {
                case 'comic': adjustments={brightness:0,contrast:50,saturation:135}; filterLayers.push({type:'halftone-dots',strength:65,blendMode:'overlay'}); break;
                case 'manga': adjustments={brightness:5,contrast:55,saturation:90}; filterLayers.push({type:'ductus-pro',strength:85,blendMode:'multiply'}); break;
                case 'neon': adjustments={brightness:15,contrast:70,saturation:180}; filterLayers.push({type:'neon-glow',strength:75,blendMode:'screen'}); break;
                case 'anime': adjustments={brightness:8,contrast:35,saturation:145}; filterLayers.push({type:'anime-ductus',strength:70,blendMode:'overlay'}); break;
                case 'pixel': adjustments={brightness:0,contrast:40,saturation:100}; filterLayers.push({type:'pixel-art',strength:100,blendMode:'normal'}); break;
                case 'jrpg': adjustments={brightness:12,contrast:30,saturation:140}; filterLayers.push({type:'cel-shade',strength:60,blendMode:'overlay'}); break;
                case 'ductus': adjustments={brightness:10,contrast:60,saturation:80}; filterLayers.push({type:'ductus-pro',strength:90,blendMode:'soft-light'}); break;
                case 'flattened': adjustments={brightness:5,contrast:40,saturation:70}; filterLayers.push({type:'posterize',strength:4,blendMode:'normal'}); break;
                case 'xray': adjustments={brightness:0,contrast:80,saturation:0}; filterLayers.push({type:'xray',strength:100,blendMode:'screen'}); break;
                default: break;
            }
            processImagePipeline();
        }

        function processImagePipeline() { /* apply filters to layers */ }

        // ========== MOVIE MODE ==========
        function playMovie() {
            if (!animationFrames.length) { showToast('No frames captured', 'error'); return; }
            movieIndex = 0;
            if (movieInterval) clearInterval(movieInterval);
            movieInterval = setInterval(() => {
                loadAnimationFrame(movieIndex);
                movieIndex = (movieIndex + 1) % animationFrames.length;
            }, 500); // adjust fps here (500ms = 2fps)
        }
        function stopMovie() { if (movieInterval) clearInterval(movieInterval); movieInterval = null; }

        function captureFrame() { /* push canvas to animationFrames */ }

        // ========== THEATER MODE ==========
        function enterTheaterMode() { /* show panels with blending */ }

        // ========== INIT ==========
        updateTopLibrary();
        applyStyle('comic');
    </script>
</body>
</html>
