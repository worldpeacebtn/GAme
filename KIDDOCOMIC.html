        // Spheric wheels
        const wheels = [

            { element: document.getElementById('spheric-size-wheel'), target: 'size' },

        function handleWheelInput(target, delta) {

        // Essential functions (simplified but working)
        function applyStyle(style) { if(!canvas.width) return; filterLayers=[]; adjustments={brightness:0,contrast:0,saturation:100}; if(style==='jrpg') { adjustments={brightness:12,contrast:30,saturation:140}; filterLayers.push({type:'cel-shade',strength:60,blendMode:'overlay'}); } else if(style==='pixel') { adjustments={brightness:0,contrast:40,saturation:100}; filterLayers.push({type:'pixel-art',strength:100,blendMode:'normal'}); } processImagePipeline(); showToast(`✨ ${style}`); }

        function handleFileSelect(e){ const files=Array.from(e.target.files); files.forEach(file=>{ const reader=new FileReader(); reader.onload=ev=>{ const type=file.type.startsWith('image')?'image':file.type.startsWith('video')?'video':file.type.startsWith('audio')?'audio':file.name.endsWith('.glb')?'glb':'file'; const item={id:'f_'+Math.random().toString(36).substr(2,8),name:file.name,dataUrl:ev.target.result,type:type,thumb:type==='image'?ev.target.result:null}; library.push(item); updateTopLibrary(); if(library.length===1 && item.type==='image') loadImageToCanvas(item.dataUrl); }; reader.readAsDataURL(file); }); e.target.value=''; }
