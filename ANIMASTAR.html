<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avatar Forge Pro — Unified Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js">
    </script>
    <style>
        :root{--bg:#0a0a14;--panel:#12121f;--border:#2a2a3e;--accent:#ec4899;--accent2:#8b5cf6;--accent3:#06b6d4;--text:#e2e8f0;--text-dim:#94a3b8}
        *{margin:0;padding:0;box-sizing:border-box}
        body{overscroll-behavior:none;touch-action:none;font-family:'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden;height:100vh;width:100vw;background:var(--bg);color:var(--text)}
        ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:rgba(20,20,35,.6)}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:9999px}
        .panel{background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(20px);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
        .btn-glow{transition:all .2s;cursor:pointer}.btn-glow:hover{box-shadow:0 0 20px rgba(236,72,153,.4);transform:translateY(-1px)}.btn-glow:active{transform:scale(.96)}
        .tab-btn{transition:all .2s}.tab-btn.active{background:rgba(236,72,153,.15);color:var(--accent);border-color:var(--accent)}
        .part-item{transition:all .2s;cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:6px;background:#1a1a2e}.part-item:hover{border-color:var(--accent)}
        .part-item.selected{border-color:var(--accent);box-shadow:0 0 15px rgba(236,72,153,.3)}
        .part-item.hidden{opacity:.4}
        .swipe-value{font-family:monospace;font-size:14px;text-align:center;min-width:60px;background:#1a1a2e;border:1px solid var(--border);border-radius:8px;padding:6px;color:#fff;cursor:pointer}
        .bone-section-header{font-size:9px;font-weight:bold;color:var(--text-dim);padding:4px 6px;margin-top:4px;border-bottom:1px solid var(--border)}
        .outline-highlight{outline:3px solid var(--accent);outline-offset:2px}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center}
        .modal-panel{background:#1a1a2e;border:1px solid #3a3a5e;border-radius:20px;padding:20px;max-width:90vw;max-height:85vh;overflow-y:auto}
        .toast-enter{animation:toastIn .3s ease forwards}
        @keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .custom-fx-item{border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:4px;cursor:pointer;background:#1a1a2e}
        .custom-fx-item:hover{border-color:var(--accent3)}
    </style>
</head>
<body>

<div id="canvas-container" class="fixed inset-0 z-0"></div>
<div id="glitch-overlay" style="position:fixed;inset:0;pointer-events:none;z-index:100;opacity:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(236,72,153,0.05) 2px,rgba(236,72,153,0.05) 4px);"></div>

<!-- TOP BAR -->
<div class="fixed top-2 left-2 right-2 z-40 flex items-center justify-between gap-2 pointer-events-none" style="top:8px;">
    <div class="flex items-center gap-1.5 pointer-events-auto flex-wrap">
        <div class="panel px-3 py-2 flex items-center gap-2">
            <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse flex-shrink-0"></div>
            <span id="asset-name" class="text-[10px] font-bold text-pink-400 truncate max-w-[80px]">No Model</span>
        </div>
        <button id="btn-toggle-skeleton" class="panel px-2.5 py-2 text-slate-300 btn-glow flex items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-bone text-emerald-400 text-xs"></i></button>
        <button id="btn-skeleton-map" class="panel px-2.5 py-2 text-amber-300 btn-glow flex items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-diagram-project text-xs"></i></button>
        <button id="btn-open-remap" class="panel px-2.5 py-2 text-sky-300 btn-glow flex items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-exchange-alt text-xs"></i></button>
        <button id="btn-toggle-texture-hud" class="panel px-2.5 py-2 text-sky-300 btn-glow flex items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-layer-group text-xs"></i></button>
        <button id="btn-toggle-hair" class="hair-toggle-btn on panel px-2.5 py-2 btn-glow flex items-center gap-1 text-[10px] font-bold text-pink-300"><i class="fa-solid fa-scissors text-xs"></i></button>
        <button id="btn-export-model" class="panel px-2.5 py-2 text-emerald-300 btn-glow flex items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-download text-xs"></i></button>
        <label class="panel px-2.5 py-2 text-sky-300 btn-glow flex items-center gap-1 text-[10px] font-bold cursor-pointer"><i class="fa-solid fa-upload text-xs"></i><input type="file" id="gltf-upload" accept=".glb,.gltf,.vrm" class="hidden"></label>
    </div>
</div>

<!-- TEXTURE HUD -->
<div id="texture-hud" class="fixed z-40 pointer-events-none hidden" style="top:50px;left:50%;transform:translateX(-50%);width:280px;">
    <div class="panel p-3 pointer-events-auto">
        <div class="flex items-center justify-between mb-2"><span class="text-[10px] font-bold text-sky-300">TEXTURE HUD</span>
            <div class="flex gap-1"><button id="btn-texture-link" class="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-slate-300 text-[9px]"><i class="fa-solid fa-link"></i></button><button id="btn-texture-undo" class="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-slate-300 text-[9px]"><i class="fa-solid fa-undo"></i></button><button id="btn-texture-redo" class="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-slate-300 text-[9px]"><i class="fa-solid fa-redo"></i></button><button id="btn-texture-delete" class="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-rose-400 text-[9px]"><i class="fa-solid fa-trash"></i></button></div>
        </div>
        <div id="texture-hud-grid" class="grid grid-cols-4 gap-1 max-h-36 overflow-y-auto"></div>
        <label class="mt-2 block text-center bg-slate-800 hover:bg-slate-700 cursor-pointer px-2 py-1 rounded text-[9px] text-sky-300"><i class="fa-solid fa-upload mr-1"></i>Upload<input type="file" id="texture-hud-upload" accept=".png,.jpg,.jpeg,.webp" class="hidden"></label>
    </div>
</div>

<!-- LEFT PANEL — ANIMATIONS -->
<div class="fixed left-2 z-30 pointer-events-none" style="top:50px;bottom:200px;width:150px;">
    <div class="panel p-2 h-full flex flex-col pointer-events-auto overflow-hidden">
        <span class="text-[9px] font-bold text-slate-400 mb-1">ANIM</span>
        <div id="anim-grid" class="grid grid-cols-1 gap-1 flex-1 overflow-y-auto"></div>
    </div>
</div>

<!-- RIGHT PANEL — BONES -->
<div class="fixed right-2 z-30 pointer-events-none" style="top:50px;bottom:200px;width:160px;">
    <div class="panel p-2 h-full flex flex-col pointer-events-auto overflow-hidden">
        <span class="text-[9px] font-bold text-slate-400 mb-1">SKELETON</span>
        <div id="bone-hierarchy-list" class="flex-1 overflow-y-auto text-[9px]"></div>
    </div>
</div>

<!-- BOTTOM DOCK -->
<div id="persistent-dock" class="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur-2xl border-t border-slate-800 flex flex-col select-none" style="height:195px;">
    <div class="grid grid-cols-4 bg-slate-950/80 border-b border-slate-800 p-1 text-[10px] font-bold text-center flex-shrink-0">
        <button onclick="switchTab('tab-pose')" id="btn-tab-pose" class="tab-btn py-1.5 rounded-xl text-slate-400">Pose</button>
        <button onclick="switchTab('tab-animate')" id="btn-tab-animate" class="tab-btn py-1.5 rounded-xl text-slate-400">Animate</button>
        <button onclick="switchTab('tab-appearance')" id="btn-tab-appearance" class="tab-btn py-1.5 rounded-xl text-slate-400">Appearance</button>
        <button onclick="switchTab('tab-parts')" id="btn-tab-parts" class="tab-btn py-1.5 rounded-xl text-slate-400">Parts</button>
    </div>
    <div class="flex-1 overflow-y-auto p-3 text-xs space-y-2">
        <!-- POSE TAB -->
        <div id="tab-pose" class="space-y-2">
            <div class="text-[9px] text-slate-400">Selected: <span id="pose-bone-name" class="text-pink-400">None</span></div>
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-slate-950/60 p-2 rounded-xl text-center">
                    <div class="text-[9px] text-pink-400 font-bold">X Pitch</div>
                    <div class="swipe-value" id="swipe-x" data-axis="x">0°</div>
                </div>
                <div class="bg-slate-950/60 p-2 rounded-xl text-center">
                    <div class="text-[9px] text-purple-400 font-bold">Y Yaw</div>
                    <div class="swipe-value" id="swipe-y" data-axis="y">0°</div>
                </div>
                <div class="bg-slate-950/60 p-2 rounded-xl text-center">
                    <div class="text-[9px] text-sky-400 font-bold">Z Roll</div>
                    <div class="swipe-value" id="swipe-z" data-axis="z">0°</div>
                </div>
            </div>
            <div class="text-[8px] text-slate-500">Swipe horizontal = value · Swipe vertical = fine/coarse</div>
        </div>

        <!-- ANIMATE TAB -->
        <div id="tab-animate" class="space-y-2 hidden">
            <div class="flex items-center justify-between">
                <span class="text-slate-300 font-bold text-[10px]">TIMELINE</span>
                <span id="keyframe-count" class="text-pink-400 font-mono text-[10px]">0 frames</span>
            </div>
            <div id="timeline-track" class="bg-slate-950/60 p-1 rounded-xl border border-slate-800 h-[45px] relative cursor-pointer"></div>
            <div class="flex gap-2 flex-wrap">
                <button id="btn-record-key" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-1.5 rounded-xl text-[10px]"><i class="fa-solid fa-circle-dot mr-1"></i>Record</button>
                <button id="btn-play-anim" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-1.5 rounded-xl text-[10px]"><i class="fa-solid fa-play mr-1"></i>Play</button>
                <button id="btn-export-anim" class="bg-slate-800 hover:bg-slate-700 px-2 py-1.5 rounded text-slate-300 text-[10px]"><i class="fa-solid fa-file-export"></i></button>
                <button id="btn-clear-anim" class="bg-slate-800 hover:bg-slate-700 px-2 py-1.5 rounded text-slate-300 text-[10px]"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>

        <!-- APPEARANCE TAB (FX + Material) -->
        <div id="tab-appearance" class="space-y-2 hidden">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="applyEffectPreset('cyberglitch')" class="bg-pink-600/30 border border-pink-500/50 p-2 rounded-xl text-pink-300 text-[10px]">⚡ Glitch</button>
                <button onclick="applyEffectPreset('ghost')" class="bg-purple-600/30 border border-purple-500/50 p-2 rounded-xl text-purple-300 text-[10px]">👻 Ghost</button>
                <button onclick="applyEffectPreset('holo')" class="bg-sky-600/30 border border-sky-500/50 p-2 rounded-xl text-sky-300 text-[10px]">✨ Holo</button>
                <button onclick="applyEffectPreset('normal')" class="bg-slate-600/30 border border-slate-500/50 p-2 rounded-xl text-slate-300 text-[10px]">↺ Reset</button>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-slate-300 text-[10px]">Color</span>
                <input type="color" id="mat-color-1" value="#f5f5f5" class="w-8 h-8 rounded cursor-pointer bg-transparent">
                <span class="text-slate-400 text-[9px]" id="mat-color-hex">#f5f5f5</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-slate-950/60 p-2 rounded-xl"><div class="text-[9px] text-slate-400">Rough <span id="val-roughness" class="text-amber-400">0.4</span></div><input type="range" id="mat-roughness" min="0" max="1" step="0.01" value="0.4" class="w-full"></div>
                <div class="bg-slate-950/60 p-2 rounded-xl"><div class="text-[9px] text-slate-400">Metal <span id="val-metalness" class="text-purple-400">0.05</span></div><input type="range" id="mat-metalness" min="0" max="1" step="0.01" value="0.05" class="w-full"></div>
            </div>
            <div class="border-t border-slate-700 pt-2">
                <div class="flex items-center justify-between mb-1"><span class="text-[10px] font-bold text-slate-300">CUSTOM FX</span><button id="btn-save-fx" class="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-[9px] text-sky-300">Save FX</button></div>
                <div id="custom-fx-list" class="space-y-1 max-h-16 overflow-y-auto"></div>
            </div>
        </div>

        <!-- PARTS TAB -->
        <div id="tab-parts" class="space-y-2 hidden">
            <div class="flex items-center justify-between">
                <span class="text-slate-300 font-bold text-[10px]">CLOTHING / BODY PARTS</span>
                <span id="asset-part-count" class="text-pink-400 font-mono text-[10px]">0</span>
            </div>
            <div id="asset-parts-list" class="space-y-1 max-h-20 overflow-y-auto"></div>
            <div id="part-edit-panel" class="bg-slate-950/60 p-2 rounded-xl border border-slate-700 hidden">
                <div class="flex items-center gap-2 mb-1">
                    <input type="text" id="part-edit-name" class="flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[10px] text-white">
                    <button id="part-eye-toggle" class="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-slate-300 text-[10px]"><i class="fa-solid fa-eye"></i></button>
                </div>
                <div class="grid grid-cols-3 gap-1">
                    <button onclick="editPartScale('x',0.1)" class="bg-slate-800 p-1 rounded text-slate-300 text-[9px]">SX+</button>
                    <button onclick="editPartScale('y',0.1)" class="bg-slate-800 p-1 rounded text-slate-300 text-[9px]">SY+</button>
                    <button onclick="editPartScale('z',0.1)" class="bg-slate-800 p-1 rounded text-slate-300 text-[9px]">SZ+</button>
                    <button onclick="editPartScale('x',-0.1)" class="bg-slate-800 p-1 rounded text-slate-300 text-[9px]">SX−</button>
                    <button onclick="editPartScale('y',-0.1)" class="bg-slate-800 p-1 rounded text-slate-300 text-[9px]">SY−</button>
                    <button onclick="editPartScale('z',-0.1)" class="bg-slate-800 p-1 rounded text-slate-300 text-[9px]">SZ−</button>
                </div>
                <div class="flex gap-2 mt-1">
                    <button onclick="editPartTexture()" class="flex-1 bg-sky-600/30 hover:bg-sky-600/50 p-1 rounded text-sky-300 text-[9px]">Texture</button>
                    <button onclick="addPartPulse()" class="flex-1 bg-purple-600/30 hover:bg-purple-600/50 p-1 rounded text-purple-300 text-[9px]">Pulse</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- SKELETON MAP MODAL -->
<div id="skeleton-map-modal" class="modal-overlay hidden" style="display:none;"><div class="modal-panel w-[380px]"><div class="flex justify-between mb-2"><h3 class="text-sm font-bold text-amber-300">Skeleton Map</h3><button onclick="closeModal('skeleton-map-modal')" class="text-slate-400 text-xl">&times;</button></div><div id="skeleton-map-canvas" style="width:320px;height:400px;background:#0d0d1a;border-radius:12px;position:relative;"></div></div></div>

<!-- BONE REMAP MODAL -->
<div id="bone-remap-modal" class="modal-overlay hidden" style="display:none;"><div class="modal-panel w-[600px] max-w-[92vw] max-h-[80vh] overflow-y-auto"><div class="flex justify-between mb-2"><h3 class="text-sm font-bold text-sky-300">Bone Remapping</h3><button onclick="closeModal('bone-remap-modal')" class="text-slate-400 text-xl">&times;</button></div><div id="bone-remap-grid" class="grid grid-cols-3 gap-2"></div><div class="flex gap-2 mt-3"><button id="btn-apply-remap" class="flex-1 bg-sky-600 text-white py-2 rounded-xl text-xs">Apply</button><button id="btn-auto-detect" class="bg-slate-800 text-slate-300 px-3 py-2 rounded-xl text-xs">Auto-Detect</button></div></div></div>

<div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 px-4 py-2 rounded-full border border-slate-700 text-xs text-slate-200 opacity-0 transition-all duration-300 pointer-events-none toast-enter">Ready</div>

<script>
let scene,camera,renderer,character,clock=new THREE.Clock(),charPos=new THREE.Vector3(0,0,0),cameraAngleX=0.3,cameraAngleY=0.35,cameraDistance=4.5;
let showSkeletonMode=false,showHair=true,currentAnimPreset='idle',recordedKeyframes=[],selectedBoneKey=null,currentEffect='normal',glitchInterval=null,skeletonHelper=null,boneVisualNodes=[],boneVisualLines=[],primaryMaterials=[],allDetectedBones=[],springBones=[],assetParts={hair:[],clothing:[],body:[],accessories:[],other:[]},textureLibrary=[],selectedTextureForAssign=null,currentTextureAssignTarget=null,replayPlaying=false,replayLoop=true,replaySpeed=1,replayTime=0,textureLinkMode=false,undoStack=[],redoStack=[],selectedPart=null,partPulses=[];
const boneGroups={head:{label:'Head',color:'#fbbf24'},neck:{label:'Neck',color:'#fbbf24'},chest:{label:'Chest',color:'#fb923c'},spine:{label:'Spine',color:'#fb923c'},hips:{label:'Hips',color:'#fb923c'},rightArm:{label:'Right Arm',color:'#f87171'},rightElbow:{label:'Right Elbow',color:'#f87171'},rightWrist:{label:'Right Wrist',color:'#f87171'},rightFingers:{label:'Right Fingers',color:'#f472b6'},leftArm:{label:'Left Arm',color:'#60a5fa'},leftElbow:{label:'Left Elbow',color:'#60a5fa'},leftWrist:{label:'Left Wrist',color:'#60a5fa'},leftFingers:{label:'Left Fingers',color:'#f472b6'},rightLeg:{label:'Right Leg',color:'#a78bfa'},rightKnee:{label:'Right Knee',color:'#a78bfa'},rightAnkle:{label:'Right Ankle',color:'#a78bfa'},leftLeg:{label:'Left Leg',color:'#34d399'},leftKnee:{label:'Left Knee',color:'#34d399'},leftAnkle:{label:'Left Ankle',color:'#34d399'}};
const skeletonBones={};Object.keys(boneGroups).forEach(k=>skeletonBones[k]=null);let boneRemapSelections={};
const animPresets=[{id:'idle',n:'Idle',i:'🧘'},{id:'walk',n:'Walk',i:'🚶'},{id:'run',n:'Run',i:'🏃'},{id:'wave',n:'Wave',i:'👋'},{id:'dance',n:'Dance',i:'💃'},{id:'jump',n:'Jump',i:'🦘'},{id:'bow',n:'Bow',i:'🙇'},{id:'sit',n:'Sit',i:'🪑'},{id:'punch',n:'Punch',i:'👊'},{id:'kick',n:'Kick',i:'🦵'},{id:'ghost',n:'Ghost',i:'👻'},{id:'glitch',n:'Glitch',i:'⚡'}];
const boneSections={Head:['head','neck'],Torso:['chest','spine','hips'],'Right Arm':['rightArm','rightElbow','rightWrist','rightFingers'],'Left Arm':['leftArm','leftElbow','leftWrist','leftFingers'],'Right Leg':['rightLeg','rightKnee','rightAnkle'],'Left Leg':['leftLeg','leftKnee','leftAnkle']};

function initGame(){
 const c=document.getElementById('canvas-container');
 scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a14);scene.fog=new THREE.FogExp2(0x0a0a14,0.03);
 camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;c.appendChild(renderer.domElement);
 const ambient=new THREE.AmbientLight(0xffffff,1);scene.add(ambient);const dl=new THREE.DirectionalLight(0xfff5ee,1.8);dl.position.set(15,25,15);dl.castShadow=true;dl.shadow.mapSize.width=2048;dl.shadow.mapSize.height=2048;scene.add(dl);
 const grid=new THREE.GridHelper(80,40,0xec4899,0x1a1a2e);grid.position.y=-0.01;scene.add(grid);const fg=new THREE.PlaneGeometry(80,80);const fm=new THREE.MeshStandardMaterial({color:0x0d0d1a,roughness:0.9});const fl=new THREE.Mesh(fg,fm);fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);
 setupControls();setupBoneInteraction();setupAnimGrid();setupTextureSystem();setupSwipeValues();window.addEventListener('resize',onResize);animate();
}

function parseBoneNameParts(n){return n.toLowerCase().replace(/[\.\-]/g,'_').split('_').filter(p=>p.length)}
function mapBoneToGroup(bone){const bn=bone.name.toLowerCase(),parts=parseBoneNameParts(bone.name);const isL=parts.some(p=>['l','left','leftarm','left_arm','arm_l'].includes(p));const isR=parts.some(p=>['r','right','rightarm','right_arm','arm_r'].includes(p));const as=k=>{if(!skeletonBones[k]){skeletonBones[k]=bone;boneRemapSelections[k]=bone.name||bone.uuid}};
 if(parts.includes('head'))as('head');else if(parts.includes('neck'))as('neck');else if(parts.includes('chest')||parts.includes('upperbody')||parts.includes('spine2'))as('chest');else if(parts.includes('spine')||parts.includes('hips')||parts.includes('pelvis')){as('spine');if(parts.includes('hips')||parts.includes('pelvis'))as('hips')}else if(parts.includes('upperarm')||parts.includes('shoulder')||parts.includes('arm')||parts.includes('clavicle')){if(isR||parts.includes('right'))as('rightArm');else if(isL||parts.includes('left'))as('leftArm')}else if(parts.includes('forearm')||parts.includes('elbow')||parts.includes('lowerarm')){if(isR)as('rightElbow');else if(isL)as('leftElbow')}else if(parts.includes('hand')||parts.includes('wrist')){if(isR)as('rightWrist');else if(isL)as('leftWrist')}else if(parts.includes('finger')||parts.includes('thumb')||parts.includes('index')||parts.includes('middle')||parts.includes('ring')||parts.includes('pinky')){if(isR||parts.includes('right'))as('rightFingers');else if(isL||parts.includes('left'))as('leftFingers')}else if(parts.includes('upleg')||parts.includes('thigh')||parts.includes('leg')||parts.includes('upperleg')){if(isR)as('rightLeg');else if(isL)as('leftLeg')}else if(parts.includes('knee')||parts.includes('shin')||parts.includes('lowerleg')){if(isR)as('rightKnee');else if(isL)as('leftKnee')}else if(parts.includes('ankle')||parts.includes('foot')){if(isR)as('rightAnkle');else if(isL)as('leftAnkle')}
 if(!skeletonBones.rightArm&&bn.includes('r_arm'))as('rightArm');if(!skeletonBones.leftArm&&bn.includes('l_arm'))as('leftArm');if(!skeletonBones.rightLeg&&bn.includes('r_leg'))as('rightLeg');if(!skeletonBones.leftLeg&&bn.includes('l_leg'))as('leftLeg');}
function generateAutoRig(){const h=new THREE.Bone();h.name='AR_Hips';h.position.set(0,0.6,0);const s=new THREE.Bone();s.name='AR_Spine';s.position.set(0,0.2,0);h.add(s);const c=new THREE.Bone();c.name='AR_Chest';c.position.set(0,0.25,0);s.add(c);const n=new THREE.Bone();n.name='AR_Neck';n.position.set(0,0.2,0);c.add(n);const he=new THREE.Bone();he.name='AR_Head';he.position.set(0,0.18,0);n.add(he);const ra=new THREE.Bone();ra.name='AR_RArm';ra.position.set(0.3,0.45,0);c.add(ra);const la=new THREE.Bone();la.name='AR_LArm';la.position.set(-0.3,0.45,0);c.add(la);const re=new THREE.Bone();re.name='AR_RElbow';re.position.set(0,-0.25,0);ra.add(re);const le=new THREE.Bone();le.name='AR_LElbow';le.position.set(0,-0.25,0);la.add(le);const rw=new THREE.Bone();rw.name='AR_RWrist';rw.position.set(0,-0.2,0);re.add(rw);const lw=new THREE.Bone();lw.name='AR_LWrist';lw.position.set(0,-0.2,0);le.add(lw);const rf=new THREE.Bone();rf.name='AR_RFingers';rf.position.set(0,-0.12,0);rw.add(rf);const lf=new THREE.Bone();lf.name='AR_LFingers';lf.position.set(0,-0.12,0);lw.add(lf);const rl=new THREE.Bone();rl.name='AR_RLeg';rl.position.set(0.15,-0.05,0);h.add(rl);const ll=new THREE.Bone();ll.name='AR_LLeg';ll.position.set(-0.15,-0.05,0);h.add(ll);const rk=new THREE.Bone();rk.name='AR_RKnee';rk.position.set(0,-0.35,0);rl.add(rk);const lk=new THREE.Bone();lk.name='AR_LKnee';lk.position.set(0,-0.35,0);ll.add(lk);const rn=new THREE.Bone();rn.name='AR_RAnkle';rn.position.set(0,-0.3,0);rk.add(rn);const ln=new THREE.Bone();ln.name='AR_LAnkle';ln.position.set(0,-0.3,0);lk.add(ln);character.add(h);const m={hips:h,spine:s,chest:c,neck:n,head:he,rightArm:ra,leftArm:la,rightElbow:re,leftElbow:le,rightWrist:rw,leftWrist:lw,rightFingers:rf,leftFingers:lf,rightLeg:rl,leftLeg:ll,rightKnee:rk,leftKnee:lk,rightAnkle:rn,leftAnkle:ln};Object.assign(skeletonBones,m);Object.keys(m).forEach(k=>boneRemapSelections[k]=m[k].name);allDetectedBones=Object.values(m);if(showSkeletonMode){if(skeletonHelper)scene.remove(sk function loadModel(url,name){const loader=new THREE.GLTFLoader();const draco=new THREE.DRACOLoader();draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');loader.setDRACOLoader(draco);loader.load(url,gltf=>{if(character){scene.remove(character);clearBoneVisuals();if(skeletonHelper){scene.remove(skeletonHelper);skeletonHelper=null}stopGlitch()}character=gltf.scene;character.scale.set(1.4,1.4,1.4);character.position.copy(charPos);primaryMaterials=[];allDetectedBones=[];springBones=[];assetParts={hair:[],clothing:[],body:[],accessories:[],other:[]};textureLibrary=[];undoStack=[];redoStack=[];Object.keys(skeletonBones).forEach(k=>{skeletonBones[k]=null;boneRemapSelections[k]=''});character.traverse(ch=>{if(ch.isMesh){ch.castShadow=ch.receiveShadow=true;if(ch.material){const ms=Array.isArray(ch.material)?ch.material:[ch.material];primaryMaterials.push(...ms)}const nm=(ch.name||'').toLowerCase();if(nm.includes('hair')||nm.includes('beard')||nm.includes('fur'))assetParts.hair.push(ch);else if(nm.includes('skirt')||nm.includes('shirt')||nm.includes('pant')||nm.includes('dress')||nm.includes('jacket')||nm.includes('cloth'))assetParts.clothing.push(ch);else if(nm.includes('body')||nm.includes('skin')||nm.includes('face')||nm.includes('head')||nm.includes('torso'))assetParts.body.push(ch);else if(nm.includes('accessor')||nm.includes('glass')||nm.includes('hat')||nm.includes('earring')||nm.includes('necklace')||nm.includes('ring'))assetParts.accessories.push(ch);else assetParts.other.push(ch)}if(ch.isBone||ch.type==='Bone'){allDetectedBones.push(ch);mapBoneToGroup(ch)}if(ch.name&&(ch.name.toLowerCase().includes('hair')||ch.name.toLowerCase().includes('skirt')||ch.name.toLowerCase().includes('cloth')))springBones.push({bone:ch,baseRotation:ch.rotation.clone()})});if(allDetectedBones.length<8)generateAutoRig();scene.add(character);if(showSkeletonMode){skeletonHelper=new THREE.SkeletonHelper(character);scene.add(skeletonHelper)}buildBoneVisuals();updateBo function setupSwipeValues(){document.querySelectorAll('.swipe-value').forEach(el=>{let startX=0,startY=0,startVal=0,active=false;el.addEventListener('pointerdown',e=>{active=true;startX=e.clientX;startY=e.clientY;startVal=parseFloat(el.textContent)||0;el.style.background='#2a2a3e';el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!active)return;const dx=e.clientX-startX,dy=e.clientY-startY;const coarse=Math.abs(dy)>30;const step=coarse?0.1:0.02;const change=dx*step;let val=startVal+change;val=Math.max(-180,Math.min(180,val));el.textContent=val.toFixed(1)+'°';const axis=el.dataset.axis;if(selectedBoneKey&&skeletonBones[selectedBoneKey]){skeletonBones[selectedBoneKey].rotation[axis]=val*(Math.PI/180);if(skeletonHelper)skeletonHelper.update();updateBoneVisualPositions()}});el.addEventListener('pointerup',()=>{active=false;el.style.background='#1a1a2e'})})}

function genThumb(tex,size=40){try{const cv=document.createElement('canvas');cv.width=cv.height=size;const ctx=cv.getContext('2d');const img=tex.image;if(img&&img.width){const asp=img.width/img.height;let sw=size,sh=size;if(asp>1)sh=size/asp;else sw=size*asp;ctx.drawImage(img,(size-sw)/2,(size-sh)/2,sw,sh)}else{ctx.fillStyle='#333';ctx.fillRect(0,0,size,size);ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('T',size/2,size/2)}return cv.toDataURL()}catch(e){return''}}

function updatePartEditPanel(){const panel=document.getElementById('part-edit-panel');if(!selectedPart){panel.classList.add('hidden');return}panel.classList.remove('hidden');document.getElementById('part-edit-name').value=selectedPart.name||'';document.getElementById('part-eye-toggle').innerHTML=selectedPart.visible?'<i class="fa-solid fa-eye"></i>':'<i class="fa-solid fa-eye-slash"></i>'}

function editPartScale(axis,amount){if(!selectedPart)return;selectedPart.scale[axis]+=amount;showToast(`${axis.toUpperCase()} scale: ${selectedPart.scale[axis].toFixed(1)}`)}

function editPartTexture(){if(!selectedPart)return;const modal=document.createElement('div');modal.className='modal-overlay';modal.style.display='flex';modal.innerHTML=`<div class="modal-panel w-[300px]"><h3 class="text-sm font-bold text-sky-300 mb-2">Assign Texture</h3><div class="grid grid-cols-4 gap-2 max-h-40 overflow-y-auto">${textureLibrary.map(t=>`<img src="${genThumb(t.texture,48)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;cursor:pointer" onclick="this.parentElement.querySelectorAll('img').forEach(i=>i.style.outline='none');this.style.outline='2px solid #06b6d4';window._texSel=${textureLibrary.indexOf(t)}">`).join('')}</div><button onclick="document.querySelector('.modal-overlay').remove()" class="w-full mt-2 bg-slate-800 p-2 rounded text-slate-300 text-xs">Cancel</button></div>`;document.body.appendChild(modal);window._texSel=-1;modal.querySelectorAll('img').forEach(img=>{img.onclick=()=>{modal.querySelectorAll('img').forEach(i=>i.style.outline='none');img.style.outline='2px solid #06b6d4';window._texSel=parseInt(img.dataset.idx||0)}});modal.innerHTML=modal.innerHTML.replace('</div></div>','<button onclick="applyTexToSelected()" class="w-full mt-2 bg-sky-600 p-2 rounded text-white text-xs">Apply</button></div></div>')}

function applyTexToSelected(){if(window._texSel>=0&&selectedPart&&textureLibrary[window._texSel]){applyTextureToPart(selectedPart,textureLibrary[window._texSel]);document.querySelector('.modal-overlay').remove()}}

function applyTextureToPart(part,tex){const ms=Array.isArray(part.material)?part.material:[part.material];const old=ms.map(m=>m.map);undoStack.push({part,old,newTexture:tex});redoStack=[];ms.forEach(m=>{m.map=tex.texture;m.color.set(0xffffff);m.needsUpdate=true})}

function applyTextureAction(a,isUndo){const ms=Array.isArray(a.part.material)?a.part.material:[a.part.material];if(isUndo)ms.forEach((m,i)=>{m.map=a.old[i]||null;m.needsUpdate=true});else ms.forEach(m=>{m.map=a.newTexture.texture;m.color.set(0xffffff);m.needsUpdate=true})}

function addPartPulse(){if(!selectedPart)return;partPulses.push({part:selectedPart,start:Date.now(),speed:2+Math.random()*2});showToast('Pulse added')}

function updateTimeline(){const tr=document.getElementById('timeline-track');tr.innerHTML='';document.getElementById('keyframe-count').textContent=`${recordedKeyframes.length} frames`;if(!recordedKeyframes.length)return;recordedKeyframes.forEach((_,i)=>{const d=document.createElement('div');d.style.cssText=`position:absolute;left:${(i/(recordedKeyframes.length-1||1))*100}%;top:20%;bottom:20%;width:3px;background:#ec4899;box-shadow:0 0 8px #ec4899`;tr.appendChild(d)});const ph=document.createElement('div');ph.style.cssText=`position:absolute;left:${(replayTime/(recordedKeyframes.length-1||1))*100}%;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 10px #fff`;tr.appendChild(ph);tr.onclick=e=>{const r=tr.getBoundingClientRect();const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));replayTime=pct*(recordedKeyframes.length-1);applyReplayFrame(replayTime);updateTimeline()}}

function applyReplayFrame(t){const n=recordedKeyframes.length;if(!n)return;if(t<=0){applyPose(recordedKeyframes[0].pose,1);return}if(t>=n-1){applyPose(recordedKeyframes[n-1].pose,1);return}const i=Math.floor(t),f=t-i,a=recordedKeyframes[i],b=recordedKeyframes[i+1];if(!a||!b)return;Object.keys(a.pose).forEach(k=>{const bone=skeletonBones[k];if(bone&&b.pose[k]){bone.rotation.x+=(b.pose[k].rx-bone.rotation.x)*f;bone.rotation.y+=(b.pose[k].ry-bone.rotation.y)*f;bone.rotation.z+=(b.pose[k].rz-bone.rotation.z)*f}});if(skeletonHelper)skeletonHelper.update()}

function applyPose(pose,blend=1){Object.keys(pose).forEach(k=>{const b=skeletonBones[k];if(!b)return;if(blend>=1)b.rotation.set(pose[k].rx,pose[k].ry,pose[k].rz);else{b.rotation.x+=(pose[k].rx-b.rotation.x)*blend;b.rotation.y+=(pose[k].ry-b.rotation.y)*blend;b.rotation.z+=(pose[k].rz-b.rotation.z)*blend}});if(skeletonHelper)skeletonHelper.update()}

function getAnimPose(t,id){const p={};const s=(k,rx,ry,rz)=>p[k]={rx,ry,rz};switch(id){case'idle':s('chest',Math.sin(t*1.5)*.04,0,0);s('head',Math.sin(t*1.2)*.05,0,0);break;case'walk':const sw=Math.sin(t*4);s('rightArm',sw*.5,0,0);s('leftArm',-sw*.5,0,0);s('rightLeg',-sw*.7,0,0);s('leftLeg',sw*.7,0,0);break;case'run':const sr=Math.sin(t*6.5);s('rightArm',sr*.8,0,0);s('leftArm',-sr*.8,0,0);s('rightLeg',-sr,0,0);s('leftLeg',sr,0,0);break;case'wave':s('rightArm',-1.2,0,Math.sin(t*5)*.5);break;case'dance':s('rightArm',Math.sin(t*5)*.7,0,0);s('leftArm',-Math.sin(t*5)*.7,0,0);break;case'ghost':s('rightArm',Math.sin(t*2)*.4,0,0);s('leftArm',-Math.sin(t*2)*.4,0,0);break;case'glitch':s('rightArm',Math.random()*.4,0,0);s('leftArm',Math.random()*.4,0,0);break;default:s('chest',Math.sin(t*1.5)*.03,0,0)}return p}

function applyEffectPreset(e){if(!primaryMaterials.length)return;stopGlitch();currentEffect=e;primaryMaterials.forEach(m=>{m.transparent=false;m.opacity=1;m.emissive=m.emissive||new THREE.Color(0);m.emissive.set(0);m.emissiveIntensity=0;m.wireframe=false;switch(e){case'cyberglitch':m.color.set(0xec4899);m.roughness=.1;m.metalness=.9;m.emissive.set(0xec4899);m.emissiveIntensity=.3;startGlitch();break;case'ghost':m.color.set(0xa78bfa);m.roughness=.25;m.metalness=.1;m.transparent=true;m.opacity=.55;break;case'holo':m.color.set(0x22d3ee);m.roughness=.05;m.metalness=.85;m.transparent=true;m.opacity=.7;break;case'normal':m.color.set(0xf5f5f5);m.roughness=.4;m.metalness=.05;m.transparent=false;m.opacity=1;break}m.needsUpdate=true})}

function startGlitch(){document.getElementById('glitch-overlay').style.opacity='1';glitchInterval=setInterval(()=>{if(character){character.position.x=charPos.x+(Math.random()-.5)*.04;setTimeout(()=>{if(character)character.position.x=charPos.x},60)}},180)}
function stopGlitch(){document.getElementById('glitch-overlay').style.opacity='0';if(glitchInterval){clearInterval(glitchInterval);glitchInterval=null}}

function buildBoneVisuals(){clearBoneVisuals();Object.keys(skeletonBones).forEach(k=>{const b=skeletonBones[k];if(!b)return;const sg=new THREE.SphereGeometry(.035,12,12);const sm=new THREE.MeshStandardMaterial({color:boneGroups[k].color,emissive:boneGroups[k].color,emissiveIntensity:.4});const sp=new THREE.Mesh(sg,sm);sp.userData.boneKey=k;sp.visible=showSkeletonMode;scene.add(sp);boneVisualNodes.push(sp)});const conn=[['hips','spine'],['spine','chest'],['chest','neck'],['neck','head'],['chest','rightArm'],['chest','leftArm'],['rightArm','rightElbow'],['leftArm','leftElbow'],['rightElbow','rightWrist'],['leftElbow','leftWrist'],['rightWrist','rightFingers'],['leftWrist','leftFingers'],['hips','rightLeg'],['hips','leftLeg'],['rightLeg','rightKnee'],['leftLeg','leftKnee'],['rightKnee','rightAnkle'],['leftKnee','leftAnkle']];conn.forEach(([a,b])=>{const ba=skeletonBones[a],bb=skeletonBones[b];if(!ba||!bb)return;const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));const lm=new THREE.LineBasicMaterial({color:boneGroups[a].color,transparent:true,opacity:.7});const l=new THREE.Line(lg,lm);l.userData.a=a;l.userData.b=b;l.visible=showSkeletonMode;scene.add(l);boneVisualLines.push(l)})}

function updateBoneVisualPositions(){if(!character)return;boneVisualNodes.forEach(sp=>{const k=sp.userData.boneKey;const b=skeletonBones[k];if(!b){sp.visible=false;return}const wp=new THREE.Vector3();b.getWorldPosition(wp);sp.position.copy(wp);sp.visible=showSkeletonMode;sp.material.emissiveIntensity=selectedBoneKey===k?1.2:.4;sp.scale.setScalar(selectedBoneKey===k?2.2:1)});boneVisualLines.forEach(l=>{const ba=skeletonBones[l.userData.a],bb=skeletonBones[l.userData.b];if(!ba||!bb){l.visible=false;return}const pa=new THREE.Vector3(),pb=new THREE.Vector3();ba.getWorldPosition(pa);bb.getWorldPosition(pb);const arr=l.geometry.attributes.position.array;arr[0]=pa.x;arr[1]=pa.y;arr[2]=pa.z;arr[3]=pb.x;arr[4]=pb.y;arr[5]=pb.z;l.geometry.attributes.position.needsUpdate=true;l.geometry.computeBoundingSphere();l.visible=showSkeletonMode})}

function clearBoneVisuals(){boneVisualNodes.forEach(n=>scene.remove(n));boneVisualLines.forEach(l=>scene.remove(l));boneVisualNodes=[];boneVisualLines=[]}

function setupBoneInteraction(){const r=new THREE.Raycaster(),m=new THREE.Vector2();const c=renderer.domElement;c.addEventListener('pointerdown',e=>{if(e.target.closest('.panel')||e.target.closest('button')||e.target.closest('select')||e.target.closest('input')||e.target.closest('.modal-overlay')||textureLinkMode)return;const rect=c.getBoundingClientRect();m.x=((e.clientX-rect.left)/rect.width)*2-1;m.y=-((e.clientY-rect.top)/rect.height)*2+1;r.setFromCamera(m,camera);const hits=r.intersectObjects(boneVisualNodes.filter(n=>n.visible));if(hits.length){const k=hits[0].object.userData.boneKey;if(k&&skeletonBones[k]){selectedBoneKey=k;updateBonesUI();updateBoneVisualPositions();document.getElementById('pose-bone-name').textContent=boneGroups[k].label}}})}

function showToast(msg){const t=document.getElementById('toast-container');t.textContent=msg;t.style.opacity='1';clearTimeout(t._to);t._to=setTimeout(()=>t.style.opacity='0',2000)}

function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)}

let customFX=[];
function updateCustomFX(){const l=document.getElementById('custom-fx-list');l.innerHTML=customFX.map((fx,i)=>`<div class="custom-fx-item" onclick="applyCustomFX(${i})"><span style="font-size:9px">${fx.name}</span> <span style="font-size:8px;color:#94a3b8">r:${fx.roughness} m:${fx.metalness}</span></div>`).join('')}
function applyCustomFX(i){const fx=customFX[i];if(!fx)return;primaryMaterials.forEach(m=>{m.color.set(fx.color);m.roughness=fx.roughness;m.metalness=fx.metalness;m.needsUpdate=true});document.getElementById('mat-color-1').value=fx.color;document.getElementById('mat-roughness').value=fx.roughness;document.getElementById('mat-metalness').value=fx.metalness;showToast('FX applied')}

function animate(){requestAnimationFrame(animate);const delta=clock.getDelta(),time=Date.now()*.001;if(replayPlaying&&recordedKeyframes.length>=2){replayTime+=delta*replaySpeed;const max=recordedKeyframes.length-1;if(replayTime>=max){if(replayLoop)replayTime=0;else{replayPlaying=false;document.getElementById('btn-play-anim').innerHTML='<i class="fa-solid fa-play"></i> Play'}}applyReplayFrame(replayTime);updateTimeline()}else if(character&&!replayPlaying){applyPose(getAnimPose(time,currentAnimPreset),.2)}if(character){if(charPos.y>0||charVel.y!==0){charPos.y+=charVel.y;charVel.y-=.018;if(charPos.y<=0){charPos.y=0;charVel.y=0}}character.position.copy(charPos);springBones.forEach((s,i)=>{const st=time+i*.7;s.bone.rotation.x+=(s.baseRotation?.x??-0.3+Math.sin(st*2.5)*.08-s.bone.rotation.x)*.08});if(skeletonHelper)skeletonHelper.update();updateBoneVisualPositions();const cx=charPos.x+Math.sin(cameraAngleX)*Math.cos(cameraAngleY)*cameraDistance,cy=charPos.y+Math.sin(cameraAngleY)*cameraDistance+.7,cz=charPos.z+Math.cos(cameraAngleX)*Math.cos(cameraAngleY)*cameraDistance;camera.position.lerp(new THREE.Vector3(cx,cy,cz),.12);camera.lookAt(charPos.x,charPos.y+.7,charPos.z)}renderer.render(scene,camera)}

window.onload=function(){initGame();switchTab('tab-pose');updateBonesUI();updatePartsUI();updateTextureHUD();setupAnimGrid();updateTimeline();showToast('Avatar Forge Pro — Unified Editor')};
</script>
</body>
